<script>
var SUC = [{"t": "蚂蚁森林·甘肃民勤种梭梭树", "tag": "成长", "batch": 1, "time": "暑假去西北旅游", "place": "大西北，甘肃民勤的村子里", "people": "我和父母、众多志愿者", "conflict": "我常在蚂蚁森林上种树，用能量在线上云种树，守护并建造沙漠绿洲。来大西北旅游时，看见一望无际的沙漠，火热的阳光洒在细腻柔软的金色沙子上，好像镀了一层金边，孤寂、辽阔、震撼。我又看见志愿者传单，去甘肃民勤拯救被沙漠吞噬的小镇，准备在行程最后一天前往，种一棵属于自己的树。到达后，我们在沙漠中步行半小时，发现种树点有许多人，各种各样的衣服五颜六色，集结了来自五湖四海的人们。我用一个大铲子在沙地上刨坑，本以为十分轻松，没想到每一铲，四周的沙子就留下来；一旦停止，风又会将刚挖好的树洞填平。我穿着一件红背心，带着防沙面罩和遮阳帽，汗水在阳光的照射下一滴滴顺着脸颊流下来，有些痒。然后在坑壁上种梭梭树苗，又浇上水。与我一起工作的小分队中，聊天中我才知道，许多人是休假时来的，不同的工作、不同的城市，现在都汇聚于此，握着铁锹刨坑。这天虽然辛苦，但看着种下的树苗，觉得一切都值得。", "insight": "这些志愿者都心怀热爱，与风沙鏖战，用几千亩梭梭林兑现守护土地的信仰", "ev": "素材的层次不错（线上云种树到线下亲手种一棵），但有一个小问题：成长性体现不够，成长的本质是改变，而这个素材里，“我”从前到后并没有发生真正的改变。", "tips": ["删减：保留核心内容，我亲眼见到、亲自参与了刨坑种树的行动；中间保留一两个细节即可（沙漠沙子的触感、太阳晒在身上的炎热、汗水滴落），写画面的时候一定要有细节；", "补上“改变”（对比）：我之前认为环保是大人的事情，与我一个小孩子无关；我在线上点点手指，就是在为环保做贡献了。到了线下，亲眼看到那么多人在真正地付出汗水、付出劳动，我由此感到震撼，感到一种真正的社会责任感；", "把这种转变挪移到自己的生活中去：从小事做起，我真正意识到，我的每一个举动，都是在为环保、为这片土地做出贡献。"]}, {"t": "臭豆腐·王婆", "tag": "平凡人物", "batch": 1, "time": "每一个上学日的黄昏时分", "place": "小巷的臭豆腐摊（铁板如镜子般光亮，一边的材料整齐摆放）", "people": "我和做臭豆腐的王婆", "conflict": "我一天放学，老远就闻到了十里飘香，正是饭点，于是我循着香气找去，发现小巷里的“王婆臭豆腐”那块招牌早已褪色，店里的桌椅永远擦得发亮，店很小，却早已排上长队。我抱着试一试的态度点了一份，发觉味道鲜美、又很纯正特别，便爱上了这家有年代感的小店。此后的每一天放学，我都绕路来王婆的店，只需 5 元。看着王婆熟练地将几块豆腐下进油锅，炸到六面金黄，入口酥脆，便夹起再递给我。我不禁疑惑，便问：“阿婆，你的定价这么低，分量又大，能赚到钱吗？”她慈爱地笑了笑说：“我做了臭豆腐 30 年了，没有涨价是对顾客的承诺，不换招牌，是怕老顾客多年后找不到了。”我又看看那排得整整齐齐的葱花辣椒、定期更换的油，心里满是暖意。联想起自己的学习生活，认为语文基础简单，总是不小心丢分；认为数学小题不必再练，却又总是计算错误。我曾经反思过，却仍然不明白。终于，在王婆臭豆腐的店里，我明白了：做事要踏实、不投机，最终才能成功。", "insight": "王婆数十年如一日守着小店那臭豆腐，让我懂得：长期主义从不是惊天动地的誓言，是把煎好每一块豆腐当成信仰，让踏实在每一个平凡的日子里积蓄力量", "ev": "这个素材后来写成了一篇完整的作文（《于烟火中见坚守力量》），课上讲评过。核心问题：①排队的长队写得像“独角戏”，毫无人气；②“我抱着试一试的态度”是作者直接跟读者对话；③王婆的坚守用她自己的话说，缺少说服力（王婆卖瓜，自卖自夸）；④结尾没有扣住“我的成长”。", "tips": ["公共场合要有人气：排队的场景要有声音、有人，有人催促“快一点，怎么那么慢”，王婆回应“您稍等，再等几份”；人们排着长队，脸上却毫无愠色（让读者好奇：凭什么）；", "把内心戏演出来：“试一试的态度”改成过程，我好奇（这到底有什么魔力）→等待中焦躁（怎么还没到我）→尝到一口的惊喜（真好吃）→回望（记住了这家店）；", "王婆的坚守，让顾客的闲谈说出来：排队时听顾客聊“阿姨这臭豆腐我从小吃到大，就是这个味儿”“不管什么时候来吃都是一个味道，从来没吃出过问题”；王婆笑呵呵：“为了你们这帮老顾客，我也不能放弃原则。”有人问“怎么不开分店”，王婆说“开了分店，我就难以把控质量了，到时候砸了招牌，你们上哪儿吃去”；", "道理要落到“我”身上：她的承诺、她的招牌，跟我一个学生有什么关系？把“我”的心浮气躁（语文基础丢分、数学小题计算错）写具体，让“踏实不投机”的道理接住我的毛病；", "结尾扣住“我的成长”：用画面收束（考场上忽然想到王婆的店；或放学又去，王婆说“你最近踏实多了”），让读者看到，我已是成长之后的人；", "前后统一：前文是“油炸”，结尾别写成“煎”，统一说法。"]}, {"t": "与母亲讨论《小王子》", "tag": "温情", "batch": 1, "time": "周末", "place": "家中", "people": "我和母亲", "conflict": "时光飞逝，我也步入初中。在母亲的指导下，我爱上唐诗宋词，从“床前明月光，疑是地上霜”到“人生得意须尽欢，莫使金樽空对月”。我与母亲共同“穿越”回唐朝，纵看盛世繁华与亡国的萧瑟，也读尽了诗人一生的风花雪月和人生的愁苦，明白“人有悲欢离合，月有阴晴圆缺”的道理。我更爱看名著，常与母亲探讨，聊《飘》中斯嘉丽的所作所言正是一种突破；又跟她聊《傲慢与偏见》中伊丽莎白克服偏见、达西放下傲慢，让我在交友中学会用更完整的视角看待问题。那一次，我与母亲讨论《小王子》中小王子的人物，我只是单纯地认为讲述了一个美好奇特的童话，不值得深究。可母亲却不这样认为，她说：“这本书探讨了友谊、爱情、责任、成长等主题，强调了保持童心、真实情感的重要性。你的想法太肤浅了。”她摸摸我的头，又说：“再读一遍吧。”我心里十分不服，但也只好怀着赌气又读了一遍。这一次，我认真地结合母亲所说的一一细品，竟发现她的观点仍不足以完美地展现故事的立意，便又与母亲讨论。我们在探讨中提升思维、明白道理，我与母亲，亦亲亦友。", "insight": "与母亲亦亲亦友，在探讨中提升思维", "ev": "这个素材还不错（从赌气到细品到发现母亲观点也不够，讨论的层次很好）；但具体的场景可以再细节一点。", "tips": ["把争论时的画面补充进来：人物的对话、表情、动作，如母亲的笑、我扭过头去不看她；我读书时拿笔圈圈画画、写下思考的样子。这些是让素材更有画面感、更让读者共情的方法；", "母亲这个人物不要忽视：写出她也拿着书，在一旁陪我静静地阅读的样子；", "前半部分的长篇大论可以稍微压缩：唐诗宋词、《飘》、《傲慢与偏见》这些铺垫点到即止，把篇幅留给《小王子》的争论（那是素材的高潮）。"]}, {"t": "昙花", "tag": "感悟自然", "batch": 1, "time": "夜晚", "place": "家中阳台上（白日盛开的鲜花在夜晚合拢花瓣，一朵雪白的昙花悄然盛放，宛如月下仙子，圣洁而又美丽）", "people": "我", "conflict": "这是我悉心照顾 3 年的昙花，它用长扁状的绿叶，在这 3 年里积蓄养分，只为这 3 小时的盛放，将所有养分倾注在这一夜。它不贪求朝暮相伴的观赏，不执着于四季常青的安稳，只愿在最恰当的时刻把美好释放。我想起小时候在田埂上欣赏萤火虫，白天为它不再闪烁而惋惜，它们的光点虽然只亮一夜，却照亮我的整个童年，成为我生命中的珍贵印记。", "insight": "昙花凋谢了，可它在夜色中绽放的模样早已刻进我心里。正如我们的人生，不必强求生命的长度，而是在那一刹那绚烂绽放，照亮岁月，成为生命中最动人的风景", "ev": "三年与 3 小时对仗工整，立意可以；问题，萤火虫的常识错误（萤火虫不是只活一夜）。", "tips": ["与“厚积薄发”匹配的昆虫是蝉（在土壤中蛰伏十几年，只为夏天的高唱），不是萤火虫；", "可匹配厚积薄发的人和事：学书法一年参赛颗粒无收，沉寂三年自己练、自己研究，最后一鸣惊人；", "可参考寇颜散文《玩伴》的用法：小时候是个假小子，看昙花绽放开启了对美的认知，从此内心变得细腻。"]}, {"t": "大草原星空", "tag": "感悟自然", "batch": 1, "time": "夜晚到凌晨", "place": "大草原上，毡房边上（草地柔软，像一块绿色的地毯；天空仿佛拉上一块黑幕，群星一闪一闪，美丽极了）", "people": "我", "conflict": "那是我第一次看到这么多星星。我还很小，觉得它们天生与“神秘”这个词联系在一起，不像月亮那样大方地铺洒清辉，只肯露出细碎的光，一颗并不亮眼，可一整片密密匝匝的星空，如此耀眼夺目。我细心地数，数着数着，就数不清了。看着几颗星星站在夜晚墨蓝的画片上，总觉得自己很渺小，像一只蚂蚁一样渺小。", "insight": "夜更深了，星星渐渐地少了。它们是如此的壮丽，我们人类是如此的渺小，人类从来不是自然的主宰", "ev": "这一篇的主题延伸有点太强行拔高了：从“一颗星星的小”直接跳到“人类渺小、不是自然的主宰”，中间的桥断了。", "tips": ["抓住“一颗小，许多颗构成美丽画卷”这个立意去延伸：把它和团结协作联系起来，班里的同学们彼此协作，就是一群星星；", "再拔高一层：人类的历史，就是一个个星星般耀眼的人物，一同构成的历史的星空；", "最后回归到自己身上：我是一颗小小的星星，但我发出的光芒并不渺小，我也是这星空的一部分。形成一个“延伸到回归”的思路。"]}, {"t": "拾落叶", "tag": "成长", "batch": 1, "time": "秋天放学时", "place": "一条小路（有各种各样的树）", "people": "我和汐汐同学", "conflict": "夕阳洒在每天都会路过的小路上，将道路两边的银杏、梧桐、栾树染上颜色，落英缤纷，如同手掌般的红色落满一地，银杏的黄叶如一把把小扇子，栾树开花，像淡黄色的月光。我有心将多彩的叶片捡起，收集在书中，留下秋天的模样。后来我发现，留存秋天的队伍里，我不是孤身一人，一个与我年龄相仿的小女孩，也在放学路上收集落叶。我们成了朋友，她与我相约一起欣赏秋天的景色。我对落叶的挑选极为苛刻，凡是有瑕疵的都无法进入我的眼；可她却不以为然，只挑选颜色美的。我不禁好奇，问她：“为什么你喜欢有残缺的叶子？”她一边仔细挑选，一边回答：“残缺也是一种美。它们虽有缺陷，却仍在绽放自己，用最美的颜色回报大树。”我有些惊讶，却认为她说的是有道理的，没有人是完美的。我总是追求完美：在绘画中涂错一个颜色，便为此懊恼；学习中有一道考题计算错误，便悔恨不已，却不知道，残缺也是一种美。秋天在四季中代表凋零与落寞，而它却用最夺目的叶子来证明自己的美。", "insight": "后来，她去了上海读书。临别时，她将一个塑封好的叶脉书签递给我，上面写着：“致那拾落叶的女孩，残缺也是一种美。”我不禁哑然一笑，明白了她的深意。此后的每一个秋日，我都想起她，却没有留下联系方式。于是，我把与她剪下的落叶发在网上，记录那份纯真与美好", "ev": "这个素材挺好的，可以写友情，也可以写成长，要把重点落在“理念之争”上面。", "tips": ["铺垫我的完美主义：我要选取那些品相完好、没有残缺的叶子，花笔墨把“我”的完美主义写出来；", "让女孩对我的选择表示不赞同，但理解，不要提前把谜底透露出来：她一开始不点破，只是坚持自己的选择；", "在她分别送我树叶的时候，才用书签说出那句话，“残缺也是一种美”；", "我在得到那份书签之后，去反思自己的生活：才领悟到，原来自己的完美主义，有的时候会使自己太过于疲惫，那个女孩正是看到了这一点，才留下了这样一个回忆；", "结尾：我不去执着于寻找那个女孩，我认为，这也是一种残缺，也是一种生命的美。生命有时候就是需要留下遗憾：哪怕我现在寻找到了她，我们的人生轨迹也大不相同，不必强求。"]}, {"t": "西湖护绿人", "tag": "平凡人物", "batch": 2, "time": "盛夏", "place": "西湖六和塔", "people": "西湖护绿人（六和塔养护主任）", "conflict": "夏日的西湖，最动人的便是那一抹鲜活的绿意。六和塔出圈的绿色能量窗，层层铺展的青绿，是酷暑里天然的消暑秘境。而这份随处可见的清凉盛夏背后，藏着一群顶着烈日坚守一线的西湖护绿人，默默守护着六和塔的盛夏生机。绿色能量窗凭一窗苍翠圈粉无数，不少市民游客专程跑来打卡。而六和塔的养护主任，日常牵头负责六和塔公园园林养护、牡丹栽培养护工作。来回穿梭的身影，让衣衫反复被汗水浸透；滚烫的热浪里，他依旧专注细致，用专业与坚守守住一路青绿。", "insight": "烈日炙烤下，这群园林工作者从未松懈停歇，扛住了日晒高温的体力考验，他们以汗水为灌溉，以匠心做管护，换来了西湖四季常绿", "ev": "素材本身很好，但写得“太官方”，像感动中国的演讲稿；要有“我来到、我看见、我感动、我记录”，亲身经历，不用官方语言。", "tips": ["写“我来到、我看见”：我是亲身在现场的，写我站在六和塔下看到的真实画面，不写宣传稿式的排比；", "抓住关键点：他是养护主任，本可以坐在办公室吹空调，却顶着烈日在现场，这个反差是全文的核心；", "设置反转：我一开始以为他只是普通的园林工人，直到有人来汇报工作，才知道他是领导；", "写真心热爱，不写“责任在身、义不容辞”这类官方口号。"]}, {"t": "农夫山泉·车间工人", "tag": "平凡人物", "batch": 2, "time": "7 月 15 日", "place": "农夫山泉千岛湖生产基地车间", "people": "车间工人（水源巡检员）", "conflict": "走进农夫山泉千岛湖生产基地，最打动我的并非先进的自动化设备，而是坚守在普通岗位上的平凡劳动者。水源巡检的工作人员日日守护水源洁净，严防一丝污染，认真核对每一瓶水质安全。他们是最普通的基层劳动者，岗位平凡，却用极致严谨与长久坚守，撑起了千万人的饮水安全。从前我只知道农夫山泉有点甜，现在懂得，甘甜背后是无数人的坚守与付出，平凡却从不平庸。", "insight": "从前我只知道农夫山泉有点甜，现在懂得甘甜背后是无数人的坚守与付出，平凡却从不平庸", "ev": "素材设计要点：需要一个具体的人物，从一个人身上折射出这群劳动者。", "tips": ["写一个具体的工人：进入工厂厂区的消毒环节，他一遍又一遍地消毒，不厌其烦，我作为参观者都觉得有些过分严谨；我问其中一个普通工人，他却说已经习惯了，并且是从心里认可这种形式。食品安全、饮水安全是一件大事，这件大事落在了他一个小小的工人身上，他为此感到骄傲；", "加上我和水源巡检工人一起看他的日常：把落脚点、切入点放在这位工人的手机微信步数上，每天都是几万步的巡检工作，我因此而感到震撼；", "前提要合理：我有理由去到他们的工厂参观（参加夏令营或农夫山泉的开放日活动，可以虚构，现在各种工厂开放给学生参观也是常有的事）；", "结尾（如果使用这个素材）：我后来某一天去便利店买水，拿着这瓶农夫山泉，虽然瓶身是冰凉的，但我似乎从中感受到了某一位车间工人亲手检查过这瓶矿泉水留下的体温。"]}, {"t": "书法（妈妈）", "tag": "传统文化", "batch": 2, "time": "每天傍晚", "place": "家中书房，刚磨好的墨香飘满屋子，妈妈手腕上的玉镯子随着动作轻响", "people": "我和妈妈", "conflict": "我用笔尖蘸墨，动作小心翼翼，生怕将墨点弄到纸上。随后落笔，我希望能和字帖相似，可随之墨汁在纸上晕开一个墨球，本希望是行云流水的飘逸行书，也化成了不可能。妈妈见我初学，便想一步登天，坐在我身边，温柔地说：“我外婆当年教我时说，书法是一个过程，要从基本练起，不能心急。”她三指握着已经包浆的竹制笔杆，仔细观察着字帖里的每一个字，果断落笔，笔尖在纸上划过，笔断意连。毛笔在妈妈手中仿佛有了魔力，每个字都写得行云流水，那手法与记忆中外婆的手法和姿态一模一样。“你外婆也是在这个时候教过我的呢。”妈妈陷入了沉思，然后说，“上次看她写字，还是我刚毕业的时候呢。”", "insight": "时至今日，我的字也与妈妈一样浸润在墨香中。我忽然懂得，传承从不是虚假的口号。是外婆的手握住妈妈的指尖，妈妈的指尖轻点我的手掌，是一段墨韵里一家人的代代相传", "ev": "好眼熟，这是好预兆：你已经能把讲过的素材内化成自己的东西，用起来水到渠成。套路变成你的东西，就是你的创意想法。", "tips": ["加入“我一开始的抗拒”：孩子抗拒写书法是合情合理的（包粽子人人都得吃，没法抗拒；但孩子可以抗拒书法），“好端端的，我为什么要学书法？跟我有什么关系？”在写书法的过程中感受到美太抽象，可以说感受到一种心境的过程，古人写书法不仅是交流，也是一种静心修行的过程；", "让妈妈的话给我一个“诱惑”：妈妈当年高考前紧张得想吐、东西也吃不下、失眠，外婆告诉她“不要看书了，去写几幅字”，让书法真的带给我好处：心静了下来，忘记了时间的流动；", "三代人＋趣缘：妈妈、外婆和我联系在一起，代代相传；如今每天总要写两笔，还要跟妈妈对比、一起讨论，这里多一个元素：人的四种缘分（血缘、地缘、事缘、趣缘），因为书法，我和妈妈有了学习之外的共同话题，一句话又把传统文化的魅力展现出来。"]}, {"t": "道德经·刻章", "tag": "传统文化", "batch": 2, "time": "读书的时候", "place": "书桌前，阳光洒在《道德经》的书页上", "people": "我", "conflict": "学习刻章，我一心求快，希望快点刻好。手握刻刀，不讲究方法，只是用力猛凿。可越是使劲，石料越容易裂开，线条歪歪扭扭，好几次刻了出去，全都失败了。妈妈看我心急，只是对我说：“你去看看《道德经》吧。”我虽然不解，却去卖旧书的店里买下一本，那书页早已泛黄，用胶的地方甚至有些脱落。直到读到一句“反者道之动，弱者道之用”，上一个主人在一旁批注：“物极必反，柔和顺势才是智慧”，妙呀！我学的是体会老子的智慧，下一次刻章的时候，每一处都用心雕刻，最后的线条也刚中带柔。", "insight": "原来古老的智慧从未过时，2000 多年前的文字一样可以解得开当下的问题。反者道之动，弱者道之用。学会收敛急躁，顺势而为，才能成功", "ev": "这一篇的境界很高深，用上了老子《道德经》的智慧，这一点非常不错，在中学作文写作的领域里，属于高阶素材。", "tips": ["妈妈这个人物稍显机械：改成我向妈妈求助，妈妈觉得我的问题不在技法上面，而在心态上面；她没有直接跟我说，反而把她自己正在看的一本《道德经》给了我，让我看一看、体会一下；", "我翻到她标注的那一句：这本旧书是妈妈从别处收购来的，上面有妈妈的传承，也有那个原主人的批注，这样会合理很多（相比我自己去买一本书）；", "结尾需要迁移：我在做别的事情的时候，浮躁的心思起来了，然后想起老子《道德经》里的那句话，于是能够静下心来，去处理眼前的问题。"]}, {"t": "亚运台风夜·父亲", "tag": "家国情怀", "batch": 2, "time": "亚运会开幕前夜，台风侵袭的夜晚", "place": "亚运会的场馆，夜色沉沉；江畔的街巷暴雨倾盆，街道激起深深的积水", "people": "我和父亲", "conflict": "①台风夜，险情紧迫。独居老人惦记着家中的老物件，执意不肯撤离危房。雨水打透父亲的衣衫，他反复劝说无用，对老人说：“家在心里，人平安，家就在。”最后，老人被父亲说服，平安转移。②亚运会来临，父亲彻夜留守在场馆中。我见他疲惫归来，又新长出了几根白发，不免有些心疼。他却对我说：“法理之外，尚有人情，百姓安稳，便是职责所在。”", "insight": "家国，从不是遥远的词语，就藏在守护百姓的一件件小事中。心怀乡土，躬身担当，便是最为滚烫的家国深情", "ev": "两个素材内核一致（守护百姓、职责所在），可以放在一起写。", "tips": ["给父亲加一个身份：党员，把信仰元素加进来，义不容辞；联系近代史，当年也是一批拥有同一个名字的中国共产党党员冲在一线；", "结尾落在自己身上：入团一般是初三、年满 14 周岁，正好是你们的年龄，落脚点不就有了吗？“我以前以为，入团入党只是让我的资料档案好看一些；但是我在他的身上，真正看到了身份背后有多么沉重。”（党徽、团徽，身份有多沉重。）"]}, {"t": "修书老爷爷", "tag": "家国情怀", "batch": 2, "time": "深秋的黄昏", "place": "老城的旧巷，暮色漫过青灰屋檐，昏黄的灯光洒落旧书店，窗内弥漫着浆糊与旧纸的气息", "people": "我和一位修书的老爷爷", "conflict": "我看着老人埋头修补残破古籍，不少书本是记述故土历史的相册，指腹被粗糙书页磨出厚茧。我不由得疑惑：如今电子阅读普及，耗费心力修复这些泛黄旧籍有什么意义？老人轻轻摩挲书页上的裂痕，他说：“这些文字记录着我们民族走过的路，书破了，那段记忆就容易被淡忘了。”我望着他穿针补页的模样，内心深深触动。", "insight": "家国不只存在于宏大的历史中，也藏在一卷卷泛黄的古籍中。老人修补的不只是破损的纸张，更是民族代代相承的文化根脉", "ev": "这个素材的优秀之处，在于把家国情怀落在了一个很小的点上：人对旧书籍的抢救工作。", "tips": ["补上一个前提：老人修补的是家中代代相传的书籍，他说自己将来要把这些古书捐赠给博物馆，这是他以个人的力量为中华文化打上的一块补丁；我望着他，感觉到这是一个人把自己融入宏大历史中的真实写照；", "古书的内容其实并不是那些特别珍贵的（如果是特别珍贵的，也不合适让一个私人来修复），是一些他的祖先收藏的书本、祖先的书信，或者一些名不见经传的人物的著作；", "我好奇这些有价值吗？他说：每一个人都是历史的一部分，就像每一个人都是家国的一部分一样。"]}, {"t": "田径 800 米", "tag": "梦想奋斗", "batch": 2, "time": "每天晚上晚自习结束后", "place": "学校的田径场上，晚风裹挟着青草的气息，暮色漫过看台，跑道上残留着落日留下的一点暖意", "people": "我和田径队的队友", "conflict": "为了冲击运动会的 800 米项目，我每次都将汗水倾注在赤红色的跑道上，喉咙好似被灌了铅、疼痛。可在日复一日的训练中，成绩依旧卡在瓶颈。我瘫坐在跑道上，盯着鞋底磨钝了的钉齿，萌生了退赛的想法。队友把他那双磨损的钉鞋放在我面前，他说：“飞跃从不是一朝一夕，每一次奔跑都在悄悄积蓄力量。”我答应一声。往后，我不再急于看到有明显的进步，而是专注于改善问题，打磨步频。", "insight": "梦想的征途，满是看不到回报的时刻。成功不在于期盼胜利，而是愿意接纳漫长的沉寂", "ev": "素材有一点点轻飘飘，朋友说一句，我就马上振奋了。", "tips": ["让朋友用问句来说，把话改成对话：他问“你还记得你刚报名时的成绩吗？”我回答一个成绩；“那你刚刚的成绩是多少？”在这两个成绩之间，设置一个微小但确实存在的进步，虽然进步很小，只有 1 秒、甚至是 0 点几秒的差距，但它扎扎实实地继续进步了，然后留我在原地若有所思，让朋友点明：“你看，进步还是存在的”；", "这有点像最开始的多肉植物素材：时间是个坏蛋，你必须认清了真相，才能够有所提高，才能够稳定住你自己。"]}, {"t": "书法比赛·初心", "tag": "梦想奋斗", "batch": 2, "time": "每天傍晚", "place": "书房，夕阳将余晖洒在我的书桌上，将笔尖的字迹印出斑斑驳驳，归鸟还巢", "people": "我和妈妈", "conflict": "书法一直是我的爱好，无论多忙，平日里的练习总是少不了的。铺纸、提笔、运笔，我常常沉浸在墨汁与纸张的海洋中，墨是香的，纸是暖的。然而，一场比赛改变了我。因为怕自己得不了奖，便没日没夜地练习。手疼了，就揉一揉再继续；背痛了，就捶捶背接着写。写得不尽人意时，那是我付出却得不到回报的失望。我感到愤恨与不解：为什么我努力了，却没有收获好的结果？我始终想不明白。妈妈见我焦躁不安、无法静心，告诉我说：“你最初写字是为了什么？是为了你心里的热爱。现在这股劲儿消失了，你的字也没了灵魂。”我细细琢磨妈妈的话，明白了这个道理。", "insight": "此后，我仍是没日没夜地练习，却少了烦躁，多了坚持，以及那份初心换来的沉淀", "ev": "素材的升格方向在于：我为什么一下子这么拼命地去练习，需要一个画面来交代。", "tips": ["给出一个画面：我在网站上看着其他选手提交的作品，感到震惊，又感到不安，觉得被他们比下去了，不想让自己这么多年的付出化为乌有。当然，这是我自己内心的一种自我攻击，然后我才想要通过大量练习来突破；", "结尾改写：把“没日没夜的练习”改变为“我花了时间去看人家的作品，去沉思，去欣赏艺术品，去捕捉其中那行云流水的美的韵味”。"]}];
var ZW = [{"t": "残缺也是一种美", "tag": "成长", "meta": "成长类大作文（友情 · 接纳缺陷）", "body": "<p>夕阳将橘黄斜斜地泼洒在林荫道上，金黄的银杏如小巧的折扇，火红的梧桐铺满地面。风里飘着落叶晒过太阳的干爽气息，我踩着满地的金黄与火红走过去，脚下沙沙作响，软软的，像踩在厚毯子上。我低头寻找心仪的落叶，竟发现有片与那叶脉书签极为相似的落叶，只是虫洞的位置不同。时间的齿轮缓缓转动，那个秋天的情景如潮水般向我涌来。</p>\n<p>我总爱在放学路上捡拾落叶，专挑光洁、没有裂缝的，小心翼翼夹入书页，想留下秋天的模样。我在这林荫道上走，并不着急，走走停停。我蹲下来捡起一片树叶，仔细端详——这片挺好，可惜上面有一处小虫眼。我嫌弃地丢在一旁，继续寻找下一个目标。我还记得那天，我正捡得欢，两片叶子挑来挑去，不知道选哪一片好。清脆的声音在我耳边响起，我转头一看，一个小女孩站在我身边，手里提着一兜子的落叶。“我叫汐汐，我也喜欢收集落叶——落叶是秋天最美丽的东西。”就这样，我和这个说话温温柔柔的女孩成了朋友。</p>\n<p>我的挑选标准与汐汐不同：我偏爱完美的树叶，她呢，全凭心情——那些裂的、有虫眼的，她都高高兴兴收下。“这片看起来脏脏的，破破的，你把它扔了吧，我给你找一片更好的。”我看着汐汐手中的落叶，满脸嫌弃。可汐汐指尖轻轻摩挲着枫叶残缺的边缘，目光落在飞舞的秋叶上，轻声说道：“我跟你可不一样，我就喜欢这样子的，你看，这不也挺好的吗？”我不理解，却也接受了。</p>\n<p>那天，她特意来找我，说她要去外地读书了，可能很久以后才会回来。她笑眯眯地从口袋里掏出一枚书签，塞在我手里：“这个送你。”我一看，是一片银杏叶做的书签，可惜有一条裂缝。我装作生气：“你明知道我不喜欢这种有瑕疵的。”“这样，你看到它，就会想起我了。”汐汐笑了，“你什么时候看懂了这叶脉书签，就懂我的用意了。”</p>\n<p>往后的日子，我依旧会走过那条落满落叶的小路。我偶然看到书签，想起汐汐——她不追求完美，她的叶子都有缺陷，可她却很开心。当初的谈话在心中慢慢化开。我向来执着于完美。那次期末考我考得不错，爸爸妈妈在饭桌上有说有笑，争着给我夹菜：“这次进步真大！”可我却低着头生闷气——只因数学那道题算错了一步，与满分擦肩而过。爸爸脸上的笑慢慢收住，和妈妈对视一眼，有点手足无措。比赛更是如此，为了追求完美，我在关键时刻求稳求全，反而输掉比赛，无缘晋级。我的不开心，不就来自这里吗？我总执拗地追求毫无瑕疵，可如同不存在完美无缺的落叶一样，世事也少有完美无缺的美满。</p>\n<p>秋叶的缺口，是风雨留下的印记，却无法掩盖它绚烂的色泽。叶片尚且如此，人又何尝不是这样？我们总会犯错，会有短板，会留下许多无法弥补的遗憾。现在我才明白，纵然带着伤痕，也要努力发光。</p>\n<p>我把那枚书签夹回书中，翻动书页——里面有不少叶子都是残缺的，我也从中读出不一样的美。</p>"}, {"t": "于烟火中见坚守力量", "tag": "平凡人物", "meta": "成长类大作文（平凡人物 · 长期主义）", "body": "<p>每一个上学日的黄昏，小巷便浸在朦胧的暮色中。这天放学，我拉着朋友，一起往巷子深处走去。朋友不解地问：“臭豆腐哪里都有，为什么偏要吃这一家？”我神秘一笑：“去了，你就知道了。”巷子深处的臭豆腐摊，是这暮色中一抹不曾改变的人间烟火。摊主王婆，在这小小天地中守了三十余年。</p>\n<p>那日放学回家的路上，一股独特的香气随风钻入鼻尖，我循着味儿走到小巷深处，“王婆臭豆腐”的招牌早已褪色发白，狭小的摊位前却早已排起了长队。人群摩肩接踵，前面有人轻声催促：“麻烦快些啦，我还要赶回家做饭。”王婆手上翻炸的动作不曾停下，笑着应声：“稍等片刻哈，马上就好。”</p>\n<p>排队的人们虽等候许久，脸上却没有半点烦躁。我心底生出浓浓的好奇：这家小店究竟藏着怎样的魔力？终于排到了，外皮炸得金黄酥脆，我迫不及待地尝了一口，内里软嫩多汁，醇厚的滋味在舌尖化开，吃完回望这家店，我记住了它。</p>\n<p>我曾光顾过一家网红臭豆腐店。吃完就拉肚子，口味每况愈下，短短几周，就草草关门。后来听街坊闲谈才知晓，那家店的油反复用到发黑，配菜随便糊弄，豆腐都过期了还在卖，只顾眼前牟利，渐渐耗光了大家的信任。</p>\n<p>往后每到放学，我总习惯绕路来这里。五元一份的臭豆腐，分量扎实，王婆的手艺依旧娴熟利落。一日，客人不多，我接过热腾腾的小吃，站在一旁听大家闲聊。旁边两位老顾客随口闲谈：“我从小吃到大，这么多年味道从没变故。”“可不是嘛，吃得放心，从来不用担心食材不新鲜。”</p>\n<p>有人顺势发问：“阿姨，您怎么不开分店扩大生意呢？”王婆一边擦拭台面，一边温和笑道：“开分店就很难把控品质了，我不想砸了招牌，辜负老主顾。”我望向桌边摆放整齐的调料、定期更换的清油，心底暖意缓缓漾开。</p>\n<p>那晚走在回家路上，王婆的话语一直在我耳边萦绕。平日里学习，我总免不了心浮气躁：觉得语文基础题简单，做题便敷衍粗心，频频丢分；轻视数学小题，不愿踏实练习，总栽在简单计算上，屡屡与满分失之交臂。我不断反思，却始终找不到症结。直到此刻，困扰我很久的问题，答案就藏在这一碗臭豆腐里。</p>\n<p>我端着手里还有余温的臭豆腐，似乎懂了什么：我总想着投机取巧、走捷径，却忘了学习和炸臭豆腐一样，唯有脚踏实地、守住本心，不偷工减料，才能有所收获。</p>\n<p>此后的日子里，我慢慢改掉浮躁的毛病，认真吃透每一道基础题，沉下心打磨小知识点。第一次做到全对的作业本发下来，老师在上面画了一个大大的勾，旁边写着一行字：“老师看到了你的变化，很欣慰。”我看着那行字，暗自觉得好笑——谁也想不到，这变化，始于一碗臭豆腐。</p>\n<p>王婆数十年如一日守着一方小摊，最好的长期主义，从不是轰轰烈烈的誓言，而是认真做好每一份油炸臭豆腐，把初心与坚守，融进平凡日子的朝夕之间。市井烟火寻常，普通人默默坚守的力量，悄悄点亮了我的成长之路。</p>\n<p>又一个黄昏，我拉着朋友来到小摊前。朋友接过刚出锅的臭豆腐，先是漫不经心地咬了一口，随即眼前一亮，惊喜地抬头看向我，又低头连吃了几口。我站在一旁，看着他的表情，忽然觉得，当初那个神秘一笑，如今有了最好的答案。</p>"}, {"t": "湖心那座爱心桥", "tag": "平凡人物", "meta": "平凡人物主题大作文", "body": "<p class='note'>说明：按严老师一对一讲评逐句升级并精修定稿。主题拉回平凡人物、小鸳鸯困境亲眼目睹、路人孩子角色、逻辑修正（先见竹板再问原因）、爱心桥细节精简、大叔与鸳鸯的灵性画面、扪心自问、结尾画面收束。</p>\n<h3>湖心那座爱心桥</h3>\n<p>西湖碧波荡漾，用木板搭成的“爱心桥”静立网间，年年护送着成群鸳鸯安然往返。世人沉醉于湖光山色，而我却认为，最美的风景，是那些默默守护生灵的平凡人。</p>\n<p>初夏，西湖的鸳鸯是最动人的风景。一窝窝小鸳鸯在妈妈的照顾下破壳长大，成群地在湖中游泳玩耍。可为了保护荷花，湖里拦着水网，这网难住了刚出生的小鸳鸯，它们个头只有鸡蛋大小，怎么也翻不过去。那天我亲眼看见，一只小鸳鸯跟着妈妈游向荷花区，游着游着，被拦网挡在了外面，扑腾着小小的翅膀，与家人隔网相望。我在岸边看着，心里发急，却无能为力。</p>\n<p>旁边有个五六岁的小男孩也看见了，扯着妈妈的衣角喊：“妈妈你看，小鸳鸯过不去了！”他蹲在岸边，小脸涨得通红，急得眼泪都要掉下来：“妈妈，你帮帮它，帮帮它！”他妈妈蹲下来，搂住他，轻声说：“妈妈也帮不了它呀。”孩子瘪着嘴，眼泪啪嗒啪嗒往下掉。那一刻，我心里说不出的难受。</p>\n<p>后来有天，我又去湖边散步，忽然远远看见有个人蹲在船上，正往拦网上安着什么。走近了才看清，是一个穿着绿马甲的大叔，他手里拿着一块竹板，正仔细地把竹板架在网口上，两端用钉子固定得整整齐齐。我等他上岸，忍不住问道：“叔叔，你为什么要在网口上加块竹板呀？”</p>\n<p>他抹了一把脸上的汗，冲我笑笑，指了指湖里的小鸳鸯：“那是‘鸳鸯爱心桥’。每次我看到小鸳鸯掉队、失散，便想帮它们一把。想了很久，发现可以做成桥，小鸳鸯能翻过去，又不耽误拦荷花，两不误！”说完，他得意地“哈哈”地笑起来。</p>\n<p>我顺着他的手看去，一只鸳鸯妈妈正带着宝宝们在“爱心桥”上歇脚，鸳鸯爸爸在一旁静静守护，那画面，真是温馨的“鸟中烟火”。</p>\n<p>后来我才知道，这“爱心桥”是大叔自己琢磨出来的：他自掏腰包买竹板，一遍遍地试，才找到常人看不到的那个改进的点。再后来，他把这个主意跟西湖水域管理处的工作人员一说，湖面上，一座座“爱心桥”陆续搭建起来。人来人往的西湖边，这座小小的竹桥，见证了一个城市对小生命的温柔守护。</p>\n<p>更让我惊奇的是大叔和鸳鸯相处的那一幕。平日里，小鸳鸯是极怕人的，人一靠近就躲得远远的。可那天大叔划着小船经过，一只小鸳鸯竟像有灵性一般，朝他游了过来，扑腾着跳上他的小船，依偎在他身边，亲昵极了。岸上的游人纷纷驻足，有人举起手机，有人小声惊叹。我站在人群里，看得出了神：一个人要怎样温柔地对待生灵，才能换来这样毫无防备的亲近？</p>\n<p>我忽然想起自己的许多事。有一次，一条蚯蚓爬到水泥路上，被太阳晒得扭来扭去，我看见了，却嫌弃地远远绕开；还有一次，一只蝴蝶在花间飞舞，我心想：这蝴蝶真好看，要是能做成标本留下来就好了。想到这里，我脸上有些发烫。大叔与动物相处的姿态，让我自惭形秽。原来真正的爱护，不是远远地欣赏，更不是想要占有，而是像他这样，蹲下身，想尽办法，帮它们一把。</p>\n<p>傍晚，一只小鸳鸯摇摇摆摆地走上“爱心桥”，稳稳地翻过了拦网，朝荷区里游去。我蹲在湖边，静静地看着这一幕，脑子里回响着大叔的那句话：“我想帮它们一把。”</p>\n<p>暮色漫过湖面，心底的光，却一点一点亮起来。原来平凡的人，也能在别人的生命里，搭起一座桥。</p>"}];

  var z = ZW[i];
  return '<div class="itm" style="margin-bottom:4px"><span class="tt" style="font-size:20px;font-weight:700;color:#3f6b5c">《' + esc(z.t) + '》终极版</span><span class="tag">' + esc(z.tag) + '</span></div>'
    + '<div style="font-size:13.5px;color:#8a8a80;margin-bottom:8px">' + esc(z.meta) + ' · 按一对一讲评升级定稿</div>'
    + '<div class="essay">' + z.body + '</div>';
}
function render(){
  var hash = location.hash || '#/';
  var m = hash.match(/^#\/sucai\/(\d+)$/), mz = hash.match(/^#\/zuowen\/(\d+)$/);
  var v = document.getElementById('view');
  var back = document.getElementById('back'), crumb = document.getElementById('crumb');
  if (hash === '#/' || hash === '') { v.innerHTML = homeView(); back.className = 'hide'; crumb.textContent = '刘梓筱 · 26年中考素材班作业归档'; }
  else if (hash === '#/sucai') { v.innerHTML = sucListView(); back.className = ''; back.href = '#/'; crumb.textContent = '素材归档'; }
  else if (m) { v.innerHTML = sucDetailView(+m[1]); back.className = ''; back.href = '#/sucai'; crumb.textContent = '素材 · ' + SUC[+m[1]].t; }
  else if (hash === '#/zuowen') { v.innerHTML = zwListView(); back.className = ''; back.href = '#/'; crumb.textContent = '作文归档'; }
  else if (mz) { v.innerHTML = zwDetailView(+mz[1]); back.className = ''; back.href = '#/zuowen'; crumb.textContent = '作文 · ' + ZW[+mz[1]].t; }
  else { v.innerHTML = homeView(); back.className = 'hide'; }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);
render();
</script>
