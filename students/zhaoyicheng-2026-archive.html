<script>
var SUC = [{"t": "外婆的来电", "tag": "温情", "batch": 1, "time": "某天晚上 7 点", "place": "书桌旁，手机放在面前，台灯的光照在桌上", "people": "我和外婆", "conflict": "界面一跳，来电提示显示是外婆来电。接听后我急忙切回游戏界面，一面用不耐烦的话应付着外婆，一边继续打团：“喂，什么事啊？”随后外婆慈祥的声音传来：“你什么时候来看外婆啊？”“等有空先吧。”我漫不经心地回答她。后来她又说了很多，我都没仔细听，用这样的话应付着。直到外婆说道：“你爱的那个辣条，我给你买回来了。”", "insight": "原来外婆她始终牵挂着我，哪怕我没来，也记得我的喜好——她的爱，藏在一包辣条里", "ev": "很真实，我很喜欢。", "tips": ["加一笔：“可我早就不爱吃辣条了”——外婆的认知里，我还是那个爱吃辣条的小孩子；我的喜好在外婆那边没有更新（因为我太久没去外婆家了）。一句话，主角的悔意就出来了；", "加催泪元素——外婆小声、神秘地说：“你妈妈不让你吃的辣条，外婆去给你买来了，来外婆家你可以吃。”（外婆为什么买辣条？她希望这可以让我愿意到她那边去。）", "细节：我停下手中的游戏、角色被打死、队友问怎么了，我闷闷地回应“没什么，这局打完了我要休息了”；", "题目：《更新》——手机里的游戏从没忘记更新，可是外婆那边的我，多久没更新了？"]}, {"t": "无人机·劳逸结合", "tag": "成长", "batch": 1, "time": "某个周末的午后", "place": "小区楼下", "people": "我和妈妈", "conflict": "阳光洒在大地上，天空中时有几朵云飘着，点缀着碧蓝的天空。我站在阳光下，一遍一遍地练习无人机的飞行，泪珠挂在脸上，四周只有螺旋桨旋转的声音。这时，妈妈走了过来，递给我一瓶水，说：“你已经练很久了，要注重劳逸结合，只有苦练是练不好的，休息也很重要。”", "insight": "休息一会儿后，我调整好无人机，继续练习，成果比刚才好了不少。看向妈妈，她露出了欣慰的笑容。原来单纯的苦练得不到结果，要有休息穿插其间，才能做得更好", "ev": "无人机是很好的时代素材（Z 时代），成长点（从一味苦练到劳逸结合）也对；但读者不知道你在练什么、离目标差多少，努力缺乏落点。", "tips": ["交代必要信息：无人机比赛比的是什么（穿越障碍还是竞速）、你距离目标还差多少（差距不能太大——必须是努力能够到的目标）、为什么这么刻苦；", "展现“拼命压榨自己”的小孩的样子：热、渴、头昏眼花，加上内心的拉扯——一会儿觉得“成绩够了，不要再练了”，一会儿又说“事到临头、临门一脚了，现在不练还待何时”；", "妈妈登场：好言相劝或“强势妈妈”夺过遥控器，让“我”不服气——妈妈的话不要一口气说太多，多回合对话，或借妈妈的口点出“劳逸结合的道理你懂不懂？你这么练下去，成绩只会越来越差”；", "加一个“适得其反”的画面：时间投入越多，成绩反而越差（当局者迷——太想赢，反而会出错）；", "切入回忆：以前熬夜复习考试没考好、锻炼过度不好好休息生了病（形散神不散，把“不懂劳逸结合”的历史翻出来）；", "结尾用画面：休息后飞得更好，妈妈在一旁赞叹“你这比前面几次看到的都好得多”——我心里想：真正有功劳的，是妈妈。"]}, {"t": "体育馆跑步", "tag": "成长", "batch": 1, "time": "某个周日的夜晚", "place": "体育馆", "people": "我和妈妈", "conflict": "“1 分 27 秒！”妈妈报时的声音响起。我坐在地上大喘着粗气，脸像烧红的铁：“我这还跑个啥呀？每次我成绩都差不多，别练了。”我垂着头，喘着气，不耐烦地说。“你自己说的，不跑进 1 分 20 秒不回家，你难道要放弃了吗？失败是成功之母，你继续坚持才能成功。”", "insight": "后来，我咬着牙继续练习，哪怕再累也坚持练习。终于，我成功了。果然，坚持与努力才是通往成功的路", "ev": "成长素材偏老（简单“努力→成功”），且“妈妈一说就成功”来得太轻易。", "tips": ["用“痛感写作”——腿抽筋像小刀割肉、嗓子里的血腥味、肺被一只大手挤压喘不过气、衣服被汗贴在身上、干呕又呕不出东西；", "痛不仅是生理反应，更是情感记忆——写出“千磨万击还坚劲”，成功才不来得太轻易；", "不要只写“妈妈说你坚持就能成功”，要让读者真的看到你受了多少苦，再看到成功。"]}, {"t": "被腰斩的小树", "tag": "感悟自然", "batch": 1, "time": "某天，台风过后", "place": "小区楼下", "people": "我", "conflict": "暴雨过后，平静终于回来，下楼透透气。到了楼下，一片狼藉——花散落一地，有的树枝折断在风雨中，更有甚者，一棵小树被腰斩，只觉得暴雨的恐怖。直到几天后出门打球，见那株被腰斩的树，它的断口处又长出了一株新芽。", "insight": "生命的可贵，在于受到挫折时，有敢于再来一次的勇气", "ev": "立意正确（挫折后敢于再来一次），但感悟是“说”出来的，缺少“我”的参与。", "tips": ["加入“我”的同情心理活动——“这棵树可完蛋了，生命还没有开始就终结了，真让人难受”；", "过几天再看到——“是我狭隘了”，断口处已长出新芽；", "与自己的往事形成对照：我曾因受打击而轻易放弃（比如把练琴的视频传上网被嘲讽，怒而把吉他塞进床底、再也不练）——重点写被嘲讽时心里的难受劲儿，有对照才有冲突。"]}, {"t": "树·生活的意义", "tag": "感悟自然", "batch": 1, "time": "某个午后", "place": "小区楼下", "people": "我", "conflict": "望着那棵树，看着树上盛开的花，回忆儿时——同一棵树下、同一个位置、不同的我。几年来，这棵树花开花落，重复着。它也许认为自己为世界带来了芬芳，可它不知道，它为自己带来了什么。", "insight": "我们生活在社会中，活在他人眼光中，从未成为自己所理想的自己", "ev": "这个素材挺有哲思的，但感悟和素材联系不够紧密。它其实触及到一个很本质的问题——生活到底是什么？生命的意义是什么？", "tips": ["写楼下的这棵树：这么多年，感觉它没有什么变化，而自己在慢慢长大——由此感知到现在的日子日复一日，非常无聊无趣，尤其是学习的压力，以及作为孩子被大人安排的生活；", "再写这棵树上的痕迹：某一年，某一根树枝被风吹断，留下伤疤；某一年，一只小鸟在上面筑巢，鸟已经飞走了，但巢的遗迹还在树上；以及自己与这棵树的许多回忆——小时候爬树玩耍被妈妈批评，长大了摘下树上的花做手工作业；", "这棵树是世上千万棵树之一，但也是全世界独一无二的一棵树；", "由此想到自己：每天的日常生活，其实也有许多值得纪念、值得欢笑或落泪的瞬间——这些瞬间，构成了我生活的意义。"]}, {"t": "补作业·牛奶", "tag": "温情", "batch": 1, "time": "某天晚上 9 点多", "place": "书桌前，奋笔疾书", "people": "我和妈妈", "conflict": "我双眼无神，一脸生无可恋地补着作业。妈妈推门进来：“那让你平时不写！现在着急忙慌地写。”“我知道了，我不是在补了吗。”“你还冲我发火？我可是你的妈。”“知道了，知道了。你是我妈，你先出去好不好？”在争吵中，她走出房间。11 点多，我补完走出房间，看到了放在桌上的牛奶。", "insight": "她总是这样——在争吵后，仍将一杯牛奶放在桌上", "ev": "这是典型的温情素材，方向很好；但缺少个人化的东西，牛奶没有细节。", "tips": ["加入个人化的前提：我们家的习惯是，我每天都要喝一杯牛奶（强身健体、补充营养）——这是大前提；", "妈妈的催促要加一点“恨铁不成钢”：妈妈早在假期刚开始的时候就说过很多次，让我早点把作业写完；", "中间加入我的倔强：我明知道自己做得不对，但就是气不过妈妈这样批评我——把心理活动写具体；", "我熬夜补完作业时，加一点小情形：有一种“好像我赢了”的感觉；", "给牛奶加细节：今天的牛奶里，妈妈加了巧克力粉，做成了巧克力牛奶——我一边暗暗吐槽“我都多大了，还给我泡巧克力牛奶”，一边又乖乖地把牛奶喝完；", "加入情节：我睡觉前想了想，又把刚刚补的作业拿出来仔细检查了一遍，修改了几处答案——以此表现我的改变；所以前面要加一个细节：我补的作业非常粗糙，仅仅是“完成”了而已。"]}, {"t": "保安大爷送快递", "tag": "平凡人物", "batch": 2, "time": "某一个炎热的午后", "place": "小区里", "people": "我和保安", "conflict": "烈日当头，炙烤大地。我很不幸地被妈妈派去取快递。虽然只有几步路，却仍觉得很艰难。刚走到一半，看见保安大爷手里端着一堆纸箱朝我走来。走到我近前，他说：“这是你家的快递，拿着，天热，少走几步。”我接了过来道谢，他却说：“应该的。”", "insight": "平凡人也在为他人付出微不足道的帮助，却弥足珍贵", "ev": "亮点——素材选得好，平凡人的帮助真实动人；问题——有一个剧情 bug：保安大爷怎么知道这是你家的快递？需要圆回来。", "tips": ["圆掉 bug：他不是专为我送——他推着小推车挨家挨户送（小区快递统一放电梯里），顺口一句“天太热，让你们业主少走几步”；", "强化“我不受热、他却很热”的对比细节：额头渗着密密的汗珠、脖子上搭着湿毛巾（干几下就得扯起来抹一把脸）、头发被汗打湿粘成一绺一绺的、扯着领口扇风——把“热”写足，这份帮助才显得珍贵；", "可以加我出门前的内心挣扎：站在单元门口望着外面，这么热的天出去不得晒晕了；看到地面的空气都有一点点扭曲——衬托大爷的付出；", "结尾加回馈：我回家拿了一包湿巾、一瓶冰水给他——大爷连连称谢，看着他用湿巾擦汗、拖着小推车去别的楼层——他本可以不做的，他做了；被我看到了，我感动了，我给予回馈，闭环完成。"]}, {"t": "早餐铺老板", "tag": "平凡人物", "batch": 2, "time": "某一个早晨", "place": "早餐铺", "people": "我和早餐店的老板", "conflict": "破旧的店面，塑料凳子和廉价的桌子，都擦得异常干净。虽说生意不是特别好，可每每遇见那些老人，老板都会多塞进一个茶叶蛋。", "insight": "", "ev": "问题——“我”缺失了：我如何看到这一幕？我如何了解到老板的动机？要把“我”加进来，再给老板的行为加一个前置的原因。", "tips": ["把“我”加进来：写我某天早晨在早餐铺吃早饭，亲眼看到老人来买早餐、老板多塞一个茶叶蛋——我是现场的见证者；", "给老板的行为加前置原因：让老板告诉我，这些老人家都很节省，每天来吃早饭都只是吃一点点——这是老人的节俭习惯，值得尊重；", "再进一步：作为店铺老板、作为家里也有老人的人，他知道老人家需要营养的补充，所以店里立了一个规矩——多少岁以上的老人，可以来领一个鸡蛋；", "升华落点：他的这一举动虽然只是个人行为，却让我看到了“老吾老以及人之老”的中国传统道德品质。"]}, {"t": "奶奶绣花", "tag": "传统文化", "batch": 2, "time": "某天午后", "place": "奶奶家", "people": "我和奶奶", "conflict": "奶奶在家里戴着老花镜，小心翼翼地用针一点一点儿地在布上绣着图案。我不解地问她，为何要如此费力地去绣，现在都用机器了，这样手工绣又累又没有用。可奶奶却说：“这是祖宗传下来的，不能丢。”", "insight": "传统文化是我国的珍宝，要将其传承", "ev": "问题——感悟写得太简单（“传统文化是珍宝，要传承”是一句口号），没有落到实处。", "tips": ["感悟升级：有些东西，是批量生产的工业品无法取代的；", "让奶奶给我讲解她绣的纹样、她小时候她的母亲是如何教她的——传统手工的传承里，还有跨越时空的温暖记忆；", "加细节：奶奶把我的名字绣在衣服的领口里，绣上代表吉祥的图案——这是买不到的，饱含着制作人的用心；", "落点：所谓传承，不只是手艺，更是藏在针脚里的心意与记忆。"]}, {"t": "七月半", "tag": "传统文化", "batch": 2, "time": "农历七月十五的晚上", "place": "自己家里", "people": "我和爸爸妈妈", "conflict": "在此之前，我和同学约好一起出去打球，可父母却说：“不行。你今天知道今天是什么日子吗？”我回答：“不就是七月半嘛，有啥的，这都 21 世纪了，你们怎么还说这些？再说了，我们要做一名坚定的唯物主义者。”可是任由我怎么说，他们都不让我去。", "insight": "", "ev": "这个素材很有意思——七月半（中元节）是中国传统文化的一部分，是中国人的鬼神信仰，也是不可忽视的文化遗产。", "tips": ["与温情主题和成长主题联系：父母其实是“宁可信其有，不可信其无”的态度，出于对我的保护与爱，才提醒我这么做；", "用双重视角：当时的我，嘲笑父母的古板、不知变通；之后的我，理解了父母的用心——这是作为长辈、作为父母，对孩子的一种爱的具体呈现；", "主题可以多向选择：成长（从不解到理解）、传统文化（中元节的文化内涵）、温情（父母的爱）。"]}, {"t": "大阅兵·爸爸抢手机", "tag": "家国情怀", "batch": 2, "time": "某一天的下午", "place": "家里", "people": "我和爸爸", "conflict": "9 月 4 日大阅兵，大概 10 点多的时候，爸爸在外面买菜回来，打开电视开始看阅兵，而我在房间里和朋友们组队打游戏。过了一会儿，他走进我的房间，见我正在玩游戏，一把抢过我的手机训斥我：“今天有阅兵，你还玩游戏？是无数革命先辈换来现在的幸福生活，你却在用游戏虚度光阴。”", "insight": "", "ev": "学生可能不知道怎么升华，也没有写出感悟——这个素材的感悟，应该跟成长类有关。", "tips": ["写出我内心的不服气：觉得那是很遥远的事情——国家的强盛固然值得庆贺，但跟我一个普通的中学生好像没有多大关系；", "补充一个具体事件：我在历史书上看到近代史，了解到当时中国积贫积弱、引来外敌的觊觎——然后才猛然意识到：国家的武器强盛、国力强盛，跟我这个普通的学生，到底有什么关系？（转折之后才懂：正因无数先辈的牺牲，才有我此刻安稳的生活）", "结尾落点：从“与我无关”到“与我有关”——把个人与家国连起来（身在福中要知福，和平由他们锻造，我该加倍珍惜）；", "可以加一个收束：从那以后，我不再觉得阅兵与我无关——大阅兵那天，我坐在爸爸身边，看完了全程。"]}, {"t": "语文成绩·前 200 名", "tag": "梦想奋斗", "batch": 2, "time": "期末考试前", "place": "学校里", "people": "我自己", "conflict": "为了能够考到年级前 200 名，可我的语文成绩长期不理想。在不断的复习与学习后，仍在模拟考中失利。我认为自己的努力白费了，想要放弃，经过老师的劝导后，重拾信心。", "insight": "通往成功的路很长，有时不仅要努力，更要有长期坚持的决心", "ev": "素材比较老套，我们需要对它进行个人化、细致化的改装。", "tips": ["点出语文成绩难以提高的原因：我作为理科较好的学生，觉得语文投入的时间没有性价比——背的那些古诗、做的那些阅读，好像无法体现在成绩上面来；", "让语文老师点出：语文学习是一个长期的、整体的过程——帮我建立正确的语文学习观念；", "感悟落在：做事情不仅靠投入时间，也要讲究方式方法、找对路径，才可以事半功倍——从“语文”这一科，升到“方法”这个普遍道理。"]}, {"t": "无人机比赛", "tag": "梦想奋斗", "batch": 2, "time": "比赛之前", "place": "小区里", "people": "我自己", "conflict": "无人机比赛将近，可我的成绩仍然停滞不前，更因为自身的焦虑心态，导致成绩越来越差，一度不愿意练习。而妈妈劝导我之后，我继续努力了。", "insight": "在通往梦想的道路上，要有一颗平稳的心，这是成功的关键", "ev": "问题在于没有写出“反复”来——我信心崩塌的过程是空的，要写出具体的动作、神情、心理活动。", "tips": ["强化我信心崩塌的具体细节：盯着纹丝不动的成绩发呆？摔下遥控器？越练越乱、手都在抖？——把崩溃演出来；", "让妈妈插入戏份：她把我叫过去，让我休息，给我买水；不讲我无人机训练的情况，转而讲起她自己学生时代、工作中“因为长期努力见不到结果、导致心态失衡、最终失败”的经历；", "用他人的经历反照自己，引发我的成长：意识到成长并不是一件能够着急的事情——平稳的心，才是通往梦想的关键。"]}];
var ZW = [{"t": "成长不是不断的加法", "tag": "成长", "meta": "成长类大作文（劳逸结合）", "body": "<h3>《成长不是不断的加法》终极版</h3>\n<p><b>学生：</b> 赵奕丞 ｜ <b>版本：</b> 原稿 → 终极版 ｜ <b>文体：</b> 成长类大作文（劳逸结合）</p>\n<h4>成长不是不断的加法</h4>\n<p>天空是蔚蓝色的，虽已入秋，微风拂面，可天气仍未凉快下去。太阳悬在天上，洒下阳光，传递着温暖，可此时却显得有些多余了。</p>\n<p>因比赛日将近，我比以往更加刻苦。无人机竞速赛，我给自己定的目标是 45 秒内完赛，可现在，我还差着将近 8 秒。</p>\n<p>我站在小区楼下，眯着眼，以此抵挡太阳刺眼的光芒。一个多小时后，风是热的，天地如烤炉，我就像一块烤肉，汗液像是汁水被不断压榨出来，让我的皮肤与衣物紧密贴合在一起。我只觉得口干舌燥、头晕眼花。</p>\n<p>其实，我的心里一直在拉扯：一边想着“已经练了一个多小时了，成绩够得着了，要不休息吧”，一边又对自己说“比赛就剩几天了，临门一脚，现在不练还待何时？”旁边乘凉的大爷都劝我：“小伙子，歇会儿吧，你练得已经挺好的了。”我却摇头：“不行，我还差得远。”</p>\n<p>可越是这样，成绩反而越差。我又飞了一圈，打开成绩记录，恨不得把这机器给摔了——怎么？这次飞得比前两次还要差！</p>\n<p>“先休息会儿吧，已经练了一个多小时了，也该休息了，喝口水吧。”我回头，是妈妈。她用左手遮住阳光，右手打着伞，手臂上挂了个透明塑料袋，里面是两瓶矿泉水。她走到我身边，拿出一瓶水递到我面前。</p>\n<p>“不用了，我的成绩还没提高。”我没有接。</p>\n<p>“你已经练很久了啊。”妈妈耐心地说，“人要劳逸结合，不能一味地苦练。就像这太阳光所带来的温度不断叠加，只会让你感到炎热；而适当的温度，才能让你感到舒适。你一味苦练而不休息，只会适得其反。”</p>\n<p>“可是比赛就剩几天了……”我小声说。</p>\n<p>“那更该休息了。”妈妈放下伞，认真地看着我，“你现在满头大汗、头昏眼花，这是最好的状态吗？不是好状态，怎么突破成绩？”她顿了顿，“你刚才自己也看到了——越练，成绩越差。这不就是适得其反吗？”</p>\n<p>我愣住了。刚才那几圈，的确是一次比一次差。妈妈的话，这才真正进了我心里。</p>\n<p>我想起以前，也有过这样的时候：期末考试前熬夜复习，熬到凌晨，第二天头昏脑涨，考试没考好；还有一次锻炼过度、不好好休息，免疫力下降生了病。哪一次，不是这样“用力过猛”的结果？</p>\n<p>我接过妈妈手里的水，咕咚咕咚喝了几口，又坐在地上歇了一会儿。凉风拂过，汗水慢慢收干，头脑也清醒了许多。</p>\n<p>休息够了，我重新拿起遥控器。这一次，我不再急着追求成绩，而是稳稳地、一圈一圈地飞。无人机在天空中盘旋、绕杆、过门，姿态从容。成绩出来了——42 秒！</p>\n<p>“哇，进步这么大！”妈妈在旁边兴奋地拍手，“你比刚才飞得好太多了！”</p>\n<p>我心里想：真正该感谢的，是妈妈。要不是她逼我停下来，我大概还在跟自己的疲惫较劲。</p>\n<p>原来，成长从来不是一味的练习叠加，而是懂得劳逸结合、张弛有度。真正的进步，往往发生在我放慢脚步之后。</p>"}, {"t": "更新", "tag": "温情", "meta": "温情类大作文（小场景·独角戏改造）", "body": "<h3>《更新》终极版</h3>\n<p><b>学生：</b> 赵奕丞 ｜ <b>版本：</b> 原稿 → 终极版 ｜ <b>文体：</b> 温情类大作文（小场景·独角戏改造）</p>\n<h4>更新</h4>\n<p>夜深了。楼下的喧闹声一点点安静下来——原本在空地上乘凉的大爷大妈们收了扇子回家，玩耍的小孩散了，跳广场舞的音乐也停了。窗外只剩几盏路灯，孤零零地亮着。</p>\n<p>我伸了个懒腰，打了个哈欠，把写完的作业一张张检查过去，满意地合上练习册。抬头看了一眼桌上的时钟——七点。</p>\n<p>“今天效率挺高。”我心想，“时间还早，不如打几把游戏放松一下。”说干就干。我打开游戏，心情一下子激动起来：好久没有痛快地玩过了，今天势必要杀他个昏天黑地！</p>\n<p>正打得酣畅，界面突然跳转——有电话进来，是外婆的。</p>\n<p>我接起电话，又急忙切回游戏。“你什么时候来外婆家玩啊？”外婆温和轻柔的声音从听筒里传来。“等有空吧。”我漫不经心地回应着，眼睛却盯着屏幕。</p>\n<p>电话那头，外婆絮絮叨叨地说着：村里的大黄狗生了一窝小狗，家里新装了电器，今天买菜碰见了谁……她一件一件地说着，像是要把攒了很久的话一次说完。我却专注着游戏，胡乱地“嗯嗯”应着，一点儿也没听进去。</p>\n<p>游戏正进行到关键时刻。我屏住呼吸，手指飞快地操作，生怕任何一个失误葬送这一局的胜利。就在这时，队友一个失误，害我丢了一条命。</p>\n<p>“哎！”我不禁叫出了声。</p>\n<p>“怎么了？发生什么事了？”电话那头，外婆听到了，连忙问我。</p>\n<p>“没什么，没什么。”我连忙掩饰。</p>\n<p>外婆沉默了一下，突然压低声音，故作神秘：“你妈她不在边上吧？就你之前来，不是说要吃辣条吗？你妈妈不让你吃，你就哭就闹。我呀，给你买回来了！”</p>\n<p>我愣住了。</p>\n<p>这是多久以前的事了？她还记得。可我却记不清了。</p>\n<p>“外婆，我这边有点事，先挂了。”我胡乱地说着——游戏里队友见我不动，正在喊我；刚才那局输了，外婆又提起辣条，我的脑子乱糟糟的，只是“嗯嗯”地应着。</p>\n<p>“好好好，你忙你忙。”外婆笑着，“辣条我给你存着，你回来吃啊，可别跟你妈讲。行了，电视剧要开始了，我去看了。”说完，电话挂了。</p>\n<p>房间里安静下来。月光照进屋子，虫鸣飘进我的耳朵。队友在耳机里喊：“刚刚怎么失误了？一个多好的机会！”我却没了心情争辩，只回了一句：“今天状态不好，不打了。”下了线。</p>\n<p>我猛地想起——我早已不爱吃辣条了呀。</p>\n<p>愧疚从心底升起来。我坐在椅子上，回想着外婆刚才的话，思绪被拉回从前。</p>\n<p>那时候我还小，夏天天很热，我在外婆家过暑假。我躺在外婆怀里，外婆一手拿着冰镇汽水——那是她特意买给我喝的，说她从来不喝，都是为我准备的；桌上摆着洗好切好的水果，葡萄、西瓜，每天都不一样。外婆把我揽在怀里，有一搭没一搭地摇着扇子，听我兴致勃勃地讲电视里播的动画片。我讲得眉飞色舞，外婆其实听不太懂，却乐呵呵地应着：“是吗？那后来呢？”我闻着她身上淡淡的雪花膏味道，觉得幸福极了。</p>\n<p>我忽然仰起头说：“外婆，等我长大了，要给你买个大别墅！”</p>\n<p>外婆哈哈大笑：“好好好，外婆等着你给我买大别墅！”</p>\n<p>回忆里的夏天，明亮、温暖、闪着光。而眼前的黑夜，冷白色的台灯光照在手机屏幕上，反射出一片冷白。</p>\n<p>细细一想，我竟然已经很久没有主动去看过外婆了。其实路并不远，就那么几公里；其实放假了，我每天都有空。可我的学习越来越忙，也就是逢年过节，才和爸爸妈妈一起去一趟。哪怕去了，我也是手机不离手——就像今晚这样。</p>\n<p>我仿佛看见，外婆一个人走进超市，站在货架前，努力回忆着我爱吃的那个牌子的辣条，挑挑拣拣，买了一大包，喜滋滋地放回家里，等着我回去，把辣条塞给我，再听我讲讲我的生活。</p>\n<p>想到这里，我的眼眶有些湿润。</p>\n<p>手机里的游戏，我从来没有忘记过更新版本。可我在外婆心里的样子，却还是那个爱吃辣条的小孩——我有多久，没有更新过“自己”了？</p>\n<p>我拿起手机，按下回拨键。</p>\n<p>“外婆……就这个周末，我回去看看你。”</p>"}, {"t": "平凡微光", "tag": "平凡人物", "meta": "平凡人物主题大作文（写人）", "body": "<h3>《平凡微光》终极版</h3>\n<p><b>学生：</b> 赵奕丞 ｜ <b>版本：</b> 原稿 → 终极版 ｜ <b>文体：</b> 平凡人物主题大作文（写人）</p>\n<h4>平凡微光</h4>\n<p>碧蓝的天空中，一个巨大的火球悬挂着，释放着热浪和刺眼的光芒。天地之间，仿佛成了一个巨大的火炉。窗外偶尔传来几声鸟鸣，但大部分时间，都热得一片死寂，连风似乎也凝固住了。</p>\n<p>我看着窗外，心里嘀咕：这天气，谁愿意出去？</p>\n<p>“儿子，去取快递去！”妈妈的声音从客厅传来。</p>\n<p>“我不要去，太热了！”我喊回去。</p>\n<p>“你去不去？不去的话，这个月的零花钱可就没有了。”</p>\n<p>在妈妈的威胁之下，我只好不情不愿地站起身，没好气地走向门口。</p>\n<p>出了家门，楼道里闷热闷热的，没走几步，身上就冒出了细细的汗。我心想：这才刚出家门口，出去还不得把我晒死？</p>\n<p>单元门一开，热浪扑面而来，如同一股洪水，侵袭全身，将我包裹、吞食。眼睛被阳光刺得几乎睁不开，皮肤晒得发烫。我一路走，尽量往树荫底下钻。不知谁家的狗倒在泥土里，不停地吐着舌头散热。我看着它，心里直叹气：这狗真可怜，热成这样还待在外面，它的主人真是的。再一想——我也好可怜，这么热的天，还不是要在外面走？</p>\n<p>走到半路，刺眼的阳光中有一个模糊的身影。汗水蒙住了眼睛，我伸手擦掉，定睛一看——是门口保安大爷。</p>\n<p>我有些意外：他平时不一直待在门口的保安亭里吗？今天怎么跑到这儿来了？我再一看，他身后拉着一辆平板车，上面堆着一座小山似的纸箱。</p>\n<p>我把目光落在他身上：他穿着保安服，热得把胸前的扣子都解开了，裸露的手臂被晒得亮晶晶的；身上其他地方，保安服被汗水打湿，紧紧贴在身上。脸上全是汗，下巴上更是一粒一粒的汗珠往下滴。</p>\n<p>“保安大叔，你这是干啥？”我抬起手，朝他打招呼。</p>\n<p>“送快递呢。”大叔笑呵呵地说，“你们家有快递，我直接拿给你，省得你再跑一趟。”</p>\n<p>“大叔，你怎么干起送快递的活儿了？”我惊奇地问。</p>\n<p>“我想着，你们业主大热天还要跑到保安亭来取，多遭罪。不如我帮帮忙，把快递都送到各栋楼下，你们下楼就能拿到了。”他说，“我在业主群里说过，你不知道吗？”</p>\n<p>我心想：大概是妈妈没看业主群吧。</p>\n<p>大叔挤出一个温和的笑容，走到车后，从快递堆里找出几个递给我：“那，你们家的快递。天热，快回去吧。”</p>\n<p>“大叔，你热不热？这么热的天，拖着一车快递跑来跑去，多累啊。”我问。</p>\n<p>“累？”大叔摆摆手，“我一个人热，可整个小区的住户都不用受累了。这笔账，算算还蛮划算的。”</p>\n<p>太阳底下的快递盒，我拿在手里，都在发烫。</p>\n<p>大叔没有停下，又拖着平板车来到我们这栋楼的单元门口，在电梯厅里，把属于这栋楼居民的快递一件一件拿出来，摆放整齐。我站在一旁看着——他做得很认真，一丝不苟。</p>\n<p>“大叔，你等一下！”我忽然想到什么，转身跑上楼。</p>\n<p>回到家，妈妈正惊讶：“这么快就回来了？”</p>\n<p>“等会儿，我有事儿。”我冲进厨房，拿了一瓶饮用水，又抓了一包湿巾，转身冲下楼去。</p>\n<p>“大叔，给！”我把水递过去，又抽出湿巾。</p>\n<p>大叔愣住了，随即接过，笑了：“你这孩子……”</p>\n<p>我想起，大叔帮过的忙远不止这一回：楼下花坛的树上长过一个马蜂窝，是他带着工具来铲除的；有一回楼道里的灯坏了，也是他赶来修好的。每次给我们干活，他总是笑眯眯的。</p>\n<p>这位保安大叔，用他的一桩一件件小事，汇聚成我们住户心里一颗小小的、发光发热的太阳。</p>\n<p>而我，也终于把这份光，接过来，又递了回去。</p>"}];

    + '<a class="ent" href="#/sucai"><div class="card"><div class="ic">📝</div><div><div class="tt">素材归档</div><div class="ds">13 篇学生素材 · 学生素材与老师点评</div></div></div></a>'
    + '<a class="ent" href="#/zuowen"><div class="card"><div class="ic">📖</div><div><div class="tt">作文归档</div><div class="ds">3 篇大作文 · 终极版成品（成长 / 温情 / 平凡人物）</div></div></div></a>';
}

function sucListView(){
  var h = '<div class="sec-t"><span class="n">1</span>素材 · 批1（成长 / 温情 / 自然 · 6 篇）</div>';
  SUC.filter(function(s){return s.batch===1;}).forEach(function(s){
    h += '<a class="ent" href="#/sucai/' + SUC.indexOf(s) + '"><div class="card itm"><span class="tt">' + esc(s.t) + '</span><span class="tag">' + esc(s.tag) + '</span></div></a>';
  });
  h += '<div class="sec-t"><span class="n">2</span>素材 · 批2（平凡人物 / 传统文化 / 家国情怀 / 梦想奋斗 · 7 篇）</div>';
  SUC.filter(function(s){return s.batch===2;}).forEach(function(s){
    h += '<a class="ent" href="#/sucai/' + SUC.indexOf(s) + '"><div class="card itm"><span class="tt">' + esc(s.t) + '</span><span class="tag">' + esc(s.tag) + '</span></div></a>';
  });
  return h;
}

function sucDetailView(i){
  var s = SUC[i];
  var h = '<div class="card detail">'
    + '<div class="itm" style="margin-bottom:6px"><span class="tt" style="font-size:20px;font-weight:700;color:#3f6b5c">' + esc(s.t) + '</span><span class="tag">' + esc(s.tag) + '</span></div>'
    + '<div class="origin"><div class="head">✏️ 学生素材</div>'
    + '<p><span class="k">时间：</span>' + esc(s.time) + '</p>'
    + '<p><span class="k">地点：</span>' + esc(s.place) + '</p>'
    + '<p><span class="k">人物：</span>' + esc(s.people) + '</p>'
    + '<p><span class="k">冲突：</span>' + esc(s.conflict) + '</p>'
    + '<p><span class="k">感悟：</span>' + (s.insight ? esc(s.insight) : '（素材未写感悟句）') + '</p></div>'
    + '<div class="review"><div class="head">💡 老师点评与升格建议</div>'
    + '<p><b>评价：</b>' + esc(s.ev) + '</p><ol>';
  s.tips.forEach(function(tp){ h += '<li>' + esc(tp) + '</li>'; });
  h += '</ol></div></div>';
  return h;
}

function zwListView(){
  var h = '';
  ZW.forEach(function(z){
    h += '<a class="ent" href="#/zuowen/' + ZW.indexOf(z) + '"><div class="card itm"><span class="tt">《' + esc(z.t) + '》</span><span class="tag">' + esc(z.tag) + '</span></div></a>';
  });
  return h;
}

function zwDetailView(i){
  var z = ZW[i];
  var h = '<div class="itm" style="margin-bottom:4px"><span class="tt" style="font-size:20px;font-weight:700;color:#3f6b5c">《' + esc(z.t) + '》终极版</span><span class="tag">' + esc(z.tag) + '</span></div>'
    + '<div style="font-size:13.5px;color:#8a8a80;margin-bottom:8px">' + esc(z.meta) + ' · 按一对一讲评升级定稿</div>'
    + '<div class="essay">' + z.body + '</div>';
  return h;
}

function render(){
  var hash = location.hash || '#/';
  var m = hash.match(/^#\/sucai\/(\d+)$/), mz = hash.match(/^#\/zuowen\/(\d+)$/);
  var v = document.getElementById('view');
  var back = document.getElementById('back'), crumb = document.getElementById('crumb');
  if (hash === '#/' || hash === '') {
    v.innerHTML = homeView(); back.className = 'hide'; crumb.textContent = '赵奕丞 · 26年中考素材班作业归档';
  } else if (hash === '#/sucai') {
    v.innerHTML = sucListView(); back.className = ''; crumb.textContent = '素材归档';
  } else if (m) {
    v.innerHTML = sucDetailView(+m[1]); back.className = ''; back.href = '#/sucai'; crumb.textContent = '素材 · ' + SUC[+m[1]].t;
  } else if (hash === '#/zuowen') {
    v.innerHTML = zwListView(); back.className = ''; back.href = '#/'; crumb.textContent = '作文归档';
  } else if (mz) {
    v.innerHTML = zwDetailView(+mz[1]); back.className = ''; back.href = '#/zuowen'; crumb.textContent = '作文 · ' + ZW[+mz[1]].t;
  } else { v.innerHTML = homeView(); back.className = 'hide'; }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
