<script>
var SUC = [{"t": "暴雨与无常", "tag": "感悟自然", "batch": 1, "time": "夏天的一个中午", "place": "楼下的露天停车场。地上是整齐排列的红砖，缝隙里钻出几棵小草，天上飘着朵朵白云", "people": "我", "conflict": "我正举着相机对准一朵娇嫩的花朵，发现镜头上总有擦不净的水珠。正当我疑惑时，随着几声闷雷，大雨倾盆而下，花朵顿时瘫在了地上。我捂住头发，赶紧往家跑去。当我到家时，雨已经停了，窗外阳光明媚，草尖上带着水滴，好像无事发生", "insight": "暴雨来得快、去得快，在生活中遇到困难时，要从容面对，问题总能解决", "ev": "画面感很好（红砖缝隙里的小草、镜头上擦不净的水珠，都是好细节）；但“暴雨来得快、去得快，遇到困难要从容面对、问题总能解决”这个领悟有问题：你解决了暴雨吗？没有，你是被淋到了。", "tips": ["暴雨告诉我们的，是“人生的无常”。考场的失利不一定是没准备好，而是意外状况；长辈的猝然离世、宠物的失踪，人总会追问：“为什么我这么倒霉？为什么坏事降在我身上？”；", "结合苏轼：《定风波》“竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生”、《水调歌头》“月有阴晴圆缺”。苏轼的人生无常：上天给他学识与出身，却不给他一条通畅的仕途；", "回到原文：“我遇到了这场暴雨，那又怎样？洗个澡、吹吹干，清清爽爽，生活要继续。”；", "再配塞翁失马（焉知祸福）：马丢了不捶胸顿足，马带着胡人的马回来也不很高兴。保持活在当下的心态，面对人生无常的课题。"]}, {"t": "校园vlog组队", "tag": "成长", "batch": 1, "time": "星期二的下午", "place": "学校里。微风轻轻掀动书页，纸页簌簌翻飞，像一群振翅欲飞的白蝶；阳光透过绿植的缝隙洒下来，地面落满细碎的光斑", "people": "我，同桌", "conflict": "老师布置了校园vlog的作业，我看着空白的剪辑页面发呆，手足无措。同桌轻轻凑过来说：“没有人愿意和我一起组成小队，你愿意和我一起完成这项作业吗？”“愿意，但是……我不会。”“没事，我和你可以一起讨论。”他擅长剪短片、拍视频，但在构思脚本上犯了难，写出的旁白干巴巴的，而这正是我的长处。我接过脚本，把课间同学的欢声笑语、翻书页的沙沙声写进文章。我们就这样取长补短", "insight": "合作不是一个人单向付出，而是取长补短、双向奔赴；既能看见别人身上的闪光点，也能认清自己的不足", "ev": "写团结协作不错；但温情一面不够，故事里“我”的处境、同桌的动机都没有交代。", "tips": ["强化温情一面，真相是：同桌知道我落单，故意说“没有人愿意和我组成小队”。他不是没人组队才来找我，而是知道我这边没有人跟我一块，主动来找我；", "读者恍然一悟：看到了两个同学之间纯洁的友情。校园青春故事的味道，就出来了。"]}, {"t": "回老家vs研学", "tag": "温情", "batch": 1, "time": "中秋节前", "place": "自己的书房里。燥热的空气顺着纱窗溜进屋里，蝉鸣不绝于耳", "people": "我，外婆", "conflict": "我回老家心切，提前几日就收拾好了行李，一想到能见到外婆、尝到她亲手制作的月饼，心底便荡漾开一阵暖意。可我突然接到通知，学校将举办一场极具吸引力的研学活动，邀请我报名参加。我陷入两难，一边是心心念念的外婆，一边是难得的机会。外婆摇着蒲扇的身影出现在视频通话中：“过节回不回老家呀？”我望着她鬓角的白发，忽然想到儿时她站在门口等我回家、做月饼时她灵巧的手。我心中已有了答案，告诉她：“外婆，我回老家。”", "insight": "中秋要的就是团圆的暖，应该多回去陪伴爱你的人", "ev": "这是温情的素材，可以写；但“接受回家的选择”来得太容易，你要把它写得没那么容易，拒绝诱惑的行动才足够动人。", "tips": ["我打电话，本想告知外婆“不回去了”。研学机会难得，外婆家随时都能去；", "视频里，我却开不了口。外婆展示采购的做月饼物资：“我等着你回来，一起做月饼。”回忆插入（外婆很爱我的往事、她的皱纹与白发），我的心被打动；", "下定决心回老家，有些东西无法替代，是世间最珍贵的。把研学的诱惑写得足够大（对升学有好处、伙伴们都去），你放弃诱惑的行动才足够动人。既可以写温情，也可以写成成长认知的突破。"]}, {"t": "向小亮请教", "tag": "成长", "batch": 1, "time": "某天下午", "place": "客厅的电脑前，台灯洒下柔和的光，荧屏上的蓝光映照着我的脸", "people": "我，小亮", "conflict": "线上数学竞赛中，我考得不理想，输了，有好多大题都想不出正确的解题方法。我抱着试一试的态度，向我的对手小亮请教。下午5点，手机显示有新的消息，小亮把题拆分成好几个部分，详细地写了解题步骤。有一道题，他用红笔标注：“你想到这里，已经非常接近正确答案了，差两步就能成功了。”我用语音发了“谢谢”。他回道：“没什么，我们一起学习，一起进步。”", "insight": "小亮的解题让我明白，对手和我也是一起进步的；学习中要认真思考，不懂就要去请教", "ev": "好，放下自尊、为求真理主动向“对手”请教；你的素材里已经有了具体的对话细节（红笔标注“差两步就能成功”），很好。", "tips": ["放大“犹豫”的态度：作为“手下败将”，我是怎么放下可笑的自尊、主动向对手开口的？把那份挣扎写出来；", "给对话加一点灵气：小亮贱嗖地说“这不是我的手下败将吗？先叫声师傅再说”，我气急“你再这样，我不问你了”，过了几秒他发来“生气了？好，不逗你了，给你讲”，让读者会心一笑；", "写法提示：写男孩要突出“贱嗖”，外表大大咧咧、爱逗人，内心柔软、懂分寸、讲情义；写女孩要“外柔内刚”，有反差感、有原则、敢为自己争取。"]}, {"t": "仰望星空", "tag": "感悟自然", "batch": 1, "time": "某天晚上", "place": "农村的小院，墙角铺着青苔，屋顶被月亮镀上一层白光", "people": "我，表弟", "conflict": "出门倒垃圾，偶然望向天空，一轮明亮的月亮旁，点点星光闪烁。星星有大有小、有明有暗，静静躺在黑色的幕布中。“这好像是我们在书上学过的半人马座！”表弟兴冲冲地跑回屋子，拿出一本星座图鉴。果然，几颗星星连接成一条条，描摹出前腿屈起、四蹄迈开的半人马形象", "insight": "大自然如此神奇，人类如此渺小，让我懂得心怀敬畏之心", "ev": "这个素材抓人的点在于它的美感：月光、青苔、漫天的星河，画面感很强。但问题在于：结尾直接喊出“我要心怀敬畏之心、人类如此渺小”，与前文脱节，敬畏不是无缘无故产生的，前面缺少铺垫。", "tips": ["前文铺垫“人与自然的隔绝”状态：你出门倒垃圾，本来是想快点回房间去，上网、看剧、打游戏、和朋友聊天；倒垃圾时的磨蹭与不耐烦、一直低头看手机，把这些“网瘾少年”的状态写出来，都是为了铺垫后面那个“抬头”的瞬间；", "写出“一瞥”的震撼：你一抬头，被漫天的星河所震撼。想把星星拍下来发给朋友看，却发现手机无论如何也捕捉不了此时此刻看到的壮观景象。“手机拍不下来”这个细节，正是时代元素，也是“美无法被记录、只能被感受”的点；", "加一条线（双线叙事）：表弟是天文爱好者，而我对他的爱好没有感觉、嗤之以鼻，觉得这很无聊；表弟不以为意，他的爱好给他带来一种超越同龄人的平静与温和。我从前对表弟爱好的轻蔑，与最后自己被星空震撼，形成对照；", "感悟升级：除了“人在自然面前的渺小、心怀敬畏”，还要加一层，对表弟爱好的重新认识：我曾经嗤之以鼻的东西，原来有那样的力量。两条线收在一起，文章就厚了。"]}, {"t": "门卫老大爷", "tag": "平凡人物", "batch": 2, "time": "周末的晚上", "place": "门卫室旁，明亮的路灯立着，沥青路面散发出燥热的气息，天空如披上幕布般黑漆漆的", "people": "门卫老大爷", "conflict": "傍晚，门卫老大爷用水泥补上了楼梯缺失的部分，汗水不断从额头淌下，滴到地上。新来的物业工作者阿明说他“多管闲事”“这个岁数了也不想着自己的身体”。他笑着抹了一把脸：“晚上很黑，楼梯缺了一角叫人踩空了怎么办。等水泥干了，我再去买几根反光条贴在台阶上面。”", "insight": "门卫老大爷没有惊天动地的举动，却用一身汗水为大家着想。这份努力格外打动人心。", "ev": "亮点：抓了一个不起眼的平凡人物，用“补楼梯”这件小事写他的用心，对话朴实有温度；问题：素材缺前因，读者不知道为什么楼梯该由他来修，也缺“我在场”的观察视角，画面立不起来。", "tips": ["补上前因：楼梯这一角其实已经破损很久了，业主报给物业，物业迟迟没有来修，有人在这里踩空、差点摔跤，大家也只是路过的时候自己注意一下而已，直到门卫老大爷自费买了材料来修补；", "加入观察视角：我是在场看着老大爷修补的人，写出他因为年纪大、弯腰劳动带来的身体不适，比如腰酸、背痛，比如长久蹲下后站起来的一阵头晕。"]}, {"t": "一楼小院·孩子们摘果子", "tag": "平凡人物", "batch": 2, "time": "每个周末", "place": "一楼有户人家的小院里，绿草丛生，一枝蔷薇爬上了围墙，蜜蜂在花间起舞", "people": "一楼户主、“我”", "conflict": "我总是看见许多孩子聚在一楼的小院里捉迷藏、抓昆虫，很是好奇，便去看了看。主人见到我后很是热情：“快来摘石榴，现在刚刚成熟呢！”这时我才发现院子里有很多果树。石榴树上挂满了石榴，青涩的柿子挂在枝头。我愣了一下，突然想到，这个户主可能是用体验摘果子的方式来收钱！我刚为自己的想法而得意，几位小朋友却抱着四五个石榴兴冲冲地跑出去，还不忘对那户主人说“再见！”我疑惑地问户主：“这些水果，都是免费摘的吗？”户主笑而不语，回屋拿出了一张老照片：“这是我儿时的照片，小时候经常爬树、斗蟋蟀，偷摘邻居的果子。现在的孩子都离不开手机，从小就抱着手机看，我只想给他们一个真正的童年。”", "insight": "户主把小院提供给了孩子们，他的温柔，藏在细碎无私的举动里。", "ev": "亮点：“先疑后悟”的设计很有层次，“我”的怀疑和现实的反差让温情更有力量；问题：老照片只被“拿出”了一下，没有展开成画面，结尾也停在“温柔藏在举动里”，可以再升一层。", "tips": ["把老照片展开成一个画面：照片上孩子正攀在树上摘果子，大人在树下紧张地张开双臂，生怕他摔下来；", "结尾联想《巨人的花园》：巨人把孩子赶走，也把春天赶走了；这位户主把孩子留在小院里，也留下了一片永不消逝的童年；", "保留“先疑后悟”的误会链条：我一开始以为他想收钱，孩子们抱着石榴说“再见”就跑，误会自然解除，这是这篇素材最亮的设计。"]}, {"t": "论语·飞机上的句子", "tag": "传统文化", "batch": 2, "time": "国庆节期间", "place": "飞机舱内光线柔和，头顶的通风口送出微凉的气流，微弱的嗡鸣持续在舱内轻轻回荡", "people": "“我”和妈妈", "conflict": "节日期间，我和妈妈去外地旅游。飞机的舷窗上方好像贴了几行小字，我凑过去看，发现上面写着《论语》里的一句话：“君子坦荡荡，小人长戚戚。”下面还有注释和翻译。其他的窗上都有不同的语句，我和妈妈顿时来了兴趣。下飞机后搜到山东是孔子的家乡，这么做是弘扬传统文化，不要被人忘记、丢弃。妈妈笑着说：“真有意思，是把经典藏在了天上啊！”", "insight": "现代科技产物与传统相结合，传统文化不应该被尘封，要代代传承下去。", "ev": "亮点：把传统文化放在“飞机”这个很现代的场景里，传统与现代的碰撞本身就有意思；问题：结尾是“隔岸观火”式的感慨（不应该被尘封、要代代传承），没有把火烧到自己身上，缺一个“文化觉醒瞬间”。", "tips": ["补一个小细节：小字下面除了白话文的注释和翻译，还有英文翻译，飞机的“现代感”一下子就出来了；", "删掉“下飞机后搜到山东是孔子的家乡”：孔子是鲁国人，这是常识，写出来反而丢印象分；", "强化飞机的现代感（整洁、舒适、升空），让传统与现代的冲击更强：现代科技能把人送上天空、在短时间内跨越山海，一句古语却依然能敲响人心；", "加一个画面：金发碧眼的外国乘客也在查看、连连点头，这不是说文化需要迎合外国人，而是文化经典的普适性；", "结尾要点醒“文化觉醒瞬间”：反观自己的生活，排队时有没有逮着空就插队，垃圾没扔进垃圾桶就不管了？把刀口向内，这个种子其实早就埋在心里，只是被现实的灰掩埋了。"]}, {"t": "竹笛·高山流水", "tag": "传统文化", "batch": 2, "time": "周日的下午", "place": "竹笛课外班的教室中，泛黄的曲谱散发出清香，墙上的钟摆不停地晃动，窗外的树叶沙沙作响", "people": "“我”和竹笛老师", "conflict": "我在练习《无羁》这首曲子时，转音总是卡顿，技巧添加得生硬，我垂头丧气地坐下来，无奈地摇头。老师没有多说什么，只是拿起笛子吹奏了一首。他吹得声音悠扬，毫无失误，高潮部分如冲入凌霄般震撼，抒情部分如潺潺流水般意韵悠长。他放下笛子，转身看着墙上的国画：“吹笛子讲究意境美，你想想高山流水，高音低音不只是音调的不同。”我以前吹笛子只为炫技，吹流行歌博得大家赞赏，认为古典音乐太老气。可是现在我的心突然静了下来，不断练习，再次演奏，卡顿的地方变得流畅，乐曲中显然少了那份毛躁与着急。", "insight": "吹笛子不是生硬地拿捏音符，而是用心来体会、沉浸。在生活中也要遇事静心、戒骄戒躁。", "ev": "亮点：老师没有说教，只用一首曲子示范“意境”，“我”前后状态的变化真实可信；问题：转变之后少了“被确认”的一笔，老师的赞赏（或他人的反应）没写；另外“高山流水”还停在老师的话里，没有化成我的感受。", "tips": ["给我的改进加一个“确认”：老师听完后的反应，或者同学、家人的反应，让读者看到我的进步是被看见的；", "把吹奏场景搬到室外：老师讲到“高山流水”，正好可以把练习放在开阔的室外，引入中国文化里“天人合一”的概念，写出在开阔天地间吹奏与在逼仄小房间里截然不同的感受，高音低音不只是音调，而是与山水相应；", "结尾落到人与自然的和谐上，让“古典音乐太老气”的旧念头彻底消解。"]}, {"t": "红小鬼", "tag": "家国情怀", "batch": 2, "time": "某天晚上", "place": "家中书房，放在窗前的书被风轻轻翻开，窗外几朵红花开得正艳", "people": "“我”与书中的“红小鬼”", "conflict": "我翻开《红星照耀中国》，读到“红小鬼”是些年龄小的红军，他们中有的人还参加过长征，在跋涉中渐渐成长，在战火中走向成熟。他们有责任心，肯吃苦，有强烈的自尊心。“红小鬼”学习的课堂就在沙地，条件艰苦却仍然努力学习。想到我拥有舒适的学习环境，有着课本与学习资料，却还借着搜题的名义来开小差，敷衍了事。想到这里，我满心愧疚。", "insight": "战火里的少年不畏艰难，心怀家国，我们新时代的少年要以他们为榜样，踏实奋进、珍惜当下。", "ev": "亮点：从书中读到“红小鬼”，反观自己借搜题的名义开小差，愧疚写得真实；问题：“沙地课堂条件艰苦”只是一个概括，没有具体画面，读者痛不起来；反思也停在“愧疚”，可以再往“我的幸运”上走一步。", "tips": ["写出“怎么个艰苦法”：沙地课堂到底怎么艰苦，可以写书里说的，也可以写我想象的，要有一个具体画面，像之前讲的江姐的例子，竹签钉进指尖，让读者也跟着痛一下；", "写完自己之后把镜头调转回去：回想一下，如果他们拥有这样好的学习条件，他们会怎样对待？会有多么认真？我如今身在福中不知福；", "联系白居易的《观刈麦》：“今我何功德，曾不事农桑。”我能有舒适的生活，不是因为我比他们强，而是因为我运气好，生在和平的年代、和平的地区。既然是运气，就该加倍珍惜，而不是把它当成理所当然。"]}, {"t": "崂山·歌唱祖国", "tag": "家国情怀", "batch": 2, "time": "国庆节的早上", "place": "崂山的山顶被雾气遮挡，巨大的岩石千奇百怪，松柏静静地挺立着", "people": "我和同学们", "conflict": "爬到山腰时，雨毫无预兆地下起来，石阶又湿又滑，我们不得不手脚并用向上攀登，雨水和汗水一起从额头滑落。爬到山顶，雨渐渐停了，阳光洒在我们身上，暖暖的，往下看，整个市区一览无余。这时，小明从包里拿出了小红旗，发给了大家。我们拿到红旗，不自觉地唱起了《歌唱祖国》，同学们也歌唱起来，我们的歌声一直在山谷中回荡。", "insight": "我们经历风雨才看到壮丽的山河，正如祖国经历无数次磨难才迎来今日山河锦绣。身为少年，我们应该心怀家国，奋发向上，不负祖国的期望。", "ev": "亮点：把“登山遇雨”和“唱《歌唱祖国》”放在一起，先苦后甜的转折自然，山河与家国的呼应很妙；问题：“不自觉地唱起《歌唱祖国》”来得有点突兀，像硬凑的；合唱时大家的状态（不好意思到投入）没有过程。", "tips": ["给唱歌一个自然的由头：同学们爬山爬累了，有人提议唱歌解乏，这是很正常的；大家一开始唱流行歌，唱着唱着，有人起了《歌唱祖国》，大家跟着唱了起来；", "写“不好意思”到“心潮澎湃”的变化：一开始唱的时候还有人放不开，这时云开雨散、阳光照下来，我们的声音越来越响，感受到这首歌里澎湃的力量；", "加一个旁观视角：路过的游人停下脚步，投来赞赏的目光，让“爱国情怀早已扎根在每个人精神深处”有了印证。"]}, {"t": "软笔·同桌", "tag": "梦想奋斗", "batch": 2, "time": "每个周日的下午", "place": "学校软笔教室，纸张的角被风吹起，墙上挂的软笔作品被太阳照得发亮，能闻到墨汁的香气", "people": "“我”和同桌", "conflict": "刚加入软笔社团时，“我”和同桌是最“菜”的两个。当社团举行软笔比赛时，我们也没有拿到名次。我有了退出社团的念头，但他却说：“没事，我们水平都一般，咱们慢慢前进，如果你退出，等一年后我的水平可就超过你了！”后来，我们约定上课前早到一个小时练习。有几次我想放弃，他用毛笔画出笑脸鼓励我。有时候他写不动了，我拿出刚入社团时他写的歪歪扭扭的字迹给他看。", "insight": "第二年的软笔比赛中，我们还是没有得到前三，但水平有了明显的提升。我们在奋斗中坚持、互相鼓励，展现出自己的光彩。", "ev": "亮点：同桌互相鼓励的细节（毛笔画笑脸、拿出旧字迹）很有温度，两个人的奋斗比一个人更动人；问题：奋斗的“难度”不够，缺一个有分量的参照；落点也可以从“名次”上再抬一抬。", "tips": ["让“软笔教室”有画面：老师是瘦高个、留着山羊胡、指节粗大、青筋突起；教室里是淡淡的墨香、木质的窗格，墙上挂着书法作品，老师还点一支檀香，放着古琴曲。以后每次写发生在书法教室里的故事，都能直接调用；", "写出对手的强大：同进社团的同学有家学渊源，每次都被老师点评表扬，神情却很严肃；我原先以为他装，随着学习的深入才懂得，他看到了自己的不足，也看到了进步的空间；", "落点拔高：书法是跟自己较劲的过程，以比过别人为目标，永远不可能攀登高点；唯有对自己严格要求，才能走得更远、更久。"]}, {"t": "画室老爷爷·热爱", "tag": "梦想奋斗", "batch": 2, "time": "去年深秋", "place": "画室。毛笔在笔架上排列整齐，画框摆放在墙角，阳光透过木窗洒在桌子上", "people": "“我”和老爷爷", "conflict": "街角画室的老爷爷讲起他年轻时的经历：“我呀，年轻时是一名法警，下班后就画国画，那时买不起名人真迹，就用借来的画册在废旧报纸上练习。现在我退休了，终于能无忧无虑地画画喽！”我问道：“那爷爷，你为什么能坚持到现在呢？”老爷爷的眼眯成了一条缝：“是热爱，我从小就喜欢搞一些笔呀墨呀的，曾经还自己做过一支毛笔呢！”", "insight": "老爷爷虽然年过七旬，但仍然因热爱而忠于自己的理想目标，我们也要保持这份热爱，向目标前进。", "ev": "亮点：老爷爷“当过法警、用废旧报纸练国画”的经历很有层次，“是热爱”三个字干净有力；问题：热爱只停在“说”上，没有具体的行动来证明（他怎么学、怎么练）；结尾也可以从“保持热爱”落到“我怎么做”。", "tips": ["写老爷爷为学国画付出的具体举动：他年纪最大，却是画室里第一个到的；他虚心地向比他小、足以当他孙辈的同学请教问题，别人指出他画作里的毛病，他也不以为意，虚心接受；", "加“我本以为”的反转：我本来以为老爷爷画得已经很好了，没想到一起学习一段时间后，发现他居然还在进步；", "反照自己：跟老爷爷做一组对照，我不喜欢被人批评，疏于练习，最后把这份触动落实到自己的行动上。"]}];
var ZW = [{"t": "在反思中成长", "tag": "成长", "meta": "成长类大作文（自省 · AI 与自律）", "body": "<h3>在反思中成长【终极版】</h3>\n<p>夜深了，台灯的光晕只圈住书桌小小一角。一道数学几何题拦在眼前，演草纸上画了许多凌乱的辅助线，我伸手将草稿纸撕下，在手中团作一团扔向了废纸篓。——废纸篓里已经堆满了废旧草稿纸。我长叹一口气：“这题怎么就这么难呢？”</p>\n<p>我深呼吸，揉了揉脸，又看了看面前的题目。这时我想起同桌对我说过，“AI可好用了，效率很高。我写作业都用它来完成，还能留出大把的时间自由活动。”我咽了咽口水，手指伸向放在一旁的平板。我悄悄点开AI工具，输入题目，看着屏幕一行又一行跳出完整清晰的答案，心里很是高兴，原来积压的情绪一扫而空，我赶忙把答案抄到本上。真想给AI打个好评。</p>\n<p>爸爸端着一杯温水走进室内，他扫视过屏幕，又看看我已经抄完答案的作业，顿了顿：“你在干啥？”我红着脸，低下头，手指不安地搅着衣角，慌乱地把平板合上：“没什么……”</p>\n<p>爸爸沉默了几秒，屋里安静得能听见钟摆声。他忽然问：“用AI了？”我的心猛地一紧：“没……没有。”爸爸的目光落在我被平板压着的手上，又问了一遍：“真没有？”我脸上一阵发烫，不敢抬头，声音低得几乎听不见：“真没有……”</p>\n<p>爸爸没有再问。他轻轻叹了口气：“AI这个东西好用是好用，但用多了，你用它解来再多难题，但你自己也解不开一道题。”我的心里像落了一颗石子，荡起层层涟漪。爸爸没有戳穿我，转身走出房间，到门口停顿了两秒：“不要做傻事。”门轻轻合上——他相信我，能自己想明白。</p>\n<p>夜更深了。那些画面忽然涌了上来——同桌的笑脸，她把平板推到我面前，笑得那么轻快；发卷那天，老师走到我桌边，看着卷子，长长地叹了口气；卷面上的红叉，一个接一个，排成刺眼的一列；还有墙上那张纸——我亲手写下、亲手钉上去的目标高中分数线，此刻正安安静静地看着我。我那时以为，用AI是“辅助学习”，让它帮我打开思路；没想到，用着用着，就让它直接生成了答案。试卷上的红叉，正是偷懒的结果。</p>\n<p>台灯依然柔和，题目依然难做，AI工具依然放在身边。我告诉自己不能重蹈覆辙，可卡了十分钟，我还是下意识伸手去摸平板——又猛地收回了手，昨天爸爸那句沉稳有力的话，还在耳边。我把题目重新输入，在后面加了一句话：“请不要给我答案。请告诉我，这道题的第一步，应该往哪里想。”</p>"}, {"t": "外婆的针线", "tag": "温情", "meta": "温情类大作文（亲情 · 选择）", "body": "<h3>《外婆的针线》终极版</h3>\n<p>班级群里炸开了锅。“同学们，中秋节期间学校举办研学活动，参加就能争取到学分，还有机会拿到科技馆的门票和精美的文具大礼包，名额有限，先到先得！”</p>\n<p>消息一发出来，群里立刻热闹起来。有人喊：“我要去我要去，科技馆门票我来啦！”有人算：“学分学分，这个学分好拿！”还有人说：“管他呢，能出去玩就很好，那还不好？”同学们你一句我一句，一条条消息往上蹿，快得看都看不过来。</p>\n<p>我没有发言，只是看着。那些话却一条一条钻进了我的心里。我原本没怎么想去，被他们这么一说，竟也动了心。</p>\n<p>我放下手机，抬头看了看天。天上的月亮快圆了，中秋节，就要到了。</p>\n<p>这时，好朋友的消息弹了出来：“我已经决定要去了。你也一起去吧！”</p>\n<p>我点开对话框，看着那行字，犹豫了。本来我可能并没有那么想去，可是好朋友都这么说了，我想，这下子不得不去了。我点开研学通知，群里又是一连串的“老师我报好了”“老师我跟家里商量好了”。过了一会儿，老师发了一条消息，一锤定音：“要报名的抓紧。这个机会很难得，我们学校也很少有这样的机会。”</p>\n<p>我看着屏幕，暗暗下了决心：今年中秋节，不回去了。</p>\n<p>我拿起手机，拨通了外婆的视频电话。</p>\n<p>电话一接通，外婆的惊喜就扑了过来：“囡囡给我打电话了？太好了，我正想着你呢！”我正要开口，外婆的声音又急急地接了上来：“你看这是啥？我给你买了你最爱吃的石榴，还有豆沙馅的月饼，就等你来了！”</p>\n<p>我张了张嘴，到了嘴边的话，又咽了回去。</p>\n<p>外婆还在说：“外婆还买了大桂鱼，买了老母鸡，给你炖汤喝。你不是最喜欢喝外婆炖的汤吗？”视频那头，外婆正在院子里织毛衣，用嘴咬着一头的线，眼睛笑成了一条缝。</p>\n<p>“外婆……”我心里想的话转了个弯，“我这边挺好的。就是想你了，给你打个电话。”</p>\n<p>“中秋节回来吗？”外婆问。</p>\n<p>我心里想的是：不回来了，有一个很重要的研学活动。可话到嘴边，又变成了别的：“外婆……你猜我在干嘛呢？”</p>\n<p>我低下头，捏了捏自己的衣角，笑了。那些准备好的话，一次次到了嘴边，又一次次变成了别的东西。</p>\n<p>就在这时，手机屏幕上方，消息一条接一条地跳出来。好朋友催：“快点儿！来不及了！我看报名名额没几个了！”群里，同学们一个接一个地说“老师我报好了”，有人说：“别商量了，机会难得，还商量个什么劲儿？”老师又发了一条：“只剩三个名额了，要报名的抓紧。”</p>\n<p>我一边回应着外婆，一边看着手机，心里像被什么东西拉扯着。我仿佛站在十字路口：一边是热闹的研学，好友的邀请，有限的名额；一边是外婆，石榴，豆沙月饼，老母鸡汤。</p>\n<p>外婆还在笑着，眼睛弯成一条缝。看着她，那些话，我又一次说不出口了。</p>\n<p>回忆如潮水般涌来。小时候，我的袜子都是外婆在炕上给我织的，我还非要让她给我做两个蝴蝶结才愿意穿。她还给我织过围巾，我玩耍时不小心把围巾弄破了，伤心地跑回家，她一边安抚我，一边用针线，一点一点把残缺的部分补上。那些针脚，好像一直缝在我的记忆里。我深呼吸一口气，然后说：“外婆，我中秋节一定回去陪你。”外婆愣了一下，随即笑得眼睛眯成一条缝：“好好好，外婆等你！”</p>\n<p>外婆手不停，好像还在做着针线活。我好奇问她：“你在做什么呀？像一个玩具。”</p>\n<p>她露出了得意的笑容：“最近我看抖音上很流行‘阿贝贝’，我也想给你做一个小兔子玩偶。本来是个秘密，你姥爷都不知道，结果被你发现了。你不是说，人要跟上时代潮流嘛！”</p>\n<p>视频那头，她举起半成品，小兔子的耳朵歪歪扭扭的，却格外可爱。</p>\n<p>我看着那只小兔子，忽然觉得有点眼熟，却又想不起来在哪里见过。</p>\n<p>外婆有些迟疑地开口：“小时候有一次逛商场，你看到小兔子就不肯走了，一眼就看中了。你妈妈说你玩具已经够多了，不给你买了。你恋恋不舍地走了。外婆当时记住了，现在终于可以给你弥补这个遗憾了。就是外婆记不清具体样子了，好像不太像。”</p>\n<p>我鼻子一酸，声音却抬高了，扯出一个大大的笑脸：“简直就是一模一样！我想起来了！”</p>\n<p>其实我早就不记得那只小兔子的样子了。可是外婆记着。她记着那个在商场橱窗前不肯走的我，记了这么多年，一针一线地缝了出来。而我，刚才竟差点为了研学的礼品，错过这份沉甸甸的牵挂。</p>\n<p>挂断视频，我给好朋友发了一条消息：“我决定还是不报名了。我有事。”</p>\n<p>好朋友回得很快：“好吧。那太可惜了。等我回来，给你带纪念品！”</p>\n<p>那些奖励，以后还能争取；可和外婆团圆的中秋，一年只有一次。</p>\n<p>中秋当晚，我靠在外婆身边。手机忽然响了，好朋友连发了好几个感叹号和表情包：“这次研学太精彩了！太有意思了！你没来参加，真是太可惜了！”他还发来好多照片，照片里的同学们笑得灿烂。</p>\n<p>我真心实意地回他：“真的可惜。不过，你给我的纪念品我可要挑剔一下，可得给我带个好的！”</p>\n<p>一边回着消息，我一边站起身，倒了两杯热茶，端到外婆手边一杯，自己也捧着一杯，重新依偎在外婆身边。我抬头望着天上又大又圆的月亮，怀里抱着外婆织的“阿贝贝”。外婆摇着扇子，也不说话，空气里飘着茶香，和瓜果的清香。</p>\n<p>世间最珍贵的，不是光鲜的奖品，而是亲人默默放在心底的惦念。外婆用月光下的针线，把爱缝进了这个中秋的夜晚。</p>"}, {"t": "藏在小院里的爱与童年", "tag": "平凡人物", "meta": "平凡人物类大作文（写人 · 善良）", "body": "<h3>《藏在小院里的爱与童年》终极版</h3>\n<p>一楼人家的小院子，门总是敞开着。里面绿草丛生，蔷薇爬上围墙，蜜蜂在花间起舞。我每次路过，都忍不住多看两眼。院子打理得这样精致漂亮，花草整整齐齐，我心里早就嘀咕过：这小院的主人，一定是个很用心、很爱花的人。</p>\n<p>以前，我也碰到过他几次。他看起来温和，却也是平平无奇。我原本以为，我和这个小院，和这个小院的主人，不会有什么交集。</p>\n<p>可这两天，楼下的小院里忽然多了许多孩子，熙熙攘攘，嬉戏打闹。我心里好奇：这是怎么回事，这些孩子怕不是自己偷偷溜进去的？趁着下楼扔垃圾的空当，我拐进了那个小院。</p>\n<p>一进小院，首先闯进眼睛的，就是满院子奔跑的孩子。有的孩子蹲在花坛边，专心致志地挖蚯蚓，挖到一条就兴奋地举起来给同伴看；有的孩子在追跑，绕着大树捉迷藏，笑声响成一片；有个男孩跃跃欲试，抱着树干想往上爬，又不敢，急得直跺脚；还有个小姑娘蹲在一丛花前，研究这是什么花，又大着胆子凑近，去看一只正在采蜜的蜜蜂。</p>\n<p>院子里热闹得像一锅沸水。这时我才注意到，石榴树挂满诱人的石榴，青涩的柿子也沉甸甸地压着枝头。</p>\n<p>孩子们的正中间，站着一个人。他笑呵呵地看着孩子们，一个孩子跑过来跟他说了什么，他弯下腰，揉了揉孩子的头发。他看到我，迎了上来：“楼上的邻居，你来了！”</p>\n<p>我还没来得及说话，一个孩子已经抱着四五个石榴，兴冲冲地跑出去了，还回头冲他挥手：“哥哥再见！等下周我还来玩！”他笑着挥手：“好嘞，等你！”</p>\n<p>然后他转向我，指了指头顶的石榴树：“摘几个石榴回去吧，现在刚是成熟的时候，好吃得很呢！”</p>\n<p>“这么好？”我上前一步，刚想伸手去够，又愣了一下。突然想到：他是不是利用体验摘果子的方式来收钱？想到这，我收回了手，为自己看透了这份精明，暗暗得意。</p>\n<p>我清了清嗓子，假装好奇地问：“大叔，这石榴怎么卖？”他瞪大眼睛，连连摆手：“卖？咱们这石榴可不卖！”“不卖？”我追问，“那你就让这些孩子白白摘走了？”他笑了，笑得很开心：“对，就是让他们摘的。”</p>\n<p>我愣住了：“为什么？”他没有直接回答，而是往屋里一指：“你看。”我顺着他的手指看过去。屋内墙上，挂着一张放大的老照片。照片里，几个男孩在乡村野地里奔跑，笑得没心没肺。</p>\n<p>“中间那个男孩……”我有些迟疑地问，“是您？”</p>\n<p>“对，那个男孩就是我。”他说，目光落在照片上，温柔了许多。</p>\n<p>“小姑娘，”他忽然问我，“你有没有自由自在地和自然接触过？爬过树吗？抓过知了吗？”</p>\n<p>“啊，”我张了张嘴，挠挠头，不好意思地摇了摇头。</p>\n<p>他笑了，带着一丝得意：“我就知道，你们这些城里的孩子，跟自然离得太远了。我小时候最美好的回忆，就是比赛爬树，和小伙伴们摘果子，斗蛐蛐，抓知了。”他望向那个挖蚯蚓的孩子，那个孩子满手都是泥，笑得开心。</p>\n<p>“现在的孩子啊，手机离不了身。我想，在虚拟世界里享乐，还不如在现实世界里自在地玩耍。”听了他的话，我若有所思。他接着说：“我在院子里侍弄花草，总能碰见有孩子在门口张望，我就让他们进来玩了。我想给他们一个真正的童年。”</p>\n<p>“那您就不担心您的花园……”我下意识发问。他听了，只是笑了笑：“起初也顾虑过，但孩子们都懂得爱惜花草，比我预想的懂事得多。”</p>\n<p>他问我：“你觉得，给这个小院安个秋千架，怎么样？”</p>\n<p>我顺着他的话想象：孩子们坐在秋千上，荡到最高处，笑声洒满整个院子。那个画面，多美啊。</p>\n<p>“好主意！”我说，“要不，您再在院墙那边开辟一小块角落，让孩子们种一种自己的花？”</p>\n<p>他一拍手：“好！你主意真好！”</p>\n<p>正说着，一个孩子在花坛边大声呼唤他：“叔叔，这个是什么花？”</p>\n<p>“我先过去了。你自己慢慢看。”他冲我点头，走过去，蹲下来，耐心地讲起来。孩子仰着头，听得入神。</p>\n<p>我站在石榴树下，看着他跟孩子亲切地交谈，心里忽然涌上一阵羞愧，为我刚才用世俗的想法，去揣测了这份质朴的善良。</p>\n<p>石榴的香气萦绕鼻尖。这一方小小的院落，藏着果实的甜，也藏着一份成全童年的温柔。普通人的日子本平平淡淡，而他，却用善意，把寻常小院活成了一束温暖的光。</p>"}];
