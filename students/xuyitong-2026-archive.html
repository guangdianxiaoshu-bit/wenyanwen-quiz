var SUC = [{"t": "阳台·爷爷修陀螺", "tag": "温情", "batch": 1, "time": "初冬的傍晚", "place": "家里阳台", "people": "我和爷爷", "conflict": "我总觉得阳台堆放旧工具杂乱，多次劝说爷爷清理，彼此心生隔阂。夕阳斜斜落进阳台，老旧工具箱的金属搭扣泛着微光。我看见爷爷低垂着头打磨木料，花白的睫毛沾着细碎木屑，正一点点修复我儿时的木陀螺。我静静站在一旁，看着他粗糙的手指细细修整木纹，忽然读懂旧物里藏着的惦念，不再执着于清理杂物，主动上前陪他整理工具箱。", "insight": "隔阂慢慢消散，我懂得去接纳那场被珍藏的回忆，读懂沉默里藏着的关怀", "ev": "这个素材挺好的，很有质感，爷爷修复我儿时的木陀螺，很有温情。", "tips": ["加感官细节：工具箱的尘土味；爷爷在阳台上忙活时，总会有木屑飞起来，在斜照的阳光下漂浮；", "补一个“爷爷的木头不能乱扔”的细节：有一天我悄悄扔掉了一块看不懂是什么的木头，爷爷敏锐地发现了，也不生气，只是默默跑到垃圾桶，把那个东西又捡了回来，我由此懂得了爷爷的东西不能乱扔；", "强化“我”的小孩子心思：我是想把阳台打造成植物角，其实爷爷那边并不影响我，只是我看着他的杂物堆，觉得它破坏了我植物角的氛围，我嫌弃的是“氛围”，不是爷爷；", "再加一个修补书桌的情节：我的书桌坏掉了，爸爸说用了很多年该换了，爷爷却用他的巧手、用攒的材料帮我把书桌修补好，虽然补的地方有些丑，但稳稳地支撑住了；", "感悟升级：除了接纳珍藏的记忆、读懂沉默的关怀，还要加入“我理解老一辈的生活态度”；", "结尾：我依然在阳台上开辟植物角，但我学会了帮爷爷归纳整理工具箱，或者，我花零花钱给爷爷买了一套更好用的工具。"]}, {"t": "线上悄悄互助补课", "tag": "成长", "batch": 1, "time": "周末午后", "place": "家中书房，线上协作", "people": "我和同桌", "conflict": "我薄弱学科基础差，害怕暴露短板，不敢当众请教。同桌擅长科学，但数学、英语是他的弱项。我们默契地选择线上悄悄互助，屏幕微光静静铺在桌面上，钉钉对话框弹出截图，标注着清晰的解题思路；共享文档内各色批注排布整齐，避开刺眼的红叉。他耐心帮我梳理薄弱学科的重难点，我也有条理地为他讲解数学、英语的知识点，互不戳破彼此的窘迫。", "insight": "我们各自补齐短板，在互不打扰的默契里，彼此支撑，收获友谊", "ev": "素材好。", "tips": ["加时代元素：我俩在学校里是争吵不休的冤家，网络世界里却是彼此帮助的挚友，线上线下双面性（有的人网上怼天怼地，线下是个社恐小透明）；", "结尾不要打破界限：不要写线下友谊也因此增进，让他保持“吵闹，但心里门清”的状态，更有趣。"]}, {"t": "爷爷陪我做作业", "tag": "成长", "batch": 1, "time": "周末下午", "place": "家中书房", "people": "我和爷爷", "conflict": "我写作业遇到难题，心态浮躁，不一会儿就想搜答案，不愿静下心来思考。爷爷坐在桌边陪着我，戴着老花镜翻看旧书本，阳光透过玻璃洒在泛黄的书页上，灰尘在光束里轻轻浮动。爷爷布满老茧的手指慢慢点着题目，目光沉静，耐心引导我一步步拆解题目，没有直接告诉我答案。我一开始十分烦躁，笔尖在纸上胡乱滑动，慢慢跟着爷爷的思路，静下心来，一点点梳理思路。", "insight": "我独立解出了难题，懂得遇到困境不能急于求成，要沉下心来钻研", "ev": "好，爷爷以身作则；问题，爷爷形象太单薄，像个“教师”，和“我直接搜答案”本质差别不大。", "tips": ["给爷爷加戏，变成“老顽童”：他也皱眉，抱怨“你们现在孩子咋学这么难”，甚至动摇“要不我们去网上搜答案吧”，又自嘲“不行，我可是老人家，不能做坏榜样”，我被爷爷逗乐；", "解出答案时，一起欢呼；", "文章要写活人，不要“少年老成”：写我会咬笔、发呆、揉皱草稿纸、写两个字起来摸鱼。"]}, {"t": "线上协作公益短视频", "tag": "成长", "batch": 1, "time": "国庆假期", "place": "我的卧室，线上协作", "people": "我和异地的几位同学", "conflict": "我们小组打算做一期关爱乡村小伙伴的公益短视频。组员分散在不同城市，只能线上沟通。一开始大家想法分歧巨大，方案改了好几版，沟通不断、吵架，项目差点作废。冷白色的屏幕光映在我的脸上，聊天框里满是争执的消息记录。我靠在椅背上，双手抱臂，嘴唇抿紧，心里满是委屈，很想直接退出小组。冷静之后，我主动发起线上会议，认真倾听每个人的想法，整合创意，分工、剪辑、写文案、收集素材，一次次深夜线上打磨。最终，短视频顺利发布，收获很多点赞，还帮乡村小伙伴募集到一批书籍。", "insight": "我懂得了线上协作、换位思考的意义", "ev": "很好，把协作用出了自己的风格，从争吵到认真完成项目。", "tips": ["结尾不要停在“换位思考的意义、项目成功”，写“项目结束了，友谊仍在”：小组群没有解散，群名改成“一群欢乐的小伙伴”，天南海北的同学在群里互相请教难题，从项目中到项目外，是友谊的升华；", "补充：大家用文字交流时，效率低、容易争执；打开线上会议室、摄像头面对面交流时，效率高了许多。我懂得了线上交流的确有效率，但同时，为了效率，我们也牺牲了许多（那些闲聊的温度、面对面时的默契与体谅）。"]}, {"t": "墙角·瓦松", "tag": "感悟自然", "batch": 1, "time": "雨后", "place": "老旧居民楼的墙角", "people": "我和外婆", "conflict": "雨后，走过老旧居民楼的墙角。斑驳的墙体裂开一道窄缝，只有薄薄一层尘土，几株瓦松扒在缝隙里，肥厚的叶片层层叠叠，泛着暗红。前几日狂风暴雨，我本以为它们会被冲落；再来时，它们只是微微倒伏，依旧牢牢嵌在墙缝中。外婆陪在我身旁，停下脚步，目光落在瓦松上，隔空轻轻一点，低声说道：“这小东西，在哪都能活下去。”我蹲下身凝望它们，它没有园中繁花的艳丽，长在无人关注的角落，却依旧舒展叶片承接雨水。我不禁想到自己：常常渴求他人的认可，却从来没有真正停下脚步，好好看看最本真的自己。", "insight": "人在生活中，不要因为追求他人的认可而迷失了自我，要倾听自己内心的声音", "ev": "这个素材可以联系袁枚的那首诗《苔》：“白日不到处，青春恰自来。苔花如米小，也学牡丹开。”标题就叫《苔》。", "tips": ["“渴求他人认同”要有一个具体的画面：比如同学们都流行使用某样东西，我虽然并不需要，却也忍痛从零花钱里拿钱去购买，只为了融入他们的讨论；或者课上老师提问，我明明会回答，但看同学们都没举手，我也强行按住了自己本想伸出的手；", "有了具体的“渴求认可”的画面，再与墙角瓦松对照，它长在无人关注的角落，却依旧舒展叶片承接雨水，从不渴求谁的认可；", "让外婆的那句“这小东西，在哪都能活下去”，成为全文的点睛之笔。"]}, {"t": "北高峰·雏菊", "tag": "感悟自然", "batch": 1, "time": "夏日", "place": "北高峰", "people": "我和同学小妮", "conflict": "炎炎夏日，蝉鸣、鸟鸣，各种声音混杂在一起，吵得我心烦意乱。突然，电话铃声响起：“去北高峰吗？那里清静。”小妮在电话另一头说道。想到那边没有烦人的声音，我应了下来。爬山爬了一个小时，我和小妮气喘吁吁地来到山顶，一群人拿着手机，在一棵苍翠无比的老树边拍照打卡。此时的我们无心赏树，直接坐在一块石头上。“看，这块儿石头上有一朵小雏菊。”我从石头上站起来，注视着这朵小雏菊，它默默地生长着，享受着这种无人欣赏的感觉。背对着那些拍树的人，我拿出相机，拍下了这一朵花。", "insight": "（学生未写出直接感悟）", "ev": "这个素材也不错，场景元素很丰富，可以写出画面感。", "tips": ["写出游客的画面：那些游客大呼小叫的场景；我遥想这棵老树，它甚至可能见过当年南宋王朝的壮丽景象；", "先站在游客那一边（拍老树、打卡），再回过头来，让同伴提醒我：“这里还有一朵小小的雏菊”；", "升华：老树生来就是树，雏菊生来就是雏菊，雏菊永远不会因为自己是一朵小小的雏菊而自卑，老树也不会因为自己是一棵千年古树而自傲。自然界中的植物体现的是生命的真谛：存在本身，在这里吸收阳光雨露，为世界带来一份美好。这让我联想起生活的意义是什么；", "前文插入：我被学业生活所困扰，正在思考人生意义的问题；", "结尾注意：不要一下子就说“我懂得了人生的意义”，而是“我在老树和雏菊的身上，看到了一种可能性”。"]}, {"t": "漆扇", "tag": "传统文化", "batch": 2, "time": "双休日", "place": "漆扇体验中心", "people": "我和小组同学、白发老人（带着小孙女）", "conflict": "老师布置周末实践作业，要求体验传统文化，并制作宣传小视频。我和小组同学来到下周就要倒闭的漆扇体验中心，准备紧急宣传漆扇工艺。我听说最近薄荷巧克力这种配色很火，制作了一个薄荷巧克力配色的漆扇，希望通过这种网红色系达到宣传的目的；小组同学也学着我的样子，做了马卡龙色系、雾霭色系的漆扇。做完后，我们用照片记录下我们的成果。旁边一位带着孙女的白发老人说：“你们年轻人天天就知道整流量，真正的漆扇要国风色系才好看、传统色系才好，就是你们这些人，丢了老祖宗的东西。”小组同学气得牙痒痒，想要争执一番。我耐下心来告诉他，我们的目的是宣传漆扇，若是还和以前一样不懂创新，就会跟这家店一样倒闭掉。白发老人虽然不完全赞同，却也没再说什么，似乎有些被说服了。离店前，我们发现白发老人的小孙女照着我们的样子，做了一个网红色的漆扇。将视频制作好发到社交媒体上之后，我们的视频获得了很大的反响。虽然也有人像那位老人一样不支持，但总之支持的人占大多数。我看到破千的点赞量，以及桌上的那个薄荷巧克力配色的漆扇，心里乐开了花。", "insight": "（素材未写感悟句；主题落点：传统与创新）", "ev": "亮点，很好的将“传统与创新”的内核挪移到了一个新的领域、新的素材，这点很优秀；问题，对“我们”的写法太简单，画面感不足，结尾也太仓促。", "tips": ["强化当下年轻人对新媒体制作的熟练：带上专业设备（三脚架、补光灯、遮光罩、反光板），还有专业的运镜设计（我们正在讨论怎样运镜，拍出来的效果最好）；把镜头对准制作漆扇的漆面，看着漆色从水里缓缓升起、一点一点印在雪白的扇面之上；", "让老人的小孙女与老人发生争执、老人败下阵来，比一个完全胜利的结果多了一些过程感；", "结尾不要简单：视频制作好发到社交媒体前，加“我们紧急进行视频剪辑，讨论几个版本的剪辑思路，选取大家公认的思路，剪辑、调色、配乐（搭配竹笛或二胡的悠扬乐曲）”，再传到短视频平台，展现当代年轻人熟练运用新的传媒、新的技术的样子；我们的配色是网红的，但最后呈现的效果还是古风的，还是中国古代山水画、纹样之美；", "（可选升华）漆扇的“随性之美”：漆扇的原理是水转印，油漆在扇面上留下水的印记；你在把它拿起来之前，也不知道它会呈现什么样子，无论如何它都是美的，这是中国古代随性之美的体现，水的哲学（若临时想显得牵强，就回归“传统与现代的争论”）。"]}, {"t": "韩国地铁·中国女孩挺身而出", "tag": "家国情怀", "batch": 2, "time": "交通高峰时期", "place": "韩国某地铁站安检处", "people": "一个瘦小的中国女留学生、一个推着行李箱独自来韩国旅行的中国老太太、一个赶时间的韩国大妈", "conflict": "正值晚高峰，地铁安检处的人一个个紧皱眉头，拼命往前挤，想要赶紧回家吃晚饭。一位中国老太太推着 28 寸的黑色大行李箱，颤颤巍巍地挪动着步子，显得格外吃力。她身后突然冒出一个脚步很快、好像赶时间的韩国大妈，她伸手推开身前的中国人，用极高的嗓门、充满讽刺的一口清晰韩语说着：“让开，没看到我们正在赶时间吗？一样都是老年人，装什么啊。”中国老太太像一个犯了错的孩子一样低下了头，用极轻的声音说：“对不起。”就在这时，队伍侧面有一个瘦小的身影挤了过来，是一个中国女孩，背着双肩包，看起来跟周围赶着下班的人群格格不入。她了解完情况后，径直走到旁边管理秩序的人员身边，告诉他：“您好，想必您也看到情况了，那位老太太并没有挡路，却被后面的人用侮辱性的语言辱骂，希望您能帮这位老太太，并向对方道歉。”她的声音细细的，却用最朴素的语言帮老太太讨回了公道。有一位同为中国人的旁观者，将全过程发到了社交平台。那位留学生碰巧刷到了这个帖子，留言：“要是再出现这种情况，我也一定会帮助他们的，这是身为同胞的基本义务。”", "insight": "异国他乡，挺身而出，帮助同胞，这是身为同胞的基本义务", "ev": "亮点，素材选得没问题：异国他乡、挺身而出、帮助同胞，元素很齐全；问题，现在是在转述，而不是在现场，像“刷视频看到好人好事”，这样用进作文就会显得硬邦邦。", "tips": ["写出现场感，给自己设定一个角色/视角：作为老太太的随行人员（孙子孙女、旅行团友），气愤却无奈，或者恐惧；作为素不相识的旅行者，事不关己高高挂起，或者习以为常（强龙不压地头蛇，不要去跟人争执）；不同视角，你创作时也会有微妙的不同；", "中国女孩出场要不卑不亢、有理有据（你原文写得挺好），不要把她写成母老虎，她的声音细细的，却用最朴素的语言帮老太太讨回了公道；", "平凡人物的写法：她长相普通，我一转眼就忘记了她长什么样子，她也汇入到地铁的人流里去了，但有什么东西留在了我心里：那一丝羞愧，以及她坚定的声音；", "韩国大妈被“制裁”之后：不要写她马上诚恳道歉，要写她虽然不服气，但迫于这么多双眼睛看着，才道了歉，毕竟她在故事里是一个不大不小的反派人物，没那么轻易服软；", "不要忘记叠加异国他乡、老年人的元素。"]}, {"t": "马海毛发圈", "tag": "温情", "batch": 2, "time": "表妹生日前一周", "place": "家中", "people": "我、表妹、外婆", "conflict": "表妹生日前一周，我和外婆准备给她做一款自制的马海毛发圈。因为表妹喜欢手感柔软的东西，马海毛颜色好看，所以我们去毛线店里买了一捆。不知是谁告了密，表妹提前知道了这份礼物，她满眼失望，没有前几日的激动，说：“店里明明都有颜色这么好看的现成东西，你们为了省几块钱，要去自制这种线头很多的东西吗？”虽然我和外婆有些灰心，但为了不前功尽弃，我们做出了一个无比精美的发圈。表妹收到后显然有些惊讶，我们的发圈没有她以为的线头、粗糙的手感，她低下头，轻轻地说：“对不起，我还以为”我并没有计较她先前的表现，却告诉她：“店里的不一定比我们做得好，自制的才有诚意呢。”表妹不再执拗地认为自制的东西比店里的差，她从此爱上了手工，并经常约我和外婆一起制作传统手工艺品，免费送给街边的人们和山区儿童，感受到了这一份独特的乐趣。", "insight": "店里的不一定比我们做得好，自制的才有诚意呢", "ev": "这个素材的问题在于逻辑上还有不通顺的地方，表妹这个人的前史铺垫得不够；后面的转变也给得太多了。", "tips": ["补表妹的前史：加上一句话，她从小养尊处优惯了，最喜欢精品店里那些精致可爱的装饰品；这样她一开始嫌弃自制发圈，才立得住；", "后面的转变不要给这么多：只需要写表妹收到这份礼物之后经常使用它，然后问我这是怎么做的，她也想做一个送给同学，就够了；", "定位：这个素材相比于传统文化素材，更偏向温情主题；如果要做传统文化，可以在里面加入一些更加特色鲜明的传统文化元素，比如我在制作这个发圈的时候，特意采用了传统染料；", "让表妹对手工制品的爱更有理有据：我们做的这一款上面，还添加了她最喜欢的卡通人物的专属配色，让表妹意识到，这是全世界独一无二、没有同款的，里面包含着我和外婆对她的用心。"]}, {"t": "龙翔桥臭豆腐", "tag": "平凡人物", "batch": 2, "time": "放学后", "place": "龙翔桥臭豆腐店", "people": "我和店铺老板", "conflict": "龙翔桥附近有一家极其好吃的臭豆腐，就叫龙翔桥臭豆腐。这家店面极其朴素，只有最普通廉价的黑字招牌，一个 3㎡ 的小厨房，旁边还有几张小板凳，相比旁边的热门网红店逊色了许多。那天放学后，我身着校服到店里买了一份臭豆腐，等了 5 分钟还没好，我皱着眉头不耐烦地说：“怎么还没好啊？”老板大约 50 岁，笑着解释道：“我们家都不是预制的，是现做的，马上就好。”终于，两分钟后，我吃上了热腾腾的臭豆腐。付钱时，我按原价递给老板 12 元，老板却找了我 5 元。我一开始以为自己拿多了，细数才发现我只付了 7 元，疑惑地问道：“不是 12 元吗？”老板说：“你穿着校服减 5 元，这是我们店的规定。我小的时候上学，有一位叔叔知道我没钱，专门为我们这些没钱但是长身体的孩子们制定了这个规则。现在我开店了，也想帮助同学们，让他们吃到自己喜欢的小吃。”“可是这样你怎么赚钱呢？”我的心中不由得疑惑。“我说了呀，我是想帮助同学们。我这些钱足够养家了，我的家人们也很支持我呢。”他说着。我捏着找回的零钱站在原地，一时说不出话来，方才催促上菜时的那份急躁，不由得变成了脸上的一丝羞愧。油锅滋滋作响，土黄色的豆腐在热油里翻滚，香气漫过小小的店铺，那一缕烟火间的微光，悄悄落在我心上。", "insight": "那一缕烟火间的微光，悄悄落在我心上", "ev": "这一篇是我们平凡人物主题的训练，镜头应该多聚焦在老板这个人物身上，把老板“任意这么做”的深层原因写出来。", "tips": ["把镜头多聚焦在老板身上：多写一写老板专注、认真、仔细地做臭豆腐的样子；", "加上老板对于自己行为的自豪：让老板说一句，“看到你们这些学生喜欢吃我的臭豆腐，我就开心”，再比如“有些学生都已经毕业了，还会回来吃我的臭豆腐”；", "“我”在这篇文章里是一个配角，心理活动可以稍微少写一点；", "写出老板这么做的深层原因：老板看着有些学生在他的店里从小学生吃到初中生，他就觉得很自豪；他也觉得，为了这些学生们，也为了这些学生对他的信任，他应该做出物美价廉、高质量的美食。"]}, {"t": "南京大屠杀遇难同胞纪念馆", "tag": "家国情怀", "batch": 3, "time": "暑假里的某一天", "place": "南京大屠杀遇难同胞纪念馆", "people": "我和同行的同龄游客", "conflict": "暑假的南京之行，最让我难以释怀的是侵华日军南京大屠杀遇难同胞纪念馆。跨过入口，一面巨大的纪念石壁静静立在眼前。石壁之上，无数遇难者的姓名排列开来，“30 余万遇难同胞”这行文字沉重得让人喘不上气。馆内氛围肃穆安静，一张张老照片、一件件遗留的实物，无声诉说着 80 多年前的那场浩劫。站在石壁前，一股酸楚与震撼涌上心头，心头仿佛被什么东西紧紧压住，久久说不出话来。同行的一位同龄游客随口和同伴念叨：“事情都过去这么久了，看看就好了，没必要一直放在心上。”听到这话，我没有出声，凝视着墙上密密麻麻的名字，心里慢慢有了自己的想法，铭记历史，从来不是为了记住怨恨。记住曾经的苦难，是懂得和平来之不易；看见民族受过的创伤，是提醒自己勿忘过往、发愤图强，守护好现在安稳的生活。", "insight": "铭记历史，从来不是为了记住怨恨；记住苦难是懂得和平来之不易，看见创伤是提醒自己勿忘过往、发愤图强", "ev": "总结是做得很不错的；我们可以加点料，加“走出场馆”的设计。", "tips": ["走出场馆，站在蓝天白云之下的那一瞬间的恍惚：在馆内参观的过程中心情变得越来越压抑；走出来的时候，庆幸自己生于现代，但也为过去的人祈福、哀悼、肃穆；", "设计一个有冲击力的场景：我在里面参观时，因为早就做过资料、看过一些影视作品，虽然会受到震动，但情绪维持着稳定的状态；直到我走出来，看到一个日常的景观，老人牵着孩子、情侣在拍照、大街上车辆往来，眼泪一下子涌出，夺眶而出，止也止不住、擦也擦不完。这是影视作品的创作手法：先压抑到极致，再由一个很小的、日常的场景去引爆情绪，让读者跟着文中的“我”一起经历一次情感的过山车；", "换一个风格（成长角度）：我原先觉得这件事已经过去那么多年、已是历史，带着这种心态去参观、悼念；但真正看到实物的时候，给了我极大的震撼，历史永远没有过去，历史永远影响着现在的人们。我的生活、学习、心理状态，都跟参观之前不一样了：以前因为学习的事情跟爸爸妈妈发生矛盾争执，觉得他们不理解我；现在觉得，能够与家人因为这些鸡毛蒜皮的小事而争执，本身也是一种幸福。"]}, {"t": "觉醒年代·我和表妹", "tag": "家国情怀", "batch": 3, "time": "暑假里", "place": "家里", "people": "我和表妹", "conflict": "这个暑假，我一集不落地看完了《觉醒年代》电视剧，内心久久不能平静，一幕幕热血的画面在我心里激起万千波澜。一旁的表妹看见屏幕上动荡艰苦的岁月，有些不解：“现在日子这么太平，为什么要看这么沉重久远的故事？”她的话让我一愣，是啊，战火早已远去，不必再有人抛头颅洒热血，那这份百年前的热血，对今天的我们还有意义吗？我重新回想起剧中的一幕幕：李大钊在长辛店奔走，深入工人之间；陈独秀创办刊物，呐喊启蒙；陈延年、陈乔年等青年，明明可以独善其身读书求学，却甘愿走上一条布满危险的救国道路。他们奋斗不止，为结束当年的苦难，更是要在国人心中种下一份家国的信念。先辈奋不顾身地奔走求索，最大的心愿就是缔造一个远离战乱、岁月安稳的国家。可和平不等于遗忘历史，安逸更不意味着可以丢掉担当。在表妹眼中，那段峥嵘岁月早已远去，先辈的精神似乎不再有用。望着屏幕上的一个个身影，我渐渐明白：家国情怀并不只存在于乱世，先辈开辟前路，我们必要守好这片山河；和平年代里少年人的觉醒，便是把这份精神记在心里，落在日常的努力之中。", "insight": "和平年代里少年人的觉醒，便是把这份精神记在心里，落在日常的努力之中", "ev": "升格思路，先理解表妹为什么会漫不经心：她还没有学习中国近代史，还不知道《觉醒年代》里面那些人物、他们的故事。", "tips": ["理解表妹：她还没有学过中国近代史，还不知道《觉醒年代》里那些人物、他们的故事，所以才会漫不经心；", "加冲突：写我一开始忍不住想要责备表妹，被她顶嘴，姐妹之间产生矛盾，我觉得表妹就是不懂得历史、没有敬畏之心；", "冷静下来反思：意识到人不是天然就有家国情怀的，而是要经过学习、要去观察和思考身边的世界，才能真正把家国情怀落在心间，而不是挂在嘴边的一句口号；", "于是我改变了策略：决定给表妹成长的时间，并且坚信家国情怀的力量可以影响和改变一个人。"]}, {"t": "咸鱼女孩·弹琴", "tag": "梦想奋斗", "batch": 3, "time": "初二的时候", "place": "家里", "people": "我和妈妈", "conflict": "升到初二年级，各科难度大幅度提高，大家都说这是初中学习的关键分水岭，稍不注意就会被落下。妈妈看着我每天写完作业还要弹琴，忍不住对我说：“现在正是拼成绩的时候，弹琴又不能帮你加分，不如把这点时间拿来多刷几道题，别在没用的事情上面浪费精力。”我没有被焦虑裹挟，依旧选择做一条节奏从容的“咸鱼”：每天完成课业任务后，我只留出半小时安静练琴，不和别人比拼考级进度，也不强迫自己高强度练习；琴键起落间，舒缓心绪。学习上，按照自己的节奏梳理知识点、补齐短板。我渐渐懂得：分水岭的成长不必靠盲目内卷，平衡好热爱与学业、稳步沉淀自己，就是属于我的奋斗方式。", "insight": "分水岭的成长不必靠盲目内卷，平衡好热爱与学业、稳步沉淀自己，就是属于我的奋斗方式", "ev": "非常不错，我很喜欢（very good）。", "tips": ["加一个“有用”的证明：妈妈说“别在没用的事情上浪费时间”，那就给弹琴加一个有用的证明，难题困扰、产生焦虑的时候，果断放下纸笔，在琴键上转换心情。你不一定写“我神奇地弹一会儿琴就解出题目了”，可以写：弹了一会儿琴之后，我的头脑中突然有了一点亮光、一点之前我没有想到的问题盲点、盲区；我又从琴键前回到了桌前，让读者直观地看到你真的从中得到了好处，而不是嘴巴上说而已；", "设置对照组（发光体的结尾）：学业的难度增加，又不是只有你一个人增加，这种困境不是个人独有的，写我的好朋友：因为初二难度增加，多加了几门补习班，花了大量时间刷题，把原先喜欢的绘画、音乐、体育都抛在一边，一门心思冲刺，反而焦虑，他的面色，甚至小小年纪多了好多白头发。我不由得心疼他，跟他提了这件事，建议他去试一试，偷偷重拾画笔，获得一份内心的安宁，这就是发光体的结尾：从我自己，把我的经验推广到别人的身上。"]}, {"t": "800 米·好友小怡", "tag": "梦想奋斗", "batch": 3, "time": "某一个上学日", "place": "操场", "people": "我和一同跑步的好友小怡", "conflict": "从前的我耐力很差，800 米一直是我的软肋。每次跑到后半程，我喘得几乎要透不过气，胸口发闷，双腿沉重，总忍不住放慢脚步，甚至萌生出放弃的念头。一次体测结束，一同跑步的好友小怡看到了我的窘迫，她没有讲大道理，只是邀请我每天放学后一起在操场练习。往后的黄昏，跑道上总有我们并肩的身影。我快要撑不下、想要停住时，她不催我冲刺，只在一旁陪着我，提醒我稳住步频、调整呼吸。汗水顺着额角滑落，小腿酸胀难忍，无数个瞬间我都想停下来，可看到身边仍在前行的她，便又咬紧牙关多坚持了一段距离。如今再站上跑道，800 米对于我已经是从容面对，是并肩同行的陪伴，是日复一日不肯松懈的坚持，让我突破了曾经孱弱的自己。", "insight": "是并肩同行的陪伴，是日复一日不肯松懈的坚持，让我突破了曾经孱弱的自己", "ev": "这个素材还不错；可以升格的点在于，这个素材里面没有反派角色，我们可以设置一个对照组。", "tips": ["设置对照组（反派）：有一个跟我一样落后的同学，他也需要加练；我的朋友小怡邀请了他，他却摆摆手，说自己吃不了这个苦、太累了，装作豁达地一笑，认为体测分拿不到也没什么关系；", "加摇摆：我在“他的想法”和“坚持锻炼的想法”之间摇摆；", "直到最后，我通过努力看到了进步，才意识到：努力才有希望，不努力就什么都没有了，感谢自己当初的选择。"]}];
var ZW = [{"t": "灯下的温情", "tag": "温情", "meta": "温情类大作文", "body": "<p>学校拐角处有一间不起眼的文具店，招牌颜色褪得浅淡，货架挨得满满当当，却被老板娘擦得一尘不染。店不大，却透着一种叫人安心的整齐。守店的老板娘五十岁上下，胖胖的，笑起来眼睛眯成一条缝，对来买东西的小顾客总是和和气气、有说有笑。我和她仅仅是顾客与店主，算不上熟悉，可每次路过，总忍不住往店里多看一眼。</p>\n<p>那次期中考试，我的成绩很不理想。放学后，我故意走得很慢，把那张试卷压进书包最底层，仿佛这样它就不存在了。我已经走过了那家文具店，又折了回来。“唉，不想回家，回去就要面对爸妈的盘问。”我想，“算了，晚一点回去，能在外面多磨蹭一会儿是一会儿吧。”</p>\n<p>以前我也看过有学生坐在店外那张掉漆的方桌上写作业，今天轮到我了。天色一点点沉下来，路灯还没亮起，光线昏暗，纸上的字迹渐渐模糊。看着那一个个红叉，泪水不知什么时候漫上眼眶，我吸了吸鼻子，笔尖不经意间在纸上划出一道长长的墨痕。这门课，我怎么就学不好呢？</p>\n<p>“看不清了吧？”身后传来一声轻柔的问话。我慌忙低头抹了一把眼睛，回头，看见老板娘拿着一盏旧台灯走过来。她把灯放在桌边，仔细调好角度，暖融融的光铺满试卷。我有些发愣：虽说我在她这里买过东西，可我们并不熟悉，她为什么……“谢谢。”我小声说，感觉耳朵有点发烫，下意识地用手遮住了我的试卷。她没接话，只是摆了摆手：“快写吧。”说完转身回了店里。走了两步，她又停下来，回身把台灯又调亮了些，这才走进门去。</p>\n<p>她没有问我为什么坐在这里。暖光落在纸上，我忽然觉得，堵在心里的东西，好像被这盏灯悄悄化开了一点儿。</p>\n<p>几天后，我进店挑直尺。老板娘抬头看见我，微笑着冲我点了点头，我也点头回应。上次那盏灯的温暖，还留在我心里。</p>\n<p>我挑中一把直尺，摸遍口袋，还差两块钱。犹豫了一下：“阿姨，可以先帮我记上，下次再来付钱吗？”她轻轻摇了摇头：“实在不好意思，小店本钱薄，文具是不能赊账的。”啊，我为我失礼的行为感到尴尬，赶紧将尺子放回原位，不敢看她，连声说：“不好意思，不好意思……”转头就要走。</p>\n<p>“等等。”她叫住我，弯腰翻了一阵抽屉，拿出一把旧尺子，上面的刻度已经磨得有些模糊，边角也毛了。“这是我女儿从前用的，我店里自己也一直在用。你上学先拿去用，明天还回来就行。”她笑着把尺子递过来，“文具不能赊，这是店里的规矩；我借你一把用一用，不坏规矩。”</p>\n<p>我捧着那把旧尺子，一时说不出话来。原来这份温柔并非没有底线，她守着开店的本分，却仍愿意在力所能及的地方，体谅我。老板娘笑呵呵地看着我，我也朝她笑了笑。温馨的氛围，在小小的店里散开。</p>\n<p>往后许多傍晚，只要我坐在桌前，那盏台灯总会静静立在一旁。我们交谈不多，碰面只是简单问候。有时有人看见我在门口写作业，朝老板娘递去探寻的目光，她便轻轻摇摇头，示意那人别打扰我；后来我把同学带到店里：“这家店的东西可齐全了，质量可好了。”她招待我的同学，还偷偷朝我眨了眨眼，我心领神会，也笑了起来。</p>\n<p>一天傍晚离开时，我悄悄把一颗奶糖放在柜台。第二天再来，台灯底座压着一张星星便利贴。我抬头望向她，她浅浅一笑：“别给自己太大压力。”便利贴上三个字，安静地躺在那里：慢慢来。后面还勾勒着一个简单的笑脸。</p>\n<p>晚风拂过街角，暖黄的灯光漫过人行道。真正动人的温情，从不是过分热切的关照，而是保持恰当的距离，不随意打探心事，却在暗处，悄悄递来一份温柔。</p>"}, {"t": "在陪伴中慢慢成长", "tag": "成长", "meta": "成长类大作文（体谅主题）", "body": "<p>台灯立在书桌一角，暖光漫开。台灯底座边，静静躺着一副耳机，那是外婆淘汰下来的旧款耳机。她现在早就用上了新款，那天还戴着新耳机，跟她的老闺蜜们炫耀。我拿起这副旧耳机，想起那个晚上，心里一阵酸涩，又涌起一丝甜蜜。</p>\n<p>那是周六的晚上，窗外已经安静了下来。我正解题解到关键处，忽然，“你别闹，哈哈，我的妈！”一阵爆笑声从外婆的手机里炸出来，像电钻一样钻入我的耳朵。我心头一紧，笔尖在纸上一滑，作业本被划出一道长长的口子。</p>\n<p>这样的“噪音袭击”，已经不是第一次了。我忍了又忍，终于忍不住，闭着眼睛大声朝外婆喊：“你能不能出去？你能不能别烦我！”</p>\n<p>喊完之后，客厅里一片安静。我不说话，外婆也不说话，我们就那样对视着。外婆攥着手机，指尖局促地抠着手机壳，屏幕跳动的光影落在她布满皱纹的脸上，她的眼睛慢慢垂下去，嘴角也耷拉下来，像做错事的孩子。</p>\n<p>我扭过头，继续写作业。终于安静了。可这骤然的安静，又让我有些不安。我悄悄回头看：外婆沉默地坐在那里，手机也不看了，只是呆呆地望着屏幕。我忽然想起，外婆的耳朵不太好，听不太清，才需要把声音开那么大；那些热闹的短视频，不过是老人排遣孤寂的消遣。</p>\n<p>我心中一阵愧疚。我默默地掏出耳机，走到外婆身边，伸手递给她。外婆愣了愣：“可是，我不会用。”我笑笑：“没关系，外婆，我来教你。”</p>\n<p>后来，外婆戴着耳机，坐在客厅沙发上，乐呵呵地看她的短视频；我在里屋写作业，耳朵里安安静静。那一刻，我们都开心了。</p>\n<p>我忽然懂了：外婆并非忽视我的感受，而是我没有考虑到她的感受，没有站在她的角度。</p>\n<p>这份体谅，不止发生在咫尺的客厅，也跨越山海，来到我和父亲的视频通话中。</p>\n<p>寒假夜里，台灯微光笼罩手机屏幕。隔着屏幕，我教在外务工的父亲使用线上小程序。电话那头，父亲长着薄茧的手指在屏幕上笨拙地反复点按，可屏幕里的图标总是不听使唤：“闺女，这个怎么点？那个怎么点？”</p>\n<p>从前的通话，我们常常无话可说：不知从何开始，我俩的通话内容只剩下了“学习怎么样”“注意身体”，然后便是长久的沉默。</p>\n<p>而如今，我耐下心，一步步给他讲解。父亲学会了，在那边笑起来：“原来是这么操作的，幸好有你，你讲得细心耐心，我找同事们讲，他们都讲不清楚。”我心里一暖，又滔滔不绝地讲起学校里的趣事：“爸爸，今天学校发生了一件特别有趣的事……”我在这头说，他在那头安静地听，眼里满是笑意。</p>\n<p>我想起小时候，父亲也是这样，温柔地教我识字、算数，从没跟我发过脾气。如今，轮到我把这份耐心，回馈给他了。</p>\n<p>台灯的光依旧柔和，那副旧耳机静静地躺在灯下，反射着温润的光。它早就用不上了，可它见证了许多东西。成长，总是在不经意间发生；当你回望它的时候，总能感觉到那份温暖，仿佛就在刚刚，仿佛就在手心里。</p>"}, {"t": "摊边微光", "tag": "平凡人物", "meta": "平凡人物主题大作文", "body": "<p>老街拐角有一处露天旧书摊。木书架上整齐摆放着二手散文、诗集，一块帆布顶棚挡着骄阳细雨。守摊的老伯话不多，头发花白，戴着一副老花镜，平日总是坐在摊边捧着书，一页一页看得入神；有人来问价，他才抬起头，慢慢应一声。我和他素不相识，可每次路过，总见他坐在那里，像一尊安静的雕像，守着满架子的旧书。</p>\n<p>一个黄昏放学，我照例在摊前随意翻看。忽然，一本散文集闯入我的视线：绝版的，网上很难买到，为数不多的几本价格都破百，新版本删去了几篇散文，这一版是我一直想读的。</p>\n<p>我不敢相信地把它拿在手上，举在眼前细细翻看。是它，就是我一直找的那本。我喜滋滋地捧着书走到老伯面前：“老伯，这本书多少钱？”</p>\n<p>他抬了一眼，看到书的封面，又把眼垂下去了：“这本书不卖。”</p>\n<p>“可是……我很喜欢它。”</p>\n<p>“可是，我也很喜欢。”他一句话把我怼了回来。</p>\n<p>我闷闷地把书放回架子，满心不舍，正要转身离开，老伯又叫住我：“慢着。想看，可以在这看。书不卖，但你站在摊边读，没问题。”</p>\n<p>我又惊又喜，连忙道谢。</p>\n<p>之后的许多黄昏，我一放学就来到书摊。老伯自顾自打理生意，很少闲谈，从不打探我的日常，也从不催我离开，留给我安静阅读的空间。</p>\n<p>我渐渐摸清了他的习惯：每天下午，他把书摊打开，把书一本一本摆好，然后沏上一碗浓茶，茶汤浓得发黑，像酱油色。他每次只喝很小的一口，然后眯起眼睛，露出一个痛苦又舒爽的表情。他的茶，一定很苦。</p>\n<p>遇到烈日或者飘小雨的时候，他就会把遮阳棚多拉开一点。</p>\n<p>那天，我捧着书站在摊边看得正入神，浑然不觉丝丝小雨。就在这时，我感觉眼前一暗，抬头正见到他拿着一根竹竿，把遮阳棚又撑开了一些，刚好罩在我的头顶上。</p>\n<p>我心里一喜，忙看向他：“谢谢您。”</p>\n<p>他却转过头去，闷闷地丢下一句：“别把我的书给弄湿了。”</p>\n<p>我笑了。他明明是在护着我，偏要说是护着他的书。</p>\n<p>这天我正看得入迷，一股刺鼻的香水味飘了过来，呛得我打了个喷嚏。一位衣着讲究的女顾客站在我身后，我明明离她还有两步远，她却先开口了：“那小孩，走开，走开，别挡着我挑书。”</p>\n<p>我脸颊一热，心想：这人怎么这么霸道？可人家好歹是来买书的顾客，我总不好跟她争执。我合上书，红着脸打算退到路边。</p>\n<p>这时，老伯抬起头，不紧不慢地说：“小姑娘是我亲戚，来帮我看摊儿的。”</p>\n<p>那位女顾客愣了一下，不好再多说什么，哼了一声，转身去挑别的书了。</p>\n<p>我朝老伯看了一眼，想说什么，他却已经低下头去摆弄他的茶碗。我抿着嘴，朝他点了点头，站在原处，捧着那本散文，又投入进去了。</p>\n<p>夕阳穿过帆布缝隙，柔和地落在书页上。暮色慢慢笼罩老街，我合上书，把书放回架子上原来的位置，朝老伯打了声招呼：“老伯，我走了。”</p>\n<p>他没抬头，只是低着头，举起一只手，朝我的方向挥了挥。</p>\n<p>我走出几步，又忍不住回头看：老伯正从箱子里取出一盏灯，踮着脚，把它挂在树枝上。昏黄的灯光亮起来，刚好照在他那一架子旧书上。晚风里，我闻到人家饭菜的香气，闻到老街里淡淡的花香。那一刻我忽然明白：凡人的微光，从不是声势浩大的相助。它藏在一份安静的成全里，不刻意张扬，不贸然打扰，悄悄守护着一份朴素的热爱，在平凡的时光里，投下一缕绵长温柔的光亮。</p>\n<p>而我，正是被那缕光亮照亮过的人。</p>"}];

    h += '<div class="sec-t"><span class="n">' + b + '</span>' + names[b] + '</div>';
    SUC.filter(function(s){return s.batch===b;}).forEach(function(s){
      h += '<a class="ent" href="#/sucai/' + SUC.indexOf(s) + '"><div class="card itm"><span class="tt">' + esc(s.t) + '</span><span class="tag">' + esc(s.tag) + '</span></div></a>';
    });
  }
  return h;
}
function sucDetailView(i){
  var s = SUC[i];
  var h = '<div class="card detail">'
    + '<div class="itm" style="margin-bottom:6px"><span class="tt" style="font-size:20px;font-weight:700;color:#3f6b5c">' + esc(s.t) + '</span><span class="tag">' + esc(s.tag) + '</span></div>'
    + '<div class="origin"><div class="head">✏️ 学生素材</div>'
    + '<p><span class="k">时间：</span>' + esc(s.time) + '</p>'
    + '<p><span class="k">地点：</span>' + esc(s.place) + '</p>'
    + '<p><span class="k">人物：</span>' + esc(s.people) + '</p>'
    + '<p><span class="k">冲突：</span>' + esc(s.conflict) + '</p>'
    + '<p><span class="k">感悟：</span>' + (s.insight ? esc(s.insight) : '（素材未写感悟句）') + '</p></div>'
    + '<div class="review"><div class="head">💡 老师点评与升格建议</div>'
    + '<p><b>评价：</b>' + esc(s.ev) + '</p><ol>';
  s.tips.forEach(function(tp){ h += '<li>' + esc(tp) + '</li>'; });
  h += '</ol></div></div>';
  return h;
}
function zwListView(){
  var h = '';
  ZW.forEach(function(z){
    h += '<a class="ent" href="#/zuowen/' + ZW.indexOf(z) + '"><div class="card itm"><span class="tt">《' + esc(z.t) + '》</span><span class="tag">' + esc(z.tag) + '</span></div></a>';
  });
  return h;
}
function zwDetailView(i){
  var z = ZW[i];
  return '<div class="itm" style="margin-bottom:4px"><span class="tt" style="font-size:20px;font-weight:700;color:#3f6b5c">《' + esc(z.t) + '》终极版</span><span class="tag">' + esc(z.tag) + '</span></div>'
    + '<div style="font-size:13.5px;color:#8a8a80;margin-bottom:8px">' + esc(z.meta) + ' · 按一对一讲评升级定稿</div>'
    + '<div class="essay">' + z.body + '</div>';
}
function render(){
  var hash = location.hash || '#/';
  var m = hash.match(/^#\/sucai\/(\d+)$/), mz = hash.match(/^#\/zuowen\/(\d+)$/);
  var v = document.getElementById('view');
  var back = document.getElementById('back'), crumb = document.getElementById('crumb');
  if (hash === '#/' || hash === '') { v.innerHTML = homeView(); back.className = 'hide'; crumb.textContent = '徐翊桐 · 26年中考素材班作业归档'; }
  else if (hash === '#/sucai') { v.innerHTML = sucListView(); back.className = ''; back.href = '#/'; crumb.textContent = '素材归档'; }
  else if (m) { v.innerHTML = sucDetailView(+m[1]); back.className = ''; back.href = '#/sucai'; crumb.textContent = '素材 · ' + SUC[+m[1]].t; }
  else if (hash === '#/zuowen') { v.innerHTML = zwListView(); back.className = ''; back.href = '#/'; crumb.textContent = '作文归档'; }
  else if (mz) { v.innerHTML = zwDetailView(+mz[1]); back.className = ''; back.href = '#/zuowen'; crumb.textContent = '作文 · ' + ZW[+mz[1]].t; }
  else { v.innerHTML = homeView(); back.className = 'hide'; }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
