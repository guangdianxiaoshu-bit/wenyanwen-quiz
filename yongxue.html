let shuffles = {};



function shuffleArray(arr) {

  const a = [...arr];

  for (let i = a.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [a[i], a[j]] = [a[j], a[i]];

  }

  return a;

}



function generateShuffles() {

  questions.forEach((_, i) => {

    shuffles[i] = shuffleArray([0, 1, 2, 3]);

  });

  localStorage.setItem(STORAGE_PREFIX + 'shuffles', JSON.stringify(shuffles));

  localStorage.removeItem(STORAGE_PREFIX + 'answers');

  localStorage.removeItem(STORAGE_PREFIX + 'done');

  localStorage.removeItem(STORAGE_PREFIX + 'submitted');

}



function loadShuffles() {

  try {

    const saved = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'shuffles'));

    if (saved && Object.keys(saved).length === questions.length) {

      shuffles = saved;

      return;

    }

  } catch {}

  generateShuffles();

}



function renderTranslation() {

  translationContent.innerHTML = '';

  sentenceData.forEach(s => {

    const block = document.createElement('div');

    block.className = 'sentence-block';



    const orig = document.createElement('div');

    orig.className = 's-line s-line-original';

    orig.innerHTML = '<span class="s-label">原文</span>' + s.original;



    block.appendChild(orig);



    if (s.notes.length > 0) {

      const notes = document.createElement('div');

      notes.className = 's-line s-line-notes';

      let html = '<span class="s-label">注释</span>';

      html += s.notes.map(n =>

        '<span class="note-word">【' + n.word + '：' + n.meaning + '】</span>'

      ).join('');

      notes.innerHTML = html;

      block.appendChild(notes);

    }



    const trans = document.createElement('div');

    trans.className = 's-line s-line-trans';

    trans.innerHTML = '<span class="s-label">译文</span>' + s.trans;

    block.appendChild(trans);



    translationContent.appendChild(block);

  });

}



function renderQuestions() {

  container.innerHTML = '';

  questions.forEach((q, i) => {

    const card = document.createElement('div');

    card.className = 'q-card';

    card.id = `q-${i}`;

    const letters = ['A', 'B', 'C', 'D'];

    const order = shuffles[i] || [0, 1, 2, 3];

    card.innerHTML = `

      <div class="q-header">

        <span class="q-num">${i + 1}</span>

        <span class="q-tag">${q.tag}</span>

      </div>

      <div class="q-text">${q.q}</div>

      <div class="opts">${order.map((oi, di) =>

        `<label data-q="${i}" data-opt="${oi}" onclick="selectOption(${i}, ${oi})">

          <input type="radio" name="q${i}" value="${oi}">

          <span class="opt-letter">${letters[di]}</span>${q.options[oi]}</label>`

      ).join('')}</div>

      <div class="explanation" id="exp-${i}">

        <span class="result-tag" id="tag-${i}"></span>

        <strong>解析：</strong>${q.explain}</div>`;

    container.appendChild(card);

  });

}



function selectOption(qIdx, optIdx) {

  if (submitted) return;

  document.querySelectorAll(`label[data-q="${qIdx}"]`).forEach(l => l.classList.remove('selected'));

  const label = document.querySelector(`label[data-q="${qIdx}"][data-opt="${optIdx}"]`);

  if (label) label.classList.add('selected');

  const answers = getStoredAnswers();

  answers[qIdx] = optIdx;

  localStorage.setItem(STORAGE_PREFIX + 'answers', JSON.stringify(answers));

  const done = getAnswered();

  if (!done.includes(qIdx)) { done.push(qIdx); localStorage.setItem(STORAGE_PREFIX + 'done', JSON.stringify(done)); }

  updateProgress();

  checkSubmitReady();

}



function getStoredAnswers() { try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'answers')) || {}; } catch { return {}; } }

function getAnswered() { try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'done')) || []; } catch { return []; } }



function restoreFromStorage() {

  const answers = getStoredAnswers();

  const answered = getAnswered();

  if (!answered.length) return;

  Object.keys(answers).forEach(k => {

    const idx = parseInt(k), opt = answers[k];

    const label = document.querySelector(`label[data-q="${idx}"][data-opt="${opt}"]`);

    if (label) { label.classList.add('selected'); const r = label.querySelector('input[type="radio"]'); if (r) r.checked = true; }

  });

  updateProgress();

  checkSubmitReady();

}



function updateProgress() {

  const done = getAnswered().length;

  const total = questions.length;

  document.getElementById('floatProg').textContent = `已答 ${done} / ${total} 题`;

}



function checkSubmitReady() {

  const done = getAnswered().length;

  const total = questions.length;

  submitBtn.disabled = done < total;

  submitBtn.textContent = done === total ? '📋 提交批改' : `📋 提交批改（还差 ${total - done} 题）`;

}



submitBtn.addEventListener('click', function() {

  if (submitted) return;

  if (submitBtn.disabled) { showToast('请先完成所有题目再提交'); return; }

  submitted = true;

  const answers = getStoredAnswers();

  let correct = 0;

  questions.forEach((q, i) => {

    const userAns = answers[i];

    const isCorrect = userAns === q.answer;

    if (isCorrect) correct++; else { try { var _wl = JSON.parse(localStorage.getItem('gd_wrong') || '[]'); _wl.push({ paper: '《咏雪》', time: new Date().toLocaleString(), tag: q.tag, q: q.q, options: q.options, userAns: userAns, correct: q.answer, explain: q.explain }); localStorage.setItem('gd_wrong', JSON.stringify(_wl)); } catch (e) {} }

    const card = document.getElementById(`q-${i}`);

    card.classList.add(isCorrect ? 'correct' : 'wrong');

    document.querySelectorAll(`label[data-q="${i}"]`).forEach(l => l.classList.add('disabled'));

    const cl = document.querySelector(`label[data-q="${i}"][data-opt="${q.answer}"]`);

    if (cl) cl.classList.add('show-correct');

    if (!isCorrect && userAns !== undefined) {

      const wl = document.querySelector(`label[data-q="${i}"][data-opt="${userAns}"]`);

      if (wl) wl.classList.add('show-wrong');

    }

    const exp = document.getElementById(`exp-${i}`);

    exp.classList.add('show');

    const tag = document.getElementById(`tag-${i}`);

    tag.className = isCorrect ? 'result-tag correct-tag' : 'result-tag wrong-tag';

    tag.textContent = isCorrect ? '✓ 正确' : '✗ 错误';

  });

  resultPanel.classList.add('show');

  scoreNum.textContent = `${correct}/${questions.length}`;

  correctCountEl.textContent = correct;

  const pct = correct / questions.length;

  let stars = '', comment = '';

  if (pct >= 0.9) { stars = '⭐⭐⭐⭐⭐'; comment = '🏆 掌握扎实，功底深厚！'; }

  else if (pct >= 0.75) { stars = '⭐⭐⭐⭐'; comment = '👏 掌握得很扎实！再巩固一下错题就完美了。'; }

  else if (pct >= 0.6) { stars = '⭐⭐⭐'; comment = '💪 基础不错，建议对照课下注释再复习一遍。'; }

  else if (pct >= 0.4) { stars = '⭐⭐'; comment = '📖 需要系统复习，重点突破字词释义。'; }

  else { stars = '⭐'; comment = '🔄 建议先熟读课文和课下注释，再回来挑战！'; }

  resultStars.textContent = stars;

  scoreComment.textContent = comment;

  submitBtn.disabled = true;

  submitBtn.textContent = '✅ 已批改';

  submitBtn.classList.add('btn-secondary');

  submitBtn.classList.remove('btn-primary');



  renderTranslation();

  translationPanel.classList.add('show');



  setTimeout(() => { resultPanel.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 200);

  localStorage.setItem(STORAGE_PREFIX + 'submitted', 'true');

});



resetBtn.addEventListener('click', function() {

  if (submitted && !confirm('重新答题将清除当前成绩，确定吗？')) return;

  submitted = false;

  localStorage.removeItem(STORAGE_PREFIX + 'answers');

  localStorage.removeItem(STORAGE_PREFIX + 'done');

  localStorage.removeItem(STORAGE_PREFIX + 'submitted');

  localStorage.removeItem(STORAGE_PREFIX + 'shuffles');

  document.querySelectorAll('.q-card').forEach(c => { c.className = 'q-card'; });

  document.querySelectorAll('.opts label').forEach(l => {

    l.className = ''; const r = l.querySelector('input[type="radio"]'); if (r) r.checked = false;

  });

  document.querySelectorAll('.explanation').forEach(e => e.classList.remove('show'));

  translationPanel.classList.remove('show');

  resultPanel.classList.remove('show');

  submitBtn.disabled = true;

  submitBtn.textContent = '📋 提交批改';

  submitBtn.classList.remove('btn-secondary');

  submitBtn.classList.add('btn-primary');

  generateShuffles();

  renderQuestions();

  updateProgress();

  scrollTo({ top: 0, behavior: 'smooth' });

});



function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); clearTimeout(toast._timer); toast._timer = setTimeout(() => toast.classList.remove('show'), 2000); }



localStorage.removeItem(STORAGE_PREFIX + 'answers'); localStorage.removeItem(STORAGE_PREFIX + 'done'); localStorage.removeItem(STORAGE_PREFIX + 'submitted'); generateShuffles();

renderQuestions();

</script>
