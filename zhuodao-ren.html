<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>《床头捉刀人》精读自测 · 9题</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Serif SC", "Source Han Serif SC", serif;
    background: #f8f5f0;
    color: #2c2c2c;
    padding: 0 0 48px;
    line-height: 1.8;
  }
  .container { max-width: 560px; margin: 0 auto; padding: 0 14px; }

  .banner {
    background: linear-gradient(135deg, #3d2b1a 0%, #6b4c30 100%);
    color: #fff;
    text-align: center;
    padding: 36px 20px 28px;
    margin-bottom: 18px;
  }
  .banner h1 { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
  .banner p { font-size: 13px; opacity: 0.8; margin-top: 6px; }
  .banner .badge {
    display: inline-block;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 20px;
    padding: 2px 14px;
    font-size: 11px;
    margin-top: 10px;
  }
  .banner .original {
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 14px 16px;
    margin-top: 14px;
    font-size: 14px;
    line-height: 2;
    text-align: left;
    font-family: inherit;
    color: #f0e6d8;
  }
  .banner .original strong { color: #fff; }

  .progress-bar-wrap {
    background: #ede7dd;
    border-radius: 10px;
    height: 6px;
    margin: 16px 0 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #6b4c30, #b8926c);
    border-radius: 10px;
    transition: width 0.3s;
    width: 0%;
  }
  .progress-text {
    text-align: center;
    font-size: 12px;
    color: #999;
    margin-bottom: 10px;
  }

  .q-card {
    background: #fff;
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    border: 1px solid #f0ebe3;
  }
  .q-card.correct { border-left: 4px solid #4caf50; }
  .q-card.wrong   { border-left: 4px solid #e53935; }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 6px;
  }
  .q-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 24px;
    height: 24px;
    background: #3d2b1a;
    color: #fff;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .q-tag {
    font-size: 11px;
    color: #8b7355;
    background: #f5efe7;
    border-radius: 4px;
    padding: 0 8px;
    margin-left: 4px;
    white-space: nowrap;
  }
  .q-text {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.7;
    margin-bottom: 8px;
  }
  .q-text .highlight {
    color: #6b4c30;
    font-weight: 600;
  }

  .opts { margin-top: 4px; }
  .opts label {
    display: block;
    padding: 10px 14px;
    margin: 5px 0;
    border-radius: 8px;
    border: 1.5px solid #e8e0d3;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }
  .opts label:hover { border-color: #c4a87c; background: #fdf9f3; }
  .opts label.selected { border-color: #6b4c30; background: #f5ede2; }
  .opts label.disabled { pointer-events: none; opacity: 0.85; }

  .opts label.show-correct {
    border-color: #4caf50;
    background: #e8f5e9;
  }
  .opts label.show-wrong {
    border-color: #e53935;
    background: #fce4ec;
  }

  .opts input[type="radio"] { display: none; }

  .opt-letter {
    display: inline-block;
    width: 22px;
    height: 22px;
    line-height: 22px;
    text-align: center;
    border-radius: 50%;
    background: #f0ebe3;
    font-size: 12px;
    font-weight: 600;
    margin-right: 8px;
    color: #666;
    transition: all 0.15s;
  }
  .opts label.selected .opt-letter {
    background: #6b4c30;
    color: #fff;
  }
  .opts label.show-correct .opt-letter {
    background: #4caf50;
    color: #fff;
  }
  .opts label.show-wrong .opt-letter {
    background: #e53935;
    color: #fff;
  }

  .explanation {
    margin-top: 8px;
    padding: 10px 14px;
    background: #faf7f0;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.8;
    display: none;
    color: #555;
  }
  .explanation.show { display: block; }
  .explanation strong { color: #3d2b1a; }
  .explanation .result-tag {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    padding: 0 8px;
    border-radius: 4px;
    margin-right: 6px;
  }
  .result-tag.correct-tag { background: #e8f5e9; color: #2e7d32; }
  .result-tag.wrong-tag  { background: #fce4ec; color: #c62828; }

  .btn-bar {
    text-align: center;
    margin: 28px 0 12px;
  }
  .btn {
    display: inline-block;
    padding: 14px 40px;
    border-radius: 28px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    margin: 4px 6px;
    font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, #6b4c30, #3d2b1a);
    color: #fff;
    box-shadow: 0 2px 8px rgba(61,43,26,0.3);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(61,43,26,0.35); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn-secondary {
    background: #fff;
    color: #3d2b1a;
    border: 2px solid #c4a87c;
  }
  .btn-secondary:hover { background: #f5efe7; }

  .btn-small {
    padding: 8px 20px;
    font-size: 13px;
    border-radius: 20px;
  }

  .result-panel {
    background: linear-gradient(135deg, #3d2b1a, #6b4c30);
    color: #fff;
    border-radius: 16px;
    padding: 28px 20px;
    margin: 24px 0 16px;
    text-align: center;
    display: none;
  }
  .result-panel.show { display: block; }
  .result-panel .score-num {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: 2px;
  }
  .result-panel .score-label {
    font-size: 14px;
    opacity: 0.8;
    margin-top: 2px;
  }
  .result-panel .score-comment {
    font-size: 15px;
    margin-top: 12px;
    opacity: 0.95;
  }
  .result-panel .score-detail {
    font-size: 13px;
    margin-top: 8px;
    opacity: 0.7;
  }
  .result-stars {
    font-size: 28px;
    margin-top: 8px;
    letter-spacing: 4px;
  }

  .footer {
    text-align: center;
    padding: 30px 0 10px;
    font-size: 12px;
    color: #bbb;
  }
  .footer .divider {
    width: 40px;
    height: 2px;
    background: #e0d5c5;
    margin: 0 auto 12px;
    border-radius: 2px;
  }

  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    padding: 10px 24px;
    border-radius: 20px;
    font-size: 13px;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 400px) {
    .banner { padding: 28px 14px 22px; }
    .banner h1 { font-size: 19px; }
    .q-card { padding: 14px 14px; }
    .opts label { padding: 9px 12px; font-size: 13px; }
    .result-panel .score-num { font-size: 42px; }
  }

  @media (min-width: 600px) {
    body { padding: 20px 0 48px; }
    .container { padding: 0 20px; }
    .banner { border-radius: 16px; margin: 0 14px 18px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="banner">
    <h1>📖 《床头捉刀人》精读自测</h1>
    <p>《世说新语·容止》· 曹操假扮侍卫的故事</p>
    <span class="badge">9 道词汇选择题 · 重点字词精练</span>
    <div class="original">
      <strong>原文：</strong>魏武（即曹操）将见匈奴使，自以形陋，不足<u>雄</u>远国，<u>使</u>崔季圭代，帝自<u>捉</u>刀立床头。<u>既</u><u>毕</u>，令间谍问曰："魏王何如？"匈奴使答曰："魏王<u>雅望</u><u>非常</u>，<u>然</u>床头捉刀人<u>乃</u>英雄也。"魏武闻之，追杀此使。
    </div>
  </div>

  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText">已答 0 / 9 题</div>

  <div id="questionsContainer"></div>

  <div class="btn-bar">
    <button class="btn btn-primary" id="submitBtn" disabled>📋 提交批改</button>
    <button class="btn btn-secondary btn-small" id="resetBtn">🔄 重新答题</button>
  </div>

  <div class="result-panel" id="resultPanel">
    <div class="score-label">你的得分</div>
    <div class="score-num" id="scoreNum">0</div>
    <div class="score-detail">共 9 题 · 答对 <span id="correctCount">0</span> 题</div>
    <div class="result-stars" id="resultStars"></div>
    <div class="score-comment" id="scoreComment"></div>
  </div>

  <div class="footer">
    <div class="divider"></div>
    <p>📚 关注公众号 · 获取更多古文精读自测</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const questions = [
  {
    tag: "重点字词",
    q: '"不足<span class="highlight">雄</span>远国"中"雄"的意思是？',
    options: ["称雄（名词作动词）", "英雄（名词）", "威慑（动词，显扬国威）", "雄壮（形容词）"],
    answer: 2,
    explain: '"雄"在此处意为"威慑、显扬国威"，是名词作动词的活用。曹操认为自己形貌丑陋，不足以威慑远方的国家。'
  },
  {
    tag: "重点字词",
    q: '"<span class="highlight">使</span>崔季圭代"中"使"的意思是？',
    options: ["使者（名词）", "致使（连词）", "命令（名词）", "让（动词，派遣）"],
    answer: 3,
    explain: '"使"意为"让、派遣"，是动词。曹操让崔季圭代替自己（接见匈奴使者）。'
  },
  {
    tag: "重点字词",
    q: '"帝自<span class="highlight">捉</span>刀立床头"中"捉"的意思是？',
    options: ["捕捉（动词，抓捕）", "握着（动词，持握）", "携带（动词，随身带）", "放置（动词，搁置）"],
    answer: 1,
    explain: '"捉"在此处意为"握着、持握"，是古义。曹操自己握着刀站在坐榻旁边（假扮侍卫）。现代汉语中"捉"多指"捕捉"，是词义转移。'
  },
  {
    tag: "重点字词",
    q: '"<span class="highlight">既</span>毕"中"既"的意思是？',
    options: ["既然（连词，表推论）", "即使（连词，表假设）", "已经（副词，表动作完成）", "不久（副词，表时间间隔）"],
    answer: 2,
    explain: '"既"意为"已经"，是副词，表示动作已完成。"既毕"即"已经结束后"。'
  },
  {
    tag: "重点字词",
    q: '"既<span class="highlight">毕</span>"中"毕"的意思是？',
    options: ["结束（动词，完毕）", "完成（动词，做成）", "全部（副词，皆）", "毕竟（副词，终归）"],
    answer: 0,
    explain: '"毕"意为"结束、完毕"。"既毕"即接见已经结束之后。'
  },
  {
    tag: "重点字词",
    q: '"魏王<span class="highlight">雅望</span>非常"中"雅望"的意思是？',
    options: ["高雅的期望（偏正短语）", "崇高的声望（名词，雅正的名望）", "深远的谋划（名词，谋略）", "傲慢的态度（偏正短语）"],
    answer: 1,
    explain: '"雅望"意为"崇高的声望、雅正的名望"。匈奴使者评价崔季圭假扮的魏王"声望非同寻常"。'
  },
  {
    tag: "重点字词",
    q: '"魏王雅望<span class="highlight">非常</span>"中"非常"的意思是？',
    options: ["不同寻常（古今异义，不一般）", "十分（副词，表程度）", "经常（副词，常常）", "非常感谢（现代常用语）"],
    answer: 0,
    explain: '"非常"在这里是古今异义词，意为"不同寻常、不一般"。"雅望非常"即"声望非同寻常"。现代汉语中"非常"多用作程度副词。'
  },
  {
    tag: "重点字词",
    q: '"<span class="highlight">然</span>床头捉刀人乃英雄也"中"然"的意思是？',
    options: ["然而（连词，表转折）", "这样（代词，如此）", "于是（连词，表顺承）", "果然（副词，表意料之中）"],
    answer: 0,
    explain: '"然"意为"然而"，是转折连词。匈奴使者说：魏王声望非同寻常，然而床头那个握刀的人才是真英雄。'
  },
  {
    tag: "重点字词",
    q: '"床头捉刀人<span class="highlight">乃</span>英雄也"中"乃"的意思是？',
    options: ["于是（副词，表顺承）", "竟然（副词，表惊讶）", "你的（代词，表所属）", "就是（判断词，表肯定）"],
    answer: 3,
    explain: '"乃"与"也"搭配构成判断句式，意为"就是"。匈奴使者看出床头握刀的人才是真正的英雄——即曹操本人。'
  }
];

const container = document.getElementById('questionsContainer');
const submitBtn = document.getElementById('submitBtn');
const resetBtn = document.getElementById('resetBtn');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const resultPanel = document.getElementById('resultPanel');
const scoreNum = document.getElementById('scoreNum');
const correctCountEl = document.getElementById('correctCount');
const resultStars = document.getElementById('resultStars');
const scoreComment = document.getElementById('scoreComment');
const toast = document.getElementById('toast');
const STORAGE_PREFIX = 'zhuodaoren_';

let submitted = false;

function renderQuestions() {
  container.innerHTML = '';
  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `q-${i}`;
    const letters = ['A', 'B', 'C', 'D'];
    let headerHTML = `
      <div class="q-header">
        <span class="q-num">${i + 1}</span>
        <span class="q-tag">${q.tag}</span>
      </div>
      <div class="q-text">${q.q}</div>
    `;
    let optsHTML = '<div class="opts">';
    q.options.forEach((opt, oi) => {
      optsHTML += `
        <label data-q="${i}" data-opt="${oi}" onclick="selectOption(${i}, ${oi})">
          <input type="radio" name="q${i}" value="${oi}">
          <span class="opt-letter">${letters[oi]}</span>
          ${opt}
        </label>
      `;
    });
    optsHTML += '</div>';
    const explainHTML = `
      <div class="explanation" id="exp-${i}">
        <span class="result-tag" id="tag-${i}"></span>
        <strong>解析：</strong>${q.explain}
      </div>
    `;
    card.innerHTML = headerHTML + optsHTML + explainHTML;
    container.appendChild(card);
  });
}

function selectOption(qIdx, optIdx) {
  if (submitted) return;
  const labels = document.querySelectorAll(`label[data-q="${qIdx}"]`);
  labels.forEach(l => l.classList.remove('selected'));
  labels[optIdx].classList.add('selected');
  const answers = getStoredAnswers();
  answers[qIdx] = optIdx;
  localStorage.setItem(STORAGE_PREFIX + 'answers', JSON.stringify(answers));
  const done = getAnswered();
  if (!done.includes(qIdx)) {
    done.push(qIdx);
    localStorage.setItem(STORAGE_PREFIX + 'done', JSON.stringify(done));
  }
  updateProgress();
  checkSubmitReady();
}

function getStoredAnswers() {
  try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'answers')) || {}; } catch { return {}; }
}
function getAnswered() {
  try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'done')) || []; } catch { return []; }
}

function restoreFromStorage() {
  const answers = getStoredAnswers();
  const answered = getAnswered();
  if (!answered.length) return;
  Object.keys(answers).forEach(k => {
    const idx = parseInt(k);
    const opt = answers[k];
    const labels = document.querySelectorAll(`label[data-q="${idx}"]`);
    if (labels[opt]) {
      labels[opt].classList.add('selected');
      const radio = labels[opt].querySelector('input[type="radio"]');
      if (radio) radio.checked = true;
    }
  });
  updateProgress();
  checkSubmitReady();
}

function updateProgress() {
  const done = getAnswered().length;
  const total = questions.length;
  const pct = Math.round((done / total) * 100);
  progressFill.style.width = Math.min(pct, 100) + '%';
  progressText.textContent = `已答 ${done} / ${total} 题`;
}

function checkSubmitReady() {
  const done = getAnswered().length;
  const total = questions.length;
  submitBtn.disabled = done < total;
  if (done === total) {
    submitBtn.textContent = '📋 提交批改';
  } else {
    submitBtn.textContent = `📋 提交批改（还差 ${total - done} 题）`;
  }
}

submitBtn.addEventListener('click', function() {
  if (submitted) return;
  if (submitBtn.disabled) { showToast('请先完成所有题目再提交'); return; }
  submitted = true;
  const answers = getStoredAnswers();
  let correct = 0;
  questions.forEach((q, i) => {
    const userAns = answers[i];
    const isCorrect = userAns === q.answer;
    if (isCorrect) correct++;
    const card = document.getElementById(`q-${i}`);
    card.classList.add(isCorrect ? 'correct' : 'wrong');
    const labels = document.querySelectorAll(`label[data-q="${i}"]`);
    labels.forEach(l => l.classList.add('disabled'));
    const correctLabel = document.querySelector(`label[data-q="${i}"][data-opt="${q.answer}"]`);
    if (correctLabel) correctLabel.classList.add('show-correct');
    if (!isCorrect && userAns !== undefined) {
      const wrongLabel = document.querySelector(`label[data-q="${i}"][data-opt="${userAns}"]`);
      if (wrongLabel) wrongLabel.classList.add('show-wrong');
    }
    const exp = document.getElementById(`exp-${i}`);
    exp.classList.add('show');
    const tag = document.getElementById(`tag-${i}`);
    tag.className = isCorrect ? 'result-tag correct-tag' : 'result-tag wrong-tag';
    tag.textContent = isCorrect ? '✓ 正确' : '✗ 错误';
  });
  resultPanel.classList.add('show');
  scoreNum.textContent = `${correct}/${questions.length}`;
  correctCountEl.textContent = correct;
  const pct = correct / questions.length;
  let stars = '', comment = '';
  if (pct >= 0.9) { stars = '⭐⭐⭐⭐⭐'; comment = '🏆 词汇达人！文言字词掌握得非常扎实！'; }
  else if (pct >= 0.75) { stars = '⭐⭐⭐⭐'; comment = '👏 很不错！重点字词基本过关。'; }
  else if (pct >= 0.5) { stars = '⭐⭐⭐'; comment = '💪 基础还可以，建议对照注释再巩固一遍。'; }
  else { stars = '⭐⭐'; comment = '📖 需要系统复习课下注释，重点关注古今异义和词类活用。'; }
  resultStars.textContent = stars;
  scoreComment.textContent = comment;
  submitBtn.disabled = true;
  submitBtn.textContent = '✅ 已批改';
  submitBtn.classList.add('btn-secondary');
  submitBtn.classList.remove('btn-primary');
  setTimeout(() => { resultPanel.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 200);
  localStorage.setItem(STORAGE_PREFIX + 'submitted', 'true');
});

resetBtn.addEventListener('click', function() {
  if (submitted && !confirm('重新答题将清除当前成绩，确定吗？')) return;
  submitted = false;
  localStorage.removeItem(STORAGE_PREFIX + 'answers');
  localStorage.removeItem(STORAGE_PREFIX + 'done');
  localStorage.removeItem(STORAGE_PREFIX + 'submitted');
  document.querySelectorAll('.q-card').forEach(c => { c.className = 'q-card'; });
  document.querySelectorAll('.opts label').forEach(l => {
    l.className = '';
    const radio = l.querySelector('input[type="radio"]');
    if (radio) radio.checked = false;
  });
  document.querySelectorAll('.explanation').forEach(e => e.classList.remove('show'));
  resultPanel.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.textContent = '📋 提交批改';
  submitBtn.classList.remove('btn-secondary');
  submitBtn.classList.add('btn-primary');
  updateProgress();
  scrollTo({ top: 0, behavior: 'smooth' });
});

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 2000);
}

renderQuestions();
const wasSubmitted = localStorage.getItem(STORAGE_PREFIX + 'submitted');
if (wasSubmitted === 'true') {
  setTimeout(() => { submitted = false; submitBtn.click(); }, 100);
} else {
  restoreFromStorage();
}
</script>
</body>
</html>
