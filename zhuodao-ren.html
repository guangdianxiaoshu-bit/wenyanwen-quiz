<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>《床头捉刀人》精读自测 · 9题</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Serif SC", "Source Han Serif SC", serif;
    background: #f8f5f0;
    color: #2c2c2c;
    padding: 0 0 48px;
    line-height: 1.8;
  }
  .container { max-width: 560px; margin: 0 auto; padding: 0 14px; }

  /* ===== 顶部标题区（随滚动消失） ===== */
  .banner {
    background: linear-gradient(135deg, #3d2b1a 0%, #6b4c30 100%);
    color: #fff;
    text-align: center;
    padding: 28px 20px 22px;
  }
  .banner h1 { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
  .banner p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
  .banner .badge {
    display: inline-block;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 20px;
    padding: 2px 14px;
    font-size: 11px;
    margin-top: 8px;
  }

  /* ===== 原文面板（吸顶） ===== */
  .sticky-original {
    position: -webkit-sticky;
    position: sticky;
    top: 0;
    z-index: 100;
    background: #3d2b1a;
    color: #e8dcc8;
    padding: 10px 16px;
    font-size: 13px;
    line-height: 1.9;
    max-height: 30vh;
    overflow-y: auto;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .sticky-original strong {
    color: #d4b896;
    font-size: 11px;
    letter-spacing: 1px;
    margin-right: 4px;
  }
  .sticky-original u {
    text-decoration: none;
    border-bottom: 1.5px dotted #d4b896;
    padding-bottom: 1px;
  }

  /* ===== 进度条 ===== */
  .progress-bar-wrap {
    background: #ede7dd;
    border-radius: 10px;
    height: 6px;
    margin: 16px 0 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #6b4c30, #b8926c);
    border-radius: 10px;
    transition: width 0.3s;
    width: 0%;
  }
  .progress-text {
    text-align: center;
    font-size: 12px;
    color: #999;
    margin-bottom: 10px;
  }

  /* ===== 题卡 ===== */
  .q-card {
    background: #fff;
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    border: 1px solid #f0ebe3;
  }
  .q-card.correct { border-left: 4px solid #4caf50; }
  .q-card.wrong   { border-left: 4px solid #e53935; }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 6px;
  }
  .q-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 24px;
    height: 24px;
    background: #3d2b1a;
    color: #fff;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .q-tag {
    font-size: 11px;
    color: #8b7355;
    background: #f5efe7;
    border-radius: 4px;
    padding: 0 8px;
    margin-left: 4px;
    white-space: nowrap;
  }
  .q-text {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.7;
    margin-bottom: 8px;
  }
  .q-text .highlight {
    color: #6b4c30;
    font-weight: 600;
  }

  .opts { margin-top: 4px; }
  .opts label {
    display: block;
    padding: 10px 14px;
    margin: 5px 0;
    border-radius: 8px;
    border: 1.5px solid #e8e0d3;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .opts label:hover { border-color: #c4a87c; background: #fdf9f3; }
  .opts label.selected { border-color: #6b4c30; background: #f5ede2; }
  .opts label.disabled { pointer-events: none; opacity: 0.85; }
  .opts label.show-correct { border-color: #4caf50; background: #e8f5e9; }
  .opts label.show-wrong { border-color: #e53935; background: #fce4ec; }
  .opts input[type="radio"] { display: none; }

  .opt-letter {
    display: inline-block;
    width: 22px;
    height: 22px;
    line-height: 22px;
    text-align: center;
    border-radius: 50%;
    background: #f0ebe3;
    font-size: 12px;
    font-weight: 600;
    margin-right: 8px;
    color: #666;
    transition: all 0.15s;
  }
  .opts label.selected .opt-letter { background: #6b4c30; color: #fff; }
  .opts label.show-correct .opt-letter { background: #4caf50; color: #fff; }
  .opts label.show-wrong .opt-letter { background: #e53935; color: #fff; }

  .explanation {
    margin-top: 8px;
    padding: 10px 14px;
    background: #faf7f0;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.8;
    display: none;
    color: #555;
  }
  .explanation.show { display: block; }
  .explanation strong { color: #3d2b1a; }
  .explanation .result-tag {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    padding: 0 8px;
    border-radius: 4px;
    margin-right: 6px;
  }
  .result-tag.correct-tag { background: #e8f5e9; color: #2e7d32; }
  .result-tag.wrong-tag  { background: #fce4ec; color: #c62828; }

  /* ===== 按钮 ===== */
  .btn-bar { text-align: center; margin: 28px 0 12px; }
  .btn {
    display: inline-block;
    padding: 14px 40px;
    border-radius: 28px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    margin: 4px 6px;
    font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, #6b4c30, #3d2b1a);
    color: #fff;
    box-shadow: 0 2px 8px rgba(61,43,26,0.3);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(61,43,26,0.35); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-secondary { background: #fff; color: #3d2b1a; border: 2px solid #c4a87c; }
  .btn-secondary:hover { background: #f5efe7; }
  .btn-small { padding: 8px 20px; font-size: 13px; border-radius: 20px; }

  /* ===== 成绩面板 ===== */
  .result-panel {
    background: linear-gradient(135deg, #3d2b1a, #6b4c30);
    color: #fff;
    border-radius: 16px;
    padding: 28px 20px;
    margin: 24px 0 16px;
    text-align: center;
    display: none;
  }
  .result-panel.show { display: block; }
  .result-panel .score-num { font-size: 52px; font-weight: 800; letter-spacing: 2px; }
  .result-panel .score-label { font-size: 14px; opacity: 0.8; margin-top: 2px; }
  .result-panel .score-comment { font-size: 15px; margin-top: 12px; opacity: 0.95; }
  .result-panel .score-detail { font-size: 13px; margin-top: 8px; opacity: 0.7; }
  .result-stars { font-size: 28px; margin-top: 8px; letter-spacing: 4px; }

  /* ===== 逐字翻译面板 ===== */
  .translation-panel {
    background: #fff;
    border-radius: 12px;
    padding: 18px 18px;
    margin: 16px 0;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    border: 1px solid #f0ebe3;
    display: none;
  }
  .translation-panel.show { display: block; }
  .translation-panel h3 {
    font-size: 15px;
    font-weight: 600;
    color: #3d2b1a;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid #f0ebe3;
  }
  .translation-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 4px;
    line-height: 2.2;
  }
  .translation-word {
    display: inline-flex;
    align-items: baseline;
    gap: 2px;
    font-size: 13px;
    color: #555;
    white-space: nowrap;
  }
  .translation-word .tw-original {
    color: #333;
    font-weight: 500;
  }
  .translation-word .tw-arrow {
    color: #ccc;
    margin: 0 1px;
    font-size: 11px;
  }
  .translation-word .tw-meaning {
    color: #888;
    font-size: 12px;
  }
  .translation-word.is-quiz {
    background: #f5efe7;
    border-radius: 4px;
    padding: 0 6px;
  }
  .translation-word.is-quiz .tw-original {
    color: #3d2b1a;
    font-weight: 700;
  }
  .translation-word.is-quiz .tw-meaning {
    color: #6b4c30;
    font-weight: 500;
  }
  .translation-word .tw-bracket {
    color: #b8926c;
    font-weight: 400;
  }
  .translation-sep {
    color: #ddd;
    font-size: 11px;
    margin: 0 2px;
  }

  /* ===== 底部 ===== */
  .footer { text-align: center; padding: 30px 0 10px; font-size: 12px; color: #bbb; }
  .footer .divider { width: 40px; height: 2px; background: #e0d5c5; margin: 0 auto 12px; border-radius: 2px; }

  /* ===== Toast ===== */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; padding: 10px 24px; border-radius: 20px;
    font-size: 13px; z-index: 999; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* ===== 响应式 ===== */
  @media (max-width: 400px) {
    .banner { padding: 24px 14px 18px; }
    .banner h1 { font-size: 19px; }
    .sticky-original { font-size: 12px; padding: 8px 12px; max-height: 25vh; }
    .q-card { padding: 14px 14px; }
    .opts label { padding: 9px 12px; font-size: 13px; }
    .result-panel .score-num { font-size: 42px; }
    .translation-word { font-size: 12px; }
  }
  @media (min-width: 600px) {
    body { padding: 20px 0 48px; }
    .container { padding: 0 20px; }
    .banner { border-radius: 0; }
    .sticky-original { border-radius: 0; }
  }
</style>
</head>
<body>

<!-- 标题区（随滚动消失） -->
<div class="banner">
  <h1>📖 《床头捉刀人》精读自测</h1>
  <p>《世说新语·容止》· 曹操假扮侍卫的故事</p>
  <span class="badge">9 道词汇选择题 · 重点字词精练</span>
</div>

<!-- 原文区（吸顶，做题时可随时参考） -->
<div class="sticky-original" id="stickyOriginal">
  <strong>原文</strong> 魏武将见匈奴使，自以形陋，不足<u>雄</u>远国，<u>使</u>崔季圭代，帝自<u>捉</u>刀立床头。<u>既</u><u>毕</u>，令间谍问曰："魏王何如？"匈奴使答曰："魏王<u>雅望</u><u>非常</u>，<u>然</u>床头捉刀人<u>乃</u>英雄也。"魏武闻之，追杀此使。
</div>

<div class="container">

  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText">已答 0 / 9 题</div>

  <div id="questionsContainer"></div>

  <div class="btn-bar">
    <button class="btn btn-primary" id="submitBtn" disabled>📋 提交批改</button>
    <button class="btn btn-secondary btn-small" id="resetBtn">🔄 重新答题</button>
  </div>

  <!-- 成绩面板 -->
  <div class="result-panel" id="resultPanel">
    <div class="score-label">你的得分</div>
    <div class="score-num" id="scoreNum">0</div>
    <div class="score-detail">共 9 题 · 答对 <span id="correctCount">0</span> 题</div>
    <div class="result-stars" id="resultStars"></div>
    <div class="score-comment" id="scoreComment"></div>
  </div>

  <!-- 逐字翻译面板（提交后显示） -->
  <div class="translation-panel" id="translationPanel">
    <h3>📖 逐字直译</h3>
    <div class="translation-grid" id="translationGrid"></div>
  </div>

  <div class="footer">
    <div class="divider"></div>
    <p>📚 关注公众号 · 获取更多古文精读自测</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const questions = [
  { tag: "重点字词", q: '"不足<span class="highlight">雄</span>远国"中"雄"的意思是？',
    options: ["称雄（名词作动词）", "英雄（名词）", "威慑（动词，显扬国威）", "雄壮（形容词）"],
    answer: 2, explain: '"雄"在此处意为"威慑、显扬国威"，是名词作动词的活用。曹操认为自己形貌丑陋，不足以威慑远方的国家。' },
  { tag: "重点字词", q: '"<span class="highlight">使</span>崔季圭代"中"使"的意思是？',
    options: ["使者（名词）", "致使（连词）", "命令（名词）", "让（动词，派遣）"],
    answer: 3, explain: '"使"意为"让、派遣"，是动词。曹操让崔季圭代替自己（接见匈奴使者）。' },
  { tag: "重点字词", q: '"帝自<span class="highlight">捉</span>刀立床头"中"捉"的意思是？',
    options: ["捕捉（动词，抓捕）", "握着（动词，持握）", "携带（动词，随身带）", "放置（动词，搁置）"],
    answer: 1, explain: '"捉"在此处意为"握着、持握"，是古义。现代汉语中"捉"多指"捕捉"，是词义转移。' },
  { tag: "重点字词", q: '"<span class="highlight">既</span>毕"中"既"的意思是？',
    options: ["既然（连词，表推论）", "即使（连词，表假设）", "已经（副词，表动作完成）", "不久（副词，表时间间隔）"],
    answer: 2, explain: '"既"意为"已经"，是副词，表示动作已完成。' },
  { tag: "重点字词", q: '"既<span class="highlight">毕</span>"中"毕"的意思是？',
    options: ["结束（动词，完毕）", "完成（动词，做成）", "全部（副词，皆）", "毕竟（副词，终归）"],
    answer: 0, explain: '"毕"意为"结束、完毕"。"既毕"即"已经结束后"。' },
  { tag: "重点字词", q: '"魏王<span class="highlight">雅望</span>非常"中"雅望"的意思是？',
    options: ["高雅的期望（偏正短语）", "崇高的声望（名词，雅正的名望）", "深远的谋划（名词，谋略）", "傲慢的态度（偏正短语）"],
    answer: 1, explain: '"雅望"意为"崇高的声望、雅正的名望"。' },
  { tag: "重点字词", q: '"魏王雅望<span class="highlight">非常</span>"中"非常"的意思是？',
    options: ["不同寻常（古今异义）", "十分（副词，表程度）", "经常（副词，常常）", "非常感谢（现代常用语）"],
    answer: 0, explain: '"非常"是古今异义词，此处意为"不同寻常"。' },
  { tag: "重点字词", q: '"<span class="highlight">然</span>床头捉刀人乃英雄也"中"然"的意思是？',
    options: ["然而（连词，表转折）", "这样（代词，如此）", "于是（连词，表顺承）", "果然（副词，表意料之中）"],
    answer: 0, explain: '"然"意为"然而"，是转折连词。' },
  { tag: "重点字词", q: '"床头捉刀人<span class="highlight">乃</span>英雄也"中"乃"的意思是？',
    options: ["于是（副词，表顺承）", "竟然（副词，表惊讶）", "你的（代词，表所属）", "就是（判断词，表肯定）"],
    answer: 3, explain: '"乃"与"也"搭配构成判断句式，意为"就是"。' }
];

// ===== 逐字翻译数据 =====
// quizWords 中收录了习题涉及的词，会在翻译中用【】标出
const translationData = [
  { t: "魏武", m: "曹操" },
  { t: "将", m: "将要" },
  { t: "见", m: "接见" },
  { t: "匈奴使", m: "匈奴的使者" },
  { t: "自", m: "自己" },
  { t: "以", m: "认为" },
  { t: "形陋", m: "形貌丑陋" },
  { t: "不足", m: "不足以" },
  { t: "雄", m: "威慑", q: true },
  { t: "远国", m: "远方的国家" },
  { t: "使", m: "让，派遣", q: true },
  { t: "崔季圭", m: "崔季珪（人名）" },
  { t: "代", m: "代替" },
  { t: "帝", m: "魏武帝" },
  { t: "自", m: "亲自" },
  { t: "捉", m: "握着，持握", q: true },
  { t: "刀", m: "刀" },
  { t: "立", m: "站立" },
  { t: "床头", m: "坐榻旁" },
  { t: "既", m: "已经", q: true },
  { t: "毕", m: "结束", q: true },
  { t: "令", m: "让，命令" },
  { t: "间谍", m: "探子" },
  { t: "问", m: "询问" },
  { t: "曰", m: "说" },
  { t: "魏王", m: "魏王" },
  { t: "何如", m: "怎么样" },
  { sep: "。" },
  { t: "匈奴使", m: "匈奴使者" },
  { t: "答", m: "回答" },
  { t: "曰", m: "说" },
  { t: "魏王", m: "魏王" },
  { t: "雅望", m: "崇高的声望", q: true },
  { t: "非常", m: "不同寻常", q: true },
  { t: "然", m: "然而", q: true },
  { t: "床头", m: "坐榻旁" },
  { t: "捉刀人", m: "握刀的人" },
  { t: "乃", m: "就是", q: true },
  { t: "英雄", m: "英雄" },
  { t: "也", m: "（判断语气）" },
  { sep: "。" },
  { t: "魏武", m: "曹操" },
  { t: "闻", m: "听说" },
  { t: "之", m: "这件事" },
  { t: "追杀", m: "追杀" },
  { t: "此", m: "这个" },
  { t: "使", m: "使者" },
  { sep: "。" }
];

// ===== DOM 引用 =====
const container = document.getElementById('questionsContainer');
const submitBtn = document.getElementById('submitBtn');
const resetBtn = document.getElementById('resetBtn');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const resultPanel = document.getElementById('resultPanel');
const scoreNum = document.getElementById('scoreNum');
const correctCountEl = document.getElementById('correctCount');
const resultStars = document.getElementById('resultStars');
const scoreComment = document.getElementById('scoreComment');
const toast = document.getElementById('toast');
const translationPanel = document.getElementById('translationPanel');
const translationGrid = document.getElementById('translationGrid');
const STORAGE_PREFIX = 'zhuodaoren_';

let submitted = false;

// ===== 渲染翻译 =====
function renderTranslation() {
  translationGrid.innerHTML = '';
  translationData.forEach(item => {
    if (item.sep) {
      const sep = document.createElement('span');
      sep.className = 'translation-sep';
      sep.textContent = item.sep;
      translationGrid.appendChild(sep);
      return;
    }
    const el = document.createElement('span');
    el.className = 'translation-word' + (item.q ? ' is-quiz' : '');
    let html = '';
    if (item.q) {
      html = `<span class="tw-bracket">【</span><span class="tw-original">${item.t}</span><span class="tw-arrow">：</span><span class="tw-meaning">${item.m}</span><span class="tw-bracket">】</span>`;
    } else {
      html = `<span class="tw-original">${item.t}</span><span class="tw-arrow">→</span><span class="tw-meaning">${item.m}</span>`;
    }
    el.innerHTML = html;
    translationGrid.appendChild(el);
  });
}

// ===== 渲染题目 =====
function renderQuestions() {
  container.innerHTML = '';
  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `q-${i}`;
    const letters = ['A', 'B', 'C', 'D'];
    let headerHTML = `
      <div class="q-header">
        <span class="q-num">${i + 1}</span>
        <span class="q-tag">${q.tag}</span>
      </div>
      <div class="q-text">${q.q}</div>
    `;
    let optsHTML = '<div class="opts">';
    q.options.forEach((opt, oi) => {
      optsHTML += `<label data-q="${i}" data-opt="${oi}" onclick="selectOption(${i}, ${oi})">
        <input type="radio" name="q${i}" value="${oi}">
        <span class="opt-letter">${letters[oi]}</span>${opt}</label>`;
    });
    optsHTML += '</div>';
    const explainHTML = `<div class="explanation" id="exp-${i}">
      <span class="result-tag" id="tag-${i}"></span>
      <strong>解析：</strong>${q.explain}</div>`;
    card.innerHTML = headerHTML + optsHTML + explainHTML;
    container.appendChild(card);
  });
}

function selectOption(qIdx, optIdx) {
  if (submitted) return;
  const labels = document.querySelectorAll(`label[data-q="${qIdx}"]`);
  labels.forEach(l => l.classList.remove('selected'));
  labels[optIdx].classList.add('selected');
  const answers = getStoredAnswers();
  answers[qIdx] = optIdx;
  localStorage.setItem(STORAGE_PREFIX + 'answers', JSON.stringify(answers));
  const done = getAnswered();
  if (!done.includes(qIdx)) { done.push(qIdx); localStorage.setItem(STORAGE_PREFIX + 'done', JSON.stringify(done)); }
  updateProgress();
  checkSubmitReady();
}

function getStoredAnswers() { try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'answers')) || {}; } catch { return {}; } }
function getAnswered() { try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'done')) || []; } catch { return []; } }

function restoreFromStorage() {
  const answers = getStoredAnswers();
  const answered = getAnswered();
  if (!answered.length) return;
  Object.keys(answers).forEach(k => {
    const idx = parseInt(k), opt = answers[k];
    const labels = document.querySelectorAll(`label[data-q="${idx}"]`);
    if (labels[opt]) { labels[opt].classList.add('selected'); const r = labels[opt].querySelector('input[type="radio"]'); if (r) r.checked = true; }
  });
  updateProgress();
  checkSubmitReady();
}

function updateProgress() {
  const done = getAnswered().length;
  const total = questions.length;
  const pct = Math.round((done / total) * 100);
  progressFill.style.width = Math.min(pct, 100) + '%';
  progressText.textContent = `已答 ${done} / ${total} 题`;
}

function checkSubmitReady() {
  const done = getAnswered().length;
  const total = questions.length;
  submitBtn.disabled = done < total;
  submitBtn.textContent = done === total ? '📋 提交批改' : `📋 提交批改（还差 ${total - done} 题）`;
}

submitBtn.addEventListener('click', function() {
  if (submitted) return;
  if (submitBtn.disabled) { showToast('请先完成所有题目再提交'); return; }
  submitted = true;
  const answers = getStoredAnswers();
  let correct = 0;
  questions.forEach((q, i) => {
    const userAns = answers[i];
    const isCorrect = userAns === q.answer;
    if (isCorrect) correct++;
    const card = document.getElementById(`q-${i}`);
    card.classList.add(isCorrect ? 'correct' : 'wrong');
    const labels = document.querySelectorAll(`label[data-q="${i}"]`);
    labels.forEach(l => l.classList.add('disabled'));
    const cl = document.querySelector(`label[data-q="${i}"][data-opt="${q.answer}"]`);
    if (cl) cl.classList.add('show-correct');
    if (!isCorrect && userAns !== undefined) {
      const wl = document.querySelector(`label[data-q="${i}"][data-opt="${userAns}"]`);
      if (wl) wl.classList.add('show-wrong');
    }
    const exp = document.getElementById(`exp-${i}`);
    exp.classList.add('show');
    const tag = document.getElementById(`tag-${i}`);
    tag.className = isCorrect ? 'result-tag correct-tag' : 'result-tag wrong-tag';
    tag.textContent = isCorrect ? '✓ 正确' : '✗ 错误';
  });
  resultPanel.classList.add('show');
  scoreNum.textContent = `${correct}/${questions.length}`;
  correctCountEl.textContent = correct;
  const pct = correct / questions.length;
  let stars = '', comment = '';
  if (pct >= 0.9) { stars = '⭐⭐⭐⭐⭐'; comment = '🏆 词汇达人！文言字词掌握得非常扎实！'; }
  else if (pct >= 0.75) { stars = '⭐⭐⭐⭐'; comment = '👏 很不错！重点字词基本过关。'; }
  else if (pct >= 0.5) { stars = '⭐⭐⭐'; comment = '💪 基础还可以，建议对照注释再巩固一遍。'; }
  else { stars = '⭐⭐'; comment = '📖 需要系统复习课下注释，重点关注古今异义和词类活用。'; }
  resultStars.textContent = stars;
  scoreComment.textContent = comment;
  submitBtn.disabled = true;
  submitBtn.textContent = '✅ 已批改';
  submitBtn.classList.add('btn-secondary');
  submitBtn.classList.remove('btn-primary');

  // 显示逐字翻译
  renderTranslation();
  translationPanel.classList.add('show');

  setTimeout(() => { resultPanel.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 200);
  localStorage.setItem(STORAGE_PREFIX + 'submitted', 'true');
});

resetBtn.addEventListener('click', function() {
  if (submitted && !confirm('重新答题将清除当前成绩，确定吗？')) return;
  submitted = false;
  localStorage.removeItem(STORAGE_PREFIX + 'answers');
  localStorage.removeItem(STORAGE_PREFIX + 'done');
  localStorage.removeItem(STORAGE_PREFIX + 'submitted');
  document.querySelectorAll('.q-card').forEach(c => { c.className = 'q-card'; });
  document.querySelectorAll('.opts label').forEach(l => {
    l.className = ''; const r = l.querySelector('input[type="radio"]'); if (r) r.checked = false;
  });
  document.querySelectorAll('.explanation').forEach(e => e.classList.remove('show'));
  translationPanel.classList.remove('show');
  resultPanel.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.textContent = '📋 提交批改';
  submitBtn.classList.remove('btn-secondary');
  submitBtn.classList.add('btn-primary');
  updateProgress();
  scrollTo({ top: 0, behavior: 'smooth' });
});

function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); clearTimeout(toast._timer); toast._timer = setTimeout(() => toast.classList.remove('show'), 2000); }

renderQuestions();
const wasSubmitted = localStorage.getItem(STORAGE_PREFIX + 'submitted');
if (wasSubmitted === 'true') { setTimeout(() => { submitted = false; submitBtn.click(); }, 100); }
else { restoreFromStorage(); }
</script>
</body>
</html>
