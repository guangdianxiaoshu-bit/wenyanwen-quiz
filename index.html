<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光点小塾文言文选择题</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Serif SC",serif;background:#f8f5f0;color:#2c2c2c;padding:0 0 48px;line-height:1.8}
.container{max-width:560px;margin:0 auto;padding:0 14px}
.banner{background:linear-gradient(135deg,#3d2b1a,#8b5e3c);color:#fff;text-align:center;padding:40px 20px 30px;margin-bottom:20px}
.banner h1{font-size:22px;font-weight:700}
.banner .badge{display:inline-block;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);border-radius:20px;padding:3px 16px;font-size:12px;margin-top:10px}
.tree-folder{display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:14px;font-weight:600;color:#5a3e2b;cursor:pointer}
.tree-folder:hover{background:#f0ebe3}
.tree-folder .arrow{font-size:10px;color:#c4a87c;transition:transform .2s;display:inline-block;width:14px}
.tree-folder .arrow.open{transform:rotate(90deg)}
.tree-children{padding-left:20px;overflow:hidden;max-height:0;transition:max-height .3s}
.tree-children.open{max-height:2000px}
.tree-quiz{display:flex;align-items:center;padding:5px 10px;font-size:13px;color:#555;text-decoration:none}
.tree-quiz:hover{background:#f0ebe3;color:#3d2b1a}
.tree-quiz .qc{font-size:11px;color:#b3926f;margin-left:auto}
.section-title{font-size:15px;font-weight:600;color:#5a3e2b;padding-bottom:8px;border-bottom:2px solid #e0d5c5;margin:20px 0 14px}
.quiz-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid #f0ebe3;display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
.quiz-card:hover{border-color:#c4a87c;box-shadow:0 3px 12px rgba(0,0,0,0.08)}
.qicon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background:#e8f5e9}
.qinfo{flex:1}
.qinfo h3{font-size:16px;font-weight:600;color:#3d2b1a}
.qinfo .m{font-size:12px;color:#999;margin-top:2px}
.qinfo .m span{background:#f0ebe3;border-radius:4px;padding:0 6px;font-size:11px;color:#8b7355}
.footer{text-align:center;padding:30px 0 10px;font-size:12px;color:#bbb}
.footer .d{width:40px;height:2px;background:#e0d5c5;margin:0 auto 12px}
</style>
</head>
<body>
<div class=container>
<div class=banner><h1>📖 光点小塾文言文选择题</h1><span class=badge id=qc></span></div>
<div id=tc class=tree-section></div>
<div class=section-title>📝 全部自测</div>
<div id=ql></div>
<div class=footer><div class=d></div><p>📚 <strong>光点小塾</strong> &middot; 专注语文学习轻量化、日常化</p></div>
</div>
<script>
var Q=[
{t:'《王戎不取道旁李》精读自测',p:'wangrong.html',n:12,i:'🍒',d:'《世说新语》',c:'课内古文/课内古文-小学/课内古文-小学-四年级'},
{t:'《精卫填海》精读自测',p:'jingwei.html',n:12,i:'🐟',d:'《山海经·北山经》',c:'课内古文/课内古文-小学/课内古文-小学-四年级'},
{t:'《守株待兔》精读自测',p:'shouzhudai.html',n:12,i:'🌾',d:'《韩非子·五蝫》',c:'课内古文/课内古文-小学/课内古文-小学-三年级'},
{t:'《司马光》精读自测',p:'simaguang.html',n:12,i:'🧱',d:'《宋史·司马光传》',c:'课内古文/课内古文-小学/课内古文-小学-三年级'},
{t:'《咏雪》精读自测',p:'yongxue.html',n:17,i:'❄️',d:'《世说新语》二则',c:'课内古文/课内古文-初中/课内古文-初中-七上'}
];
var TS={"课内古文":{"课内古文-小学":["课内古文-小学-三年级","课内古文-小学-四年级","课内古文-小学-五年级","课内古文-小学-六年级"],"课内古文-初中":["课内古文-初中-七上","课内古文-初中-七下","课内古文-初中-八上","课内古文-初中-八下","课内古文-初中-九上","课内古文-初中-九下"]}};
(function(){var qc=document.getElementById('qc'),ql=document.getElementById('ql'),tc=document.getElementById('tc');
qc.textContent='共'+Q.length+'套';ql.innerHTML='';
for(var i=0;i<Q.length;i++){var q=Q[i],c=document.createElement('a');c.className='quiz-card';c.href=q.p;
c.innerHTML='<div class=qicon>'+q.i+'</div><div class=qinfo><h3>'+q.t+'</h3><div class=m><span>'+q.n+'题</span>'+q.d+'</div></div><div class=quiz-arrow>›</div>';ql.appendChild(c);}
function bt(){var r={children:{}};Q.forEach(function(q,j){var n=r;q.c.split('/').forEach(function(p){if(!n.children[p])n.children[p]={name:p,children:{},items:[]};n=n.children[p]});n.items.push(j)});
(function ep(a){var n=r;a.forEach(function(p){if(!n.children[p])n.children[p]={name:p,children:{},items:[]};n=n.children[p]})})(['课内古文','课内古文-小学']);
ep(['课内古文','课内古文-初中']);
for(var g=3;g<=6;g++)ep(['课内古文','课内古文-小学','课内古文-小学-三年级'.replace('\u4e09',String(g))]);
for(var g=7;g<=9;g++){ep(['课内古文','课内古文-初中','课内古文-初中-七上'.replace('\u4e03',String(g)).replace('\u4e0a','\u4e0a')]);ep(['课内古文','课内古文-初中','课内古文-初中-七下'.replace('\u4e03',String(g)).replace('\u4e0b','\u4e0b')]);}
return r}
function cdi(n){var c=n.items.length;for(var k in n.children)c+=cdi(n.children[k]);return c}
function rt(n,c,d){var keys=Object.keys(n.children).sort();
for(var ki=0;ki<keys.length;ki++){var name=keys[ki],ch=n.children[name],ic=ch.items.length+cdi(ch),hc=Object.keys(ch.children).length>0||ch.items.length>0;
if(!hc)continue;var w=document.createElement('div');w.className='tree-node';
var f=document.createElement('div');f.className='tree-folder';f.style.paddingLeft=(10+d*4)+'px';
var a=document.createElement('span');a.className='arrow';a.textContent='▶';f.appendChild(a);
var ii=document.createElement('span');ii.textContent='📂';f.appendChild(ii);
var l=document.createElement('span');l.textContent=name;f.appendChild(l);
var cc=document.createElement('span');cc.textContent=ic+'题';cc.style.cssText='margin-left:auto;font-size:11px;color:#b3926f';f.appendChild(cc);
var cd=document.createElement('div');cd.className='tree-children';
ch.items.forEach(function(j){var q=Q[j],lk=document.createElement('a');lk.className='tree-quiz';lk.href=q.p;lk.style.paddingLeft=(10+(d+1)*4)+'px';lk.innerHTML='<span>'+q.i+'</span><span>'+q.t+'</span><span class=qc>'+q.n+'题</span>';cd.appendChild(lk)});
if(Object.keys(ch.children).length>0)rt(ch,cd,d+1);
if(d<=1){cd.classList.add('open');a.classList.add('open')}
f.onclick=function(e){e.stopPropagation();cd.classList.toggle('open');a.classList.toggle('open')};
w.appendChild(f);w.appendChild(cd);c.appendChild(w)}}
rt(bt(),tc,0)})();
</script>
</body>
</html>
