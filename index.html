<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>光点小塾文言文选择题</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Serif SC", "Source Han Serif SC", serif;
    background: #f8f5f0;
    color: #2c2c2c;
    padding: 0 0 48px;
    line-height: 1.8;
  }
  .container { max-width: 560px; margin: 0 auto; padding: 0 14px; }

  .banner {
    background: linear-gradient(135deg, #3d2b1a 0%, #8b5e3c 100%);
    color: #fff;
    text-align: center;
    padding: 40px 20px 30px;
    margin-bottom: 20px;
  }
  .banner h1 { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
  .banner .badge {
    display: inline-block;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 20px;
    padding: 3px 16px;
    font-size: 12px;
    margin-top: 10px;
  }

  .tree-section { margin-bottom: 20px; }
  .tree-node { margin: 1px 0; }
  .tree-folder {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 6px;
    font-size: 14px; font-weight: 600; color: #5a3e2b;
    cursor: pointer; user-select: none; transition: background 0.15s;
  }
  .tree-folder:hover { background: #f0ebe3; }
  .tree-folder .arrow {
    font-size: 10px; color: #c4a87c; transition: transform 0.2s;
    display: inline-block; width: 14px;
  }
  .tree-folder .arrow.open { transform: rotate(90deg); }
  .tree-folder .folder-icon { font-size: 16px; }
  .tree-folder .count { font-size: 11px; color: #b3926f; font-weight: 400; margin-left: auto; }
  .tree-children {
    padding-left: 20px; overflow: hidden;
    max-height: 0; transition: max-height 0.3s ease;
  }
  .tree-children.open { max-height: 1000px; }
  .tree-quiz {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 10px; border-radius: 6px;
    font-size: 13px; color: #555; text-decoration: none; transition: background 0.15s;
  }
  .tree-quiz:hover { background: #f0ebe3; color: #3d2b1a; }
  .tree-quiz .q-icon { font-size: 14px; }
  .tree-quiz .q-title { flex: 1; }
  .tree-quiz .q-count { font-size: 11px; color: #b3926f; }
  .tree-empty { padding: 4px 10px; font-size: 12px; color: #ccc; font-style: italic; }

  .section-title {
    font-size: 15px; font-weight: 600; color: #5a3e2b;
    padding-bottom: 8px; border-bottom: 2px solid #e0d5c5; margin: 20px 0 14px;
  }
  .quiz-card {
    background: #fff; border-radius: 12px; padding: 16px 18px; margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05); border: 1px solid #f0ebe3;
    display: flex; align-items: center; gap: 14px;
    text-decoration: none; color: inherit; transition: all 0.2s;
  }
  .quiz-card:hover { border-color: #c4a87c; box-shadow: 0 3px 12px rgba(0,0,0,0.08); transform: translateY(-1px); }
  .quiz-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .quiz-icon.green { background: #e8f5e9; }
  .quiz-info { flex: 1; }
  .quiz-info h3 { font-size: 16px; font-weight: 600; color: #3d2b1a; }
  .quiz-info .meta { font-size: 12px; color: #999; margin-top: 2px; }
  .quiz-info .meta span { display: inline-block; background: #f0ebe3; border-radius: 4px; padding: 0 6px; margin-right: 4px; font-size: 11px; color: #8b7355; }
  .quiz-arrow { font-size: 18px; color: #c4a87c; }

  .empty-state { text-align: center; padding: 40px 20px; color: #bbb; font-size: 14px; }
  .empty-state .big-icon { font-size: 48px; margin-bottom: 12px; }

  .footer { text-align: center; padding: 30px 0 10px; font-size: 12px; color: #bbb; }
  .footer .divider { width: 40px; height: 2px; background: #e0d5c5; margin: 0 auto 12px; border-radius: 2px; }

  @media (max-width: 400px) {
    .banner { padding: 30px 14px 22px; }
    .banner h1 { font-size: 19px; }
    .quiz-card { padding: 14px 14px; }
  }
  @media (min-width: 600px) {
    body { padding: 20px 0 48px; }
    .container { padding: 0 20px; }
    .banner { border-radius: 16px; margin: 0 14px 20px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="banner">
    <h1>📖 光点小塾文言文选择题</h1>
    <span class="badge" id="quizCount">加载中…</span>
  </div>

  <div id="treeContainer" class="tree-section"></div>

  <div class="section-title">📝 全部自测</div>
  <div id="quizList"></div>

  <div class="footer">
    <div class="divider"></div>
    <p>📚 <strong>光点小塾</strong> · 专注语文学习轻量化、日常化</p>
  </div>
</div>

<script>
const quizzes = [
  {
    title: "《守株待兔》精读自测",
    path: "shouzhudai.html",
    questions: 12,
    icon: "🌾",
    iconClass: "brown",
    desc: "《韩非子·五蠹》",
    category: "课内古文/课内古文-小学/课内古文-小学-三年级"
  },
  {
    title: "《司马光》精读自测",
    path: "simaguang.html",
    questions: 12,
    icon: "🧱",
    iconClass: "green",
    desc: "《宋史·司马光传》",
    category: "课内古文/课内古文-小学/课内古文-小学-三年级"
  },
  {
    title: "《咏雪》精读自测",
    path: "yongxue.html",
    questions: 17,
    icon: "❄️",
    iconClass: "green",
    desc: "《世说新语》二则",
    category: "课内古文/课内古文-初中/课内古文-初中-七上"
  }
];

const treeStructure = {
  "课内古文": {
    "课内古文-小学": [
      "课内古文-小学-三年级",
      "课内古文-小学-四年级",
      "课内古文-小学-五年级",
      "课内古文-小学-六年级"
    ],
    "课内古文-初中": [
      "课内古文-初中-七上",
      "课内古文-初中-七下",
      "课内古文-初中-八上",
      "课内古文-初中-八下",
      "课内古文-初中-九上",
      "课内古文-初中-九下"
    ]
  }
};

const quizList = document.getElementById('quizList');
const quizCount = document.getElementById('quizCount');
const treeContainer = document.getElementById('treeContainer');

function buildFullTree() {
  const root = { children: {} };
  quizzes.forEach((q, idx) => {
    const parts = q.category.split('/');
    let node = root;
    parts.forEach(part => {
      if (!node.children[part]) { node.children[part] = { name: part, children: {}, items: [] }; }
      node = node.children[part];
    });
    node.items.push(idx);
  });
  function ensurePath(pathParts) {
    let node = root;
    pathParts.forEach(part => {
      if (!node.children[part]) { node.children[part] = { name: part, children: {}, items: [] }; }
      node = node.children[part];
    });
    return node;
  }
  Object.keys(treeStructure).forEach(l1 => {
    Object.keys(treeStructure[l1]).forEach(l2 => {
      ensurePath([l1, l2]);
      treeStructure[l1][l2].forEach(l3 => { ensurePath([l1, l2, l3]); });
    });
  });
  return root;
}

function countDescendantItems(node) {
  let count = node.items.length;
  Object.values(node.children).forEach(c => { count += countDescendantItems(c); });
  return count;
}

function renderTree(node, container, depth) {
  const names = Object.keys(node.children).sort();
  names.forEach(name => {
    const child = node.children[name];
    const itemCount = child.items.length + countDescendantItems(child);
    const hasChildren = Object.keys(child.children).length > 0 || child.items.length > 0;
    if (!hasChildren) return;
    const wrap = document.createElement('div');
    wrap.className = 'tree-node';
    const folder = document.createElement('div');
    folder.className = 'tree-folder';
    folder.style.paddingLeft = (10 + depth * 4) + 'px';
    const arrow = document.createElement('span'); arrow.className = 'arrow'; arrow.textContent = '▶'; folder.appendChild(arrow);
    const icon = document.createElement('span'); icon.className = 'folder-icon'; icon.textContent = '📂'; folder.appendChild(icon);
    const label = document.createElement('span'); label.textContent = name; folder.appendChild(label);
    const cnt = document.createElement('span'); cnt.className = 'count'; cnt.textContent = itemCount + ' 题'; folder.appendChild(cnt);
    const childrenDiv = document.createElement('div'); childrenDiv.className = 'tree-children';
    child.items.forEach(idx => {
      const q = quizzes[idx];
      const link = document.createElement('a'); link.className = 'tree-quiz'; link.href = q.path;
      link.style.paddingLeft = (10 + (depth + 1) * 4) + 'px';
      link.innerHTML = '<span class="q-icon">' + q.icon + '</span><span class="q-title">' + q.title + '</span><span class="q-count">' + q.questions + '题</span>';
      childrenDiv.appendChild(link);
    });
    if (Object.keys(child.children).length > 0) { renderTree(child, childrenDiv, depth + 1); }
    if (depth <= 1) { childrenDiv.classList.add('open'); arrow.classList.add('open'); }
    folder.addEventListener('click', function(e) { e.stopPropagation(); childrenDiv.classList.toggle('open'); arrow.classList.toggle('open'); });
    wrap.appendChild(folder); wrap.appendChild(childrenDiv);
    container.appendChild(wrap);
  });
}

function renderCards() {
  quizCount.textContent = '共 ' + quizzes.length + ' 套自测题';
  if (quizzes.length === 0) { quizList.innerHTML = '<div class="empty-state"><div class="big-icon">📚</div><p>自测题准备中，敬请期待……</p></div>'; return; }
  quizList.innerHTML = '';
  quizzes.forEach(q => {
    const card = document.createElement('a'); card.className = 'quiz-card'; card.href = q.path;
    card.innerHTML = '<div class="quiz-icon ' + q.iconClass + '">' + q.icon + '</div><div class="quiz-info"><h3>' + q.title + '</h3><div class="meta"><span>' + q.questions + ' 题</span>' + (q.desc || '') + '</div></div><div class="quiz-arrow">›</div>';
    quizList.appendChild(card);
  });
}

const tree = buildFullTree();
renderTree(tree, treeContainer, 0);
renderCards();
</script>
</body>
</html>
