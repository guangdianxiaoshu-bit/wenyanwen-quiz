<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>光点小塾</title>
<style>
body{font-family:sans-serif;background:#f8f5f0;padding:20px;max-width:500px;margin:0 auto}
h1{color:#5a3e2b;font-size:18px;margin-bottom:16px}
.item{background:#fff;padding:12px 16px;margin:0 0 8px;border-radius:8px;border:1px solid #ede7dd;text-decoration:none;color:inherit;display:block}
.item:hover{border-color:#c4a87c}
.item b{display:block;font-size:14px;color:#3d2b1a}
.item s{display:block;font-size:11px;color:#999;margin-top:2px}
</style>
</head>
<body>
<h1>光点小塾 · 古文自测</h1>
<div id=x></div>
<script>
var Q=[
['《王戎不取道旁李》','wangrong.html','12题 四年级上'],
['《精卫填海》','jingwei.html','12题 四年级上'],
['《守株待兔》','shouzhudai.html','12题 三年级下'],
['《司马光》','simaguang.html','12题 三年级上'],
['《咏雪》','yongxue.html','17题 七年级上']
];
var h='';for(var i=0;i<Q.length;i++){h+='<a class=item href="'+Q[i][1]+'"><b>'+Q[i][0]+'</b><s>'+Q[i][2]+'</s></a>';}
document.getElementById('x').innerHTML=h;
</script>
</body>
</html>
