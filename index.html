<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>古文精读自测题集</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Serif SC", "Source Han Serif SC", serif;
    background: #f8f5f0;
    color: #2c2c2c;
    padding: 0 0 48px;
    line-height: 1.8;
  }
  .container { max-width: 560px; margin: 0 auto; padding: 0 14px; }

  .banner {
    background: linear-gradient(135deg, #3d2b1a 0%, #8b5e3c 100%);
    color: #fff;
    text-align: center;
    padding: 48px 20px 36px;
    margin-bottom: 24px;
  }
  .banner h1 { font-size: 26px; font-weight: 700; letter-spacing: 3px; }
  .banner p { font-size: 14px; opacity: 0.85; margin-top: 8px; }
  .banner .badge {
    display: inline-block;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 20px;
    padding: 3px 16px;
    font-size: 12px;
    margin-top: 12px;
  }

  .section-title {
    font-size: 15px;
    font-weight: 600;
    color: #5a3e2b;
    padding-bottom: 8px;
    border-bottom: 2px solid #e0d5c5;
    margin: 20px 0 14px;
  }

  .quiz-card {
    background: #fff;
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    border: 1px solid #f0ebe3;
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    color: inherit;
    transition: all 0.2s;
  }
  .quiz-card:hover {
    border-color: #c4a87c;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    transform: translateY(-1px);
  }

  .quiz-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .quiz-icon.green { background: #e8f5e9; }
  .quiz-icon.brown { background: #f5efe7; }

  .quiz-info { flex: 1; }
  .quiz-info h3 { font-size: 16px; font-weight: 600; color: #3d2b1a; }
  .quiz-info .meta {
    font-size: 12px;
    color: #999;
    margin-top: 2px;
  }
  .quiz-info .meta span {
    display: inline-block;
    background: #f0ebe3;
    border-radius: 4px;
    padding: 0 6px;
    margin-right: 4px;
    font-size: 11px;
    color: #8b7355;
  }
  .quiz-arrow {
    font-size: 18px;
    color: #c4a87c;
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #bbb;
    font-size: 14px;
  }
  .empty-state .big-icon { font-size: 48px; margin-bottom: 12px; }

  .footer {
    text-align: center;
    padding: 30px 0 10px;
    font-size: 12px;
    color: #bbb;
  }
  .footer .divider {
    width: 40px;
    height: 2px;
    background: #e0d5c5;
    margin: 0 auto 12px;
    border-radius: 2px;
  }

  @media (max-width: 400px) {
    .banner { padding: 36px 14px 28px; }
    .banner h1 { font-size: 22px; }
    .banner p { font-size: 13px; }
    .quiz-card { padding: 14px 14px; }
  }

  @media (min-width: 600px) {
    body { padding: 20px 0 48px; }
    .container { padding: 0 20px; }
    .banner { border-radius: 16px; margin: 0 14px 24px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="banner">
    <h1>📖 古文精读自测</h1>
    <p>部编版初中语文 · 重点篇目逐篇突破</p>
    <span class="badge" id="quizCount">加载中…</span>
  </div>

  <div class="section-title">📝 自测列表</div>

  <div id="quizList"></div>

  <div class="footer">
    <div class="divider"></div>
    <p>📚 关注公众号 · 持续更新中</p>
  </div>
</div>

<script>
// ===== 题库目录 =====
const quizzes = [
  {
    title: "《咏雪》精读自测",
    path: "yongxue.html",
    questions: 20,
    icon: "❄️",
    iconClass: "green",
    desc: "部编版七上 · 《世说新语》二则"
  }
];

const quizList = document.getElementById('quizList');
const quizCount = document.getElementById('quizCount');

function renderList() {
  quizCount.textContent = `共 ${quizzes.length} 套自测题`;

  if (quizzes.length === 0) {
    quizList.innerHTML = `
      <div class="empty-state">
        <div class="big-icon">📚</div>
        <p>自测题准备中，敬请期待……</p>
      </div>
    `;
    return;
  }

  quizList.innerHTML = '';
  quizzes.forEach(q => {
    const card = document.createElement('a');
    card.className = 'quiz-card';
    card.href = q.path;
    card.innerHTML = `
      <div class="quiz-icon ${q.iconClass}">${q.icon}</div>
      <div class="quiz-info">
        <h3>${q.title}</h3>
        <div class="meta">
          <span>${q.questions} 题</span>
          ${q.desc}
        </div>
      </div>
      <div class="quiz-arrow">›</div>
    `;
    quizList.appendChild(card);
  });
}

renderList();
</script>
</body>
</html>
