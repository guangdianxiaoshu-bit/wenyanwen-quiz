<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>《精卫填海》 · 12题</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Serif SC", "Source Han Serif SC", serif;
    background: #f0f5f8;
    color: #2c2c2c;
    padding: 0 0 48px;
    line-height: 1.8;
  }
  .container { max-width: 560px; margin: 0 auto; padding: 0 14px; }

  .banner {
    background: linear-gradient(135deg, #1a5276 0%, #2e86c1 100%);
    color: #fff;
    text-align: center;
    padding: 28px 20px 22px;
  }
  .banner h1 { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
  .banner p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
  .banner .badge {
    display: inline-block; background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25); border-radius: 20px;
    padding: 2px 14px; font-size: 11px; margin-top: 8px;
  }

  .sticky-original {
    position: -webkit-sticky; position: sticky; top: 0; z-index: 100;
    background: #1a5276; color: #d4e6f1;
    padding: 10px 16px; font-size: 14px; line-height: 1.9;
    max-height: 35vh; overflow-y: auto;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .sticky-original strong { color: #85c1e9; font-size: 11px; letter-spacing: 1px; margin-right: 4px; }
  .sticky-original u { text-decoration: none; border-bottom: 1.5px dotted #85c1e9; padding-bottom: 1px; }

  .progress-bar-wrap { background: #d4e6f1; border-radius: 10px; height: 6px; margin: 16px 0 4px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #1a5276, #5dade2); border-radius: 10px; transition: width 0.3s; width: 0%; }
  .progress-text { text-align: center; font-size: 12px; color: #999; margin-bottom: 10px; }

  .q-card { background: #fff; border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); border: 1px solid #d4e6f1; }
  .q-card.correct { border-left: 4px solid #4caf50; }
  .q-card.wrong { border-left: 4px solid #e53935; }
  .q-header { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .q-num { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; background: #1a5276; color: #fff; border-radius: 50%; font-size: 12px; font-weight: 600; flex-shrink: 0; margin-top: 2px; }
  .q-tag { font-size: 11px; color: #2e86c1; background: #d4e6f1; border-radius: 4px; padding: 0 8px; margin-left: 4px; white-space: nowrap; }
  .q-text { font-size: 15px; font-weight: 500; line-height: 1.7; margin-bottom: 8px; }
  .q-text .highlight { color: #1a5276; font-weight: 600; }

  .opts { margin-top: 4px; }
  .opts label { display: block; padding: 10px 14px; margin: 5px 0; border-radius: 8px; border: 1.5px solid #d4e6f1; font-size: 14px; cursor: pointer; transition: all 0.15s; }
  .opts label:hover { border-color: #5dade2; background: #eaf2f8; }
  .opts label.selected { border-color: #1a5276; background: #d4e6f1; }
  .opts label.disabled { pointer-events: none; opacity: 0.85; }
  .opts label.show-correct { border-color: #4caf50; background: #e8f5e9; }
  .opts label.show-wrong { border-color: #e53935; background: #fce4ec; }
  .opts input[type="radio"] { display: none; }
  .opt-letter { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; background: #d4e6f1; font-size: 12px; font-weight: 600; margin-right: 8px; color: #666; }
  .opts label.selected .opt-letter { background: #1a5276; color: #fff; }
  .opts label.show-correct .opt-letter { background: #4caf50; color: #fff; }
  .opts label.show-wrong .opt-letter { background: #e53935; color: #fff; }

  .explanation { margin-top: 8px; padding: 10px 14px; background: #eaf2f8; border-radius: 8px; font-size: 13px; line-height: 1.8; display: none; color: #555; }
  .explanation.show { display: block; }
  .explanation strong { color: #1a5276; }
  .explanation .result-tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 0 8px; border-radius: 4px; margin-right: 6px; }
  .result-tag.correct-tag { background: #e8f5e9; color: #2e7d32; }
  .result-tag.wrong-tag { background: #fce4ec; color: #c62828; }

  .btn-bar { text-align: center; margin: 28px 0 12px; }
  .btn { display: inline-block; padding: 14px 40px; border-radius: 28px; font-size: 16px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; margin: 4px 6px; font-family: inherit; }
  .btn-primary { background: linear-gradient(135deg, #1a5276, #2e86c1); color: #fff; box-shadow: 0 2px 8px rgba(26,82,118,0.3); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(26,82,118,0.35); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-secondary { background: #fff; color: #1a5276; border: 2px solid #5dade2; }
  .btn-secondary:hover { background: #eaf2f8; }
  .btn-small { padding: 8px 20px; font-size: 13px; border-radius: 20px; }

  .result-panel { background: linear-gradient(135deg, #1a5276, #2e86c1); color: #fff; border-radius: 16px; padding: 28px 20px; margin: 24px 0 16px; text-align: center; display: none; }
  .result-panel.show { display: block; }
  .result-panel .score-num { font-size: 52px; font-weight: 800; letter-spacing: 2px; }
  .result-panel .score-label { font-size: 14px; opacity: 0.8; margin-top: 2px; }
  .result-panel .score-comment { font-size: 15px; margin-top: 12px; opacity: 0.95; }
  .result-panel .score-detail { font-size: 13px; margin-top: 8px; opacity: 0.7; }
  .result-stars { font-size: 28px; margin-top: 8px; letter-spacing: 4px; }

  .translation-panel { background: #fff; border-radius: 12px; padding: 18px; margin: 16px 0; box-shadow: 0 1px 4px rgba(0,0,0,0.05); border: 1px solid #d4e6f1; display: none; }
  .translation-panel.show { display: block; }
  .translation-panel h3 { font-size: 15px; font-weight: 600; color: #1a5276; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 2px solid #d4e6f1; }
  .sentence-block { margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid #eaf2f8; }
  .sentence-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .s-line { font-size: 14px; line-height: 1.9; margin-bottom: 2px; }
  .s-line .s-label { display: inline-block; font-size: 11px; font-weight: 600; color: #bbb; min-width: 3.2em; letter-spacing: 1px; }
  .s-line-original { color: #333; font-weight: 500; }
  .s-line-notes { color: #1a5276; font-size: 13px; margin-bottom: 4px; }
  .s-line-notes .note-word { display: inline-block; background: #eaf2f8; border: 1px solid #d4e6f1; border-radius: 4px; padding: 0 8px; margin: 2px 3px 2px 0; font-weight: 500; }
  .s-line-trans { color: #666; font-size: 13px; }

  .footer { text-align: center; padding: 30px 0 10px; font-size: 12px; color: #bbb; }
  .footer .divider { width: 40px; height: 2px; background: #d4e6f1; margin: 0 auto 12px; border-radius: 2px; }

  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 24px; border-radius: 20px; font-size: 13px; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }

  @media (max-width: 400px) {
    .banner { padding: 24px 14px 18px; }
    .banner h1 { font-size: 19px; }
    .sticky-original { font-size: 13px; padding: 8px 12px; max-height: 25vh; }
    .q-card { padding: 14px; }
    .opts label { padding: 9px 12px; font-size: 13px; }
    .result-panel .score-num { font-size: 42px; }
  }
  @media (min-width: 600px) {
    body { padding: 20px 0 48px; }
    .container { padding: 0 20px; }
    .banner, .sticky-original { border-radius: 0; }
  }
</style>
</head>
<body>

<div class="banner">
  <h1>📖 《精卫填海》</h1>
  <p>部编版四年级上册 · 《山海经·北山经》</p>
  <span class="badge">12 道选择题 · 测测你对这篇古文掌握得怎样</span>
</div>

<div class="sticky-original" id="stickyOriginal">
  <strong>原文</strong> 炎帝<u>之</u><u>少女</u>，名<u>曰</u>女娃。女娃<u>游</u><u>于</u>东海，<u>溺</u><u>而</u>不<u>返</u>，<u>故</u><u>为</u>精卫，常<u>衔</u>西山<u>之</u>木石，<u>以</u><u>堙(yīn)</u>于东海。<br>
  <strong>常识</strong> 本文选自《山海经·北山经》。精卫是神话中的鸟，形状像乌鸦，头上有花纹，白嘴红脚，传说是炎帝小女儿溺水后的化身。
</div>

<div class="container">

  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText">已答 0 / 12 题</div>

  <div id="questionsContainer"></div>

  <div class="btn-bar">
    <button class="btn btn-primary" id="submitBtn" disabled>📋 提交批改</button>
    <button class="btn btn-secondary btn-small" id="resetBtn">🔄 重新答题</button>
  </div>

  <div class="result-panel" id="resultPanel">
    <div class="score-label">你的得分</div>
    <div class="score-num" id="scoreNum">0</div>
    <div class="score-detail">共 12 题 · 答对 <span id="correctCount">0</span> 题</div>
    <div class="result-stars" id="resultStars"></div>
    <div class="score-comment" id="scoreComment"></div>
  </div>

  <div class="translation-panel" id="translationPanel">
    <h3>📖 逐句精读</h3>
    <div id="translationContent"></div>
  </div>

  <div class="footer">
    <div class="divider"></div>
    <p style="margin-bottom:4px;">📚 <strong>光点小塾</strong> · 专注语文学习轻量化、日常化</p>
    <p><a href="https://guangdianxiaoshu-bit.github.io/wenyanwen-quiz/" style="color:#5dade2;text-decoration:none;font-size:12px;">← 返回目录</a></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const questions = [
  { tag: "字词释义", q: '“炎帝<span class="highlight">之</span>少女”中“<span class="highlight">之</span>”的意思是？',
    options: ["的", "到", "去", "这"], answer: 0,
    explain: '“之”是结构助词，意为“的”。炎帝的小女儿。' },
  { tag: "字词释义", q: '“炎帝之<span class="highlight">少女</span>”中“少女”在文中的意思是？',
    options: ["年轻女子", "小女儿", "少女", "小女孩"], answer: 1,
    explain: '“少女”在此处是古今异义词，意为“小女儿”，不是现代汉语中的“少女”。' },
  { tag: "字词释义", q: '“名<span class="highlight">曰</span>女娃”中“<span class="highlight">曰</span>”的意思是？',
    options: ["说", "叫", "是", "认为"], answer: 1,
    explain: '“曰”意为“叫、称为”。名字叫女娃。' },
  { tag: "字词释义", q: '“女娃<span class="highlight">游</span>于东海”中“<span class="highlight">游</span>”的意思是？',
    options: ["游泳", "游玩", "旅游", "游戏"], answer: 1,
    explain: '“游”意为“游玩”。女娃去东海游玩。' },
  { tag: "字词释义", q: '“女娃游<span class="highlight">于</span>东海”中“<span class="highlight">于</span>”的意思是？',
    options: ["对于", "到", "在", "于是"], answer: 2,
    explain: '“于”是介词，意为“在”。女娃在东海游玩。' },
  { tag: "字词释义", q: '“<span class="highlight">溺</span>而不返”中“<span class="highlight">溺</span>”的意思是？',
    options: ["溺爱", "溺水", "沉溺", "沉迷"], answer: 1,
    explain: '“溺”意为“溺水、淹没”。女娃溺水而死。' },
  { tag: "字词释义", q: '“溺<span class="highlight">而</span>不返”中“而”表示什么关系？',
    options: ["转折（却）", "顺承（然后）", "并列（并且）", "因果（因而）"], answer: 1,
    explain: '“而”表顺承，意为“然后”。溺水了然后没能返回（死去）。' },
  { tag: "字词释义", q: '“<span class="highlight">故</span>为精卫”中“<span class="highlight">故</span>”的意思是？',
    options: ["故事", "旧的", "因此", "故乡"], answer: 2,
    explain: '“故”意为“因此、所以”。因此化成了精卫鸟。' },
  { tag: "字词释义", q: '“故<span class="highlight">为</span>精卫”中“<span class="highlight">为</span>”的意思是？',
    options: ["为了", "因为", "成为", "被"], answer: 2,
    explain: '“为”意为“成为”。因此成为精卫鸟。' },
  { tag: "字词释义", q: '“常<span class="highlight">衔</span>西山之木石”中“<span class="highlight">衔</span>”的意思是？',
    options: ["包含", "叼", "衔接", "头衔"], answer: 1,
    explain: '“衔”意为“叼”。精卫鸟经常用嘴叼着西山的树枝和石块。' },
  { tag: "字词释义", q: '“<span class="highlight">以</span>堙于东海”中“<span class="highlight">以</span>”的意思是？',
    options: ["因为", "用来", "认为", "可以"], answer: 1,
    explain: '“以”意为“用来”，表示目的。用来填塞东海。' },
  { tag: "字词释义", q: '“以<span class="highlight">堙(yīn)</span>于东海”中“<span class="highlight">堙(yīn)</span>”的意思是？',
    options: ["淹没", "填塞", "烟囱", "阻拦"], answer: 1,
    explain: '“堙(yīn)”意为“填塞”。精卫鸟叼来木石是为了填平东海。' }
];

const sentenceData = [
  { original: "炎帝之少女，名曰女娃。", notes: [{ word: "之", meaning: "的" }, { word: "少女", meaning: "小女儿" }, { word: "曰", meaning: "叫" }], trans: "炎帝的小女儿，名叫女娃。" },
  { original: "女娃游于东海，溺而不返，", notes: [{ word: "游", meaning: "游玩" }, { word: "于", meaning: "在" }, { word: "溺", meaning: "溺水" }, { word: "而", meaning: "却" }, { word: "返", meaning: "返回" }], trans: "女娃在东海游玩，溺水身亡没能回来，" },
  { original: "故为精卫，常衔西山之木石，", notes: [{ word: "故", meaning: "因此" }, { word: "为", meaning: "成为" }, { word: "衔", meaning: "叼" }], trans: "因此化为精卫鸟，常常叼着西山的树枝和石块，" },
  { original: "以堙于东海。", notes: [{ word: "以", meaning: "用来" }, { word: "堙(yīn)", meaning: "填塞" }], trans: "用来填塞东海。" }
];

const container = document.getElementById('questionsContainer');
const submitBtn = document.getElementById('submitBtn');
const resetBtn = document.getElementById('resetBtn');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const resultPanel = document.getElementById('resultPanel');
const scoreNum = document.getElementById('scoreNum');
const correctCountEl = document.getElementById('correctCount');
const resultStars = document.getElementById('resultStars');
const scoreComment = document.getElementById('scoreComment');
const toast = document.getElementById('toast');
const translationPanel = document.getElementById('translationPanel');
const translationContent = document.getElementById('translationContent');
const STORAGE_PREFIX = 'jingwei_';

let submitted = false;
let shuffles = {};
function shuffleArray(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function generateShuffles() { questions.forEach((_, i) => { shuffles[i] = shuffleArray([0, 1, 2, 3]); }); localStorage.setItem(STORAGE_PREFIX + 'shuffles', JSON.stringify(shuffles)); }
function loadShuffles() { try { const s = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'shuffles')); if (s && Object.keys(s).length === questions.length) { shuffles = s; return; } } catch {} generateShuffles(); }
function renderTranslation() {
  translationContent.innerHTML = '';
  sentenceData.forEach(s => {
    const block = document.createElement('div'); block.className = 'sentence-block';
    const orig = document.createElement('div'); orig.className = 's-line s-line-original'; orig.innerHTML = '<span class="s-label">原文</span>' + s.original; block.appendChild(orig);
    if (s.notes.length > 0) { const notes = document.createElement('div'); notes.className = 's-line s-line-notes'; notes.innerHTML = '<span class="s-label">注释</span>' + s.notes.map(n => '<span class="note-word">【' + n.word + '：' + n.meaning + '】</span>').join(''); block.appendChild(notes); }
    const trans = document.createElement('div'); trans.className = 's-line s-line-trans'; trans.innerHTML = '<span class="s-label">译文</span>' + s.trans; block.appendChild(trans);
    translationContent.appendChild(block);
  });
}
function renderQuestions() {
  container.innerHTML = '';
  questions.forEach((q, i) => {
    const card = document.createElement('div'); card.className = 'q-card'; card.id = 'q-' + i;
    const letters = ['A', 'B', 'C', 'D']; const order = shuffles[i] || [0, 1, 2, 3];
    card.innerHTML = '<div class="q-header"><span class="q-num">' + (i + 1) + '</span><span class="q-tag">' + q.tag + '</span></div><div class="q-text">' + q.q + '</div><div class="opts">' + order.map((oi, di) => '<label data-q="' + i + '" data-opt="' + oi + '" onclick="selectOption(' + i + ', ' + oi + ')"><input type="radio" name="q' + i + '" value="' + oi + '"><span class="opt-letter">' + letters[di] + '</span>' + q.options[oi] + '</label>').join('') + '</div><div class="explanation" id="exp-' + i + '"><span class="result-tag" id="tag-' + i + '"></span><strong>解析：</strong>' + q.explain + '</div>';
    container.appendChild(card);
  });
}
function selectOption(qIdx, optIdx) {
  if (submitted) return;
  document.querySelectorAll('label[data-q="' + qIdx + '"]').forEach(l => l.classList.remove('selected'));
  const label = document.querySelector('label[data-q="' + qIdx + '"][data-opt="' + optIdx + '"]');
  if (label) label.classList.add('selected');
  const answers = getStoredAnswers(); answers[qIdx] = optIdx;
  localStorage.setItem(STORAGE_PREFIX + 'answers', JSON.stringify(answers));
  const done = getAnswered();
  if (!done.includes(qIdx)) { done.push(qIdx); localStorage.setItem(STORAGE_PREFIX + 'done', JSON.stringify(done)); }
  updateProgress(); checkSubmitReady();
}
function getStoredAnswers() { try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'answers')) || {}; } catch { return {}; } }
function getAnswered() { try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'done')) || []; } catch { return []; } }
function restoreFromStorage() {
  const answers = getStoredAnswers(); const answered = getAnswered();
  if (!answered.length) return;
  Object.keys(answers).forEach(k => { const idx = parseInt(k), opt = answers[k]; const label = document.querySelector('label[data-q="' + idx + '"][data-opt="' + opt + '"]'); if (label) { label.classList.add('selected'); const r = label.querySelector('input[type="radio"]'); if (r) r.checked = true; } });
  updateProgress(); checkSubmitReady();
}
function updateProgress() { const done = getAnswered().length; const total = questions.length; progressFill.style.width = Math.min(Math.round((done / total) * 100), 100) + '%'; progressText.textContent = '已答 ' + done + ' / ' + total + ' 题'; }
function checkSubmitReady() { const done = getAnswered().length; const total = questions.length; submitBtn.disabled = done < total; submitBtn.textContent = done === total ? '📋 提交批改' : '📋 提交批改（还差 ' + (total - done) + ' 题）'; }
submitBtn.addEventListener('click', function() {
  if (submitted) return; if (submitBtn.disabled) { showToast('请先完成所有题目再提交'); return; }
  submitted = true; const answers = getStoredAnswers(); let correct = 0;
  questions.forEach((q, i) => { const userAns = answers[i]; const isCorrect = userAns === q.answer; if (isCorrect) correct++;
    const card = document.getElementById('q-' + i); card.classList.add(isCorrect ? 'correct' : 'wrong');
    document.querySelectorAll('label[data-q="' + i + '"]').forEach(l => l.classList.add('disabled'));
    const cl = document.querySelector('label[data-q="' + i + '"][data-opt="' + q.answer + '"]'); if (cl) cl.classList.add('show-correct');
    if (!isCorrect && userAns !== undefined) { const wl = document.querySelector('label[data-q="' + i + '"][data-opt="' + userAns + '"]'); if (wl) wl.classList.add('show-wrong'); }
    const exp = document.getElementById('exp-' + i); exp.classList.add('show');
    const tag = document.getElementById('tag-' + i); tag.className = isCorrect ? 'result-tag correct-tag' : 'result-tag wrong-tag'; tag.textContent = isCorrect ? '✓ 正确' : '✗ 错误';
  });
  resultPanel.classList.add('show'); scoreNum.textContent = correct + '/' + questions.length; correctCountEl.textContent = correct;
  const pct = correct / questions.length; let stars = '', comment = '';
  if (pct >= 0.9) { stars = '⭐⭐⭐⭐⭐'; comment = '🏆 太厉害了！你是古文小达人！'; }
  else if (pct >= 0.75) { stars = '⭐⭐⭐⭐'; comment = '👏 掌握得很不错！继续加油！'; }
  else if (pct >= 0.5) { stars = '⭐⭐⭐'; comment = '💪 基础还可以，再复习一遍课下注释吧。'; }
  else { stars = '⭐⭐'; comment = '📖 建议熟读课文，理解每个字的意思。'; }
  resultStars.textContent = stars; scoreComment.textContent = comment;
  submitBtn.disabled = true; submitBtn.textContent = '✅ 已批改'; submitBtn.classList.add('btn-secondary'); submitBtn.classList.remove('btn-primary');
  renderTranslation(); translationPanel.classList.add('show');
  setTimeout(function() { resultPanel.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 200);
  localStorage.setItem(STORAGE_PREFIX + 'submitted', 'true');
});
resetBtn.addEventListener('click', function() {
  if (submitted && !confirm('重新答题将清除当前成绩，确定吗？')) return;
  submitted = false; ['answers','done','submitted','shuffles'].forEach(function(k) { localStorage.removeItem(STORAGE_PREFIX + k); });
  document.querySelectorAll('.q-card').forEach(function(c) { c.className = 'q-card'; });
  document.querySelectorAll('.opts label').forEach(function(l) { l.className = ''; var r = l.querySelector('input[type="radio"]'); if (r) r.checked = false; });

});
function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); clearTimeout(toast._timer); toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 2000); }
loadShuffles(); renderQuestions();

else { restoreFromStorage(); }
