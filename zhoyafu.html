<script>
const questions = [
  { seg: "文帝之后六年，匈奴大入边。<u>乃</u>以宗正<small>〔宗正〕掌管皇族事务的官员。</small>刘礼为将军，<u>军</u>霸上；祝兹侯<small>〔祝兹侯〕封号。</small>徐厉为将军，军棘门；以河内守亚夫为将军，军细柳：<u>以</u>备胡。" },
  { tag: "字词释义", q: '“<span class="highlight">乃</span>以宗正刘礼为将军”中“<span class="highlight">乃</span>”的意思是？', options: ["于是，就", "才", "竟然", "却"], answer: 0, explain: '“乃”意为“于是、就”。“乃以宗正刘礼为将军”即于是任命宗正刘礼为将军。' },
  { tag: "字词释义", q: '“<span class="highlight">军</span>霸上”中“<span class="highlight">军</span>”的活用和意思是？', options: ["名词作动词，驻军", "军队", "军营", "军事"], answer: 0, explain: '“军”名词作动词，意为“驻军”。“军霸上”即驻军霸上。' },
  { tag: "字词释义", q: '“<span class="highlight">以</span>备胡”中“<span class="highlight">以</span>”的意思是？', options: ["来，用来", "凭借", "因为", "认为"], answer: 0, explain: '“以”意为“来、用来”。“以备胡”即用来防备匈奴。' },
  { seg: "上自<u>劳</u>军。至霸上及棘门军，直驰入，将以<u>下骑</u>送迎。<u>已而</u><u>之</u>细柳军，军士吏<u>被</u>甲，<u>锐兵刃</u>，<u>彀(gòu)</u>弓弩，持满。天子<u>先驱</u>至，不得入。先驱曰：“天子<u>且</u>至！”军门都尉曰：“将军令曰‘军中闻将军令，不闻天子之诏’。”<u>居</u><u>无何</u>，上至，又不得入。" },
  { tag: "字词释义", q: '“上自<span class="highlight">劳</span>军”中“<span class="highlight">劳</span>”的意思是？', options: ["慰劳", "劳动", "劳累", "功劳"], answer: 0, explain: '“劳”意为“慰劳”。“上自劳军”即皇上亲自慰劳军队。' },
  { tag: "字词释义", q: '“将以<span class="highlight">下骑</span>送迎”中“<span class="highlight">下骑</span>”的意思是？', options: ["下马", "骑马的人", "骑兵", "下车"], answer: 0, explain: '“下骑”意为“下马”。“将以下骑送迎”即将军及其部下都下马迎送。' },
  { tag: "字词释义", q: '“<span class="highlight">已而</span>之细柳军”中“<span class="highlight">已而</span>”的意思是？', options: ["不久", "已经", "然后", "很久"], answer: 0, explain: '“已而”意为“不久”。' },
  { tag: "字词释义", q: '“已而<span class="highlight">之</span>细柳军”中“<span class="highlight">之</span>”的意思是？', options: ["到，往", "的", "代词", "取消句子独立性"], answer: 0, explain: '“之”是动词，意为“到、往”。“之细柳军”即到细柳军营。' },
  { tag: "字词释义", q: '“军士吏<span class="highlight">被</span>甲”中“<span class="highlight">被</span>”的意思是？', options: ["同“披”，穿着", "被子", "被动", "背负"], answer: 0, explain: '“被”同“披”，穿着。“军士吏被甲”即官兵都穿着铠甲。' },
  { tag: "字词释义", q: '“<span class="highlight">锐兵刃</span>”中“<span class="highlight">锐</span>”的活用和意思是？', options: ["形容词使动用法，使……锋利（刀出鞘）", "锐利的兵器", "精锐的部队", "兵器锋利"], answer: 0, explain: '“锐”形容词使动用法，“使……锋利”。“锐兵刃”即使刀刃锋利，即刀出鞘。' },
  { tag: "字词释义", q: '“<span class="highlight">彀(gòu)</span>弓弩”中“<span class="highlight">彀</span>”的意思是？', options: ["张开", "弓箭", "弓弦", "拉满"], answer: 0, explain: '“彀”意为“张开”。“彀弓弩”即张开弓弩。' },
  { tag: "字词释义", q: '“天子<span class="highlight">先驱</span>至”中“<span class="highlight">先驱</span>”的意思是？', options: ["先行引导的人员", "先驱者", "先头部队", "前进"], answer: 0, explain: '“先驱”指先行引导的人员。“天子先驱至”即天子的先行引导人员到了营前。' },
  { tag: "字词释义", q: '“天子<span class="highlight">且</span>至”中“<span class="highlight">且</span>”的意思是？', options: ["将要", "并且", "况且", "尚且"], answer: 0, explain: '“且”意为“将要”。“天子且至”即天子即将到来。' },
  { tag: "字词释义", q: '“<span class="highlight">居</span>无何”中“<span class="highlight">居</span>”的意思是？', options: ["经过，过了", "居住", "停留", "占据"], answer: 0, explain: '“居”意为“经过、过了”。“居无何”即过了不久。' },
  { tag: "字词释义", q: '“居<span class="highlight">无何</span>”中“<span class="highlight">无何</span>”的意思是？', options: ["不久", "没有什么", "没有原因", "无论"], answer: 0, explain: '“无何”意为“不久”。“居无何”即过了不久。' },
  { seg: "于是上乃<u>使</u><u>使</u>持节诏将军：“吾欲入劳军。”亚夫<u>乃</u>传言开壁门。壁门士吏<u>谓</u>从属车骑曰：“将军约，军中不得驱驰。”于是天子乃按辔徐行。至营，将军亚夫持兵曰：“<u>介</u>胄之士不拜，请以军礼见。”天子为<u>动</u>，改容<u>式车</u>。使人<u>称谢</u>：“皇帝敬劳将军。”成礼而<u>去</u>。" },
  { tag: "字词释义", q: '“于是上乃<span class="highlight">使</span>使持节诏将军”中第一个“<span class="highlight">使</span>”的意思是？', options: ["派遣", "使者", "使用", "假如"], answer: 0, explain: '第一个“使”是动词，意为“派遣”。' },
  { tag: "字词释义", q: '“于是上乃使<span class="highlight">使</span>持节诏将军”中第二个“<span class="highlight">使</span>”的意思是？', options: ["使者", "派遣", "使用", "使命"], answer: 0, explain: '第二个“使”是名词，意为“使者”。' },
  { tag: "字词释义", q: '“亚夫<span class="highlight">乃</span>传言开壁门”中“<span class="highlight">乃</span>”的意思是？', options: ["才", "于是", "竟然", "却"], answer: 0, explain: '“乃”意为“才”。“亚夫乃传言开壁门”即周亚夫这才传令打开营垒大门。' },
  { tag: "字词释义", q: '“壁门士吏<span class="highlight">谓</span>从属车骑曰”中“<span class="highlight">谓</span>”的意思是？', options: ["告诉，对……说", "认为", "叫做", "称为"], answer: 0, explain: '“谓”意为“告诉、对……说”。' },
  { tag: "字词释义", q: '“<span class="highlight">介</span>胄之士不拜”中“<span class="highlight">介</span>”的活用和意思是？', options: ["名词作动词，穿铠甲", "介绍", "间隔", "铠甲（名词）"], answer: 0, explain: '“介”名词作动词，意为“穿铠甲”。“介胄之士”即穿铠甲戴头盔的将士。' },
  { tag: "字词释义", q: '“天子为<span class="highlight">动</span>”中“<span class="highlight">动</span>”的意思是？', options: ["感动", "行动", "打动", "变动"], answer: 0, explain: '“动”意为“感动”。“天子为动”即天子被他感动（“为”表被动）。' },
  { tag: "字词释义", q: '“改容<span class="highlight">式车</span>”中“<span class="highlight">式</span>”的意思是？', options: ["同“轼”，车前横木，这里指扶轼致敬", "乘车", "车式", "仪式"], answer: 0, explain: '“式”同“轼”，车前横木，这里指扶轼致敬。“改容式车”即表情严肃，扶着车前横木表示敬意。' },
  { tag: "字词释义", q: '“使人<span class="highlight">称谢</span>”中“<span class="highlight">称谢</span>”的意思是？', options: ["致意，告知", "感谢", "称谢（今义）", "谢罪"], answer: 0, explain: '“称谢”意为“致意、告知”，是古今异义词。“使人称谢”即派人向周亚夫致意。' },
  { tag: "字词释义", q: '“成礼而<span class="highlight">去</span>”中“<span class="highlight">去</span>”的意思是？', options: ["离开", "去除", "过去", "前往"], answer: 0, explain: '“去”意为“离开”。“成礼而去”即完成礼仪后离去。' },
  { seg: "<u>既</u>出军门，群臣皆惊。文帝曰：“嗟乎，此真将军矣！<u>曩</u>者霸上、棘门军，<u>若</u>儿戏耳，其将<u>固</u>可袭而虏也。至于亚夫，可得而犯邪！”称善者久<u>之</u>。" },
  { tag: "字词释义", q: '“<span class="highlight">既</span>出军门”中“<span class="highlight">既</span>”的意思是？', options: ["已经，……之后", "既然", "即使", "立即"], answer: 0, explain: '“既”意为“已经”。“既出军门”即出了军营大门之后。' },
  { tag: "字词释义", q: '“<span class="highlight">曩</span>者霸上、棘门军”中“<span class="highlight">曩</span>”的意思是？', options: ["先前，从前", "囊", "曾经", "日后"], answer: 0, explain: '“曩”意为“先前、从前”。“曩者”即先前。' },
  { tag: "字词释义", q: '“<span class="highlight">若</span>儿戏耳”中“<span class="highlight">若</span>”的意思是？', options: ["像，如同", "如果", "你", "假如"], answer: 0, explain: '“若”意为“像、如同”。“若儿戏耳”即就像儿戏一样。' },
  { tag: "字词释义", q: '“其将<span class="highlight">固</span>可袭而虏也”中“<span class="highlight">固</span>”的意思是？', options: ["一定，必", "坚固", "本来", "顽固"], answer: 0, explain: '“固”意为“一定、必”。“其将固可袭而虏也”即那里的将军必定会被袭击而俘获。' },
  { tag: "字词释义", q: '“称善者久<span class="highlight">之</span>”中“<span class="highlight">之</span>”的意思是？', options: ["音节助词，补足音节", "的", "代词", "到"], answer: 0, explain: '“之”是音节助词，用来补足音节。“称善者久之”即称赞了很久。' },
  { tag: "字词释义", q: '下列加点字词类活用类型与“<span class="highlight">军</span>细柳”相同的一项是？', options: ["锐兵刃", "介胄之士不拜", "天子为动", "按辔徐行"], answer: 1, explain: '“军”名词作动词，驻军；“介胄”名词作动词，穿铠甲戴头盔，活用类型相同。A“锐”使动；C 被动句；D 无活用。' },
  { tag: "内容理解", q: '下列对“军中闻将军令，不闻天子之诏”的翻译，准确的一项是？', options: ["军营中听从将军的命令，不听从天子发布的诏令。", "军营里听见将军下令，听不见天子的诏书。", "在军队中只能听闻将军，不能听闻天子。", "将军下令，天子的诏令不起作用。"], answer: 0, explain: '“闻”为听从，“诏”为诏令。A 项翻译准确。' },
  { tag: "内容理解", q: '下列翻译有误的一项是？', options: ["居无何，上至，又不得入：过了不久，皇上驾到，也不能够进入军营。", "将军约，军中不得驱驰：将军规定，军营中不可以策马疾驰。", "介胄之士不拜，请以军礼见：穿戴盔甲的将士不行跪拜礼，请允许我用军礼参见。", "天子为动：天子主动动身。"], answer: 3, explain: '“天子为动”是被动句，意为“天子被他感动”，不是“主动动身”。' },
  { tag: "断句", q: '下列朗读停顿划分正确的一项是？', options: ["已而之细柳 / 军", "军士吏 / 被甲，锐兵 / 刃", "于是上 / 乃使使持节诏将军", "称善者 / 久之"], answer: 3, explain: 'A“细柳军”不可拆；B“锐兵刃”不可拆；C 应在“于是”后停顿；D“称善者/久之”停顿正确。' },
  { tag: "内容理解", q: '文章写霸上、棘门军营的作用是？', options: ["体现三处军营防御力量各有特色", "与细柳营形成对比，突出周亚夫治军严明", "说明刘礼、徐厉两位将军毫无军事才能", "交代匈奴入侵时汉朝全部边防部署"], answer: 1, explain: '霸上、棘门营门大开、直驰而入，与细柳营军纪严明形成对比，突出周亚夫治军严明。' },
  { tag: "内容理解", q: '下列说法不符合文意的一项是？', options: ["细柳营士兵严守军令，即使天子到来也不随意放行", "周亚夫面对汉文帝，坚持行军人礼仪，不卑不亢", "群臣感到吃惊，是因为大家都认为周亚夫应当迎接皇帝", "汉文帝内心不满周亚夫无礼，只是表面称赞他"], answer: 3, explain: '汉文帝赞赏周亚夫（“此真将军矣”），并非“内心不满、表面称赞”。' },
  { tag: "内容理解", q: '下列对周亚夫人物形象的概括，不准确的一项是？', options: ["治军严格，军纪严明", "坚守原则，刚正不阿", "谄媚君主，讨好帝王", "恪尽职守，不卑不亢"], answer: 2, explain: '周亚夫治军严明、刚正不阿、不卑不亢，绝非“谄媚君主”。' },
  { tag: "内容理解", q: '下列关于本文的理解，说法正确的一项是？', options: ["周亚夫拒绝天子直接进军营，是以下犯上、目中无人", "“被”“式”都是文中出现的通假字", "霸上棘门军营守卫森严，外敌难以偷袭", "本文主要通过大量心理描写塑造人物"], answer: 1, explain: '“被”通“披”（穿着），“式”通“轼”（车前横木），都是通假字。B 项正确。' }
];

  { original: "已而之细柳军，军士吏被甲，锐兵刃，彀弓弩，持满。", notes: [{ word: "已而", meaning: "不久" }, { word: "之", meaning: "到，往" }, { word: "被", meaning: "同“披”，穿着" }, { word: "锐", meaning: "使……锋利" }, { word: "彀", meaning: "张开" }], trans: "不久来到细柳军营，只见官兵都穿着铠甲，刀剑出鞘，张开弓弩，拉满弓弦。" },
  { original: "天子先驱至，不得入。先驱曰：“天子且至！”军门都尉曰：“将军令曰‘军中闻将军令，不闻天子之诏’。”", notes: [{ word: "先驱", meaning: "先行引导的人员" }, { word: "且", meaning: "将要" }], trans: "天子的先行引导人员到了营前，无法进入。先行官说：“天子即将到来！”军营的守卫军官说：“将军有令‘军中只听从将军的命令，不听从天子的诏令’。”" },

  { original: "壁门士吏谓从属车骑曰：“将军约，军中不得驱驰。”于是天子乃按辔徐行。", notes: [{ word: "谓", meaning: "告诉，对……说" }], trans: "守卫营门的军官对随从车马队伍说：“将军规定，军营中不可以策马疾驰。”于是天子就控制着缰绳缓慢前行。" },

const container = document.getElementById('questionsContainer');
const submitBtn = document.getElementById('submitBtn');
const resetBtn = document.getElementById('resetBtn');
const progressFill = document.getElementById('progressFill');
const resultPanel = document.getElementById('resultPanel');
const scoreNum = document.getElementById('scoreNum');
const correctCountEl = document.getElementById('correctCount');
const resultStars = document.getElementById('resultStars');
const scoreComment = document.getElementById('scoreComment');
const toast = document.getElementById('toast');
const translationPanel = document.getElementById('translationPanel');
const translationContent = document.getElementById('translationContent');
const STORAGE_PREFIX = 'zhoyafu_';
var TOTAL_Q = questions.filter(function(q){ return !q.seg; }).length;

let submitted = false;
let shuffles = {};
function shuffleArray(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function generateShuffles() { for (var gi = 0; gi < TOTAL_Q; gi++) { shuffles[gi] = shuffleArray([0, 1, 2, 3]); } localStorage.setItem(STORAGE_PREFIX + 'shuffles', JSON.stringify(shuffles)); }
function loadShuffles() { try { const s = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'shuffles')); if (s && Object.keys(s).length === TOTAL_Q) { shuffles = s; return; } } catch {} generateShuffles(); }
function renderTranslation() {
  translationContent.innerHTML = '';
  sentenceData.forEach(s => {
    const block = document.createElement('div'); block.className = 'sentence-block';
    const orig = document.createElement('div'); orig.className = 's-line s-line-original'; orig.innerHTML = '<span class="s-label">原文</span>' + s.original; block.appendChild(orig);
    if (s.notes.length > 0) { const notes = document.createElement('div'); notes.className = 's-line s-line-notes'; notes.innerHTML = '<span class="s-label">注释</span>' + s.notes.map(n => '<span class="note-word">【' + n.word + '：' + n.meaning + '】</span>').join(''); block.appendChild(notes); }
    const trans = document.createElement('div'); trans.className = 's-line s-line-trans'; trans.innerHTML = '<span class="s-label">译文</span>' + s.trans; block.appendChild(trans);
    translationContent.appendChild(block);
  });
}
function renderQuestions() {
  container.innerHTML = '';
  var qi = 0;
  for (var i = 0; i < questions.length; i++) {
    var q = questions[i];
    if (q.seg) {
      var s = document.createElement('div'); s.className = 'seg-orig';
      s.innerHTML = '<strong>原文</strong> ' + q.seg;
      container.appendChild(s);
      continue;
    }
    var card = document.createElement('div'); card.className = 'q-card'; card.id = 'q-' + i;
    var letters = ['A', 'B', 'C', 'D']; var order = shuffles[qi] || [0, 1, 2, 3];
    card.innerHTML = '<div class="q-header"><span class="q-num">' + (qi + 1) + '</span><span class="q-tag">' + q.tag + '</span></div><div class="q-text">' + q.q + '</div><div class="opts">' + order.map(function(oi, di) { return '<label data-q="' + i + '" data-opt="' + oi + '" onclick="selectOption(' + i + ', ' + oi + ')"><input type="radio" name="q' + i + '" value="' + oi + '"><span class="opt-letter">' + letters[di] + '</span>' + q.options[oi] + '</label>'; }).join('') + '</div><div class="explanation" id="exp-' + i + '"><span class="result-tag" id="tag-' + i + '"></span><strong>解析：</strong>' + q.explain + '</div>';
    container.appendChild(card);
    qi++;
  }
}
function selectOption(qIdx, optIdx) {
  if (submitted) return;
  document.querySelectorAll('label[data-q="' + qIdx + '"]').forEach(l => l.classList.remove('selected'));
  const label = document.querySelector('label[data-q="' + qIdx + '"][data-opt="' + optIdx + '"]');
  if (label) label.classList.add('selected');
  const answers = getStoredAnswers(); answers[qIdx] = optIdx;
  localStorage.setItem(STORAGE_PREFIX + 'answers', JSON.stringify(answers));
  const done = getAnswered();
  if (!done.includes(qIdx)) { done.push(qIdx); localStorage.setItem(STORAGE_PREFIX + 'done', JSON.stringify(done)); }
  updateProgress(); checkSubmitReady();
}
function getStoredAnswers() { try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'answers')) || {}; } catch { return {}; } }
function getAnswered() { try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'done')) || []; } catch { return []; } }
function restoreFromStorage() {
  const answers = getStoredAnswers(); const answered = getAnswered();
  if (!answered.length) return;
  Object.keys(answers).forEach(k => { const idx = parseInt(k), opt = answers[k]; const label = document.querySelector('label[data-q="' + idx + '"][data-opt="' + opt + '"]'); if (label) { label.classList.add('selected'); const r = label.querySelector('input[type="radio"]'); if (r) r.checked = true; } });
  updateProgress(); checkSubmitReady();
}
function updateProgress() { const done = getAnswered().length; const total = TOTAL_Q; progressFill.style.width = Math.min(Math.round((done / total) * 100), 100) + '%'; document.getElementById('floatProg').textContent = '已答 ' + done + ' / ' + total + ' 题'; }
function checkSubmitReady() { const done = getAnswered().length; const total = TOTAL_Q; submitBtn.disabled = done < total; submitBtn.textContent = done === total ? '📋 提交批改' : '📋 提交批改（还差 ' + (total - done) + ' 题）'; }
submitBtn.addEventListener('click', function() {
  if (submitted) return; if (submitBtn.disabled) { showToast('请先完成所有题目再提交'); return; }
  submitted = true; const answers = getStoredAnswers(); let correct = 0;
  questions.forEach((q, i) => { if (q.seg) return; const userAns = answers[i]; const isCorrect = userAns === q.answer; if (isCorrect) correct++; else { try { var _wl = JSON.parse(localStorage.getItem('gd_wrong') || '[]'); _wl.push({ paper: '《周亚夫军细柳》', time: new Date().toLocaleString(), tag: q.tag, q: q.q, options: q.options, userAns: userAns, correct: q.answer, explain: q.explain }); localStorage.setItem('gd_wrong', JSON.stringify(_wl)); } catch (e) {} }
    const card = document.getElementById('q-' + i); card.classList.add(isCorrect ? 'correct' : 'wrong');
    document.querySelectorAll('label[data-q="' + i + '"]').forEach(l => l.classList.add('disabled'));
    const cl = document.querySelector('label[data-q="' + i + '"][data-opt="' + q.answer + '"]'); if (cl) cl.classList.add('show-correct');
    if (!isCorrect && userAns !== undefined) { const wl = document.querySelector('label[data-q="' + i + '"][data-opt="' + userAns + '"]'); if (wl) wl.classList.add('show-wrong'); }
    const exp = document.getElementById('exp-' + i); exp.classList.add('show');
    const tag = document.getElementById('tag-' + i); tag.className = isCorrect ? 'result-tag correct-tag' : 'result-tag wrong-tag'; tag.textContent = isCorrect ? '✓ 正确' : '✗ 错误';
  });
  resultPanel.classList.add('show'); scoreNum.textContent = correct + '/' + TOTAL_Q; correctCountEl.textContent = correct;
  const pct = correct / TOTAL_Q; let stars = '', comment = '';
  if (pct >= 0.9) { stars = '⭐⭐⭐⭐⭐'; comment = '🏆 掌握扎实，功底深厚！'; }
  else if (pct >= 0.75) { stars = '⭐⭐⭐⭐'; comment = '👏 掌握得很不错！继续加油！'; }
  else if (pct >= 0.5) { stars = '⭐⭐⭐'; comment = '💪 基础还可以，再复习一遍课下注释吧。'; }
  else { stars = '⭐⭐'; comment = '📖 建议熟读课文，理解每个字的意思。'; }
  resultStars.textContent = stars; scoreComment.textContent = comment;
  submitBtn.disabled = true; submitBtn.textContent = '✅ 已批改'; submitBtn.classList.add('btn-secondary'); submitBtn.classList.remove('btn-primary');
  renderTranslation(); translationPanel.classList.add('show');
  setTimeout(function() { resultPanel.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 200);
  localStorage.setItem(STORAGE_PREFIX + 'submitted', 'true');
  localStorage.removeItem(STORAGE_PREFIX + 'answers');
  localStorage.removeItem(STORAGE_PREFIX + 'done');
  localStorage.removeItem(STORAGE_PREFIX + 'submitted');
});
resetBtn.addEventListener('click', function() {
  if (submitted && !confirm('重新答题将清除当前成绩，确定吗？')) return;
  submitted = false; ['answers','done','submitted','shuffles'].forEach(function(k) { localStorage.removeItem(STORAGE_PREFIX + k); });
  document.querySelectorAll('.q-card').forEach(function(c) { c.className = 'q-card'; });
  document.querySelectorAll('.opts label').forEach(function(l) { l.className = ''; var r = l.querySelector('input[type="radio"]'); if (r) r.checked = false; });
  document.querySelectorAll('.explanation').forEach(function(e) { e.classList.remove('show'); });
  translationPanel.classList.remove('show'); resultPanel.classList.remove('show');
  submitBtn.disabled = true; submitBtn.textContent = '📋 提交批改'; submitBtn.classList.remove('btn-secondary'); submitBtn.classList.add('btn-primary');
  generateShuffles(); renderQuestions(); updateProgress();
  scrollTo({ top: 0, behavior: 'smooth' });
});
function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); clearTimeout(toast._timer); toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 2000); }
