<style>

    .result-panel .score-num { font-size: 42px; }
  }
  @media (min-width: 600px) { body { padding: 20px 0 48px; } .container { padding: 0 20px; } .banner, .sticky-original { border-radius: 0; } }
</style>

<body>

<div class="banner">
  <h1>📖 《王戎不取道旁李》精读自测</h1>

<div class="sticky-original" id="stickyOriginal">
  <strong>原文</strong> 王戎七岁，<u>尝</u><u>与</u><u>诸</u>小儿<u>游</u>。看道边李树多<u>子</u><u>折</u>枝，<u>诸</u>儿<u>竞</u><u>走</u><u>取</u><u>之</u>，<u>唯</u>戎不动。人问<u>之</u>，答<u>曰</u>："树在道边而多子，<u>此</u><u>必</u><u>苦</u>李。"取之，<u>信</u><u>然</u>。

    <p><a href="https://guangdianxiaoshu-bit.github.io/wenyanwen-quiz/" style="color:#c47ca0;text-decoration:none;font-size:12px;">← 返回目录</a></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var questions = [
  { tag: "字词释义", q: '“王戎七岁，<span class="highlight">尝</span>与诸小儿游”中“尝”的意思是？', options: ["品尝", "曾经", "尝试", "常常"], answer: 1, explain: '“尝”意为“曾经”。王戎七岁的时候，曾经和一群小孩一起玩。' },
  { tag: "字词释义", q: '“尝<span class="highlight">与</span>诸小儿游”中“与”的意思是？', options: ["给予", "和", "参与", "与其"], answer: 1, explain: '“与”是介词，意为“和、跟”。' },
  { tag: "字词释义", q: '“尝与<span class="highlight">诸</span>小儿游”中“诸”的意思是？', options: ["各个（众位）", "全部", "几位", "各位（尊称）"], answer: 0, explain: '“诸”意为“众、各”。“诸小儿”即“各位小孩、一群小孩”。“诸位”是现代敬称，与本义不同。' },
  { tag: "字词释义", q: '“看道边李树多<span class="highlight">子</span>折枝”中“子”的意思是？', options: ["儿子", "果实", "种子", "子女"], answer: 1, explain: '“子”在此处指“果实”，即李子。李树上结满了果子。' },
  { tag: "字词释义", q: '“诸儿<span class="highlight">竞</span>走取之”中“竞”的意思是？', options: ["竞争", "争相", "竞赛", "究竟"], answer: 1, explain: '“竞”意为“争相”。其他小孩都争相跑过去摘李子。' },
  { tag: "字词释义", q: '“诸儿竞<span class="highlight">走</span>取之”中“走”的意思是？', options: ["走路", "跑", "散步", "逃走"], answer: 1, explain: '“走”在古文中意为“跑”，是古今异义词。小孩们跑着去摘李子。' },
  { tag: "字词释义", q: '“诸儿竞走取<span class="highlight">之</span>”中“之”指的是什么？', options: ["王戎", "李子", "树枝", "小孩"], answer: 1, explain: '“之”是代词，指代“李子”。小孩们争相跑过去摘李子。' },
  { tag: "字词释义", q: '“<span class="highlight">唯</span>戎不动”中“唯”的意思是？', options: ["唯一", "只有", "但是", "思维"], answer: 1, explain: '“唯”意为“只有”。只有王戎站在原地不动。' },
  { tag: "字词释义", q: '“答<span class="highlight">曰</span>”中“曰”的意思是？', options: ["说", "日", "是", "因为"], answer: 0, explain: '“曰”意为“说”。王戎回答说。' },
  { tag: "字词释义", q: '“<span class="highlight">此</span>必苦李”中“此”的意思是？', options: ["此时", "这", "因此", "彼此"], answer: 1, explain: '“此”意为“这”。这一定是苦李子。' },
  { tag: "字词释义", q: '“此<span class="highlight">必</span>苦李”中“必”的意思是？', options: ["必须", "一定", "必要", "毕竟"], answer: 1, explain: '“必”意为“一定”。这一定是苦李子。' },
  { tag: "内容理解", q: '“取之，<span class="highlight">信然</span>”中“信然”的意思是？', options: ["相信别人", "确实这样", "信以为真", "自然相信"], answer: 1, explain: '“信然”意为“确实这样”。“信”是“确实”，“然”是“这样”。摘下李子一尝，果然像王戎说的那样是苦的。王戎小小年纪就能通过观察推理得出结论，表现了善于观察思考的品质。' }
];

var sentenceData = [
  { original: "王戎七岁，尝与诸小儿游。", notes: [{ word: "尝", meaning: "曾经" }, { word: "与", meaning: "和" }, { word: "诸", meaning: "众、各" }], trans: "王戎七岁的时候，曾经和一群小孩子一起游玩。" },
  { original: "看道边李树多子折枝，", notes: [{ word: "子", meaning: "果实" }], trans: "看见路边李树上结满果实，压弯了树枝，" },
  { original: "诸儿竞走取之，唯戎不动。", notes: [{ word: "竞", meaning: "争相" }, { word: "走", meaning: "跑" }, { word: "之", meaning: "李子" }, { word: "唯", meaning: "只有" }], trans: "其他小孩都争相跑去摘李子，只有王戎没有动。" },
  { original: "人问之，答曰：\"树在道边而多子，此必苦李。\"", notes: [{ word: "曰", meaning: "说" }, { word: "此", meaning: "这" }, { word: "必", meaning: "一定" }], trans: "有人问他，王戎回答说：\"李树长在路边却结满果实，这一定是苦李子。\"" },
  { original: "取之，信然。", notes: [{ word: "信然", meaning: "确实这样" }], trans: "摘来一尝，果然像他说的那样。" }
];

var container = document.getElementById('questionsContainer');
var submitBtn = document.getElementById('submitBtn');
var resetBtn = document.getElementById('resetBtn');
var progressFill = document.getElementById('progressFill');
var progressText = document.getElementById('progressText');
var resultPanel = document.getElementById('resultPanel');
var scoreNum = document.getElementById('scoreNum');
var correctCountEl = document.getElementById('correctCount');
var resultStars = document.getElementById('resultStars');
var scoreComment = document.getElementById('scoreComment');
var toast = document.getElementById('toast');
var translationPanel = document.getElementById('translationPanel');
var translationContent = document.getElementById('translationContent');
var STORAGE_PREFIX = 'wangrong_';

var submitted = false;
var shuffles = {};
function shuffleArray(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function generateShuffles() { for (var i = 0; i < questions.length; i++) { shuffles[i] = shuffleArray([0, 1, 2, 3]); } localStorage.setItem(STORAGE_PREFIX + 'shuffles', JSON.stringify(shuffles)); }
function loadShuffles() { try { var s = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'shuffles')); if (s && Object.keys(s).length === questions.length) { shuffles = s; return; } } catch(e) {} generateShuffles(); }
function renderTranslation() {
  translationContent.innerHTML = '';
  for (var si = 0; si < sentenceData.length; si++) { var s = sentenceData[si];
    var block = document.createElement('div'); block.className = 'sentence-block';
    var orig = document.createElement('div'); orig.className = 's-line s-line-original'; orig.innerHTML = '<span class="s-label">原文</span>' + s.original; block.appendChild(orig);
    if (s.notes.length > 0) { var notes = document.createElement('div'); notes.className = 's-line s-line-notes'; var html = '<span class="s-label">注释</span>'; for (var ni = 0; ni < s.notes.length; ni++) { html += '<span class="note-word">【' + s.notes[ni].word + '：' + s.notes[ni].meaning + '】</span>'; } notes.innerHTML = html; block.appendChild(notes); }
    var trans = document.createElement('div'); trans.className = 's-line s-line-trans'; trans.innerHTML = '<span class="s-label">译文</span>' + s.trans; block.appendChild(trans);
    translationContent.appendChild(block);
  }
}
function renderQuestions() {
  container.innerHTML = '';
  for (var qi = 0; qi < questions.length; qi++) { var q = questions[qi];
    var card = document.createElement('div'); card.className = 'q-card'; card.id = 'q-' + qi;
    var letters = ['A', 'B', 'C', 'D']; var order = shuffles[qi] || [0, 1, 2, 3];
    var optsHtml = '';
    for (var oi = 0; oi < 4; oi++) { var di = order[oi]; optsHtml += '<label data-q="' + qi + '" data-opt="' + di + '" onclick="selectOption(' + qi + ', ' + di + ')"><input type="radio" name="q' + qi + '" value="' + di + '"><span class="opt-letter">' + letters[oi] + '</span>' + q.options[di] + '</label>'; }
    card.innerHTML = '<div class="q-header"><span class="q-num">' + (qi + 1) + '</span><span class="q-tag">' + q.tag + '</span></div><div class="q-text">' + q.q + '</div><div class="opts">' + optsHtml + '</div><div class="explanation" id="exp-' + qi + '"><span class="result-tag" id="tag-' + qi + '"></span><strong>解析：</strong>' + q.explain + '</div>';
    container.appendChild(card);
  }
}
function selectOption(qIdx, optIdx) {
  if (submitted) return;
  var labels = document.querySelectorAll('label[data-q="' + qIdx + '"]'); for (var i = 0; i < labels.length; i++) { labels[i].classList.remove('selected'); }
  var label = document.querySelector('label[data-q="' + qIdx + '"][data-opt="' + optIdx + '"]'); if (label) label.classList.add('selected');
  var answers = getStoredAnswers(); answers[qIdx] = optIdx;
  localStorage.setItem(STORAGE_PREFIX + 'answers', JSON.stringify(answers));
  var done = getAnswered();
  if (done.indexOf(qIdx) === -1) { done.push(qIdx); localStorage.setItem(STORAGE_PREFIX + 'done', JSON.stringify(done)); }
  updateProgress(); checkSubmitReady();
}
function getStoredAnswers() { try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'answers')) || {}; } catch(e) { return {}; } }
function getAnswered() { try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'done')) || []; } catch(e) { return []; } }
function restoreFromStorage() {
  var answers = getStoredAnswers(); var answered = getAnswered();
  if (!answered.length) return;
  var keys = Object.keys(answers);
  for (var ki = 0; ki < keys.length; ki++) { var idx = parseInt(keys[ki]); var opt = answers[keys[ki]]; var label = document.querySelector('label[data-q="' + idx + '"][data-opt="' + opt + '"]'); if (label) { label.classList.add('selected'); var r = label.querySelector('input[type="radio"]'); if (r) r.checked = true; } }
  updateProgress(); checkSubmitReady();
}
function updateProgress() { var done = getAnswered().length; var total = questions.length; progressFill.style.width = Math.min(Math.round((done / total) * 100), 100) + '%'; progressText.textContent = '已答 ' + done + ' / ' + total + ' 题'; }
function checkSubmitReady() { var done = getAnswered().length; var total = questions.length; submitBtn.disabled = done < total; submitBtn.textContent = done === total ? '📋 提交批改' : '📋 提交批改（还差 ' + (total - done) + ' 题）'; }
submitBtn.addEventListener('click', function() {
  if (submitted) return; if (submitBtn.disabled) { showToast('请先完成所有题目再提交'); return; }
  submitted = true; var answers = getStoredAnswers(); var correct = 0;
  for (var i = 0; i < questions.length; i++) { var q = questions[i]; var userAns = answers[i]; var isCorrect = userAns === q.answer; if (isCorrect) correct++;
    var card = document.getElementById('q-' + i); card.classList.add(isCorrect ? 'correct' : 'wrong');
    var labels = document.querySelectorAll('label[data-q="' + i + '"]'); for (var li = 0; li < labels.length; li++) { labels[li].classList.add('disabled'); }
    var cl = document.querySelector('label[data-q="' + i + '"][data-opt="' + q.answer + '"]'); if (cl) cl.classList.add('show-correct');
    if (!isCorrect && userAns !== undefined) { var wl = document.querySelector('label[data-q="' + i + '"][data-opt="' + userAns + '"]'); if (wl) wl.classList.add('show-wrong'); }
    var exp = document.getElementById('exp-' + i); exp.classList.add('show');
    var tag = document.getElementById('tag-' + i); tag.className = isCorrect ? 'result-tag correct-tag' : 'result-tag wrong-tag'; tag.textContent = isCorrect ? '✓ 正确' : '✗ 错误';
  }
  resultPanel.classList.add('show'); scoreNum.textContent = correct + '/' + questions.length; correctCountEl.textContent = correct;
  var pct = correct / questions.length; var stars = ''; var comment = '';
  if (pct >= 0.9) { stars = '⭐⭐⭐⭐⭐'; comment = '🏆 太厉害了！你是古文小达人！'; }
  else if (pct >= 0.75) { stars = '⭐⭐⭐⭐'; comment = '👏 掌握得很不错！继续加油！'; }
  else if (pct >= 0.5) { stars = '⭐⭐⭐'; comment = '💪 基础还可以，再复习一遍课下注释吧。'; }
  else { stars = '⭐⭐'; comment = '📖 建议熟读课文，理解每个字的意思。'; }
  resultStars.textContent = stars; scoreComment.textContent = comment;
  submitBtn.disabled = true; submitBtn.textContent = '✅ 已批改'; submitBtn.classList.add('btn-secondary'); submitBtn.classList.remove('btn-primary');
  renderTranslation(); translationPanel.classList.add('show');
  setTimeout(function() { resultPanel.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 200);
  localStorage.setItem(STORAGE_PREFIX + 'submitted', 'true');
});
resetBtn.addEventListener('click', function() {
  if (submitted && !confirm('重新答题将清除当前成绩，确定吗？')) return;
  submitted = false; ['answers','done','submitted','shuffles'].forEach(function(k) { localStorage.removeItem(STORAGE_PREFIX + k); });
  document.querySelectorAll('.q-card').forEach(function(c) { c.className = 'q-card'; });
  document.querySelectorAll('.opts label').forEach(function(l) { l.className = ''; var r = l.querySelector('input[type="radio"]'); if (r) r.checked = false; });
  document.querySelectorAll('.explanation').forEach(function(e) { e.classList.remove('show'); });
  translationPanel.classList.remove('show'); resultPanel.classList.remove('show');
  submitBtn.disabled = true; submitBtn.textContent = '📋 提交批改'; submitBtn.classList.remove('btn-secondary'); submitBtn.classList.add('btn-primary');
  generateShuffles(); renderQuestions(); updateProgress();
  scrollTo({ top: 0, behavior: 'smooth' });
});
function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); clearTimeout(toast._timer); toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 2000); }
loadShuffles(); renderQuestions();
var wasSubmitted = localStorage.getItem(STORAGE_PREFIX + 'submitted');
if (wasSubmitted === 'true') { setTimeout(function() { submitted = false; submitBtn.click(); }, 100); }
else { restoreFromStorage(); }
</script>
