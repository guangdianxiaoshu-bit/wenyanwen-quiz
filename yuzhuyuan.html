<script>
const questions = [
  { seg: "风烟<u>俱</u><u>净</u>，天山共色。从流飘荡，任意<u>东西</u>。自富阳至桐庐一百<u>许</u>里，奇山异水，天下<u>独</u>绝。" },
  { tag: "字词释义", q: '“风烟<span class="highlight">俱</span><span class="highlight">净</span>”中“<span class="highlight">俱</span>”的意思是？', options: ["全，都", "一起", "工具", "具备"], answer: 0, explain: '“俱”意为“全、都”。“风烟俱净”即烟雾都消散尽净。' },
  { tag: "字词释义", q: '“风烟俱<span class="highlight">净</span>”中“<span class="highlight">净</span>”的意思是？', options: ["消散，散尽", "干净", "纯净", "清净"], answer: 0, explain: '“净”此处指烟雾消散尽净。' },
  { tag: "字词释义", q: '“任意<span class="highlight">东西</span>”中“<span class="highlight">东西</span>”的活用和意思是？', options: ["名词作动词，向东向西漂行", "东边和西边", "物品", "方向"], answer: 0, explain: '“东西”名词作动词，意为“向东向西漂行”。' },
  { tag: "字词释义", q: '“一百<span class="highlight">许</span>里”中“<span class="highlight">许</span>”的意思是？', options: ["左右，约", "允许", "也许", "许多"], answer: 0, explain: '“许”意为“左右、约”。“一百许里”即一百里左右。' },
  { tag: "字词释义", q: '“天下<span class="highlight">独</span>绝”中“<span class="highlight">独</span>”的意思是？', options: ["独一无二", "独自", "唯独", "孤独"], answer: 0, explain: '“独”意为“独一无二”。“天下独绝”即天下独一无二。' },
  { seg: "水皆缥碧，千丈见底。游鱼细石，直视无碍。急湍甚箭，猛浪<u>若</u><u>奔</u>。" },
  { tag: "字词释义", q: '“猛浪<span class="highlight">若</span>奔”中“<span class="highlight">若</span>”的意思是？', options: ["像，如同", "如果", "比得上", "假如"], answer: 0, explain: '“若”意为“像、如同”。凶猛的巨浪像飞奔的骏马。' },
  { tag: "字词释义", q: '“猛浪若<span class="highlight">奔</span>”中“<span class="highlight">奔</span>”的活用和意思是？', options: ["动词作名词，飞奔的马", "奔跑", "奔腾", "飞奔"], answer: 0, explain: '“奔”动词作名词，指飞奔的骏马。' },
  { tag: "修辞手法", q: '“急湍甚箭，猛浪若奔”运用的修辞手法是？', options: ["对偶+比喻", "对偶+夸张", "比喻+拟人", "排比+比喻"], answer: 0, explain: '把急流比作飞箭、巨浪比作奔马，是比喻；两句对仗工整，是对偶。生动写出江水流速迅猛、气势磅礴。' },
  { seg: "<u>夹岸</u>高山，皆生<u>寒树</u>，负势<u>竞</u>上，互相<u>轩邈</u>，争高<u>直指</u>，千百成峰<small>〔千百成峰〕形成千百座山峰</small>。" },
  { tag: "字词释义", q: '“<span class="highlight">夹岸</span>高山”中“<span class="highlight">夹岸</span>”的意思是？', options: ["两岸", "岸边", "夹住江岸", "对岸"], answer: 0, explain: '“夹岸”即“两岸”。' },
  { tag: "字词释义", q: '“皆生<span class="highlight">寒树</span>”中“<span class="highlight">寒树</span>”的意思是？', options: ["耐寒常绿的树，这里指密而绿的树", "寒冷的树", "冬天的树", "枯树"], answer: 0, explain: '“寒树”指耐寒常绿的树，这里形容树木密而绿。' },
  { tag: "字词释义", q: '“负势<span class="highlight">竞</span>上”中“<span class="highlight">竞</span>”的意思是？', options: ["争相", "竟然", "竞争", "比赛"], answer: 0, explain: '“竞”意为“争相”。山峦凭借地势争相向上。' },
  { tag: "字词释义", q: '“互相<span class="highlight">轩邈</span>”中“<span class="highlight">轩邈</span>”的活用和意思是？', options: ["形容词作动词，向高处、远处伸展", "高大", "深远", "轩敞"], answer: 0, explain: '“轩”“邈”形容词作动词，意为“向高处、远处伸展”。' },
  { tag: "字词释义", q: '“争高<span class="highlight">直指</span>”中“<span class="highlight">直指</span>”的意思是？', options: ["笔直地向上，直插云天", "直接指挥", "径直指着", "伸手指挥"], answer: 0, explain: '“直指”意为笔直地向上，直插云天。' },
  { tag: "修辞手法", q: '“负势竞上，互相轩邈，争高直指”运用的修辞手法是？', options: ["拟人", "比喻", "夸张", "对偶"], answer: 0, explain: '赋予山峦“竞上”“轩邈”“争高”的竞争情态，是拟人，生动写出群山高耸、连绵、生机勃勃的特点。' },
  { seg: "泉水激石，泠泠作响；好鸟相鸣，嘤嘤成韵。蝉则千<u>转</u>不<u>穷</u>，猿则百叫无绝。" },
  { tag: "字词释义", q: '“蝉则千<span class="highlight">转</span>不穷”中“<span class="highlight">转</span>”的意思是？', options: ["同“啭”，婉转鸣叫，这里指蝉鸣", "转动", "转变", "转告"], answer: 0, explain: '“转”同“啭”，婉转鸣叫，这里指蝉鸣。' },
  { tag: "字词释义", q: '“蝉则千转不<span class="highlight">穷</span>”中“<span class="highlight">穷</span>”的意思是？', options: ["穷尽", "贫穷", "穷困", "尽头"], answer: 0, explain: '“穷”意为“穷尽”。“千转不穷”即长久不停地鸣叫。' },
  { seg: "鸢飞<u>戾</u>天者，望峰息心；<u>经纶</u>世务者，窥谷忘<u>反</u>。横<u>柯</u><u>上</u>蔽，在昼<u>犹</u>昏；疏条交映，有时见日。" },
  { tag: "字词释义", q: '“鸢飞<span class="highlight">戾</span>天者”中“<span class="highlight">戾</span>”的意思是？', options: ["至，到达", "暴戾", "乖戾", "弯曲"], answer: 0, explain: '“戾”意为“至、到达”。“鸢飞戾天”即鸢鸟飞到天上。' },
  { tag: "字词释义", q: '“<span class="highlight">经纶</span>世务者”中“<span class="highlight">经纶</span>”的意思是？', options: ["筹划、治理", "经营", "丝线", "纺织"], answer: 0, explain: '“经纶”本义整理丝缕，引申为“筹划、治理”。' },
  { tag: "字词释义", q: '“窥谷忘<span class="highlight">反</span>”中“<span class="highlight">反</span>”的意思是？', options: ["同“返”，返回", "反对", "反而", "反叛"], answer: 0, explain: '“反”同“返”，返回。“忘反”即流连忘返。' },
  { tag: "字词释义", q: '“横<span class="highlight">柯</span>上蔽”中“<span class="highlight">柯</span>”的意思是？', options: ["树枝", "斧柄", "树干", "树根"], answer: 0, explain: '“柯”本义斧柄，这里指树枝。“横柯”即横斜的树枝。' },
  { tag: "字词释义", q: '“横柯<span class="highlight">上</span>蔽”中“<span class="highlight">上</span>”的活用和意思是？', options: ["名词作状语，在上方", "向上（动词）", "上面", "上级"], answer: 0, explain: '“上”名词作状语，意为“在上方”。' },
  { tag: "字词释义", q: '“在昼<span class="highlight">犹</span>昏”中“<span class="highlight">犹</span>”的意思是？', options: ["仍然，好像", "犹豫", "尤其", "还要"], answer: 0, explain: '“犹”意为“仍然、好像”。“在昼犹昏”即白天也如同黄昏。' },
  { tag: "内容理解", q: '“鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反”在文中的作用是？', options: ["结构上承上启下，由写景转入抒情议论；内容上抒发热爱自然、淡泊名利、避世归隐的情怀，暗含对追逐名利之人的规劝", "结构上总结全文，内容上点明时间地点", "结构上照应开头，内容上描写景物细节", "结构上引出下文，内容上交代写作缘由"], answer: 0, explain: '结构上承上启下（由写景转入抒情议论）；内容上触景生情，抒发热爱自然、淡泊名利、避世归隐的情怀，也暗含对世俗官场追逐名利之人的规劝。' },
  { tag: "字词释义", q: '下列加点词解释有误的一项是？', options: ["一百<u>许</u>里——左右", "猛浪若<u>奔</u>——奔跑", "互相<u>轩</u>邈——向高处伸展", "窥谷忘<u>反</u>——同“返”，返回"], answer: 1, explain: '“奔”动词作名词，指“飞奔的马”，不是“奔跑”。' },
  { tag: "内容理解", q: '下列最能概括“鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反”所表达思想感情的一项是？', options: ["热爱自然、避世退隐、鄙弃功名利禄", "对山水美景的喜爱与留恋", "对隐居生活的向往", "赞美富春江山水之美"], answer: 0, explain: '这两句由写景转入抒情议论，表达作者热爱自然、避世退隐、鄙弃功名利禄的思想感情。' }
];

const sentenceData = [
  { original: "风烟俱净，天山共色。从流飘荡，任意东西。", notes: [{ word: "俱", meaning: "全，都" }, { word: "净", meaning: "消散，散尽" }, { word: "东西", meaning: "名词作动词，向东向西漂行" }], trans: "风停雾散，天空与山峦同呈青苍之色。（我乘船）随水流飘荡，任凭船儿向东或向西漂行。" },
  { original: "自富阳至桐庐一百许里，奇山异水，天下独绝。", notes: [{ word: "许", meaning: "左右，约" }, { word: "独", meaning: "独一无二" }, { word: "绝", meaning: "绝妙" }], trans: "从富阳到桐庐一百多里，奇山异水，是天下独一无二的景致。" },
  { original: "水皆缥碧，千丈见底。游鱼细石，直视无碍。", notes: [{ word: "缥碧", meaning: "浅青色" }, { word: "直视", meaning: "径直看下去" }, { word: "碍", meaning: "障碍" }], trans: "江水都是浅青色，千丈之深也能见底。游动的鱼和细小的石子，径直看下去毫无障碍。" },
  { original: "急湍甚箭，猛浪若奔。", notes: [{ word: "甚", meaning: "超过，胜过" }, { word: "若", meaning: "像，如同" }, { word: "奔", meaning: "飞奔的马（动词作名词）" }], trans: "湍急的水流比箭还快，凶猛的巨浪如飞奔的骏马。" },
  { original: "夹岸高山，皆生寒树，负势竞上，互相轩邈，争高直指，千百成峰。", notes: [{ word: "夹岸", meaning: "两岸" }, { word: "寒树", meaning: "耐寒常绿的树" }, { word: "竞", meaning: "争相" }, { word: "轩邈", meaning: "向高处、远处伸展（形容词作动词）" }, { word: "直指", meaning: "笔直地向上" }], trans: "两岸高山都生长着密而绿的树，山峦凭借地势争着向上，仿佛都在争着往高处远处伸展，争相比高，直插云天，形成千百座山峰。" },
  { original: "泉水激石，泠泠作响；好鸟相鸣，嘤嘤成韵。", notes: [{ word: "激", meaning: "冲击" }, { word: "泠泠", meaning: "清脆的水声" }, { word: "相鸣", meaning: "互相和鸣" }, { word: "成韵", meaning: "和谐动听" }], trans: "泉水冲击石头，发出清越的声响；美丽的鸟儿相互和鸣，鸣声和谐动听。" },
  { original: "蝉则千转不穷，猿则百叫无绝。", notes: [{ word: "转", meaning: "同“啭”，婉转鸣叫" }, { word: "穷", meaning: "穷尽" }, { word: "绝", meaning: "停止，断绝" }], trans: "蝉长久不停地叫，猿猴的啼叫也持续不断。" },
  { original: "鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反。", notes: [{ word: "戾", meaning: "至，到达" }, { word: "息", meaning: "平息" }, { word: "经纶", meaning: "治理" }, { word: "反", meaning: "同“返”，返回" }], trans: "极力追求名利的人，望见山峰便平息野心；治理国家大事的人，看见山谷就流连忘返。" },
  { original: "横柯上蔽，在昼犹昏；疏条交映，有时见日。", notes: [{ word: "柯", meaning: "树枝" }, { word: "上", meaning: "名词作状语，在上方" }, { word: "犹", meaning: "仍然，好像" }, { word: "交映", meaning: "交错掩映" }], trans: "横斜的树枝在上遮蔽，白天犹如黄昏；稀疏的枝条交错掩映，有时能见到阳光。" }
];

const container = document.getElementById('questionsContainer');
const submitBtn = document.getElementById('submitBtn');
const resetBtn = document.getElementById('resetBtn');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const resultPanel = document.getElementById('resultPanel');
const scoreNum = document.getElementById('scoreNum');
const correctCountEl = document.getElementById('correctCount');
const resultStars = document.getElementById('resultStars');
const scoreComment = document.getElementById('scoreComment');
const toast = document.getElementById('toast');
const translationPanel = document.getElementById('translationPanel');
const translationContent = document.getElementById('translationContent');
const STORAGE_PREFIX = 'yuzhuyuan_';
var TOTAL_Q = questions.filter(function(q){ return !q.seg; }).length;

let submitted = false;
let shuffles = {};
function shuffleArray(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function generateShuffles() { for (var gi = 0; gi < TOTAL_Q; gi++) { shuffles[gi] = shuffleArray([0, 1, 2, 3]); } localStorage.setItem(STORAGE_PREFIX + 'shuffles', JSON.stringify(shuffles)); }
function loadShuffles() { try { const s = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'shuffles')); if (s && Object.keys(s).length === TOTAL_Q) { shuffles = s; return; } } catch {} generateShuffles(); }
function renderTranslation() {
  translationContent.innerHTML = '';
  sentenceData.forEach(s => {
    const block = document.createElement('div'); block.className = 'sentence-block';
    const orig = document.createElement('div'); orig.className = 's-line s-line-original'; orig.innerHTML = '<span class="s-label">原文</span>' + s.original; block.appendChild(orig);
    if (s.notes.length > 0) { const notes = document.createElement('div'); notes.className = 's-line s-line-notes'; notes.innerHTML = '<span class="s-label">注释</span>' + s.notes.map(n => '<span class="note-word">【' + n.word + '：' + n.meaning + '】</span>').join(''); block.appendChild(notes); }
    const trans = document.createElement('div'); trans.className = 's-line s-line-trans'; trans.innerHTML = '<span class="s-label">译文</span>' + s.trans; block.appendChild(trans);
    translationContent.appendChild(block);
  });
}
function renderQuestions() {
  container.innerHTML = '';
  var qi = 0;
  for (var i = 0; i < questions.length; i++) {
    var q = questions[i];
    if (q.seg) {
      var s = document.createElement('div'); s.className = 'seg-orig';
      s.innerHTML = '<strong>原文</strong> ' + q.seg;
      container.appendChild(s);
      continue;
    }
    var card = document.createElement('div'); card.className = 'q-card'; card.id = 'q-' + i;
    var letters = ['A', 'B', 'C', 'D']; var order = shuffles[qi] || [0, 1, 2, 3];
    card.innerHTML = '<div class="q-header"><span class="q-num">' + (qi + 1) + '</span><span class="q-tag">' + q.tag + '</span></div><div class="q-text">' + q.q + '</div><div class="opts">' + order.map(function(oi, di) { return '<label data-q="' + i + '" data-opt="' + oi + '" onclick="selectOption(' + i + ', ' + oi + ')"><input type="radio" name="q' + i + '" value="' + oi + '"><span class="opt-letter">' + letters[di] + '</span>' + q.options[oi] + '</label>'; }).join('') + '</div><div class="explanation" id="exp-' + i + '"><span class="result-tag" id="tag-' + i + '"></span><strong>解析：</strong>' + q.explain + '</div>';
    container.appendChild(card);
    qi++;
  }
}
function selectOption(qIdx, optIdx) {
  if (submitted) return;
  document.querySelectorAll('label[data-q="' + qIdx + '"]').forEach(l => l.classList.remove('selected'));
  const label = document.querySelector('label[data-q="' + qIdx + '"][data-opt="' + optIdx + '"]');
  if (label) label.classList.add('selected');
  const answers = getStoredAnswers(); answers[qIdx] = optIdx;
  localStorage.setItem(STORAGE_PREFIX + 'answers', JSON.stringify(answers));
  const done = getAnswered();
  if (!done.includes(qIdx)) { done.push(qIdx); localStorage.setItem(STORAGE_PREFIX + 'done', JSON.stringify(done)); }
  updateProgress(); checkSubmitReady();
}
function getStoredAnswers() { try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'answers')) || {}; } catch { return {}; } }
function getAnswered() { try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'done')) || []; } catch { return []; } }
function restoreFromStorage() {
  const answers = getStoredAnswers(); const answered = getAnswered();
  if (!answered.length) return;
  Object.keys(answers).forEach(k => { const idx = parseInt(k), opt = answers[k]; const label = document.querySelector('label[data-q="' + idx + '"][data-opt="' + opt + '"]'); if (label) { label.classList.add('selected'); const r = label.querySelector('input[type="radio"]'); if (r) r.checked = true; } });
  updateProgress(); checkSubmitReady();
}
function updateProgress() { const done = getAnswered().length; const total = TOTAL_Q; progressFill.style.width = Math.min(Math.round((done / total) * 100), 100) + '%'; progressText.textContent = '已答 ' + done + ' / ' + total + ' 题'; }
function checkSubmitReady() { const done = getAnswered().length; const total = TOTAL_Q; submitBtn.disabled = done < total; submitBtn.textContent = done === total ? '📋 提交批改' : '📋 提交批改（还差 ' + (total - done) + ' 题）'; }
submitBtn.addEventListener('click', function() {
  if (submitted) return; if (submitBtn.disabled) { showToast('请先完成所有题目再提交'); return; }
  submitted = true; const answers = getStoredAnswers(); let correct = 0;
  questions.forEach((q, i) => { if (q.seg) return; const userAns = answers[i]; const isCorrect = userAns === q.answer; if (isCorrect) correct++; else { try { var _wl = JSON.parse(localStorage.getItem('gd_wrong') || '[]'); _wl.push({ paper: '《与朱元思书》', time: new Date().toLocaleString(), tag: q.tag, q: q.q, options: q.options, userAns: userAns, correct: q.answer, explain: q.explain }); localStorage.setItem('gd_wrong', JSON.stringify(_wl)); } catch (e) {} }
    const card = document.getElementById('q-' + i); card.classList.add(isCorrect ? 'correct' : 'wrong');
    document.querySelectorAll('label[data-q="' + i + '"]').forEach(l => l.classList.add('disabled'));
    const cl = document.querySelector('label[data-q="' + i + '"][data-opt="' + q.answer + '"]'); if (cl) cl.classList.add('show-correct');
    if (!isCorrect && userAns !== undefined) { const wl = document.querySelector('label[data-q="' + i + '"][data-opt="' + userAns + '"]'); if (wl) wl.classList.add('show-wrong'); }
    const exp = document.getElementById('exp-' + i); exp.classList.add('show');
    const tag = document.getElementById('tag-' + i); tag.className = isCorrect ? 'result-tag correct-tag' : 'result-tag wrong-tag'; tag.textContent = isCorrect ? '✓ 正确' : '✗ 错误';
  });
  resultPanel.classList.add('show'); scoreNum.textContent = correct + '/' + TOTAL_Q; correctCountEl.textContent = correct;
  const pct = correct / TOTAL_Q; let stars = '', comment = '';
  if (pct >= 0.9) { stars = '⭐⭐⭐⭐⭐'; comment = '🏆 太厉害了！你是古文小达人！'; }
  else if (pct >= 0.75) { stars = '⭐⭐⭐⭐'; comment = '👏 掌握得很不错！继续加油！'; }
  else if (pct >= 0.5) { stars = '⭐⭐⭐'; comment = '💪 基础还可以，再复习一遍课下注释吧。'; }
  else { stars = '⭐⭐'; comment = '📖 建议熟读课文，理解每个字的意思。'; }
  resultStars.textContent = stars; scoreComment.textContent = comment;
  submitBtn.disabled = true; submitBtn.textContent = '✅ 已批改'; submitBtn.classList.add('btn-secondary'); submitBtn.classList.remove('btn-primary');
  renderTranslation(); translationPanel.classList.add('show');
  setTimeout(function() { resultPanel.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 200);
  localStorage.setItem(STORAGE_PREFIX + 'submitted', 'true');
  localStorage.removeItem(STORAGE_PREFIX + 'answers');
  localStorage.removeItem(STORAGE_PREFIX + 'done');
  localStorage.removeItem(STORAGE_PREFIX + 'submitted');
});
resetBtn.addEventListener('click', function() {
  if (submitted && !confirm('重新答题将清除当前成绩，确定吗？')) return;
  submitted = false; ['answers','done','submitted','shuffles'].forEach(function(k) { localStorage.removeItem(STORAGE_PREFIX + k); });
  document.querySelectorAll('.q-card').forEach(function(c) { c.className = 'q-card'; });
  document.querySelectorAll('.opts label').forEach(function(l) { l.className = ''; var r = l.querySelector('input[type="radio"]'); if (r) r.checked = false; });
  document.querySelectorAll('.explanation').forEach(function(e) { e.classList.remove('show'); });
  translationPanel.classList.remove('show'); resultPanel.classList.remove('show');
  submitBtn.disabled = true; submitBtn.textContent = '📋 提交批改'; submitBtn.classList.remove('btn-secondary'); submitBtn.classList.add('btn-primary');
  generateShuffles(); renderQuestions(); updateProgress();
  scrollTo({ top: 0, behavior: 'smooth' });
});
function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); clearTimeout(toast._timer); toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 2000); }
generateShuffles(); renderQuestions();
</script>
</body>
</html>
