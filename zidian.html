<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>文言实词活字典 · 光点小塾</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#f0f7fc; color:#333; padding-bottom:30px; }
  .banner { background:linear-gradient(135deg,#1a6fb5,#3d8fd1); color:#fff; padding:18px 16px 14px; text-align:center; }
  .banner h1 { font-size:20px; margin-bottom:4px; }
  .banner p { font-size:12px; opacity:.85; }
  .search-bar { position:sticky; top:0; z-index:50; background:#f0f7fc; padding:10px 14px 6px; }
  .search-bar input { width:100%; padding:10px 14px; border:1px solid #cfe3f2; border-radius:20px; font-size:14px; outline:none; background:#fff; }
  .stat { text-align:center; font-size:12px; color:#5a7a94; padding:2px 0 10px; }
  .word-card { background:#fff; margin:0 12px 12px; border-radius:12px; padding:12px 14px; box-shadow:0 1px 4px rgba(26,111,181,.08); }
  .word-head { font-size:20px; font-weight:700; color:#1a6fb5; margin-bottom:6px; }
  .yi-item { padding:6px 0; border-bottom:1px dashed #e8f1f8; }
  .yi-item:last-child { border-bottom:none; }
  .yi-text { font-size:15px; color:#333; line-height:1.6; }
  .yi-ex { font-size:12px; color:#6d8aa0; line-height:1.7; margin-top:3px; }
  .src-tag { display:inline-block; font-size:10px; background:#eaf4fb; color:#5a8db8; border-radius:4px; padding:1px 5px; margin-left:6px; vertical-align:middle; }
  .no-result { text-align:center; color:#8aa4b8; padding:40px 0; font-size:14px; }
  .footer { text-align:center; font-size:12px; color:#8aa4b8; padding:14px; }
  .footer a { color:#1a6fb5; text-decoration:none; }
</style>
</head>
<body>
<div class="banner">
  <h1>📖 文言实词活字典</h1>
  <p>光点小塾 · 持续更新的实词义项库（考纲 150 实词 + 课内外篇目考点）</p>
</div>
<div class="search-bar"><input id=s type=text placeholder="🔍 搜词 / 义项 / 例句 / 出处…" oninput=f()></div>
<div class="stat" id=stat></div>
<div id=list></div>
<div class="no-result" id=empty style="display:none">没有找到相关词条</div>
<div class="footer"><a href="index.html">📚 返回首页</a> · 光点小塾 · 专注语文学习轻量化、日常化</div>
<script src="dict_data.js"></script>
<script>
var words = Object.keys(DICT).sort(function(a,b){return a.localeCompare(b,'zh')});
function fmtEx(e){ return e.replace(/——自测题库·《[^》]*》$/,''); }
function render(list){
  var html=''; var n=0;
  list.forEach(function(w){
    var items=DICT[w];
    html+='<div class="word-card"><div class="word-head">'+w+'</div>';
    items.forEach(function(it){
      html+='<div class="yi-item"><div class="yi-text">'+it['义']+'<span class="src-tag">'+(it.src||'')+'</span></div>';
      (it['例']||[]).forEach(function(e){ html+='<div class="yi-ex">'+fmtEx(e)+'</div>'; });
      html+='</div>';
    });
    html+='</div>'; n++;
  });
  document.getElementById('list').innerHTML=html;
  document.getElementById('empty').style.display=n?'none':'block';
}
function f(){
  var q=document.getElementById('s').value.trim();
  if(!q){ render(words); document.getElementById('stat').textContent='共 '+words.length+' 词 · '+Object.keys(DICT).reduce(function(a,w){return a+DICT[w].length},0)+' 义项'; return; }
  var hit=words.filter(function(w){
    if(w.indexOf(q)>=0) return true;
    return DICT[w].some(function(it){
      if((it['义']||'').indexOf(q)>=0) return true;
      return (it['例']||[]).some(function(e){ return e.indexOf(q)>=0; });
    });
  });
  render(hit);
  document.getElementById('stat').textContent='找到 '+hit.length+' 词';
}
var totalYi = Object.keys(DICT).reduce(function(a,w){return a+DICT[w].length},0);
render(words);
document.getElementById('stat').textContent='共 '+words.length+' 词 · '+totalYi+' 义项';
</script>
</body>
</html>
