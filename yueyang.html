// ⑤ 题目数组：长文先写 { seg: "本段原文" } 再紧跟本段题目（考点 <u>黄底</u>；注释词 <span class="jz" data-tip="词：注释">词</span>；seg 内属性必须单引号！）
const questions = [
  { seg: "<span class='jz' data-tip='庆历四年：1044 年。庆历，宋仁宗赵祯的年号；本文写于庆历六年（1046）'>庆历四年</span>春，滕子京<u>谪</u>守巴陵郡。<u>越明年</u>，<span class='jz' data-tip='政通人和：政事顺利，百姓和乐'>政通人和</span>，百废<u>具</u>兴，<u>乃</u>重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上，<u>属</u>予<u>作文</u><u>以</u>记之。" },
  { tag: "字词释义", q: '“滕子京<span class="highlight">谪</span>守巴陵郡”中“<span class="highlight">谪</span>”的意思是？', options: ["贬官", "流放", "责备", "指责"], answer: 0, explain: '“谪”意为贬官。“滕子京谪守巴陵郡”即滕子京被贬官到巴陵郡做太守。' },
  { tag: "古今异义", q: '“<span class="highlight">越明年</span>”中“<span class="highlight">明年</span>”在文中的意思是？', options: ["第二年", "今年的下一年", "来年", "以后"], answer: 0, explain: '“明年”古义为第二年，今义为今年的下一年。“越明年”即到了第二年。' },
  { tag: "字词释义", q: '“百废<span class="highlight">具</span>兴”中“<span class="highlight">具</span>”的意思是？', options: ["全，都", "具体", "具备", "准备"], answer: 0, explain: '“具”同“俱”，全、都。“百废具兴”即各种荒废的事业都兴办起来。' },
  { tag: "字词释义", q: '“<span class="highlight">乃</span>重修岳阳楼”中“<span class="highlight">乃</span>”的意思是？', options: ["于是", "竟然", "才", "却"], answer: 0, explain: '“乃”意为于是。“乃重修岳阳楼”即于是重新修建岳阳楼。' },
  { tag: "字词释义", q: '“<span class="highlight">属</span>予作文以记之”中“<span class="highlight">属</span>”的意思是？', options: ["嘱托", "属于", "归属", "连接"], answer: 0, explain: '“属”同“嘱”，嘱托。“属予作文以记之”即嘱托我写一篇文章来记述这件事。' },
  { tag: "古今异义", q: '“属予<span class="highlight">作文</span>以记之”中“<span class="highlight">作文</span>”在文中的意思是？', options: ["写文章", "习作", "文章", "作品"], answer: 0, explain: '“作文”古义为写文章，今义为学生习作。“属予作文”即嘱托我写文章。' },
  { tag: "字词释义", q: '“作文<span class="highlight">以</span>记之”中“<span class="highlight">以</span>”的意思是？', options: ["来，表目的", "用", "因为", "按照"], answer: 0, explain: '“以”表目的，来。“以记之”即用来记述这件事。' },
  { seg: "予观<u>夫</u>巴陵<u>胜</u>状，在洞庭一湖。<u>衔</u>远山，吞长江，浩浩<u>汤汤</u>，横无际涯，朝晖夕阴，气象万千，此则岳阳楼之<u>大观</u>也，前人之述<u>备</u>矣。然则北通巫峡，南极<span class='jz' data-tip='潇湘：潇水、湘水。潇水是湘水的支流，湘水流入洞庭湖'>潇湘</span>，迁客<span class='jz' data-tip='骚人：战国时屈原作《离骚》，故称屈原或《楚辞》作者为“骚人”，后泛指文人'>骚人</span>，多会于此，览物之情，<u>得无</u>异乎？" },
  { tag: "字词释义", q: '“予观<span class="highlight">夫</span>巴陵胜状”中“<span class="highlight">夫</span>”的意思是？', options: ["那", "大丈夫", "语气词", "并且"], answer: 0, explain: '“夫”是指示代词，那。“观夫巴陵胜状”即看那巴陵的美好景色。' },
  { tag: "字词释义", q: '“巴陵<span class="highlight">胜</span>状”中“<span class="highlight">胜</span>”的意思是？', options: ["美好", "胜利", "超过", "名胜"], answer: 0, explain: '“胜”意为美好。“胜状”即美好的景色。' },
  { tag: "字词释义", q: '“<span class="highlight">衔</span>远山”中“<span class="highlight">衔</span>”的意思是？', options: ["连接", "用嘴叼", "包含", "仰望"], answer: 0, explain: '“衔”意为连接（拟人）。 “衔远山”即（洞庭湖）连接着远处的山。' },
  { tag: "字词释义", q: '“浩浩<span class="highlight">汤汤</span>”中“<span class="highlight">汤汤</span>”的意思是？', options: ["水势大", "热水", "汤水", "翻腾"], answer: 0, explain: '“汤汤”读 shāng shāng，意为水势浩大。' },
  { tag: "字词释义", q: '“此则岳阳楼之<span class="highlight">大观</span>也”中“<span class="highlight">大观</span>”的意思是？', options: ["雄伟景象", "伟大观点", "大规模", "观赏"], answer: 0, explain: '“大观”意为雄伟景象。“岳阳楼之大观”即岳阳楼的雄伟景象。' },
  { tag: "字词释义", q: '“前人之述<span class="highlight">备</span>矣”中“<span class="highlight">备</span>”的意思是？', options: ["详尽", "准备", "具备", "防备"], answer: 0, explain: '“备”意为详尽、完备。“前人之述备矣”即前人的记述已经很详尽了。' },
  { tag: "字词释义", q: '“览物之情，<span class="highlight">得无</span>异乎”中“<span class="highlight">得无</span>”的意思是？', options: ["恐怕，表推测", "得到", "没有", "难道"], answer: 0, explain: '“得无”表推测，恐怕、莫非。“得无异乎”即恐怕会有所不同吧。' },
  { seg: "<u>若夫</u><u>淫</u>雨<span class='jz' data-tip='霏霏：雨雪纷纷而下的样子'>霏霏</span>，连月不开，阴风怒号，浊浪<u>排</u>空，日星隐曜，山岳潜形，商旅<u>不行</u>，<span class='jz' data-tip='樯倾楫摧：桅杆倒下，船桨折断。倾，倒下；摧，折断'>樯倾楫摧</span>，薄暮<span class='jz' data-tip='冥冥：昏暗'>冥冥</span>，虎啸猿啼。登斯楼也，则有<u>去国</u>怀乡，<span class='jz' data-tip='忧谗畏讥：担心被说坏话，惧怕被批评指责'>忧谗畏讥</span>，满目<u>萧然</u>，感极而悲者矣。" },
  { tag: "字词释义", q: '“<span class="highlight">若夫</span>淫雨霏霏”中“<span class="highlight">若夫</span>”的意思是？', options: ["像那", "如果", "假若", "丈夫"], answer: 0, explain: '“若夫”是发语词，像那，用来引起下文。“若夫淫雨霏霏”即像那连绵的雨纷纷而下。' },
  { tag: "字词释义", q: '“<span class="highlight">淫</span>雨霏霏”中“<span class="highlight">淫</span>”的意思是？', options: ["连绵", "淫荡", "暴雨", "狂风"], answer: 0, explain: '“淫”意为连绵不断。“淫雨”即连绵不断的雨。' },
  { tag: "字词释义", q: '“浊浪<span class="highlight">排</span>空”中“<span class="highlight">排</span>”的意思是？', options: ["冲击", "排列", "排除", "推开"], answer: 0, explain: '“排”意为冲击。“浊浪排空”即浑浊的波浪冲向天空。' },
  { tag: "古今异义", q: '“商旅<span class="highlight">不行</span>”中“<span class="highlight">不行</span>”在文中的意思是？', options: ["不能通行", "不走路", "不可以", "不执行"], answer: 0, explain: '“不行”古义为不能通行，今义为不可以。“商旅不行”即商人和旅客无法通行。' },
  { tag: "字词释义", q: '“则有<span class="highlight">去国</span>怀乡”中“<span class="highlight">去国</span>”的意思是？', options: ["离开国都", "离开国家", "去国外", "前往国都"], answer: 0, explain: '“去”意为离开，“国”意为国都（京城）。“去国”即离开国都。' },
  { tag: "字词释义", q: '“满目<span class="highlight">萧然</span>”中“<span class="highlight">萧然</span>”的意思是？', options: ["萧条", "肃然", "欢快", "静谧"], answer: 0, explain: '“萧然”意为萧条冷落的样子。“满目萧然”即眼前尽是萧条的景象。' },
  { seg: "<u>至若</u>春和<u>景</u>明，波澜不惊，上下天光，一碧万顷，沙鸥翔<u>集</u>，锦鳞<u>游泳</u>，<span class='jz' data-tip='岸芷汀兰：岸上与小洲上的花草。芷，白芷；汀，小洲'>岸芷汀兰</span>，郁郁青青。而或长烟<u>一</u>空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何<u>极</u>！登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。" },
  { tag: "字词释义", q: '“<span class="highlight">至若</span>春和景明”中“<span class="highlight">至若</span>”的意思是？', options: ["至于", "如果", "甚至", "到了"], answer: 0, explain: '“至若”意为至于，用来转换话题。“至若春和景明”即至于春风和煦、阳光明媚时。' },
  { tag: "字词释义", q: '“春和<span class="highlight">景</span>明”中“<span class="highlight">景</span>”的意思是？', options: ["日光", "景色", "景物", "风景"], answer: 0, explain: '“景”古义为日光，今义为景色。“春和景明”即春风和煦、阳光明媚。' },
  { tag: "字词释义", q: '“沙鸥翔<span class="highlight">集</span>”中“<span class="highlight">集</span>”的意思是？', options: ["停息", "集合", "集中", "集市"], answer: 0, explain: '“集”意为停息。“沙鸥翔集”即沙洲上的鸥鸟时而飞翔时而停歇。' },
  { tag: "古今异义", q: '“锦鳞<span class="highlight">游泳</span>”中“<span class="highlight">游泳</span>”在文中的意思是？', options: ["游动", "游泳运动", "浮沉", "嬉戏"], answer: 0, explain: '“游泳”古义为游动，今义为体育运动。“锦鳞游泳”即美丽的鱼儿在水中游来游去。' },
  { tag: "字词释义", q: '“长烟<span class="highlight">一</span>空”中“<span class="highlight">一</span>”的意思是？', options: ["全，都", "数目一", "一旦", "统一"], answer: 0, explain: '“一”意为全、都。“长烟一空”即大片烟雾完全消散。' },
  { tag: "字词释义", q: '“此乐何<span class="highlight">极</span>”中“<span class="highlight">极</span>”的意思是？', options: ["穷尽", "极点", "极力", "达到"], answer: 0, explain: '“极”意为穷尽。“此乐何极”即这种乐趣哪有穷尽。' },
  { seg: "嗟夫！予<u>尝</u>求<span class='jz' data-tip='古仁人：古代品德高尚的人'>古仁人</span>之心，或<u>异</u>二者之为，何哉？不<u>以</u>物喜，不以己悲，居<u>庙堂</u>之高则忧其民，处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰“先天下之忧而忧，后天下之乐而乐”乎！噫！<u>微</u>斯人，吾谁与<u>归</u>？时六年九月十五日。" },
  { tag: "字词释义", q: '“予<span class="highlight">尝</span>求古仁人之心”中“<span class="highlight">尝</span>”的意思是？', options: ["曾经", "品尝", "尝试", "经历"], answer: 0, explain: '“尝”意为曾经。“予尝求”即我曾经探求。' },
  { tag: "字词释义", q: '“或<span class="highlight">异</span>二者之为”中“<span class="highlight">异</span>”的意思是？', options: ["不同于", "奇异", "差异", "奇怪"], answer: 0, explain: '“异”意为不同于。“或异二者之为”即或许不同于以上两种心情。' },
  { tag: "字词释义", q: '“不<span class="highlight">以</span>物喜”中“<span class="highlight">以</span>”的意思是？', options: ["因为", "用", "凭借", "来"], answer: 0, explain: '“以”意为因为。“不以物喜”即不因外物好坏而或喜或悲。' },
  { tag: "字词释义", q: '“居<span class="highlight">庙堂</span>之高”中“<span class="highlight">庙堂</span>”的意思是？', options: ["朝廷", "庙宇", "殿堂", "祠堂"], answer: 0, explain: '“庙堂”古义为朝廷。“居庙堂之高”即在朝廷做官。' },
  { tag: "字词释义", q: '“<span class="highlight">微</span>斯人”中“<span class="highlight">微</span>”的意思是？', options: ["如果没有", "微小", "轻微", "微妙"], answer: 0, explain: '“微”意为如果没有。“微斯人”即如果没有这种人。' },
  { tag: "字词释义", q: '“吾谁与<span class="highlight">归</span>”中“<span class="highlight">归</span>”的意思是？', options: ["归依", "归来", "归还", "归属"], answer: 0, explain: '“归”意为归依。“吾谁与归”即我同谁一道呢。' },
  { tag: "句式", q: '下面对文言句式判断错误的一项是？', options: ["“此则岳阳楼之大观也”为判断句", "“居庙堂之高则忧其民”是定语后置句", "“吾谁与归”属于宾语前置句", "“不以物喜，不以己悲”是被动句"], answer: 3, explain: 'D 判断错误。“不以物喜，不以己悲”是互文（不因外物好坏和自己得失而或喜或悲），不是被动句。其余三项判断均正确。' },
  { tag: "词类活用", q: '下面词类活用分析正确的一项是？', options: ["“百废具兴”中“废”，动词，废弃", "“先天下之忧而忧”中“先”，名词作状语，在……之前", "“后天下之乐而乐”中“后”，名词，后面", "“长烟一空”中“空”，名词，天空"], answer: 1, explain: 'B 分析正确。“先”名词作状语，在……之前。A“废”是形容词作名词（荒废的事业）；C“后”名词作状语，在……之后；D“空”形容词作动词（消散）。' },
  { tag: "内容理解", q: '下列对迁客骚人的览物之情，理解正确的一项是？', options: ["迁客骚人能够做到不以物喜，不以己悲", "阴雨萧条之景触发迁客骚人喜悦舒畅的心情", "迁客骚人悲喜随景物变化，“以物喜，以己悲”", "迁客骚人胸怀远大，心系天下百姓安危"], answer: 2, explain: 'C 理解正确。迁客骚人的心情随阴晴景色变化而或悲或喜（以物喜，以己悲），这正是古仁人与之不同的地方。' },
  { tag: "内容理解", q: '下列对文章内容与艺术分析有误的一项是？', options: ["文章以“记”为名，大量议论，借写景抒发政治理想", "“微斯人，吾谁与归”既赞美古仁人，也暗含劝勉滕子京", "“先天下之忧而忧，后天下之乐而乐”体现古仁人超脱个人得失，心怀天下", "古仁人“进亦忧，退亦忧”，是指做官就忧愁，不做官就不再忧愁"], answer: 3, explain: 'D 有误。“进亦忧，退亦忧”是指无论做官（进）还是退隐（退）都心怀天下而忧虑，并非“不做官就不再忧愁”。' },
  { tag: "内容理解", q: '下面对全文理解表述错误的一项是？', options: ["文中写阴晴两种景色，用来对比迁客骚人两种不同心境", "作者实地游览岳阳楼，目睹洞庭风光写下本篇文章", "“衔远山，吞长江”的“衔”“吞”用拟人，写出洞庭湖气势宏大", "古仁人的境界高于迁客骚人，是作者推崇的理想人格"], answer: 1, explain: 'B 错误。范仲淹并未亲临岳阳楼，本文是他应滕子京之请、依据《洞庭晚秋图》等写成的。' },
  { tag: "翻译", q: '对“微斯人，吾谁与归”翻译正确的一项是？', options: ["如果没有这样的人，我同谁一道呢？", "如果没有这种人，我和谁一起回来？", "微小的人，我和谁一起回去？", "如果没有这个人，我同谁归还呢？"], answer: 0, explain: '“微”意为如果没有，“吾谁与归”是宾语前置（吾与谁归）。A 翻译准确。B 误译“归”为回来；C 误译“微”为微小；D 误译“归”为归还。' },
  { tag: "翻译", q: '对“先天下之忧而忧，后天下之乐而乐”翻译正确的一项是？', options: ["在天下人忧愁之前先忧愁，在天下人快乐之后才快乐", "先为天下人担忧，后为天下人高兴", "天下人忧愁之前就忧愁，天下人快乐之后就快乐", "在天下之前忧愁，在天下之后快乐"], answer: 0, explain: '“先”“后”都是名词作状语（在……之前、在……之后）。A 翻译准确。C 漏掉“先”“后”作状语的含义；B、D 语序不当。' },
  { tag: "句式", q: '【联动七八年级】下列句子中属于状语后置（介宾短语后置）的一项是？', options: ["刻唐贤今人诗赋于其上", "其印为余群从所得", "马之千里者", "何陋之有"], answer: 0, explain: 'A 是状语后置，“于其上”后置（于其上刻诗赋）。B 是被动句（为……所，选自《活板》）；C 是定语后置（选自《马说》）；D 是宾语前置（何陋之有=有何陋，选自《陋室铭》）。' },
  { tag: "词类活用", q: '【联动七八年级】下列句中加点字的用法与其他三项不同的一项是？', options: ["北通巫峡中“北”", "斗折蛇行中“斗”", "其一犬坐于前中“犬”", "策之不以其道中“策”"], answer: 3, explain: 'A“北”（选自本文）名词作状语，向北；B“斗”（选自《小石潭记》）名词作状语，像北斗星那样；C“犬”（选自《狼》）名词作状语，像狗一样；D“策”（选自《马说》）名词作动词，用马鞭驱赶。故选 D。' }
];

// ⑥ 逐句精读（original 原文 / notes 注释 / trans 直译，每段一条）
const sentenceData = [
  { original: "庆历四年春，滕子京谪守巴陵郡。越明年，政通人和，百废具兴，乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上，属予作文以记之。", notes: [{ word: "谪", meaning: "贬官" }, { word: "明年", meaning: "第二年" }, { word: "具", meaning: "同“俱”，全，都" }, { word: "乃", meaning: "于是" }, { word: "属", meaning: "同“嘱”，嘱托" }, { word: "作文", meaning: "写文章" }, { word: "以", meaning: "来，表目的" }], trans: "庆历四年的春天，滕子京被贬官到巴陵郡做太守。到了第二年，政事顺利，百姓和乐，各种荒废的事业都兴办起来了，于是重新修建岳阳楼，扩大它原有的规模，把唐代名家和当代人的诗赋刻在上面，嘱托我写一篇文章来记述这件事。" },
  { original: "予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯，朝晖夕阴，气象万千，此则岳阳楼之大观也，前人之述备矣。然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？", notes: [{ word: "夫", meaning: "那" }, { word: "胜", meaning: "美好" }, { word: "衔", meaning: "连接" }, { word: "汤汤", meaning: "水势浩大" }, { word: "大观", meaning: "雄伟景象" }, { word: "备", meaning: "详尽" }, { word: "得无", meaning: "恐怕，表推测" }], trans: "我看那巴陵郡的美好景色，全在洞庭湖上。它连接着远处的山，吞吐长江的水流，浩浩荡荡，无边无际，早晚阴晴变化，景象千变万化，这就是岳阳楼的壮丽景象，前人的记述已经很详尽了。虽然如此，那么向北通到巫峡，向南直到潇水和湘水，被贬谪的官吏和诗人，大多在这里聚会，他们观赏自然景物而触发的感情，恐怕会有所不同吧？" },
  { original: "若夫淫雨霏霏，连月不开，阴风怒号，浊浪排空，日星隐曜，山岳潜形，商旅不行，樯倾楫摧，薄暮冥冥，虎啸猿啼。登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。", notes: [{ word: "若夫", meaning: "像那" }, { word: "淫", meaning: "连绵" }, { word: "排", meaning: "冲击" }, { word: "不行", meaning: "不能通行" }, { word: "去国", meaning: "离开国都" }, { word: "萧然", meaning: "萧条的样子" }], trans: "像那连绵细雨纷纷而下、整月不放晴的时候，阴冷的风怒吼着，浑浊的波浪冲向天空，太阳和星星隐藏起光辉，山岳隐没了形体，商人和旅客无法通行，桅杆倒下，船桨折断，傍晚天色昏暗，虎在长啸，猿在悲啼。这时登上这座楼，就会产生被贬离京、怀念家乡，担心人家说坏话、惧怕人家批评指责的情绪，眼前尽是萧条的景象，感慨到了极点而悲伤不已。" },
  { original: "至若春和景明，波澜不惊，上下天光，一碧万顷，沙鸥翔集，锦鳞游泳，岸芷汀兰，郁郁青青。而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。", notes: [{ word: "至若", meaning: "至于" }, { word: "景", meaning: "日光" }, { word: "集", meaning: "停息" }, { word: "游泳", meaning: "游动" }, { word: "一", meaning: "全，都" }, { word: "极", meaning: "穷尽" }], trans: "至于春风和煦、阳光明媚时，湖面平静，没有惊涛骇浪，天色湖光相接，一片碧绿，广阔无际，沙洲上的鸥鸟时而飞翔时而停歇，美丽的鱼儿在水中游来游去，岸上的香草和小洲上的兰花，草木茂盛，青翠欲滴。有时大片烟雾完全消散，皎洁的月光一泻千里，波动的光闪着金色，静静的月影像沉入水中的玉璧，渔夫的歌声在互相应答，这种乐趣哪有穷尽！这时登上这座楼，就会感到心胸开阔、心情愉快，荣耀和屈辱一并忘了，端着酒杯，吹着微风，那真是快乐高兴极了。" },
  { original: "嗟夫！予尝求古仁人之心，或异二者之为，何哉？不以物喜，不以己悲，居庙堂之高则忧其民，处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰“先天下之忧而忧，后天下之乐而乐”乎！噫！微斯人，吾谁与归？时六年九月十五日。", notes: [{ word: "尝", meaning: "曾经" }, { word: "异", meaning: "不同于" }, { word: "以", meaning: "因为" }, { word: "庙堂", meaning: "朝廷" }, { word: "微", meaning: "如果没有" }, { word: "归", meaning: "归依" }], trans: "唉！我曾经探求古时品德高尚的人的思想感情，他们或许不同于以上两种心情，这是为什么呢？（是因为他们）不因外物好坏和自己得失而或喜或悲，在朝廷做官就为百姓忧虑，被贬到边远地区就为君主忧虑。这样看来，在朝为官也忧虑，在野为民也忧虑，那么他们什么时候才会快乐呢？他们一定会说“在天下人忧之前先忧，在天下人乐之后才乐”吧！唉！如果没有这种人，我同谁一道呢？写于庆历六年九月十五日。" }
];

const container = document.getElementById('questionsContainer');
const submitBtn = document.getElementById('submitBtn');
const resetBtn = document.getElementById('resetBtn');
const resultPanel = document.getElementById('resultPanel');
const scoreNum = document.getElementById('scoreNum');
const correctCountEl = document.getElementById('correctCount');
const resultStars = document.getElementById('resultStars');
const scoreComment = document.getElementById('scoreComment');
const toast = document.getElementById('toast');
const translationPanel = document.getElementById('translationPanel');
const translationContent = document.getElementById('translationContent');
const STORAGE_PREFIX = 'yueyang_';
var TOTAL_Q = questions.filter(function(q){ return !q.seg; }).length;

let submitted = false;
let shuffles = {};
function shuffleArray(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function generateShuffles() { for (var gi = 0; gi < TOTAL_Q; gi++) { shuffles[gi] = shuffleArray([0, 1, 2, 3]); } localStorage.setItem(STORAGE_PREFIX + 'shuffles', JSON.stringify(shuffles)); }
function loadShuffles() { try { const s = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'shuffles')); if (s && Object.keys(s).length === TOTAL_Q) { shuffles = s; return; } } catch {} generateShuffles(); }
function renderTranslation() {
  translationContent.innerHTML = '';
  sentenceData.forEach(s => {
    const block = document.createElement('div'); block.className = 'sentence-block';
    const orig = document.createElement('div'); orig.className = 's-line s-line-original'; orig.innerHTML = '<span class="s-label">原文</span>' + s.original; block.appendChild(orig);
    if (s.notes.length > 0) { const notes = document.createElement('div'); notes.className = 's-line s-line-notes'; notes.innerHTML = '<span class="s-label">注释</span>' + s.notes.map(n => '<span class="note-word">【' + n.word + '：' + n.meaning + '】</span>').join(''); block.appendChild(notes); }
    const trans = document.createElement('div'); trans.className = 's-line s-line-trans'; trans.innerHTML = '<span class="s-label">译文</span>' + s.trans; block.appendChild(trans);
    translationContent.appendChild(block);
  });
}
function renderQuestions() {
  container.innerHTML = '';
  var qi = 0;
  for (var i = 0; i < questions.length; i++) {
    var q = questions[i];
    if (q.seg) {
      var s = document.createElement('div'); s.className = 'seg-orig';
      s.innerHTML = '<strong>原文</strong> ' + q.seg;
      container.appendChild(s);
      continue;
    }
    var card = document.createElement('div'); card.className = 'q-card'; card.id = 'q-' + i;
    var letters = ['A', 'B', 'C', 'D']; var order = shuffles[qi] || [0, 1, 2, 3];
    card.innerHTML = '<div class="q-header"><span class="q-num">' + (qi + 1) + '</span><span class="q-tag">' + q.tag + '</span></div><div class="q-text">' + q.q + '</div><div class="opts">' + order.map(function(oi, di) { return '<label data-q="' + i + '" data-opt="' + oi + '" onclick="selectOption(' + i + ', ' + oi + ')"><input type="radio" name="q' + i + '" value="' + oi + '"><span class="opt-letter">' + letters[di] + '</span>' + q.options[oi] + '</label>'; }).join('') + '</div><div class="explanation" id="exp-' + i + '"><span class="result-tag" id="tag-' + i + '"></span><strong>解析：</strong>' + q.explain + '</div>';
    container.appendChild(card);
    qi++;
  }
}
function selectOption(qIdx, optIdx) {
  if (submitted) return;
  document.querySelectorAll('label[data-q="' + qIdx + '"]').forEach(l => l.classList.remove('selected'));
  const label = document.querySelector('label[data-q="' + qIdx + '"][data-opt="' + optIdx + '"]');
  if (label) label.classList.add('selected');
  const answers = getStoredAnswers(); answers[qIdx] = optIdx;
  localStorage.setItem(STORAGE_PREFIX + 'answers', JSON.stringify(answers));
  const done = getAnswered();
  if (!done.includes(qIdx)) { done.push(qIdx); localStorage.setItem(STORAGE_PREFIX + 'done', JSON.stringify(done)); }
  updateProgress(); checkSubmitReady();
}
function getStoredAnswers() { try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'answers')) || {}; } catch { return {}; } }
function getAnswered() { try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'done')) || []; } catch { return []; } }
function restoreFromStorage() {
  const answers = getStoredAnswers(); const answered = getAnswered();
  if (!answered.length) return;
  Object.keys(answers).forEach(k => { const idx = parseInt(k), opt = answers[k]; const label = document.querySelector('label[data-q="' + idx + '"][data-opt="' + opt + '"]'); if (label) { label.classList.add('selected'); const r = label.querySelector('input[type="radio"]'); if (r) r.checked = true; } });
  updateProgress(); checkSubmitReady();
}
function updateProgress() { const done = getAnswered().length; const total = TOTAL_Q; document.getElementById('fpMain').textContent = '已答 ' + done + ' / ' + total + ' 题'; }

  var progMenu = document.getElementById('progMenu');
  var floatProgEl = document.getElementById('floatProg');
  function renderProgMenu(){
    var html = '<div class="pm-title">答题进度 · 点击题号跳转</div>';
    var no = 0;
    questions.forEach(function(q, i){
      if(q.seg) return;
      no++;
      var stCls, stTxt;
      if(submitted){
        var card = document.getElementById('q-' + i);
        if(card && card.classList.contains('correct')){ stCls = 'pm-ok'; stTxt = '✅'; }
        else { stCls = 'pm-bad'; stTxt = '❌'; }
      } else {
        if(getAnswered().indexOf(i) >= 0){ stCls = 'pm-done'; stTxt = '已完成'; }
        else { stCls = 'pm-undone'; stTxt = '未完成'; }
      }
      html += '<div class="pm-item" data-i="' + i + '"><span class="pm-no">第' + no + '题</span><span class="' + stCls + '">' + stTxt + '</span></div>';
    });
    progMenu.innerHTML = html;
  }
  if (floatProgEl) {
    floatProgEl.addEventListener('click', function(e){
      e.stopPropagation();
      if(progMenu.style.display === 'block'){ progMenu.style.display = 'none'; return; }
      renderProgMenu();
      progMenu.style.display = 'block';
    });
  }
  document.addEventListener('click', function(e){
    var item = e.target.closest ? e.target.closest('.pm-item') : null;
    if(item){
      var card = document.getElementById('q-' + item.getAttribute('data-i'));
      if(card) card.scrollIntoView({behavior:'smooth', block:'center'});
      progMenu.style.display = 'none';
      return;
    }
    if(progMenu.style.display === 'block' && !(e.target.closest ? e.target.closest('#progMenu') : null) && e.target !== floatProgEl){
      progMenu.style.display = 'none';
    }
  });
  function checkSubmitReady() { const done = getAnswered().length; const total = TOTAL_Q; submitBtn.disabled = done < total; submitBtn.textContent = done === total ? '📋 提交批改' : '📋 提交批改（还差 ' + (total - done) + ' 题）'; }
submitBtn.addEventListener('click', function() {
  if (submitted) return; if (submitBtn.disabled) { showToast('请先完成所有题目再提交'); return; }
  submitted = true; const answers = getStoredAnswers(); let correct = 0;
  questions.forEach((q, i) => { if (q.seg) return; const userAns = answers[i]; const isCorrect = userAns === q.answer; if (isCorrect) correct++; else { try { var _wl = JSON.parse(localStorage.getItem('gd_wrong') || '[]'); _wl.push({ // ⑦ 篇目标识
paper: '《岳阳楼记》', time: new Date().toLocaleString(), tag: q.tag, q: q.q, options: q.options, userAns: userAns, correct: q.answer, explain: q.explain }); localStorage.setItem('gd_wrong', JSON.stringify(_wl)); } catch (e) {} }
    const card = document.getElementById('q-' + i); card.classList.add(isCorrect ? 'correct' : 'wrong');
    document.querySelectorAll('label[data-q="' + i + '"]').forEach(l => l.classList.add('disabled'));
    const cl = document.querySelector('label[data-q="' + i + '"][data-opt="' + q.answer + '"]'); if (cl) cl.classList.add('show-correct');
    if (!isCorrect && userAns !== undefined) { const wl = document.querySelector('label[data-q="' + i + '"][data-opt="' + userAns + '"]'); if (wl) wl.classList.add('show-wrong'); }
    const exp = document.getElementById('exp-' + i); exp.classList.add('show');
    const tag = document.getElementById('tag-' + i); tag.className = isCorrect ? 'result-tag correct-tag' : 'result-tag wrong-tag'; tag.textContent = isCorrect ? '✓ 正确' : '✗ 错误';
  });
  resultPanel.classList.add('show'); scoreNum.textContent = correct + '/' + TOTAL_Q; correctCountEl.textContent = correct;
  const pct = correct / TOTAL_Q; let stars = '', comment = '';
  if (pct >= 0.9) { stars = '⭐⭐⭐⭐⭐'; comment = '🏆 掌握扎实，功底深厚！'; }
  else if (pct >= 0.75) { stars = '⭐⭐⭐⭐'; comment = '👏 掌握得很不错！继续加油！'; }
  else if (pct >= 0.5) { stars = '⭐⭐⭐'; comment = '💪 基础还可以，再复习一遍课下注释吧。'; }
  else { stars = '⭐⭐'; comment = '📖 建议熟读课文，理解每个字的意思。'; }
  resultStars.textContent = stars; scoreComment.textContent = comment;
  submitBtn.disabled = true; submitBtn.textContent = '✅ 已批改'; submitBtn.classList.add('btn-secondary'); submitBtn.classList.remove('btn-primary');
  renderTranslation(); translationPanel.classList.add('show');
  setTimeout(function() { resultPanel.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 200);
  localStorage.setItem(STORAGE_PREFIX + 'submitted', 'true');
  localStorage.removeItem(STORAGE_PREFIX + 'answers');
  localStorage.removeItem(STORAGE_PREFIX + 'done');
  localStorage.removeItem(STORAGE_PREFIX + 'submitted');
});
resetBtn.addEventListener('click', function() {
  if (submitted && !confirm('重新答题将清除当前成绩，确定吗？')) return;
  submitted = false; ['answers','done','submitted','shuffles'].forEach(function(k) { localStorage.removeItem(STORAGE_PREFIX + k); });
  document.querySelectorAll('.q-card').forEach(function(c) { c.className = 'q-card'; });
  document.querySelectorAll('.opts label').forEach(function(l) { l.className = ''; var r = l.querySelector('input[type="radio"]'); if (r) r.checked = false; });
  document.querySelectorAll('.explanation').forEach(function(e) { e.classList.remove('show'); });
  translationPanel.classList.remove('show'); resultPanel.classList.remove('show');
  submitBtn.disabled = true; submitBtn.textContent = '📋 提交批改'; submitBtn.classList.remove('btn-secondary'); submitBtn.classList.add('btn-primary');
  generateShuffles(); renderQuestions(); updateProgress();
  scrollTo({ top: 0, behavior: 'smooth' });
});
function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); clearTimeout(toast._timer); toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 2000); }
localStorage.removeItem(STORAGE_PREFIX + 'answers'); localStorage.removeItem(STORAGE_PREFIX + 'done'); localStorage.removeItem(STORAGE_PREFIX + 'submitted'); generateShuffles(); renderQuestions();
(function(){ function segUpd(){ var segs=document.querySelectorAll('.seg-orig'); if(!segs.length) return; var cur=null; segs.forEach(function(s){ var r=s.getBoundingClientRect(); if(r.top<80 && r.bottom>0) cur=s; }); segs.forEach(function(s){ if(s===cur) s.classList.add('active'); else s.classList.remove('active'); }); } window.addEventListener('scroll', segUpd, {passive:true}); setInterval(segUpd, 600); segUpd(); })();
</script>

<script>
(function(){
  var tip=document.createElement('div');tip.id='jzTip';document.body.appendChild(tip);
  function showTip(el){
    var r=el.getBoundingClientRect();
    tip.textContent=el.getAttribute('data-tip');
    tip.style.display='block';
    var tw=tip.offsetWidth,th=tip.offsetHeight;
    var left=r.left+r.width/2-tw/2;
    if(left<8)left=8;
    if(left+tw>window.innerWidth-8)left=window.innerWidth-8-tw;
    var top=r.top-th-10;
    if(top<8){top=r.bottom+10;tip.classList.add('below');}else{tip.classList.remove('below');}
    tip.style.left=left+'px';tip.style.top=top+'px';
  }
  document.addEventListener('click',function(e){
    var el=e.target;
    var jz=el.closest?el.closest('.jz'):null;
    if(jz){showTip(jz);return;}
    if(el.id!=='jzTip'){tip.style.display='none';}
  });
  window.addEventListener('scroll',function(){tip.style.display='none';},{passive:true});
})();
</script></body>
