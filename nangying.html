<style>

  .opts { margin-top: 4px; }

  .opts label:hover { border-color: #6abf96; background: #f0faf4; }

  .opts label.selected .opt-letter { background: #2d4a3e; color: #fff; }
  .opts label.show-correct .opt-letter { background: #4caf50; color: #fff; }
  .opts label.show-wrong .opt-letter { background: #e53935; color: #fff; }

  .explanation { margin-top: 8px; padding: 10px 14px; background: #f0faf4; border-radius: 8px; font-size: 13px; line-height: 1.8; display: none; color: #555; }
  .explanation.show { display: block; }
  .explanation strong { color: #2d4a3e; }
  .explanation .result-tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 0 8px; border-radius: 4px; margin-right: 6px; }
  .result-tag.correct-tag { background: #e8f5e9; color: #2e7d32; }
  .result-tag.wrong-tag { background: #fce4ec; color: #c62828; }

  .btn-bar { text-align: center; margin: 28px 0 12px; }
  .btn { display: inline-block; padding: 14px 40px; border-radius: 28px; font-size: 16px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; margin: 4px 6px; font-family: inherit; }
  .btn-primary { background: linear-gradient(135deg, #2d4a3e, #1b3528); color: #fff; box-shadow: 0 2px 8px rgba(45,74,62,0.3); }
  .btn-primary:hover { transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: #fff; color: #2d4a3e; border: 2px solid #6abf96; }
  .btn-small { padding: 8px 20px; font-size: 13px; border-radius: 20px; }

  .result-panel { background: linear-gradient(135deg, #2d4a3e, #4a7a5e); color: #fff; border-radius: 16px; padding: 28px 20px; margin: 24px 0 16px; text-align: center; display: none; }

  .translation-panel { background: #fff; border-radius: 12px; padding: 18px; margin: 16px 0; box-shadow: 0 1px 4px rgba(0,0,0,0.05); border: 1px solid #ede7dd; display: none; }
  .translation-panel.show { display: block; }
  .translation-panel h3 { font-size: 15px; font-weight: 600; color: #2d4a3e; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 2px solid #dce8e0; }
  .sentence-block { margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid #e0ece4; }
  .sentence-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .s-line { font-size: 14px; line-height: 1.9; margin-bottom: 2px; }
  .s-line .s-label { display: inline-block; font-size: 11px; font-weight: 600; color: #bbb; min-width: 3.2em; letter-spacing: 1px; }
  .s-line-original { color: #333; font-weight: 500; }
  .s-line-notes { color: #2d4a3e; font-size: 13px; margin-bottom: 4px; }
  .s-line-notes .note-word { display: inline-block; background: #f0faf4; border: 1px solid #dce8e0; border-radius: 4px; padding: 0 8px; margin: 2px 3px 2px 0; font-weight: 500; }
  .s-line-trans { color: #666; font-size: 13px; }

  .footer { text-align: center; padding: 30px 0 10px; font-size: 12px; color: #bbb; }
  .footer .divider { width: 40px; height: 2px; background: #e0d5c5; margin: 0 auto 12px; border-radius: 2px; }

  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 24px; border-radius: 20px; font-size: 13px; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }

  @media (max-width: 400px) {
    .banner { padding: 24px 14px 18px; }

    .sticky-original { font-size: 13px; padding: 8px 12px; max-height: 25vh; }
    .q-card { padding: 14px; }
    .opts label { padding: 9px 12px; font-size: 13px; }
    .result-panel .score-num { font-size: 42px; }
  }
  @media (min-width: 600px) {
    body { padding: 20px 0 48px; }
    .container { padding: 0 20px; }
    .banner, .sticky-original { border-radius: 0; }
  }
</style>
</head>
<body>

<div class="banner">
  <h1>📖 《囊萤夜读》</h1>
  <p>部编版四年级上册 · 《晋书·车胤传》</p>
  <span class="badge">11 道选择题 · 测测你对这篇古文掌握得怎样</span>
</div>

<div class="sticky-original" id="stickyOriginal">
  <strong>原文</strong> 胤恭勤不倦，博学多通。家贫不常得油，夏月则<u>练囊</u>盛数十<u>萤火</u>以照书，以夜继日焉。<br>
  <strong>常识</strong> 本文选自《晋书·车胤传》。“囊”用袋子装，“萤”萤火虫。
</div>

<div class="container">

  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText">已答 0 / 11 题</div>

  <div id="questionsContainer"></div>

  <div class="btn-bar">
    <button class="btn btn-primary" id="submitBtn" disabled>📋 提交批改</button>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var Q=[
['\u201c胤<span class="highlight">恭勤</span>不倦\u201d中\u201c<span class="highlight">恭勤</span>\u201d的意思是',['恭谨','庭勤','肃敬勤勉','恭敬'],2,'\u201c恭勤\u201d意为\u201c肃敬勤勉\u201d。车胤肃敬勤勉而不知疲倦。'],
['\u201c恭勤不<span class="highlight">倦</span>\u201d中\u201c<span class="highlight">倦</span>\u201d的意思是',['疲倦','反倦','懈怠','厌倦'],0,'\u201c倦\u201d意为\u201c疲倦\u201d。肃敬勤勉而不知疲倦。'],
['\u201c博学多<span class="highlight">通</span>\u201d中\u201c<span class="highlight">通</span>\u201d的意思是',['通过','流通','通晓，明白','串通'],2,'\u201c通\u201d意为\u201c通晓，明白\u201d。博学多通即知识广博，学问精通。'],
['\u201c家贫不<span class="highlight">常</span>得油\u201d中\u201c<span class="highlight">常</span>\u201d的意思是',['经常','平常','常识','常见'],0,'\u201c常\u201d意为\u201c经常\u201d。家境贫寒，不能经常得到灯油。'],
['\u201c夏月则<span class="highlight">练囊</span>\u201d中\u201c<span class="highlight">练囊</span>\u201d是什么',['练习用的袋子','白色薄绢做的口袋','棉布袋','练过的袋子'],1,'\u201c练囊\u201d指\u201c白色薄绢做的口袋\u201d。\u201c练\u201d是白色薄绢，\u201c囊\u201d是袋子。'],
['\u201c练囊<span class="highlight">盛</span>数十萤火\u201d中\u201c<span class="highlight">盛</span>\u201d的意思是',['盛大','装着','孟','充满'],1,'\u201c盛\u201d读sh\u00e9ng，意为\u201c装\u201d。用白绢袋子装数十只萤火虫。'],
['\u201c盛数十<span class="highlight">萤火</span>\u201d中\u201c<span class="highlight">萤火</span>\u201d指的是',['火光','萤火虫','火把','荧幕'],1,'\u201c萤火\u201d指的是\u201c萤火虫\u201d。古人称萤火虫为\u201c萤\u201d。'],
['\u201c<span class="highlight">以夜继日</span>\u201d中\u201c<span class="highlight">以夜继日</span>\u201d的意思是',['夜晚接着白天','白天接着夜晚','以夜替日','夜和日一样'],0,'\u201c以夜继日\u201d即\u201c用夜晚接着白天\u201d，形容夜以继日地学习。'],
['车胤用什么照亮书籍',['灯油','月光','萤火虫','火把'],2,'车胤用白绢袋子装萤火虫照亮书籍，即\u201c囊萤夜读\u201d故事。'],
['这则故事表现了车胤什么样的品质',['聪明过人','苦学勤奋、刻苦读书','喜欢萤火虫','有钱买油'],1,'囊萤夜读表现了车胤刻苦勤奋、刻苦读书的品质。这也是后世\u201c囊萤夜读\u201d典故的来历。']
];

var S=[
['胤恭勤不倦，博学多通。','恭勤：肃敬勤勉、倦：疲倦、通：通晓','车胤肃敬勤勉而不知疲倦，知识广博，学问精通。'],
['家贫不常得油，','常：经常','他家境贫寒，不能经常得到灯油。'],
['夏月则练囊盛数十萤火以照书，','练囊：白色薄绢做的口袋、盛：装、萤火：萤火虫、照：照亮','夏天的夜晚，就用白绢做成透光的袋子，装几十只萤火虫照着书本，'],
['以夜继日焉。','以夜继日：夜以继日','夜以继日地学习着。']
];

var container = document.getElementById('questionsContainer');
var submitBtn = document.getElementById('submitBtn');
var resetBtn = document.getElementById('resetBtn');
var progressFill = document.getElementById('progressFill');
var progressText = document.getElementById('progressText');
var resultPanel = document.getElementById('resultPanel');
var scoreNum = document.getElementById('scoreNum');
var correctCountEl = document.getElementById('correctCount');
var resultStars = document.getElementById('resultStars');
var scoreComment = document.getElementById('scoreComment');
var toast = document.getElementById('toast');
var translationPanel = document.getElementById('translationPanel');
var translationContent = document.getElementById('translationContent');
var P = 'ny_';
var submitted = false;
var shuffles = {};

function shuffleArray(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function generateShuffles() { for (var i = 0; i < Q.length; i++) { shuffles[i] = shuffleArray([0, 1, 2, 3]); } localStorage.setItem(P + 's', JSON.stringify(shuffles)); }
function loadShuffles() { try { var s = JSON.parse(localStorage.getItem(P + 's')); if (s && Object.keys(s).length == Q.length) { shuffles = s; return; } } catch (e) {} generateShuffles(); }

function renderTranslation() {
  translationContent.innerHTML = '';
  for (var si = 0; si < S.length; si++) { var s = S[si];
    var block = document.createElement('div'); block.className = 'sentence-block';
    var orig = document.createElement('div'); orig.className = 's-line s-line-original'; orig.innerHTML = '<span class="s-label">原文</span>' + s[0]; block.appendChild(orig);
    if (s[1]) { var notes = document.createElement('div'); notes.className = 's-line s-line-notes'; var h = '<span class="s-label">注释</span>'; var ns = s[1].split('、'); for (var ni = 0; ni < ns.length; ni++) { h += '<span class="note-word">【' + ns[ni] + '】</span>'; } notes.innerHTML = h; block.appendChild(notes); }
    var trans = document.createElement('div'); trans.className = 's-line s-line-trans'; trans.innerHTML = '<span class="s-label">译文</span>' + s[2]; block.appendChild(trans);
    translationContent.appendChild(block);
  }
}

function renderQuestions() {
  container.innerHTML = '';
  for (var qi = 0; qi < Q.length; qi++) { var q = Q[qi];
    var card = document.createElement('div'); card.className = 'q-card'; card.id = 'q' + qi;
    var letters = ['A', 'B', 'C', 'D']; var order = shuffles[qi] || [0, 1, 2, 3];
    var oh = '<div class="q-header"><span class="q-num">' + (qi + 1) + '</span><span class="q-tag">字词释义</span></div><div class="q-text">' + q[0] + '</div><div class="opts">';
    for (var oi = 0; oi < 4; oi++) { var d = order[oi]; oh += '<label data-q="' + qi + '" data-o="' + d + '" onclick="selectOption(' + qi + ', ' + d + ')"><input type="radio" name="q' + qi + '" value="' + d + '"><span class="opt-letter">' + letters[oi] + '</span>' + q[1][d] + '</label>'; }
    oh += '</div><div class="explanation" id="exp' + qi + '"><span class="result-tag" id="tag' + qi + '"></span><strong>解析：</strong>' + q[3] + '</div>';
    card.innerHTML = oh;
    container.appendChild(card);
  }
}

function selectOption(qIdx, optIdx) {
  if (submitted) return;
  var labels = document.querySelectorAll('label[data-q="' + qIdx + '"]'); for (var i = 0; i < labels.length; i++) { labels[i].classList.remove('selected'); }
  var label = document.querySelector('label[data-q="' + qIdx + '"][data-o="' + optIdx + '"]'); if (label) label.classList.add('selected');
  var answers = getStoredAnswers(); answers[qIdx] = optIdx;
  localStorage.setItem(P + 'a', JSON.stringify(answers));
  var done = getAnswered();
  if (done.indexOf(qIdx) == -1) { done.push(qIdx); localStorage.setItem(P + 'd', JSON.stringify(done)); }
  updateProgress(); checkSubmitReady();
}

function getStoredAnswers() { try { return JSON.parse(localStorage.getItem(P + 'a')) || {}; } catch (e) { return {}; } }
function getAnswered() { try { return JSON.parse(localStorage.getItem(P + 'd')) || []; } catch (e) { return []; } }

function restoreFromStorage() {
  var answers = getStoredAnswers(); var answered = getAnswered();
  if (!answered.length) return;
  var keys = Object.keys(answers);
  for (var ki = 0; ki < keys.length; ki++) { var idx = parseInt(keys[ki]); var opt = answers[keys[ki]]; var label = document.querySelector('label[data-q="' + idx + '"][data-o="' + opt + '"]'); if (label) { label.classList.add('selected'); var r = label.querySelector('input'); if (r) r.checked = true; } }
  updateProgress(); checkSubmitReady();
}

function updateProgress() { var done = getAnswered().length; var total = Q.length; progressFill.style.width = Math.min(Math.round((done / total) * 100), 100) + '%'; progressText.textContent = '已答 ' + done + ' / ' + total + ' 题'; }
function checkSubmitReady() { var done = getAnswered().length; var total = Q.length; submitBtn.disabled = done < total; submitBtn.textContent = done == total ? '📋 提交批改' : '📋 提交批改（还差 ' + (total - done) + ' 题）'; }

submitBtn.addEventListener('click', function() {
  if (submitted) return;
  if (submitBtn.disabled) { toast.textContent = '请先完成所有题目再提交'; toast.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function() { toast.classList.remove('show'); }, 2000); return; }
  submitted = true;
  var answers = getStoredAnswers(); var correct = 0;
  for (var i = 0; i < Q.length; i++) {
    var q = Q[i]; var ua = answers[i]; var isCorrect = ua === q[2]; if (isCorrect) correct++;
    document.getElementById('q' + i).classList.add(isCorrect ? 'correct' : 'wrong');
    var labels = document.querySelectorAll('label[data-q="' + i + '"]'); for (var li = 0; li < labels.length; li++) { labels[li].classList.add('disabled'); }
    var cl = document.querySelector('label[data-q="' + i + '"][data-o="' + q[2] + '"]'); if (cl) cl.classList.add('show-correct');
    if (!isCorrect && ua !== undefined) { var wl = document.querySelector('label[data-q="' + i + '"][data-o="' + ua + '"]'); if (wl) wl.classList.add('show-wrong'); }
    var exp = document.getElementById('exp' + i); exp.classList.add('show');
    var tag = document.getElementById('tag' + i); tag.className = isCorrect ? 'result-tag correct-tag' : 'result-tag wrong-tag'; tag.textContent = isCorrect ? '✓ 正确' : '✗ 错误';
  }
  resultPanel.classList.add('show'); scoreNum.textContent = correct + '/' + Q.length; correctCountEl.textContent = correct;
  var pct = correct / Q.length; var stars = ''; var comment = '';
  if (pct >= 0.9) { stars = '⭐⭐⭐⭐⭐'; comment = '🏆 太厉害了！你是古文小达人！'; }
  else if (pct >= 0.75) { stars = '⭐⭐⭐⭐'; comment = '👏 掌握得很不错！继续加油！'; }
  else if (pct >= 0.5) { stars = '⭐⭐⭐'; comment = '💪 基础还可以，再复习一遍课下注释吧。'; }
  else { stars = '⭐⭐'; comment = '📖 建议熟读课文，理解每个字的意思。'; }
  resultStars.textContent = stars; scoreComment.textContent = comment;
  submitBtn.disabled = true; submitBtn.textContent = '✅ 已批改';
  renderTranslation(); translationPanel.classList.add('show');
  setTimeout(function() { resultPanel.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 200);
  localStorage.setItem(P + 'sub', 'true');
});

resetBtn.addEventListener('click', function() {
  if (submitted && !confirm('重新答题将清除当前成绩，确定吗？')) return;
  submitted = false;
  ['a', 'd', 'sub', 's'].forEach(function(k) { localStorage.removeItem(P + k); });
  document.querySelectorAll('.q-card').forEach(function(c) { c.className = 'q-card'; });
  document.querySelectorAll('.opts label').forEach(function(l) { l.className = ''; var r = l.querySelector('input'); if (r) r.checked = false; });
  document.querySelectorAll('.explanation').forEach(function(e) { e.classList.remove('show'); });
  translationPanel.classList.remove('show'); resultPanel.classList.remove('show');
  submitBtn.disabled = true; submitBtn.textContent = '📋 提交批改';
  generateShuffles(); renderQuestions(); updateProgress();
  scrollTo({ top: 0, behavior: 'smooth' });
});

loadShuffles(); renderQuestions();
var wasSubmitted = localStorage.getItem(P + 'sub');
if (wasSubmitted === 'true') { setTimeout(function() { submitted = false; submitBtn.click(); }, 100); }
else { restoreFromStorage(); }
</script>
</body>
</html>
