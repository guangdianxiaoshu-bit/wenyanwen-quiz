<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>文言文题库 · 在线自测</title>
<style>
:root{
  --main:#CD5452; --main-d:#b34543; --main-l:#FBEFED; --ink:#333333; --ink-2:#6b6b6b;
  --line:#efdfdd; --ok:#2f7d5e; --ok-l:#eaf6f0; --no:#c0392b; --no-l:#fdeeea; --card:#ffffff;
  --jd:#1a6fb5; --jd-l:#eaf3fb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#faf8f6;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",sans-serif;
  font-size:16px;line-height:1.7;
}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 60px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
[hidden]{display:none !important}

/* ---------- 目录 ---------- */
.banner{padding:24px 4px 12px;text-align:center}
.banner h1{margin:0 0 8px;font-size:25px;letter-spacing:.02em;color:var(--main)}
.banner .sub{margin:0 0 10px;font-size:13.5px;color:var(--main-d);opacity:.9}
.banner .tip{margin:0;font-size:13px;color:var(--ink-2);line-height:1.75}
.tabs{display:flex;gap:8px;margin:14px 0 10px}
.tabs button{
  flex:1;padding:10px 6px;border:1px solid var(--line);border-radius:11px;background:#fff;
  font-size:14px;color:var(--ink-2);transition:.15s;line-height:1.3
}
.tabs button b{display:block;font-size:16px;color:var(--ink)}
.tabs button.on{border-color:var(--main);background:var(--main-l);color:var(--main-d)}
.tabs button.on b{color:var(--main)}
.tools{display:flex;gap:8px;margin:10px 0 10px;flex-wrap:wrap}
.tools input[type=search]{
  flex:1 1 200px;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:11px;
  background:#fff;font-size:14.5px;color:var(--ink);outline:none;
}
.tools input[type=search]:focus{border-color:var(--main);box-shadow:0 0 0 3px var(--main-l)}
.tools select{
  padding:11px 10px;border:1px solid var(--line);border-radius:11px;background:#fff;
  font-size:14px;color:var(--ink);outline:none;max-width:47%
}
.stats{display:flex;gap:10px;margin:4px 0 14px;flex-wrap:wrap}
.stat{flex:1 1 150px;background:var(--main-l);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--main-d)}
.stat b{display:block;font-size:19px;color:var(--main);letter-spacing:.02em;line-height:1.3}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 13px;
  display:flex;flex-direction:column;gap:6px;text-align:left;transition:.15s;position:relative
}
.card:hover{border-color:var(--main);box-shadow:0 4px 14px rgba(205,84,82,.12);transform:translateY(-1px)}
.card .top{display:flex;align-items:baseline;gap:8px}
.card .no{font-size:12px;color:#fff;background:var(--main);border-radius:7px;padding:1px 7px;font-weight:600;flex:none}
.card.jd .no{background:var(--jd)}
.card .name{font-size:15.5px;font-weight:600;line-height:1.45}
.card .meta{font-size:12px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap}
.card .meta .bg{border:1px solid var(--line);border-radius:6px;padding:0 5px}
.card.jd .meta .bg{border-color:#cfe3f3;color:var(--jd);background:var(--jd-l)}
.card .bar{height:5px;border-radius:4px;background:#f2eae9;overflow:hidden;margin-top:2px}
.card .bar i{display:block;height:100%;background:var(--main);border-radius:4px}
.card.jd .bar i{background:var(--jd)}
.card .done{font-size:12px;color:var(--ok)}
.card .flag{font-size:11.5px;color:#9a7b3f}
.card .twin{font-size:11.5px;color:#a99}
.empty{color:var(--ink-2);font-size:14px;padding:24px 4px}
.foot{margin-top:26px;text-align:center;font-size:12px;color:#a99}

/* ---------- 刷题 ---------- */
.qbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:10px 0;margin-bottom:10px;background:rgba(250,248,246,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line)
}
.ghost{
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;
  font-size:13.5px;color:var(--main-d);transition:.15s
}
.ghost:hover{border-color:var(--main);color:var(--main)}
.qtitle{flex:1;min-width:0;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qtitle .no{color:var(--main);margin-right:4px}
.qtitle .no.jd{color:var(--jd)}
.prog{font-size:13px;color:var(--ink-2);flex:none}
.paper{background:#fff;border:1px solid var(--line);border-left:4px solid var(--main);border-radius:13px;padding:13px 15px;margin-bottom:14px}
.paper.jd{border-left-color:var(--jd)}
.sechead{font-size:13px;font-weight:700;color:var(--main-d);margin-bottom:8px;cursor:pointer;user-select:none}
.paper.jd .sechead{color:var(--jd)}
.sechead .hint{font-weight:400;color:#b39d9c;font-size:12px}
.passage p{margin:0 0 9px;font-size:15.5px;line-height:2;text-align:justify}
.passage p:last-child{margin-bottom:0}
.passage u{text-decoration:none;color:var(--jd);font-weight:700;background:linear-gradient(transparent 62%,#dcebfa 62%)}
.passage small{font-size:12px;color:#7f9db8;margin:0 1px}
.passage .jz{border-bottom:1px dotted #8fa9c2;cursor:help}
.passage em.k, .qtext em.k{font-style:normal;color:var(--main);font-weight:700;background:linear-gradient(transparent 62%,#fbe0dd 62%)}
.qtext u{text-decoration:none;color:var(--jd);font-weight:700}
.common{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink-2);line-height:1.85}
.common b{color:var(--jd)}
.qcard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:11px}
.qhead{display:flex;gap:9px;align-items:baseline;margin-bottom:9px}
.qnum{
  flex:none;width:24px;height:24px;border-radius:50%;background:var(--main-l);color:var(--main);
  font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:3px
}
.qtext{font-size:15.5px;line-height:1.85;flex:1;min-width:0}
.qtag{font-size:11.5px;color:var(--jd);border:1px solid #cfe3f3;background:var(--jd-l);border-radius:9px;padding:0 7px;flex:none;margin-top:4px}
.opt{
  display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px;
  font-size:15px;line-height:1.7;color:var(--ink);transition:.13s
}
.opt:hover{border-color:var(--main);background:#fffafa}
.opt .lt{
  flex:none;width:21px;height:21px;border-radius:50%;border:1px solid var(--line);color:var(--ink-2);
  font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px
}
.opt .tx{flex:1;min-width:0}
.opt.right{border-color:var(--ok);background:var(--ok-l)}
.opt.right .lt{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--no-l)}
.opt.wrong .lt{background:var(--no);border-color:var(--no);color:#fff}
.opt.locked{cursor:default}
.opt.locked:hover{border-color:var(--line);background:#fff}
.opt.locked.right:hover{border-color:var(--ok);background:var(--ok-l)}
.opt.locked.wrong:hover{border-color:var(--no);background:var(--no-l)}
.res{margin-top:8px;font-size:13.5px;padding:8px 11px;border-radius:9px;background:#faf7f7;border-left:3px solid var(--main);color:var(--ink-2);line-height:1.8}
.res b{color:var(--main-d)}
.res.ok{background:var(--ok-l);border-color:var(--ok)}
.res.no{background:var(--no-l);border-color:var(--no)}
.res .exp{margin-top:5px;color:var(--ink)}
.res .exp em.k{font-style:normal;color:var(--main);font-weight:700}
.blank{background:#faf7f7;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;font-size:14.5px;color:var(--ink-2);box-shadow:none;line-height:1.85}
.blank b{color:var(--main-d)}
.blank em.k{font-style:normal;color:var(--main);font-weight:700}
.jdline{padding:9px 0;border-bottom:1px dashed var(--line)}
.jdline:last-child{border-bottom:none}
.jdline .jo{font-size:15px;line-height:1.9}
.jdline .jo u{text-decoration:none;color:var(--jd);font-weight:700}
.jdline .jnote{font-size:12.5px;color:#7f9db8;margin-top:3px;line-height:1.8}
.jdline .jt{font-size:14.5px;color:var(--ink);margin-top:4px;line-height:1.9;background:#f8f8f6;border-radius:8px;padding:6px 9px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0 0}
.btn{background:var(--main);border:none;border-radius:11px;padding:11px 18px;font-size:14.5px;color:#fff;font-weight:600}
.btn:hover{background:var(--main-d)}
.score{background:#fff;border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:13px;padding:14px 16px;margin-top:14px}
.score b{color:var(--ok);font-size:19px}
.float-home{
  position:fixed;right:14px;bottom:16px;z-index:40;background:rgba(205,84,82,.92);color:#fff;border:none;
  border-radius:22px;padding:10px 16px;font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(205,84,82,.35)
}
.float-home:hover{background:var(--main-d)}
@media (max-width:520px){
  .banner h1{font-size:22px}
  .list{grid-template-columns:1fr 1fr}
  .card .name{font-size:14.5px}
  .qtext,.opt{font-size:15px}
  .tabs button{font-size:13px}
}
</style>
</head>
<body>
<div class="wrap">

  <section id="home">
    <header class="banner">
      <h1>文言文题库 · 在线自测</h1>
      <p class="sub" id="bannerSub">课内精读自测 · 打卡题库</p>
      <p class="tip">点开任意一篇开始刷题：选完即时判对错；课内篇配原文注释、逐句精读与答案解析，打卡篇配全篇译文。</p>
    </header>
    <div class="tabs" id="tabs">
      <button data-g="" class="on">全部<b id="cntAll">-</b></button>
      <button data-g="jd">精读自测<b id="cntJd">-</b></button>
      <button data-g="dk">打卡题库<b id="cntDk">-</b></button>
    </div>
    <div class="tools">
      <input id="kw" type="search" placeholder="搜篇名、编号或考点词，如：陋室铭、狼、之、118">
      <select id="src"><option value="">全部来源</option></select>
      <select id="scope">
        <option value="">全部状态</option>
        <option value="todo">未刷</option>
        <option value="doing">刷过未完成</option>
        <option value="done">已完成</option>
      </select>
    </div>
    <div class="stats" id="stats"></div>
    <div class="list" id="list"></div>
    <footer class="foot">光点小塾 · 文言文题库｜内容仅供学员练习使用</footer>
  </section>

  <section id="quiz" hidden>
    <div class="qbar">
      <button class="ghost" id="back">← 目录</button>
      <div class="qtitle"><span class="no" id="qno"></span><span id="qname"></span></div>
      <div class="prog" id="prog"></div>
    </div>
    <div class="paper" id="paper">
      <div class="sechead" id="phead">原文<span class="hint">（点这里收起／展开）</span></div>
      <div class="passage" id="passage"></div>
      <div class="common" id="common" hidden></div>
    </div>
    <div id="flag"></div>
    <div id="qwrap"></div>
    <div class="actions">
      <button class="btn" id="nbtn">下一篇 →</button>
      <button class="ghost" id="jdbtn" hidden>逐句精读</button>
      <button class="ghost" id="tbtn" hidden>显示译文</button>
      <button class="ghost" id="rbtn">重做本篇</button>
    </div>
    <div class="paper" id="trans" hidden>
      <div class="sechead">译文</div>
      <div class="passage" id="transBody"></div>
    </div>
    <div class="paper" id="jdpanel" hidden>
      <div class="sechead">逐句精读</div>
      <div id="jdBody"></div>
    </div>
    <div class="score" id="score" hidden></div>
    <button class="float-home" id="floatHome">📚 目录</button>
  </section>

</div>
<script src="daka_data.js?v=20261011b"></script>
<script src="jd_data.js?v=20261011b"></script>
<script>
(function(){
  "use strict";
  var LT = ["A","B","C","D","E","F"];
  var KEY = "daka_v1";

  /* ---- 统一数据：课内精读自测（JD）+ 打卡题库（DAKA） ---- */
  var PAPERS = [];
  (typeof JD !== "undefined" ? JD : []).forEach(function(p){
    PAPERS.push({ g:"jd", key:"jd" + p.no, no:p.no, t:p.t, src:p.src, tag:p.tag, html:true,
                  p:p.p, common:p.common || "", q:p.q, jd:p.jd || [], tr:[], fl:[] });
  });
  (typeof DAKA !== "undefined" ? DAKA : []).forEach(function(p){
    PAPERS.push({ g:"dk", key:String(p.n), no:p.n, t:p.t, src:p.b, tag:p.b, html:false,
                  p:p.p, common:"", q:p.q, jd:[], tr:p.tr || [], fl:p.fl || [] });
  });
  var byTitle = {};
  PAPERS.forEach(function(p){ (byTitle[p.t] = byTitle[p.t] || []).push(p); });
  PAPERS.forEach(function(p){
    p.twin = (byTitle[p.t] || []).filter(function(x){ return x.g !== p.g; })[0] || null;
  });
  var TOTAL_Q = 0, JD_N = 0, DK_N = 0;
  PAPERS.forEach(function(p){ TOTAL_Q += p.q.length; if (p.g === "jd") JD_N++; else DK_N++; });

  var store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e){ store = {}; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }

  function esc(s){
    return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function sanitize(h){
    h = String(h || "");
    h = h.replace(/<\s*(\/?)\s*(em|u|small|br|strong|b|span)([^>]*?)\/?\s*>/gi, function(m, close, tag, attrs){
      var t = tag.toLowerCase();
      if (t === "br") return "<br>";
      if (t === "b") return close ? "</b>" : "<b>";
      if (t === "span"){
        if (close) return "</span>";
        if (!/class\s*=\s*['"]jz['"]/.test(attrs)) return "";
        var ti = /title\s*=\s*['"]([^'"]*)['"]/.exec(attrs);
        return '<span class="jz"' + (ti ? ' title="' + ti[1].replace(/"/g, "&quot;") + '"' : "") + ">";
      }
      if (close) return "</" + t + ">";
      if (t === "em" && /class\s*=\s*['"]k['"]/.test(attrs)) return '<em class="k">';
      return "<" + t + ">";
    });
    h = h.replace(/&(?!amp;|lt;|gt;|nbsp;|quot;)/g, "&amp;");
    return h;
  }
  function kx(s, isHtml){
    if (isHtml) return sanitize(s);
    return esc(s).replace(/【([^】]+)】/g, '<em class="k">$1</em>');
  }
  function rec(p){ return store[p.key] || {}; }
  function answered(p){
    var r = rec(p);
    return Object.keys(r).filter(function(k){ return r[k] !== "" && r[k] != null; }).length;
  }
  function isDone(p){ return p.q.length > 0 && answered(p) >= p.q.length; }
  function judgeable(p){
    return p.q.filter(function(q){ return q.o && q.o.length && /^[A-F]$/.test(q.a || ""); }).length;
  }
  function correctCount(p){
    var r = rec(p), c = 0;
    p.q.forEach(function(q, i){
      if (q.o && q.o.length && /^[A-F]$/.test(q.a || "") && r[i] === q.a) c++;
    });
    return c;
  }

  /* ---------------- 目录 ---------------- */
  var listEl = document.getElementById("list"), statsEl = document.getElementById("stats");
  var kwEl = document.getElementById("kw"), srcEl = document.getElementById("src"), scopeEl = document.getElementById("scope");
  var tabG = "";
  document.getElementById("cntAll").textContent = PAPERS.length;
  document.getElementById("cntJd").textContent = JD_N;
  document.getElementById("cntDk").textContent = DK_N;
  document.getElementById("bannerSub").textContent =
    "课内精读自测 " + JD_N + " 篇 · 打卡题库 " + DK_N + " 篇｜共 " + TOTAL_Q + " 题";

  var SRC_LIST = [];
  PAPERS.forEach(function(p){ if (SRC_LIST.indexOf(p.tag) < 0) SRC_LIST.push(p.tag); });
  function fillSrc(){
    var keep = srcEl.value;
    srcEl.innerHTML = '<option value="">全部来源</option>';
    SRC_LIST.filter(function(s){
      if (!tabG) return true;
      return PAPERS.some(function(p){ return p.g === tabG && p.tag === s; });
    }).forEach(function(s){
      var o = document.createElement("option"); o.value = s; o.textContent = s; srcEl.appendChild(o);
    });
    if ([].some.call(srcEl.options, function(o){ return o.value === keep; })) srcEl.value = keep;
  }
  function totals(){
    var d = 0, ans = 0, cor = 0, judge = 0;
    PAPERS.forEach(function(p){
      if (isDone(p)) d++;
      ans += answered(p); cor += correctCount(p); judge += judgeable(p);
    });
    return {done:d, ans:ans, cor:cor, judge:judge};
  }
  function renderStats(){
    var t = totals(), rate = t.judge ? Math.round(t.cor / t.judge * 100) : 0;
    statsEl.innerHTML =
      '<div class="stat"><b>' + t.done + ' / ' + PAPERS.length + '</b>已完成篇目</div>' +
      '<div class="stat"><b>' + t.ans + ' / ' + TOTAL_Q + '</b>已答题数</div>' +
      '<div class="stat"><b>' + rate + '%</b>已答正确率（' + t.cor + '/' + t.judge + '）</div>';
  }
  function matchScore(p, kw){
    if (!kw) return 0;
    var n = (p.t.indexOf(kw) >= 0 ? 2 : 0) + (String(p.no) === kw ? 2 : 0) + (p.src.indexOf(kw) >= 0 ? 1 : 0);
    p.q.forEach(function(q){ if (q.s.indexOf(kw) >= 0) n++; });
    return n;
  }
  function renderList(){
    var kw = kwEl.value.trim(), src = srcEl.value, scope = scopeEl.value;
    var rows = PAPERS.filter(function(p){
      if (tabG && p.g !== tabG) return false;
      if (src && p.tag !== src) return false;
      if (scope === "todo" && answered(p) > 0) return false;
      if (scope === "doing" && !(answered(p) > 0 && !isDone(p))) return false;
      if (scope === "done" && !isDone(p)) return false;
      return true;
    });
    if (kw){
      rows = rows.map(function(p){ return {p:p, s:matchScore(p, kw)}; })
                 .filter(function(r){ return r.s > 0; })
                 .sort(function(a, b){ return b.s - a.s; })
                 .map(function(r){ return r.p; });
    }
    if (!rows.length){ listEl.innerHTML = '<div class="empty">没有匹配的篇目，换个词试试。</div>'; return; }
    listEl.innerHTML = rows.map(function(p){
      var a = answered(p), tot = p.q.length, pct = tot ? Math.round(a / tot * 100) : 0;
      var flags = (p.fl || []).filter(function(f){ return f.indexOf("无答案") >= 0 || f.indexOf("答案码") >= 0; });
      return '<button class="card ' + p.g + '" data-key="' + p.key + '">' +
        '<div class="top"><span class="no">' + p.no + '</span>' +
        '<span class="name">' + esc(p.t) + '</span></div>' +
        '<div class="meta"><span class="bg">' + esc(p.tag) + '</span><span>' + tot + ' 题</span>' +
          (a ? '<span class="done">已答 ' + a + '／' + tot + '</span>' : '<span>未刷</span>') + '</div>' +
        (a ? '<div class="bar"><i style="width:' + pct + '%"></i></div>' : '') +
        (p.twin ? '<div class="twin">另有' + (p.g === "jd" ? "打卡版" : "精读版") + '（' + p.twin.q.length + ' 题）</div>' : '') +
        (flags.length ? '<div class="flag">' + esc(flags.join("；")) + '</div>' : '') +
      '</button>';
    }).join("");
  }
  listEl.addEventListener("click", function(e){
    var el = e.target.closest ? e.target.closest(".card") : null;
    if (el) openQuiz(el.getAttribute("data-key"), true);
  });
  document.getElementById("tabs").addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("button[data-g]") : null;
    if (!b) return;
    tabG = b.getAttribute("data-g");
    [].forEach.call(this.querySelectorAll("button"), function(x){ x.classList.toggle("on", x === b); });
    fillSrc(); renderList();
  });
  kwEl.addEventListener("input", renderList);
  srcEl.addEventListener("change", renderList);
  scopeEl.addEventListener("change", renderList);

  /* ---------------- 刷题 ---------------- */
  var quizEl = document.getElementById("quiz"), homeEl = document.getElementById("home");
  var qnoEl = document.getElementById("qno"), qnameEl = document.getElementById("qname"), progEl = document.getElementById("prog");
  var passageEl = document.getElementById("passage"), commonEl = document.getElementById("common"), paperEl = document.getElementById("paper");
  var transBody = document.getElementById("transBody"), transEl = document.getElementById("trans");
  var jdBody = document.getElementById("jdBody"), jdPanel = document.getElementById("jdpanel");
  var qwrap = document.getElementById("qwrap"), scoreEl = document.getElementById("score"), flagEl = document.getElementById("flag");
  var tbtn = document.getElementById("tbtn"), jdbtn = document.getElementById("jdbtn");
  var cur = null, curIdx = 0;

  function findPaper(key){
    for (var i = 0; i < PAPERS.length; i++) if (PAPERS[i].key === key) return i;
    return -1;
  }
  function openQuiz(key, push){
    var i = findPaper(key);
    if (i < 0) return;
    cur = PAPERS[i]; curIdx = i;
    homeEl.hidden = true; quizEl.hidden = false;
    if (push && location.hash !== "#" + key) location.hash = "#" + key;
    qnoEl.textContent = (cur.g === "jd" ? "精读 " : "打卡 ") + cur.no;
    qnoEl.className = "no" + (cur.g === "jd" ? " jd" : "");
    qnameEl.textContent = "　" + cur.t;
    paperEl.className = "paper" + (cur.g === "jd" ? " jd" : "");
    passageEl.innerHTML = cur.p.length
      ? cur.p.map(function(x){ return "<p>" + kx(x, cur.html) + "</p>"; }).join("")
      : "<p>（原文缺失）</p>";
    commonEl.hidden = !cur.common;
    commonEl.innerHTML = cur.common ? "<b>常识</b>　" + esc(cur.common) : "";
    transBody.innerHTML = cur.tr.length
      ? cur.tr.map(function(x){ return "<p>" + kx(x, false) + "</p>"; }).join("") : "";
    transEl.hidden = true;
    jdBody.innerHTML = cur.jd.length ? cur.jd.map(function(s){
      return '<div class="jdline">' +
        '<div class="jo">' + kx(s.o, true) + '</div>' +
        (s.notes && s.notes.length
          ? '<div class="jnote">' + s.notes.map(function(n){ return "【" + esc(n[0]) + "：" + esc(n[1]) + "】"; }).join("　") + '</div>'
          : '') +
        '<div class="jt">' + kx(s.t, true) + '</div>' +
      '</div>';
    }).join("") : "";
    jdPanel.hidden = true;
    tbtn.hidden = !cur.tr.length;
    tbtn.textContent = "显示译文";
    jdbtn.hidden = !cur.jd.length;
    jdbtn.textContent = "逐句精读";
    flagEl.innerHTML = (cur.fl && cur.fl.length)
      ? '<div class="res" style="margin:0 0 12px">原件提示：' + esc(cur.fl.join("；")) + '</div>' : "";
    renderQuestions(cur);
    window.scrollTo(0, 0);
    document.title = cur.t + " · 文言文题库";
  }

  function renderQuestions(p){
    var r = rec(p);
    qwrap.innerHTML = p.q.map(function(q, i){
      var opts;
      if (q.o && q.o.length){
        opts = q.o.map(function(text, oi){
          return '<button class="opt" data-i="' + i + '" data-oi="' + oi + '">' +
            '<span class="lt">' + LT[oi] + '</span><span class="tx">' + kx(text, p.html) + '</span></button>';
        }).join("");
      } else {
        opts = '<button class="opt" data-i="' + i + '" data-oi="-1">' +
          '<span class="lt">✎</span><span class="tx">' + (q.a ? "查看参考答案" : "查看提示") + '</span></button>';
      }
      return '<div class="qcard" id="q-' + i + '">' +
        '<div class="qhead"><span class="qnum">' + (i + 1) + '</span>' +
        '<span class="qtext">' + kx(q.s, p.html) + (q.s ? "" : "（题干缺失）") + '</span>' +
        (q.tag ? '<span class="qtag">' + esc(q.tag) + '</span>' : '') + '</div>' +
        opts + '<div class="resbox"></div></div>';
    }).join("");
    p.q.forEach(function(q, i){ if (r[i] != null) restore(p, i, r[i]); });
    updateProg(p);
  }
  function resBox(i){ var c = document.getElementById("q-" + i); return c ? c.querySelector(".resbox") : null; }
  function expHtml(q, p){
    return q.e ? '<div class="exp"><b>解析：</b>' + kx(q.e, p.html) + '</div>' : "";
  }
  function restore(p, i, val){
    var q = p.q[i], card = document.getElementById("q-" + i);
    if (!card) return;
    if (!q.o || !q.o.length){
      var box = resBox(i);
      if (box) box.innerHTML = '<div class="blank">参考答案：<b>' + (q.a ? esc(q.a) : "原件未提供") + '</b>' +
        expHtml(q, p) + '</div>';
      card.querySelector(".opt").classList.add("locked");
      return;
    }
    var buttons = card.querySelectorAll(".opt"), ok = /^[A-F]$/.test(q.a || "");
    for (var k = 0; k < buttons.length; k++){
      var el = buttons[k], oi = parseInt(el.getAttribute("data-oi"), 10);
      el.classList.add("locked");
      if (ok){
        if (LT[oi] === q.a) el.classList.add("right");
        if (LT[oi] === val && val !== q.a) el.classList.add("wrong");
      }
    }
    var b2 = resBox(i);
    if (!b2) return;
    if (!q.a) b2.innerHTML = '<div class="res">原件未提供答案，可对照译文理解。</div>';
    else if (ok) b2.innerHTML = '<div class="res ' + (val === q.a ? "ok" : "no") + '">' +
      (val === q.a ? "答对了" : "正确答案：<b>" + q.a + "</b>") + expHtml(q, p) + '</div>';
    else b2.innerHTML = '<div class="res">参考答案：<b>' + esc(q.a) + '</b>' + expHtml(q, p) + '</div>';
  }
  function choose(p, i, oi){
    var q = p.q[i];
    if (!q.o || !q.o.length){
      resBox(i).innerHTML = '<div class="blank">参考答案：<b>' + (q.a ? esc(q.a) : "原件未提供") + '</b>' +
        expHtml(q, p) + '</div>';
      document.getElementById("q-" + i).querySelector(".opt").classList.add("locked");
      return;
    }
    var picked = LT[oi];
    (store[p.key] || (store[p.key] = {}))[i] = picked; save();
    var buttons = document.getElementById("q-" + i).querySelectorAll(".opt");
    for (var k = 0; k < buttons.length; k++) buttons[k].classList.add("locked");
    restore(p, i, picked);
    updateProg(p);
  }
  qwrap.addEventListener("click", function(e){
    var el = e.target.closest ? e.target.closest(".opt") : null;
    if (!el || !cur || el.classList.contains("locked")) return;
    choose(cur, parseInt(el.getAttribute("data-i"), 10), parseInt(el.getAttribute("data-oi"), 10));
  });
  function updateProg(p){
    var a = answered(p), tot = p.q.length;
    progEl.textContent = "已答 " + a + " / " + tot;
    if (a >= tot && tot){
      var j = judgeable(p), c = correctCount(p), rate = j ? Math.round(c / j * 100) : 0;
      var word = rate >= 90 ? "很稳，可以直接冲下一篇了。" :
                 rate >= 75 ? "不错，错题对着解析或译文再过一遍就更牢了。" :
                 rate >= 60 ? "基本掌握，建议把错的字词抄一遍。" :
                              "别急，先看解析与逐句精读，再重做这一篇。";
      scoreEl.hidden = false;
      scoreEl.innerHTML = "<b>" + c + " / " + j + "</b>　正确率 " + rate + "%<br>" +
        '<span style="font-size:13.5px;color:#6b6b6b">' + esc(word) + '</span>';
    } else {
      scoreEl.hidden = true;
    }
  }

  function goHome(){
    quizEl.hidden = true; homeEl.hidden = false;
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
    document.title = "文言文题库 · 在线自测";
    renderStats(); renderList();
    window.scrollTo(0, 0);
  }
  document.getElementById("back").addEventListener("click", goHome);
  document.getElementById("floatHome").addEventListener("click", goHome);
  document.getElementById("phead").addEventListener("click", function(){ passageEl.hidden = !passageEl.hidden; });
  tbtn.addEventListener("click", function(){
    transEl.hidden = !transEl.hidden;
    this.textContent = transEl.hidden ? "显示译文" : "收起译文";
    if (!transEl.hidden) transEl.scrollIntoView({behavior:"smooth", block:"start"});
  });
  jdbtn.addEventListener("click", function(){
    jdPanel.hidden = !jdPanel.hidden;
    this.textContent = jdPanel.hidden ? "逐句精读" : "收起精读";
    if (!jdPanel.hidden) jdPanel.scrollIntoView({behavior:"smooth", block:"start"});
  });
  document.getElementById("rbtn").addEventListener("click", function(){
    if (!cur) return;
    if (!confirm("重做本篇？本篇的作答记录会清空。")) return;
    delete store[cur.key]; save();
    renderQuestions(cur); updateProg(cur); renderStats();
  });
  document.getElementById("nbtn").addEventListener("click", function(){
    if (!cur) return;
    openQuiz(PAPERS[(curIdx + 1) % PAPERS.length].key, true);
  });
  window.addEventListener("hashchange", function(){
    var m = /#(jd\d+|\d+)/.exec(location.hash);
    if (m) openQuiz(m[1], false); else goHome();
  });

  /* ---------------- 启动 ---------------- */
  fillSrc(); renderStats(); renderList();
  var m0 = /#(jd\d+|\d+)/.exec(location.hash);
  if (m0) openQuiz(m0[1], false);
})();
</script>
</body>
</html>
