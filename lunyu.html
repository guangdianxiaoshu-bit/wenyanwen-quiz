<script>
const questions = [
  { tag: "字词释义", q: '“是<span class="highlight">知</span>也”中“<span class="highlight">知</span>”的读音和意思是？',
    options: ["zhī，知道", "zhì，同“智”，智慧", "zhī，知识", "zhì，知觉"], answer: 1,
    explain: '“知”是通假字，同“智”，读zhì，意为“智慧”。知道就是知道，不知道就是不知道，这就是智慧。' },
  { tag: "字词释义", q: '“<span class="highlight">敏</span>而好学”中“<span class="highlight">敏</span>”的意思是？',
    options: ["聪敏", "敏捷", "敏感", "勤奋"], answer: 0,
    explain: '“敏”此处指聪敏。聪明而又喜好学习。' },
  { tag: "字词释义", q: '“敏而<span class="highlight">好</span>学”中“<span class="highlight">好</span>”的意思是？',
    options: ["良好", "爱好", "好处", "友好"], answer: 1,
    explain: '“好”读hào，意为“喜好、爱好”。聪明而又喜好学习。' },
  { tag: "字词释义", q: '“不<span class="highlight">耻</span>下问”中“<span class="highlight">耻</span>”的意思是？',
    options: ["羞耻", "耻辱", "以……为耻", "可耻"], answer: 2,
    explain: '“耻”是意动用法，意为“以……为耻”。不以向别人请教为耻。' },
  { tag: "字词释义", q: '“不耻<span class="highlight">下问</span>”中“<span class="highlight">下问</span>”的意思是？',
    options: ["向下问", "向地位、学问不如自己的人请教", "低声地问", "谦虚地问"], answer: 1,
    explain: '“下问”指向地位、学问不如自己的人请教。' },
  { tag: "字词释义", q: '“默而<span class="highlight">识</span>之”中“<span class="highlight">识</span>”的读音和意思是？',
    options: ["shí，认识", "shí，知识", "zhì，记住", "zhì，识别"], answer: 2,
    explain: '“识”读zhì，意为“记住”。默默地记住所学的知识。' },
  { tag: "字词释义", q: '“学而不<span class="highlight">厌</span>”中“<span class="highlight">厌</span>”的意思是？',
    options: ["讨厌", "厌烦", "满足", "厌倦"], answer: 2,
    explain: '“厌”意为“满足”。学习不知道满足。' },
  { tag: "字词释义", q: '“<span class="highlight">诲</span>人不倦”中“<span class="highlight">诲</span>”的意思是？',
    options: ["悔恨", "教诲", "学习", "商量"], answer: 1,
    explain: '“诲”意为“教诲”。教导别人不知疲倦。' },
  { tag: "字词释义", q: '“<span class="highlight">敏</span>以求之者也”中“<span class="highlight">敏</span>”的意思是？',
    options: ["聪敏", "勤勉", "敏捷", "敏感"], answer: 1,
    explain: '“敏”此处指勤勉。勤奋敏捷地去求得知识。' },
  { tag: "字词释义", q: '“学如不<span class="highlight">及</span>”中“<span class="highlight">及</span>”的意思是？',
    options: ["以及", "到达", "赶得上", "及时"], answer: 2,
    explain: '“及”意为“赶得上”。学习就像追赶什么似的，唯恐赶不上。' },
  { tag: "字词释义", q: '“<span class="highlight">犹</span>恐失之”中“<span class="highlight">犹</span>”的意思是？',
    options: ["还", "犹如", "犹豫", "尤其"], answer: 0,
    explain: '“犹”意为“还，尚且”。学到了，还唯恐丢失了。' },
  { tag: "字词释义", q: '“吾<span class="highlight">尝</span>终日不食”中“<span class="highlight">尝</span>”的意思是？',
    options: ["品尝", "曾经", "尝试", "偿还"], answer: 1,
    explain: '“尝”意为“曾经”。我曾经整天不吃饭。' },
  { tag: "字词释义", q: '“吾尝<span class="highlight">终日</span>不食”中“<span class="highlight">终日</span>”的意思是？',
    options: ["整天", "太阳", "终于", "一天"], answer: 0,
    explain: '“终日”意为“整天”。我曾经整天不吃饭。' },
  { tag: "字词释义", q: '“以思，无<span class="highlight">益</span>”中“<span class="highlight">益</span>”的意思是？',
    options: ["益处", "增加", "有益", "溢出"], answer: 0,
    explain: '“益”意为“益处、好处”。用来思考没有益处，不如去学习。' },
  { tag: "内容理解", q: '“知之为知之，不知为不知，是知也”告诉我们什么道理？',
    options: ["做人要谦虚", "要诚实，知道就是知道，不知道就是不知道", "要多向别人请教", "做人要聪明"], answer: 1,
    explain: '这则语录告诉我们：对待知识要诚实，不不懂装懂，这才是真正的智慧。' },
  { tag: "内容理解", q: '“学如不及，犹恐失之”表达了怎样的学习态度？',
    options: ["学习要慢慢来", "学习要争分夺秒，唯恐落后", "学习不重要", "学习要劳逸结合"], answer: 1,
    explain: '这句话形容学习时唯恐赶不上、唯恐丢失的紧迫感，表达了勤勉努力、分秒必争的学习态度。' }
];

const sentenceData = [
  { original: "①知之为知之，不知为不知，是知也。", notes: [{ word: "知", meaning: "同“智”，智慧" }], trans: "知道就是知道，不知道就是不知道，这就是智慧。" },
  { original: "②敏而好学，不耻下问。", notes: [{ word: "敏", meaning: "聪敏" }, { word: "好", meaning: "喜好" }, { word: "耻", meaning: "以……为耻" }, { word: "下问", meaning: "向地位、学问不如自己的人请教" }], trans: "聪敏而又喜好学习，不以向地位、学问不如自己的人请教为耻。" },
  { original: "③默而识之，学而不厌，诲人不倦。", notes: [{ word: "识", meaning: "记住" }, { word: "厌", meaning: "满足" }, { word: "诲", meaning: "教诲" }], trans: "默默地记住所学的知识，学习不知道满足，教诲别人不知疲倦。" },
  { original: "④我非生而知之者，好古，敏以求之者也。", notes: [{ word: "敏", meaning: "勤勉" }], trans: "我不是生来就懂得知识的人，而是喜好古代文化，勤奋敏捷地去求得知识的人。" },
  { original: "⑤学如不及，犹恐失之。", notes: [{ word: "及", meaning: "赶得上" }, { word: "犹", meaning: "还" }], trans: "学习就像追赶什么似的，唯恐赶不上；学到了，还唯恐丢失了。" },
  { original: "⑥吾尝终日不食，终夜不寝，以思，无益，不如学也。", notes: [{ word: "尝", meaning: "曾经" }, { word: "终日", meaning: "整天" }, { word: "益", meaning: "益处" }], trans: "我曾经整天不吃饭，整夜不睡觉，用来思考，但没有益处，不如去学习。" }
];

const container = document.getElementById('questionsContainer');
const submitBtn = document.getElementById('submitBtn');
const resetBtn = document.getElementById('resetBtn');
const resultPanel = document.getElementById('resultPanel');
const scoreNum = document.getElementById('scoreNum');
const correctCountEl = document.getElementById('correctCount');
const resultStars = document.getElementById('resultStars');
const scoreComment = document.getElementById('scoreComment');
const toast = document.getElementById('toast');
const translationPanel = document.getElementById('translationPanel');
const translationContent = document.getElementById('translationContent');
const STORAGE_PREFIX = 'lunyu_';

let submitted = false;
let shuffles = {};

function shuffleArray(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function generateShuffles() { for (let i = 0; i < questions.length; i++) { shuffles[i] = shuffleArray([0, 1, 2, 3]); } localStorage.setItem(STORAGE_PREFIX + 's', JSON.stringify(shuffles)); }
function loadShuffles() { try { const s = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 's')); if (s && Object.keys(s).length == questions.length) { shuffles = s; return; } } catch (e) {} generateShuffles(); }

function renderTranslation() {
  translationContent.innerHTML = '';
  for (let si = 0; si < sentenceData.length; si++) { const s = sentenceData[si];
    const block = document.createElement('div'); block.className = 'sentence-block';
    const orig = document.createElement('div'); orig.className = 's-line s-line-original'; orig.innerHTML = '<span class="s-label">原文</span>' + s.original; block.appendChild(orig);
    if (s.notes.length > 0) { const notes = document.createElement('div'); notes.className = 's-line s-line-notes'; notes.innerHTML = '<span class="s-label">注释</span>' + s.notes.map(n => '<span class="note-word">【' + n.word + '：' + n.meaning + '】</span>').join(''); block.appendChild(notes); }
    const trans = document.createElement('div'); trans.className = 's-line s-line-trans'; trans.innerHTML = '<span class="s-label">译文</span>' + s.trans; block.appendChild(trans);
    translationContent.appendChild(block);
  }
}

function renderQuestions() {
  container.innerHTML = '';
  for (let qi = 0; qi < questions.length; qi++) { const q = questions[qi];
    const card = document.createElement('div'); card.className = 'q-card'; card.id = 'q' + qi;
    const letters = ['A', 'B', 'C', 'D']; const order = shuffles[qi] || [0, 1, 2, 3];
    let oh = '<div class="q-header"><span class="q-num">' + (qi + 1) + '</span><span class="q-tag">' + q.tag + '</span></div><div class="q-text">' + q.q + '</div><div class="opts">';
    for (let oi = 0; oi < 4; oi++) { const d = order[oi]; oh += '<label data-q="' + qi + '" data-o="' + d + '" onclick="selectOption(' + qi + ', ' + d + ')"><input type="radio" name="q' + qi + '" value="' + d + '"><span class="opt-letter">' + letters[oi] + '</span>' + q.options[d] + '</label>'; }
    oh += '</div><div class="explanation" id="exp' + qi + '"><span class="result-tag" id="tag' + qi + '"></span><strong>解析：</strong>' + q.explain + '</div>';
    card.innerHTML = oh;
    container.appendChild(card);
  }
}

function selectOption(qIdx, optIdx) {
  if (submitted) return;
  const labels = document.querySelectorAll('label[data-q="' + qIdx + '"]'); for (let i = 0; i < labels.length; i++) { labels[i].classList.remove('selected'); }
  const label = document.querySelector('label[data-q="' + qIdx + '"][data-o="' + optIdx + '"]'); if (label) label.classList.add('selected');
  const answers = getStoredAnswers(); answers[qIdx] = optIdx;
  localStorage.setItem(STORAGE_PREFIX + 'a', JSON.stringify(answers));
  const done = getAnswered();
  if (done.indexOf(qIdx) == -1) { done.push(qIdx); localStorage.setItem(STORAGE_PREFIX + 'd', JSON.stringify(done)); }
  updateProgress(); checkSubmitReady();
}

function getStoredAnswers() { try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'a')) || {}; } catch (e) { return {}; } }
function getAnswered() { try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'd')) || []; } catch (e) { return []; } }

function restoreFromStorage() {
  const answers = getStoredAnswers(); const answered = getAnswered();
  if (!answered.length) return;
  const keys = Object.keys(answers);
  for (let ki = 0; ki < keys.length; ki++) { const idx = parseInt(keys[ki]); const opt = answers[keys[ki]]; const label = document.querySelector('label[data-q="' + idx + '"][data-o="' + opt + '"]'); if (label) { label.classList.add('selected'); const r = label.querySelector('input'); if (r) r.checked = true; } }
  updateProgress(); checkSubmitReady();
}

function updateProgress() { const done = getAnswered().length; const total = questions.length; document.getElementById('fpMain').textContent = '已答 ' + done + ' / ' + total + ' 题'; }

  var progMenu = document.getElementById('progMenu');
  var floatProgEl = document.getElementById('floatProg');
  function renderProgMenu(){
    var html = '<div class="pm-title">答题进度 · 点击题号跳转</div>';
    var no = 0;
    questions.forEach(function(q, i){
      if(q.seg) return;
      no++;
      var stCls, stTxt;
      if(submitted){
        var card = document.getElementById('q-' + i);
        if(card && card.classList.contains('correct')){ stCls = 'pm-ok'; stTxt = '✅'; }
        else { stCls = 'pm-bad'; stTxt = '❌'; }
      } else {
        if(getAnswered().indexOf(i) >= 0){ stCls = 'pm-done'; stTxt = '已完成'; }
        else { stCls = 'pm-undone'; stTxt = '未完成'; }
      }
      html += '<div class="pm-item" data-i="' + i + '"><span class="pm-no">第' + no + '题</span><span class="' + stCls + '">' + stTxt + '</span></div>';
    });
    progMenu.innerHTML = html;
  }
  if (floatProgEl) {
    floatProgEl.addEventListener('click', function(e){
      e.stopPropagation();
      if(progMenu.style.display === 'block'){ progMenu.style.display = 'none'; return; }
      renderProgMenu();
      progMenu.style.display = 'block';
    });
  }
  document.addEventListener('click', function(e){
    var item = e.target.closest ? e.target.closest('.pm-item') : null;
    if(item){
      var card = document.getElementById('q-' + item.getAttribute('data-i'));
      if(card) card.scrollIntoView({behavior:'smooth', block:'center'});
      progMenu.style.display = 'none';
      return;
    }
    if(progMenu.style.display === 'block' && !(e.target.closest ? e.target.closest('#progMenu') : null) && e.target !== floatProgEl){
      progMenu.style.display = 'none';
    }
  });
  function checkSubmitReady() { const done = getAnswered().length; const total = questions.length; submitBtn.disabled = done < total; submitBtn.textContent = done == total ? '📋 提交批改' : '📋 提交批改（还差 ' + (total - done) + ' 题）'; }

submitBtn.addEventListener('click', function() {
  if (submitted) return;
  if (submitBtn.disabled) { toast.textContent = '请先完成所有题目再提交'; toast.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function() { toast.classList.remove('show'); }, 2000); return; }
  submitted = true;
  const answers = getStoredAnswers(); let correct = 0;
  for (let i = 0; i < questions.length; i++) {
    const q = questions[i]; const ua = answers[i]; const isCorrect = ua === q.answer; if (isCorrect) correct++; else { try { var _wl = JSON.parse(localStorage.getItem('gd_wrong') || '[]'); _wl.push({ paper: '《古人谈读书之论语》', time: new Date().toLocaleString(), tag: q.tag, q: q.q, options: q.options, userAns: ua, correct: q.answer, explain: q.explain }); localStorage.setItem('gd_wrong', JSON.stringify(_wl)); } catch (e) {} }
    document.getElementById('q' + i).classList.add(isCorrect ? 'correct' : 'wrong');
    const labels = document.querySelectorAll('label[data-q="' + i + '"]'); for (let li = 0; li < labels.length; li++) { labels[li].classList.add('disabled'); }
    const cl = document.querySelector('label[data-q="' + i + '"][data-o="' + q.answer + '"]'); if (cl) cl.classList.add('show-correct');
    if (!isCorrect && ua !== undefined) { const wl = document.querySelector('label[data-q="' + i + '"][data-o="' + ua + '"]'); if (wl) wl.classList.add('show-wrong'); }
    const exp = document.getElementById('exp' + i); exp.classList.add('show');
    const tag = document.getElementById('tag' + i); tag.className = isCorrect ? 'result-tag correct-tag' : 'result-tag wrong-tag'; tag.textContent = isCorrect ? '✓ 正确' : '✗ 错误';
  }
  resultPanel.classList.add('show'); scoreNum.textContent = correct + '/' + questions.length; correctCountEl.textContent = correct;
  const pct = correct / questions.length; let stars = ''; let comment = '';
  if (pct >= 0.9) { stars = '⭐⭐⭐⭐⭐'; comment = '🏆 掌握扎实，功底深厚！'; }
  else if (pct >= 0.75) { stars = '⭐⭐⭐⭐'; comment = '👏 掌握得很不错！继续加油！'; }
  else if (pct >= 0.5) { stars = '⭐⭐⭐'; comment = '💪 基础还可以，再复习一遍课下注释吧。'; }
  else { stars = '⭐⭐'; comment = '📖 建议熟读课文，理解每个字的意思。'; }
  resultStars.textContent = stars; scoreComment.textContent = comment;
  submitBtn.disabled = true; submitBtn.textContent = '✅ 已批改';
  renderTranslation(); translationPanel.classList.add('show');
  setTimeout(function() { resultPanel.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 200);
  localStorage.setItem(STORAGE_PREFIX + 'sub', 'true');
  localStorage.removeItem(STORAGE_PREFIX + 'a');
  localStorage.removeItem(STORAGE_PREFIX + 'd');
  localStorage.removeItem(STORAGE_PREFIX + 'sub');
});

resetBtn.addEventListener('click', function() {
  if (submitted && !confirm('重新答题将清除当前成绩，确定吗？')) return;
  submitted = false;
  ['a', 'd', 'sub', 's'].forEach(function(k) { localStorage.removeItem(STORAGE_PREFIX + k); });
  document.querySelectorAll('.q-card').forEach(function(c) { c.className = 'q-card'; });
  document.querySelectorAll('.opts label').forEach(function(l) { l.className = ''; const r = l.querySelector('input'); if (r) r.checked = false; });
  document.querySelectorAll('.explanation').forEach(function(e) { e.classList.remove('show'); });
  translationPanel.classList.remove('show'); resultPanel.classList.remove('show');
  submitBtn.disabled = true; submitBtn.textContent = '📋 提交批改';
  generateShuffles(); renderQuestions(); updateProgress();
  scrollTo({ top: 0, behavior: 'smooth' });
});

localStorage.removeItem(STORAGE_PREFIX + 'answers'); localStorage.removeItem(STORAGE_PREFIX + 'done'); localStorage.removeItem(STORAGE_PREFIX + 'submitted'); generateShuffles(); renderQuestions();
</script>
