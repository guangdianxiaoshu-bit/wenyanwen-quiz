<div class="sticky-original" id="stickyOriginal">
  <strong>原文</strong> 蜀中有杜处士，<u>好</u>书画，所<u>宝</u><u>以</u>百<u>数</u>。有戴嵩《牛》一轴，<u>尤</u>所爱，<u>锦囊玉轴</u>，常以自随。一日曝书画，有一牧童见之，<u>拊(fǔ)</u>掌大笑，曰：“此画斗牛也。牛斗，力在角，尾<u>搐</u>入两<u>股</u>间，今<u>乃</u><u>掉</u>尾而斗，<u>谬(miù)</u>矣。”处士笑<u>而</u><u>然</u>之。古语有云：“耕当问奴，织当问婢。”不可改也。<br>
  <strong>常识</strong> 本文作者是宋代的苏轼。戴嵩，唐代画家。处士，本指有德才而不愿去做官的人，后来也指未做官的士人。

<script>
const questions = [
  { tag: "字词释义", q: '“<span class="highlight">好</span>书画”中“<span class="highlight">好</span>”的意思是？',
    options: ["喜爱", "良好", "好事", "友好"], answer: 0,
    explain: '“好”读hào，意为“喜爱”。喜爱书画。' },
  { tag: "字词释义", q: '“所<span class="highlight">宝</span>以百数”中“<span class="highlight">宝</span>”的意思是？',
    options: ["珍宝", "珍藏", "宝贝", "宝贵"], answer: 1,
    explain: '“宝”名词作动词，意为“珍藏”。所珍藏的（书画）。' },
  { tag: "字词释义", q: '“所宝<span class="highlight">以</span>百数”中“<span class="highlight">以</span>”的意思是？',
    options: ["用，凭", "因为", "所以", "以为"], answer: 0,
    explain: '“以”意为“用，凭”。所珍藏的书画用百来计算。' },
  { tag: "字词释义", q: '“所宝以百<span class="highlight">数</span>”中“<span class="highlight">数</span>”的意思是？',
    options: ["数字", "计算", "数量", "数次"], answer: 1,
    explain: '“数”意为“计算”。所珍藏的书画用百来计算，即成百件。' },
  { tag: "字词释义", q: '“<span class="highlight">尤</span>所爱”中“<span class="highlight">尤</span>”的意思是？',
    options: ["尤其", "仍然", "优秀", "犹豫"], answer: 0,
    explain: '“尤”意为“尤其”。其中他尤其珍爱《牛》这幅画。' },
  { tag: "字词释义", q: '“<span class="highlight">锦囊玉轴</span>”中“<span class="highlight">锦囊玉轴</span>”的意思是？',
    options: ["用锦缎作画囊，用玉作画轴（名词作动词）", "锦缎做的囊、玉做的轴（名词）", "锦缎和玉做的盒子", "用锦缎包着的玉轴"], answer: 0,
    explain: '“锦囊玉轴”是名词作动词，意为“用锦缎作画囊，用玉作画轴”。' },
  { tag: "字词释义", q: '“<span class="highlight">拊</span>掌大笑”中“<span class="highlight">拊</span>”的读音和意思是？',
    options: ["fǔ，拍", "fù，抚摸", "fǔ，扶持", "pǔ，拍"], answer: 0,
    explain: '“拊”读fǔ，意为“拍”。“拊掌”即拍手。' },
  { tag: "字词释义", q: '“尾<span class="highlight">搐</span>入两股间”中“<span class="highlight">搐</span>”的意思是？',
    options: ["抽缩", "抽搐", "抽打", "压缩"], answer: 0,
    explain: '“搐”意为“抽缩”。尾巴收缩夹在两腿之间。' },
  { tag: "字词释义", q: '“尾搐入两<span class="highlight">股</span>间”中“<span class="highlight">股</span>”的意思是？',
    options: ["大腿", "屁股", "股份", "一股"], answer: 0,
    explain: '“股”意为“大腿”。“两股”即两条大腿。' },
  { tag: "字词释义", q: '“今<span class="highlight">乃</span>掉尾而斗”中“<span class="highlight">乃</span>”的意思是？',
    options: ["却", "于是", "才", "竟然"], answer: 0,
    explain: '“乃”意为“却”，表转折。如今这幅画却画成牛摇着尾巴相斗。' },
  { tag: "字词释义", q: '“今乃<span class="highlight">掉</span>尾而斗”中“<span class="highlight">掉</span>”的意思是？',
    options: ["摆动，摇", "掉下", "丢失", "旋转"], answer: 0,
    explain: '“掉”意为“摆动，摇”。“掉尾”即摇着尾巴。' },
  { tag: "字词释义", q: '“<span class="highlight">谬</span>矣”中“<span class="highlight">谬</span>”的读音和意思是？',
    options: ["miù，错误", "miào，错误", "miù，荒谬", "miào，巧妙"], answer: 0,
    explain: '“谬”读miù，意为“错误”。这是错误的啊！' },
  { tag: "字词释义", q: '“处士笑<span class="highlight">而</span>然之”中“<span class="highlight">而</span>”的意思是？',
    options: ["表修饰，笑着", "表转折，却", "表顺承，然后", "表并列，并且"], answer: 0,
    explain: '“而”表修饰关系，连接“笑”和“然之”，意为“笑着”。处士笑着认为他说得对。' },
  { tag: "字词释义", q: '“处士笑而<span class="highlight">然</span>之”中“<span class="highlight">然</span>”的意思是？',
    options: ["认为……对", "然而", "这样", "燃烧"], answer: 0,
    explain: '“然”是意动用法，意为“认为……对”。“然之”即认为他说得对。' },
  { tag: "内容理解", q: '牧童为什么说这幅《斗牛图》画错了？',
    options: ["牛不应该画尾巴", "牛相斗时尾巴夹在两腿间，画里却是摇着尾巴", "牛角画得不对", "牛的颜色不对"], answer: 1,
    explain: '牧童说牛相斗时“力在角，尾搐入两股间”，而画里却是“掉尾而斗”，与实情不符，所以说画错了。' },
  { tag: "内容理解", q: '“耕当问奴，织当问婢”告诉我们什么道理？',
    options: ["要听奴仆的话", "遇到事情要向有实践经验的人请教", "农夫和织女最聪明", "不要相信别人"], answer: 1,
    explain: '“奴”“婢”是常年耕田、织布的人，最有实践经验。这句话告诉我们：遇事要向有实践经验的人请教，不可凭空臆断。' }
];

const sentenceData = [
  { original: "蜀中有杜处士，好书画，所宝以百数。", notes: [{ word: "好", meaning: "喜爱" }, { word: "宝", meaning: "珍藏" }, { word: "以", meaning: "用，凭" }, { word: "数", meaning: "计算" }], trans: "蜀地有位姓杜的处士，喜爱书画，他珍藏的书画作品有成百件之多。" },
  { original: "有戴嵩《牛》一轴，尤所爱，锦囊玉轴，常以自随。", notes: [{ word: "尤", meaning: "尤其" }, { word: "锦囊玉轴", meaning: "用锦缎作画囊，用玉作画轴" }], trans: "其中有一幅戴嵩画的《牛》，他尤其珍爱，用锦缎做囊、玉石做轴来装裱，常常随身携带。" },
  { original: "一日曝书画，有一牧童见之，拊掌大笑，曰：\u201c此画斗牛也。牛斗，力在角，尾搐入两股间，今乃掉尾而斗，谬矣。\u201d", notes: [{ word: "拊", meaning: "拍" }, { word: "搐", meaning: "抽缩" }, { word: "股", meaning: "大腿" }, { word: "乃", meaning: "却" }, { word: "掉", meaning: "摆动，摇" }, { word: "谬", meaning: "错误" }], trans: "一天，杜处士晾晒书画时，有个牧童看见这幅《牛》，拍手大笑着说：\u201c这画的是斗牛啊！牛相斗时，力量集中在牛角上，尾巴会收缩夹在两腿之间，如今这幅画却画成牛摇着尾巴相斗，真是错了。\u201d" },
  { original: "处士笑而然之。", notes: [{ word: "而", meaning: "表修饰，笑着" }, { word: "然", meaning: "认为……对" }], trans: "杜处士笑着认为牧童说得对。" },
  { original: "古语有云：\u201c耕当问奴，织当问婢。\u201d不可改也。", notes: [], trans: "古语说：\u201c耕种的事要问农夫，纺织的事要问织女。\u201d这是不可改变的道理。" }
];

const container = document.getElementById('questionsContainer');
const submitBtn = document.getElementById('submitBtn');
const resetBtn = document.getElementById('resetBtn');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const resultPanel = document.getElementById('resultPanel');
const scoreNum = document.getElementById('scoreNum');
const correctCountEl = document.getElementById('correctCount');
const resultStars = document.getElementById('resultStars');
const scoreComment = document.getElementById('scoreComment');
const toast = document.getElementById('toast');
const translationPanel = document.getElementById('translationPanel');
const translationContent = document.getElementById('translationContent');
const STORAGE_PREFIX = 'daisong_';

let submitted = false;
let shuffles = {};

function shuffleArray(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function generateShuffles() {
  for (let i = 0; i < questions.length; i++) { shuffles[i] = shuffleArray([0, 1, 2, 3]); }
  localStorage.setItem(STORAGE_PREFIX + 's', JSON.stringify(shuffles));
  localStorage.removeItem(STORAGE_PREFIX + 'a');
  localStorage.removeItem(STORAGE_PREFIX + 'd');
  localStorage.removeItem(STORAGE_PREFIX + 'sub');
}

function renderTranslation() {
  translationContent.innerHTML = '';
  for (let si = 0; si < sentenceData.length; si++) { const s = sentenceData[si];
    const block = document.createElement('div'); block.className = 'sentence-block';
    const orig = document.createElement('div'); orig.className = 's-line s-line-original'; orig.innerHTML = '<span class="s-label">原文</span>' + s.original; block.appendChild(orig);
    if (s.notes.length > 0) { const notes = document.createElement('div'); notes.className = 's-line s-line-notes'; notes.innerHTML = '<span class="s-label">注释</span>' + s.notes.map(n => '<span class="note-word">【' + n.word + '：' + n.meaning + '】</span>').join(''); block.appendChild(notes); }
    const trans = document.createElement('div'); trans.className = 's-line s-line-trans'; trans.innerHTML = '<span class="s-label">译文</span>' + s.trans; block.appendChild(trans);
    translationContent.appendChild(block);
  }
}

function renderQuestions() {
  container.innerHTML = '';
  for (let qi = 0; qi < questions.length; qi++) { const q = questions[qi];
    const card = document.createElement('div'); card.className = 'q-card'; card.id = 'q' + qi;
    const letters = ['A', 'B', 'C', 'D']; const order = shuffles[qi] || [0, 1, 2, 3];
    let oh = '<div class="q-header"><span class="q-num">' + (qi + 1) + '</span><span class="q-tag">' + q.tag + '</span></div><div class="q-text">' + q.q + '</div><div class="opts">';
    for (let oi = 0; oi < 4; oi++) { const d = order[oi]; oh += '<label data-q="' + qi + '" data-o="' + d + '" onclick="selectOption(' + qi + ', ' + d + ')"><input type="radio" name="q' + qi + '" value="' + d + '"><span class="opt-letter">' + letters[oi] + '</span>' + q.options[d] + '</label>'; }
    oh += '</div><div class="explanation" id="exp' + qi + '"><span class="result-tag" id="tag' + qi + '"></span><strong>解析：</strong>' + q.explain + '</div>';
    card.innerHTML = oh;
    container.appendChild(card);
  }
}

function selectOption(qIdx, optIdx) {
  if (submitted) return;
  const labels = document.querySelectorAll('label[data-q="' + qIdx + '"]'); for (let i = 0; i < labels.length; i++) { labels[i].classList.remove('selected'); }
  const label = document.querySelector('label[data-q="' + qIdx + '"][data-o="' + optIdx + '"]'); if (label) label.classList.add('selected');
  const answers = getStoredAnswers(); answers[qIdx] = optIdx;
  localStorage.setItem(STORAGE_PREFIX + 'a', JSON.stringify(answers));
  const done = getAnswered();
  if (done.indexOf(qIdx) == -1) { done.push(qIdx); localStorage.setItem(STORAGE_PREFIX + 'd', JSON.stringify(done)); }
  updateProgress(); checkSubmitReady();
}

function getStoredAnswers() { try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'a')) || {}; } catch (e) { return {}; } }
function getAnswered() { try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'd')) || []; } catch (e) { return []; } }

function updateProgress() { const done = getAnswered().length; const total = questions.length; progressFill.style.width = Math.min(Math.round((done / total) * 100), 100) + '%'; progressText.textContent = '已答 ' + done + ' / ' + total + ' 题'; }
function checkSubmitReady() { const done = getAnswered().length; const total = questions.length; submitBtn.disabled = done < total; submitBtn.textContent = done == total ? '📋 提交批改' : '📋 提交批改（还差 ' + (total - done) + ' 题）'; }

submitBtn.addEventListener('click', function() {
  if (submitted) return;
  if (submitBtn.disabled) { toast.textContent = '请先完成所有题目再提交'; toast.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function() { toast.classList.remove('show'); }, 2000); return; }
  submitted = true;
  const answers = getStoredAnswers(); let correct = 0;
  for (let i = 0; i < questions.length; i++) {
    const q = questions[i]; const ua = answers[i]; const isCorrect = ua === q.answer; if (isCorrect) correct++;
    document.getElementById('q' + i).classList.add(isCorrect ? 'correct' : 'wrong');
    const labels = document.querySelectorAll('label[data-q="' + i + '"]'); for (let li = 0; li < labels.length; li++) { labels[li].classList.add('disabled'); }
    const cl = document.querySelector('label[data-q="' + i + '"][data-o="' + q.answer + '"]'); if (cl) cl.classList.add('show-correct');
    if (!isCorrect && ua !== undefined) { const wl = document.querySelector('label[data-q="' + i + '"][data-o="' + ua + '"]'); if (wl) wl.classList.add('show-wrong'); }
    const exp = document.getElementById('exp' + i); exp.classList.add('show');
    const tag = document.getElementById('tag' + i); tag.className = isCorrect ? 'result-tag correct-tag' : 'result-tag wrong-tag'; tag.textContent = isCorrect ? '✓ 正确' : '✗ 错误';
  }
  resultPanel.classList.add('show'); scoreNum.textContent = correct + '/' + questions.length; correctCountEl.textContent = correct;
  const pct = correct / questions.length; let stars = ''; let comment = '';
  if (pct >= 0.9) { stars = '⭐⭐⭐⭐⭐'; comment = '🏆 太厉害了！你是古文小达人！'; }
  else if (pct >= 0.75) { stars = '⭐⭐⭐⭐'; comment = '👏 掌握得很不错！继续加油！'; }
  else if (pct >= 0.5) { stars = '⭐⭐⭐'; comment = '💪 基础还可以，再复习一遍课下注释吧。'; }
  else { stars = '⭐⭐'; comment = '📖 建议熟读课文，理解每个字的意思。'; }
  resultStars.textContent = stars; scoreComment.textContent = comment;
  submitBtn.disabled = true; submitBtn.textContent = '✅ 已批改';
  renderTranslation(); translationPanel.classList.add('show');
  setTimeout(function() { resultPanel.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 200);
  localStorage.setItem(STORAGE_PREFIX + 'sub', 'true');
});

resetBtn.addEventListener('click', function() {
  if (submitted && !confirm('重新答题将清除当前成绩，确定吗？')) return;
  submitted = false;
  ['a', 'd', 'sub', 's'].forEach(function(k) { localStorage.removeItem(STORAGE_PREFIX + k); });
  document.querySelectorAll('.q-card').forEach(function(c) { c.className = 'q-card'; });
  document.querySelectorAll('.opts label').forEach(function(l) { l.className = ''; const r = l.querySelector('input'); if (r) r.checked = false; });
  document.querySelectorAll('.explanation').forEach(function(e) { e.classList.remove('show'); });
  translationPanel.classList.remove('show'); resultPanel.classList.remove('show');
  submitBtn.disabled = true; submitBtn.textContent = '📋 提交批改';
  generateShuffles(); renderQuestions(); updateProgress();
  scrollTo({ top: 0, behavior: 'smooth' });
});

generateShuffles(); renderQuestions();
</script>
</body>
</html>
