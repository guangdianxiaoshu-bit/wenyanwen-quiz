<script>
const questions = [
  { seg: "晋<span class='jz' data-tip='太元：东晋孝武帝年号（376—396）'>太元</span>中，武陵人捕鱼为业。<u>缘</u>溪行，忘路之远近。忽逢桃花林，<u>夹岸</u>数百步，中无杂树，芳草<u>鲜美</u>，<u>落英</u><u>缤纷</u>。渔人甚异之，复<u>前</u>行，欲<u>穷</u>其林。" },
  { tag: "字词释义", q: '“<span class="highlight">缘</span>溪行”中“<span class="highlight">缘</span>”的意思是？', options: ["沿着", "缘由", "因为", "缘分"], answer: 0, explain: '“缘”意为“沿着、顺着”。“缘溪行”即顺着溪水划行。' },
  { tag: "字词释义", q: '“<span class="highlight">夹岸</span>数百步”中“<span class="highlight">夹岸</span>”的意思是？', options: ["两岸", "夹着岸", "岸边", "两岸之间"], answer: 0, explain: '“夹岸”即两岸。' },
  { tag: "字词释义", q: '“芳草<span class="highlight">鲜美</span>”中“<span class="highlight">鲜美</span>”的意思是？', options: ["鲜艳", "新鲜美味", "味道鲜美", "鲜嫩美丽"], answer: 3, explain: '“鲜美”意为“鲜嫩美丽”，是古今异义词（今义指味道鲜美）。' },
  { tag: "字词释义", q: '“<span class="highlight">落英</span>缤纷”中“<span class="highlight">落英</span>”的意思是？', options: ["落花", "花", "花瓣", "落叶"], answer: 0, explain: '“落英”指落花。“英”指花。' },
  { tag: "字词释义", q: '“落英<span class="highlight">缤纷</span>”中“<span class="highlight">缤纷</span>”的意思是？', options: ["繁多而错杂的样子", "缤纷（今义）", "纷纷", "繁多"], answer: 0, explain: '“缤纷”形容落花繁多而错杂的样子。' },
  { tag: "字词释义", q: '“复<span class="highlight">前</span>行”中“<span class="highlight">前</span>”的活用和意思是？', options: ["名词作状语，向前", "前面", "前进", "先前"], answer: 0, explain: '“前”名词作状语，意为“向前”。“复前行”即又向前划行。' },
  { tag: "字词释义", q: '“欲<span class="highlight">穷</span>其林”中“<span class="highlight">穷</span>”的意思是？', options: ["走到尽头", "贫穷", "穷尽", "困窘"], answer: 0, explain: '“穷”意为“走到尽头”。“欲穷其林”即想要走到林子尽头。' },
  { seg: "<u>林尽水源</u>，便得一山，山有小口，<u>仿佛</u>若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍<u>俨然</u>，有良田、美池、桑竹之<u>属</u>。" },
  { tag: "特殊句式", q: '“林尽水源”的特殊句式是？', options: ["判断句", "宾语前置", "状语后置", "被动句"], answer: 2, explain: '“林尽水源”即“林尽（于）水源”，桃花林在溪水发源处就到头了，是状语后置，省略介词“于”。' },
  { tag: "字词释义", q: '“<span class="highlight">仿佛</span>若有光”中“<span class="highlight">仿佛</span>”的意思是？', options: ["仿佛（今义）", "隐隐约约", "好像", "相似"], answer: 1, explain: '“仿佛”意为“隐隐约约，好像”。' },
  { tag: "字词释义", q: '“屋舍<span class="highlight">俨然</span>”中“<span class="highlight">俨然</span>”的意思是？', options: ["整齐的样子", "俨然（今义）", "严肃", "整齐"], answer: 0, explain: '“俨然”意为“整齐的样子”。“屋舍俨然”即房屋整整齐齐。' },
  { tag: "字词释义", q: '“桑竹之<span class="highlight">属</span>”中“<span class="highlight">属</span>”的意思是？', options: ["类", "属于", "归属", "嘱咐"], answer: 0, explain: '“属”意为“类”。“桑竹之属”即桑树竹林之类。' },
  { seg: "<span class='jz' data-tip='阡陌：田间小路'>阡陌</span><u>交通</u>，鸡犬相闻。其中往来种作，男女衣着，<u>悉</u>如外人。<span class='jz' data-tip='黄发垂髫：指老人和小孩。黄发，旧说是长寿的特征，用来指老人。垂髫，垂下来的头发，用来指小孩'>黄发垂髫</span>，<u>并</u>怡然自乐。" },
  { tag: "字词释义", q: '“阡陌<span class="highlight">交通</span>”中“<span class="highlight">交通</span>”的意思是？', options: ["相通", "交通运输", "交通（今义）", "交错相通"], answer: 3, explain: '“交通”意为“交错相通”，是古今异义词（今义指交通运输）。' },
  { tag: "字词释义", q: '“男女衣着，<span class="highlight">悉</span>如外人”中“<span class="highlight">悉</span>”的意思是？', options: ["全，都", "熟悉", "详细", "知道"], answer: 0, explain: '“悉”意为“全、都”。“悉如外人”即全都和外面的人一样。' },
  { tag: "字词释义", q: '“<span class="highlight">并</span>怡然自乐”中“<span class="highlight">并</span>”的意思是？', options: ["都，一起", "并且", "并列", "合并"], answer: 0, explain: '“并”意为“都、一起”。“并怡然自乐”即都安闲快乐。' },
  { seg: "见渔人，<u>乃</u>大惊，问所从来。<u>具</u>答之。便<u>要</u>还家，设酒杀鸡作食。村中闻有此人，<u>咸</u>来问讯。自云先世避秦时乱，率<u>妻子</u>邑人来此<u>绝境</u>，不复出<u>焉</u>，遂与外人<u>间隔</u>。" },
  { tag: "字词释义", q: '“见渔人，<span class="highlight">乃</span>大惊”中“<span class="highlight">乃</span>”的意思是？', options: ["于是，就", "才", "竟然", "却"], answer: 0, explain: '“乃”意为“于是、就”。看见渔人，于是十分惊奇。' },
  { tag: "字词释义", q: '“<span class="highlight">具</span>答之”中“<span class="highlight">具</span>”的意思是？', options: ["工具", "详尽", "具备", "具有"], answer: 1, explain: '“具”意为“详尽、详细”。“具答之”即详尽地回答。' },
  { tag: "字词释义", q: '“便<span class="highlight">要</span>还家”中“<span class="highlight">要</span>”的意思是？', options: ["同“邀”，邀请", "重要", "要求", "需要"], answer: 0, explain: '“要”同“邀”，邀请。“便要还家”即就邀请（渔人）到自己家。' },
  { tag: "字词释义", q: '“<span class="highlight">咸</span>来问讯”中“<span class="highlight">咸</span>”的意思是？', options: ["全，都", "咸味", "咸（今义）", "皆"], answer: 0, explain: '“咸”意为“全、都”。“咸来问讯”即都来打听消息。' },
  { tag: "字词释义", q: '“率<span class="highlight">妻子</span>邑人”中“<span class="highlight">妻子</span>”的意思是？', options: ["妻子儿女", "妻子和儿子", "妻子（今义）", "家人"], answer: 0, explain: '“妻子”意为“妻子儿女”，是古今异义词（今义只指妻子）。' },
  { tag: "字词释义", q: '“来此<span class="highlight">绝境</span>”中“<span class="highlight">绝境</span>”的意思是？', options: ["险境", "绝境（今义）", "与人世隔绝的地方", "走投无路"], answer: 2, explain: '“绝境”意为“与人世隔绝的地方”，是古今异义词（今义指走投无路的境地）。' },
  { tag: "字词释义", q: '“不复出<span class="highlight">焉</span>”中“<span class="highlight">焉</span>”的意思是？', options: ["从这里（兼词，于此）", "语气词", "哪里", "怎么"], answer: 0, explain: '“焉”是兼词，意为“于此、从这里”。“不复出焉”即不再从这里出去。' },
  { tag: "字词释义", q: '“遂与外人<span class="highlight">间隔</span>”中“<span class="highlight">间隔</span>”的意思是？', options: ["断绝", "间隔（今义）", "隔开", "隔绝"], answer: 3, explain: '“间隔”意为“隔绝”，是古今异义词（今义指事物之间距离）。' },
  { seg: "问今是何世，<u>乃</u>不知有汉，<u>无论</u>魏晋。此人一一为<u>具</u>言所闻，皆叹惋。余人各复<u>延</u>至其家，皆出酒食。停数日，辞去。此中人语云：“<u>不足</u>为外人道也。”" },
  { tag: "字词释义", q: '“<span class="highlight">乃</span>不知有汉”中“<span class="highlight">乃</span>”的意思是？', options: ["竟然", "于是", "才", "就"], answer: 0, explain: '“乃”意为“竟然”。“乃不知有汉”即竟然不知道有汉朝。' },
  { tag: "字词释义", q: '“<span class="highlight">无论</span>魏晋”中“<span class="highlight">无论</span>”的意思是？', options: ["无论（今义）", "不论", "不管", "更不必说"], answer: 3, explain: '“无论”意为“更不必说”，是古今异义词（今义指不管）。' },
  { tag: "字词释义", q: '“此人一一为<span class="highlight">具</span>言所闻”中“<span class="highlight">具</span>”的意思是？', options: ["详尽", "具备", "工具", "全"], answer: 0, explain: '“具”意为“详尽”。“具言所闻”即详尽地说出所听到的事。' },
  { tag: "字词释义", q: '“余人各复<span class="highlight">延</span>至其家”中“<span class="highlight">延</span>”的意思是？', options: ["邀请", "延长", "延续", "拖延"], answer: 0, explain: '“延”意为“邀请”。“余人各复延至其家”即其余的人又各自邀请（他）到自己家。' },
  { tag: "字词释义", q: '“<span class="highlight">不足</span>为外人道也”中“<span class="highlight">不足</span>”的意思是？', options: ["不值得", "不足（今义）", "不够", "不满"], answer: 0, explain: '“不足”意为“不值得”。“不足为外人道也”即不值得对外面的人说。' },
  { seg: "<u>既</u>出，得其船，便<u>扶</u>向路，处处<u>志</u>之。<span class='jz' data-tip='及郡下：到了郡城。及，到。郡，指武陵郡'>及郡下</span>，<u>诣</u>太守，说如此。太守即遣人随其往，寻<u>向</u>所志，遂迷，不复得路。" },
  { tag: "字词释义", q: '“<span class="highlight">既</span>出”中“<span class="highlight">既</span>”的意思是？', options: ["已经，……之后", "既然", "即使", "立即"], answer: 0, explain: '“既”意为“已经”。“既出”即出来以后。' },
  { tag: "字词释义", q: '“便<span class="highlight">扶</span>向路”中“<span class="highlight">扶</span>”的意思是？', options: ["沿着", "帮助", "扶持", "扶着"], answer: 0, explain: '“扶”意为“沿着、顺着”。“便扶向路”即就顺着旧路（回去）。' },
  { tag: "字词释义", q: '“处处<span class="highlight">志</span>之”中“<span class="highlight">志</span>”的活用和意思是？', options: ["名词作动词，做记号", "志向", "标记（名词）", "标志"], answer: 0, explain: '“志”名词作动词，意为“做记号”。“处处志之”即处处做记号。' },
  { tag: "字词释义", q: '“<span class="highlight">诣</span>太守”中“<span class="highlight">诣</span>”的意思是？', options: ["拜访，到……去", "造诣", "指", "告诉"], answer: 0, explain: '“诣”意为“拜访、到……去”。“诣太守”即去拜见太守。' },
  { tag: "字词释义", q: '“寻<span class="highlight">向</span>所志”中“<span class="highlight">向</span>”的意思是？', options: ["先前", "方向", "朝向", "向来"], answer: 0, explain: '“向”意为“先前”。“寻向所志”即寻找先前做的标记。' },
  { seg: "<span class='jz' data-tip='南阳：郡名，在今河南南阳一带'>南阳</span><span class='jz' data-tip='刘子骥：名驎之，字子骥，《晋书·隐逸传》里说他“好游山泽”'>刘子骥</span>，高尚士也，闻之，欣然<u>规</u>往。<u>未果</u>，<u>寻</u>病终。后<u>遂</u>无问<u>津</u>者。" },
  { tag: "字词释义", q: '“欣然<span class="highlight">规</span>往”中“<span class="highlight">规</span>”的意思是？', options: ["规则", "规矩", "计划", "规定"], answer: 2, explain: '“规”意为“计划、打算”。“欣然规往”即高兴地计划前往。' },
  { tag: "字词释义", q: '“<span class="highlight">未果</span>”中“<span class="highlight">未果</span>”的意思是？', options: ["没有实现", "没有结果", "果实", "未成功"], answer: 0, explain: '“未果”意为“没有实现”。' },
  { tag: "字词释义", q: '“<span class="highlight">寻</span>病终”中“<span class="highlight">寻</span>”的意思是？', options: ["不久", "寻找", "寻常", "寻找（今义）"], answer: 0, explain: '“寻”意为“不久”。“寻病终”即不久因病去世。' },
  { tag: "字词释义", q: '“后<span class="highlight">遂</span>无问津者”中“<span class="highlight">遂</span>”的意思是？', options: ["于是，就", "顺遂", "成功", "完成"], answer: 0, explain: '“遂”意为“就”。“后遂无问津者”即此后就没有探访的人了。' },
  { tag: "字词释义", q: '“无问<span class="highlight">津</span>者”中“<span class="highlight">津</span>”的意思是？', options: ["天津", "唾液", "渡河", "渡口"], answer: 3, explain: '“津”意为“渡口”。“问津”本义打听渡口，这里引申为探访。' },
  { tag: "字词释义", q: '下列加点字词类活用类型与“处处<span class="highlight">志</span>之”相同的一项是？', options: ["渔人甚异之", "欲穷其林", "山有小口", "一狼洞其中"], answer: 3, explain: '“志”名词作动词，做记号；“洞”名词作动词，打洞，活用类型相同。A“异”意动；B“穷”形作动；C 无活用。' },
  { tag: "字词释义", q: '对“渔人甚<span class="highlight">异</span>之”中“<span class="highlight">异</span>”的用法，分析正确的一项是？', options: ["异：形容词，奇异", "异：意动用法，对……感到惊异", "异：使动用法，使……奇异", "异：名词，奇异景象"], answer: 1, explain: '“异”是意动用法，“对……感到惊异”。“渔人甚异之”即渔人对这件事感到很惊异。' },
  { tag: "内容理解", q: '下列句子翻译正确的一项是？', options: ["落英缤纷：落花繁多的样子。", "阡陌交通：田间小路四通八达，可以通行车辆。", "率妻子邑人来此绝境：带领妻子和同乡来到这个走投无路的地方。", "不足为外人道也：不值得对外人讲道理。"], answer: 0, explain: 'B“交通”为交错相通，“通行车辆”误；C“妻子”应译“妻子儿女”，“绝境”为“与世隔绝的地方”；D“道”为“说”。A 正确。' },
  { tag: "内容理解", q: '下列翻译有误的一项是？', options: ["黄发垂髫，并怡然自乐：老人和小孩，都安适愉快。", "乃不知有汉，无论魏晋：竟然不知道有汉朝，更不必说魏晋了。", "便扶向路，处处志之：顺着先前的路回去，到处做记号。", "寻病终：寻找机会，最终生病去世。"], answer: 3, explain: '“寻病终”意为“不久因病去世”，“寻”是“不久”，不是“寻找机会”。' },
  { tag: "内容理解", q: '文中桃花源中人“叹惋”的原因是？', options: ["渔人路途艰辛，令人同情", "外界朝代更迭，战乱不断，世人饱受苦难", "担心渔人泄露桃花源的位置", "羡慕渔人可以自由外出游历"], answer: 1, explain: '桃花源中人听渔人说起外界战乱不断、百姓受苦，因而感叹惋惜。' },
  { tag: "内容理解", q: '对文章结尾写“南阳刘子骥欣然规往，未果，寻病终。后遂无问津者”的作用，分析最准确的一项是？', options: ["交代真实历史人物寻访桃花源未果，说明桃花源确实存在，只是难以寻找", "借助名士寻访失败的情节，增添神秘色彩，暗示桃花源是虚构的理想社会", "表达作者惋惜之情，遗憾刘子骥没能找到世外桃源", "意在批判世人追求隐逸生活，却缺少坚持寻访的毅力"], answer: 1, explain: '借名士寻访失败增添神秘色彩，暗示桃花源是虚构的理想社会，可望而不可即。' },
  { tag: "内容理解", q: '桃花源中人叮嘱渔人“不足为外人道也”，下列理解不正确的一项是？', options: ["桃花源人害怕外界战乱侵扰，破坏这里安宁平和的生活", "他们不愿世俗之人闯入，打破与世隔绝、自给自足的美好家园", "桃花源人心存私心，想独自占有这片世外桃源，不愿分享美景", "为下文渔人再寻桃花源却迷路埋下伏笔，推动情节发展"], answer: 2, explain: '桃花源人叮嘱不外传是出于避乱、守护安宁，并非“心存私心、独自占有”。' }
];

const sentenceData = [
  { original: "晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。", notes: [{ word: "缘", meaning: "沿着，顺着" }, { word: "夹岸", meaning: "两岸" }, { word: "鲜美", meaning: "鲜嫩美丽（古今异义）" }, { word: "落英", meaning: "落花" }, { word: "缤纷", meaning: "繁多而错杂的样子" }, { word: "前", meaning: "名词作状语，向前" }, { word: "穷", meaning: "走到尽头" }], trans: "东晋太元年间，武陵郡有个人以打鱼作为谋生手段。（他）顺着溪水划船前行，忘记了路程的远近。忽然遇到一片桃花林，生长在溪水两岸，长达几百步，中间没有别的树木，花草鲜嫩美丽，落花纷纷地散落在地上。渔人对此感到十分诧异，又继续向前划行，想要走到那片林子的尽头。" },
  { original: "林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田、美池、桑竹之属。", notes: [{ word: "林尽水源", meaning: "状语后置（林尽（于）水源）" }, { word: "仿佛", meaning: "隐隐约约，好像" }, { word: "俨然", meaning: "整齐的样子" }, { word: "属", meaning: "类" }], trans: "桃花林在溪水发源的地方就到头了，便出现一座山，山上有个小洞口，隐隐约约好像有点光亮。（渔人）于是舍弃船只，从洞口进去。起初洞口非常狭窄，仅能容一个人通过。又走了几十步，突然变得开阔明亮了。眼前一片平坦宽广的土地，一排排整齐的房舍，还有肥沃的田地、美丽的池沼，桑树竹林之类的。" },
  { original: "阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。", notes: [{ word: "交通", meaning: "交错相通（古今异义）" }, { word: "悉", meaning: "全，都" }, { word: "并", meaning: "都，一起" }], trans: "田间小路交错相通，鸡鸣狗叫的声音此起彼伏，相互都能听见。在田野里来来往往耕种劳作的人们，男女的穿戴全都跟桃花源以外的世人一样。老人和小孩，都安闲快乐。" },
  { original: "见渔人，乃大惊，问所从来。具答之。便要还家，设酒杀鸡作食。村中闻有此人，咸来问讯。自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。", notes: [{ word: "乃", meaning: "于是，就" }, { word: "具", meaning: "详尽，详细" }, { word: "要", meaning: "同“邀”，邀请" }, { word: "咸", meaning: "全，都" }, { word: "妻子", meaning: "妻子儿女（古今异义）" }, { word: "绝境", meaning: "与人世隔绝的地方（古今异义）" }, { word: "焉", meaning: "兼词，于此" }, { word: "间隔", meaning: "隔绝（古今异义）" }], trans: "（桃花源里的人）看见渔人，于是十分惊奇，问（他）是从哪里来的。（渔人）详尽地回答了他们。（有人）就邀请（渔人）到自己家里去，摆酒杀鸡做饭来款待他。村里的人听说来了这么一个人，都来打听消息。（他们）自己说他们的祖先为了躲避秦朝的战乱，率领妻子儿女和同乡人来到这个与人世隔绝的地方，不再出去，于是就同外界的人隔绝了。" },
  { original: "问今是何世，乃不知有汉，无论魏晋。此人一一为具言所闻，皆叹惋。余人各复延至其家，皆出酒食。停数日，辞去。此中人语云：“不足为外人道也。”", notes: [{ word: "乃", meaning: "竟然" }, { word: "无论", meaning: "更不必说（古今异义）" }, { word: "延", meaning: "邀请" }, { word: "不足", meaning: "不值得" }], trans: "（他们）问现在是什么朝代，竟然不知道有过汉朝，更不必说魏朝和晋朝了。渔人把自己知道的事一件一件详尽地说给他们听，（他们）听后都感叹惋惜。其余的人各自又把渔人邀请到自己家中，都拿出酒饭来款待他。（渔人）停留了几天，就告辞离开了。村里的人告诉他说：“（这里的情况）不值得对外面的人说啊。”" },
  { original: "既出，得其船，便扶向路，处处志之。及郡下，诣太守，说如此。太守即遣人随其往，寻向所志，遂迷，不复得路。", notes: [{ word: "既", meaning: "已经，……之后" }, { word: "扶", meaning: "沿着，顺着" }, { word: "志", meaning: "名词作动词，做记号" }, { word: "诣", meaning: "拜访，到……去" }, { word: "向", meaning: "先前" }], trans: "（渔人）出来以后，找到了他的船，就顺着旧路回去，处处都做了标记。到了郡城，（渔人）去拜见太守，报告了这番经历。太守立即派人跟着他去，寻找以前所做的标记，终于迷失了方向，再也找不到通往桃花源的路了。" },
  { original: "南阳刘子骥，高尚士也，闻之，欣然规往。未果，寻病终。后遂无问津者。", notes: [{ word: "规", meaning: "计划，打算" }, { word: "未果", meaning: "没有实现" }, { word: "寻", meaning: "不久" }, { word: "遂", meaning: "就" }, { word: "津", meaning: "渡口（引申为探访）" }], trans: "南阳人刘子骥，是个志向高洁的隐士，听到这件事后，高兴地计划前往。但没有实现，不久就因病去世了。此后就再也没有探寻桃花源的人了。" }
];

const STORAGE_PREFIX = 'taohuayuan_';
var TOTAL_Q = questions.filter(function(q){ return !q.seg; }).length;

let submitted = false;
let shuffles = {};
function shuffleArray(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function generateShuffles() { for (var gi = 0; gi < TOTAL_Q; gi++) { shuffles[gi] = shuffleArray([0, 1, 2, 3]); } localStorage.setItem(STORAGE_PREFIX + 'shuffles', JSON.stringify(shuffles)); }
function loadShuffles() { try { const s = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'shuffles')); if (s && Object.keys(s).length === TOTAL_Q) { shuffles = s; return; } } catch {} generateShuffles(); }
function renderTranslation() {

function renderQuestions() {

function getStoredAnswers() { try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'answers')) || {}; } catch { return {}; } }

function restoreFromStorage() {

function updateProgress() { const done = getAnswered().length; const total = TOTAL_Q; document.getElementById('fpMain').textContent = '已答 ' + done + ' / ' + total + ' 题'; }

  var progMenu = document.getElementById('progMenu');

  function checkSubmitReady() { const done = getAnswered().length; const total = TOTAL_Q; submitBtn.disabled = done < total; submitBtn.textContent = done === total ? '📋 提交批改' : '📋 提交批改（还差 ' + (total - done) + ' 题）'; }
submitBtn.addEventListener('click', function() {

  questions.forEach((q, i) => { if (q.seg) return; const userAns = answers[i]; const isCorrect = userAns === q.answer; if (isCorrect) correct++; else { try { var _wl = JSON.parse(localStorage.getItem('gd_wrong') || '[]'); _wl.push({ paper: '《桃花源记》', time: new Date().toLocaleString(), tag: q.tag, q: q.q, options: q.options, userAns: userAns, correct: q.answer, explain: q.explain }); localStorage.setItem('gd_wrong', JSON.stringify(_wl)); } catch (e) {} }
    const card = document.getElementById('q-' + i); card.classList.add(isCorrect ? 'correct' : 'wrong');

<script>
(function(){
  var tip=document.createElement('div');tip.id='jzTip';document.body.appendChild(tip);
  function showTip(el){
    var r=el.getBoundingClientRect();
    tip.textContent=el.getAttribute('data-tip');
    tip.style.display='block';
    var tw=tip.offsetWidth,th=tip.offsetHeight;
    var left=r.left+r.width/2-tw/2;
    if(left<8)left=8;
    if(left+tw>window.innerWidth-8)left=window.innerWidth-8-tw;
    var top=r.top-th-10;
    if(top<8){top=r.bottom+10;tip.classList.add('below');}else{tip.classList.remove('below');}
    tip.style.left=left+'px';tip.style.top=top+'px';
  }
  document.addEventListener('click',function(e){
    var el=e.target;
    var jz=el.closest?el.closest('.jz'):null;
    if(jz){showTip(jz);return;}
    if(el.id!=='jzTip'){tip.style.display='none';}
  });
  window.addEventListener('scroll',function(){tip.style.display='none';},{passive:true});
})();
