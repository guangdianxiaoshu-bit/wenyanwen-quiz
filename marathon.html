<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>连打模式 · 古文自测</title>

<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {

    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Serif SC", serif;

    background: #f8f5f0; color: #2c2c2c; padding: 0 0 48px; line-height: 1.8;

  }

  .wrap { max-width: 560px; margin: 0 auto; padding: 0 14px; }

  .banner {

    background: linear-gradient(135deg, #b5533c, #d47a5e); color: #fff;

    text-align: center; padding: 30px 20px 24px; margin-bottom: 16px;

  }

  .banner h1 { font-size: 22px; font-weight: 700; letter-spacing: 2px; }

  .banner p { font-size: 13px; opacity: .85; margin-top: 4px; }

  .sec { font-size: 15px; font-weight: 600; color: #b5533c; padding-bottom: 6px; border-bottom: 2px solid #e8d5cc; margin: 18px 0 12px; }

  #pickList { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  .pick {

    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 3px;

    background: #fff; padding: 14px 6px; border-radius: 10px; border: 1px solid #ede7dd; cursor: pointer; transition: all .15s; position: relative;

  }

  @media (max-width: 480px) { #pickList { grid-template-columns: repeat(2, 1fr); } }

  .pick:hover { border-color: #d47a5e; }

  .pick.sel { border-color: #b5533c; background: #fdf0ec; }

  .pick input { position: absolute; top: 6px; right: 6px; width: 16px; height: 16px; accent-color: #b5533c; }

  .pick .nm { font-size: 13px; font-weight: 600; color: #3d2b1a; line-height: 1.4; }

  .pick .ct { font-size: 10px; color: #b3926f; }

  .tip { font-size: 12px; color: #999; margin: 4px 0 10px; }

  .btn-bar { text-align: center; margin: 24px 0; }

  .btn {

    display: inline-block; padding: 13px 36px; border-radius: 26px; font-size: 15px; font-weight: 600;

    border: none; cursor: pointer; font-family: inherit; transition: all .2s; margin: 4px 6px;

  }

  .btn-p { background: linear-gradient(135deg, #b5533c, #8f3d2b); color: #fff; box-shadow: 0 2px 8px rgba(181,83,60,0.3); }

  .btn-p:disabled { opacity: .5; cursor: not-allowed; }

  .btn-s { background: #fff; color: #b5533c; border: 2px solid #d47a5e; }

  .qprog { font-size: 13px; color: #999; margin: 10px 0 6px; }

  .qcard { background: #fff; border-radius: 12px; padding: 16px 18px; border: 1px solid #ede7dd; }

  .qhead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }

  .qtitle { font-size: 12px; color: #b5533c; background: #fdf0ec; border-radius: 4px; padding: 1px 8px; }

  .qtag { font-size: 11px; color: #999; }

  .qctx {
    background: #fdf6f2; border: 1px solid #e8d5cc; border-radius: 8px;
    padding: 10px 12px; font-size: 13px; line-height: 1.9; color: #6d4c41;
    margin-bottom: 10px;
  }
  .qctx .lbl { font-size: 11px; color: #b5533c; font-weight: 600; margin-right: 4px; }

  .q { font-size: 15px; font-weight: 500; line-height: 1.7; margin-bottom: 10px; }

  .q .highlight { color: #b5533c; font-weight: 600; }

  .opts label {

    display: block; padding: 10px 14px; margin: 5px 0; border-radius: 8px;

    border: 1.5px solid #e8d5cc; font-size: 14px; cursor: pointer; transition: all .15s;

  }

  .opts label:hover { border-color: #d47a5e; background: #fdf6f2; }

  .opts label.picked { border-color: #b5533c; background: #fdf0ec; }

  .opts label.lock { pointer-events: none; }

  .ol { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; background: #f0ebe3; font-size: 12px; font-weight: 600; margin-right: 8px; color: #666; }

  .opts label.picked .ol { background: #b5533c; color: #fff; }

  .finish {

    background: linear-gradient(135deg, #b5533c, #d47a5e); color: #fff; border-radius: 16px;

    padding: 32px 20px; margin: 24px 0; text-align: center;

  }

  .finish .big { font-size: 46px; font-weight: 800; margin: 8px 0 4px; }

  .finish .sub { font-size: 14px; opacity: .85; }

  .finish .rate { font-size: 60px; font-weight: 800; margin: 12px 0 6px; }

  .finish .cm { font-size: 15px; opacity: .95; margin-top: 8px; }

  .footer { text-align: center; padding: 30px 0 10px; font-size: 12px; color: #bbb; }

  .footer .d { width: 40px; height: 2px; background: #e0d5c5; margin: 0 auto 10px; }

  .float-home {

    position: fixed; right: 16px; bottom: 24px; z-index: 900;

    background: rgba(181,83,60,0.92); color: #fff; padding: 10px 18px; border-radius: 24px;

    font-size: 13px; text-decoration: none; box-shadow: 0 3px 12px rgba(0,0,0,0.25);

    display: flex; align-items: center; gap: 6px; transition: all .2s;

  }

  .float-home:hover { background: #8f3d2b; transform: translateY(-2px); }

  .float-start {

    position: fixed; right: 16px; bottom: 84px; z-index: 900;

    background: rgba(181,83,60,0.95); color: #fff; padding: 10px 18px;

    border: none; border-radius: 24px; font-size: 14px; font-weight: 600;

    cursor: pointer; font-family: inherit; box-shadow: 0 3px 12px rgba(0,0,0,0.25);

    transition: all .2s;

  }

  .float-start:hover { background: #8f3d2b; transform: translateY(-2px); }

  .float-start:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.mar-tags { text-align: center; margin: 10px 0 14px; }
  .mar-tags .tag { background: #fff; border: 1px solid #d9cfc2; color: #8a6d5d; border-radius: 16px; padding: 5px 18px; margin: 3px 4px; font-size: 13px; cursor: pointer; transition: all .15s; }
  .mar-tags .tag.on { background: #b5533c; border-color: #b5533c; color: #fff; }
  .mar-search{text-align:center;margin:0 0 12px;}
  .mar-search input{width:70%;max-width:260px;padding:8px 14px;border:1px solid #d9cfc2;border-radius:18px;font-size:13px;outline:none;background:#fff;color:#333;}
  .mar-search input:focus{border-color:#b5533c;}
  </style>

</head>

<body>

<div class="wrap">



<div class="banner">

  <h1>🔥 连打模式</h1>

  <p>自选篇目 · 连续答题 · 只看正确率</p>

</div>



<!-- 选择界面 -->

<div id="s1">

  <div class="sec">选择篇目（最多 5 篇）</div>
  <div class="mar-tags"><button class="tag on" onclick="marTag(this,'')">全部</button><button class="tag" onclick="marTag(this,'小学')">小学</button><button class="tag" onclick="marTag(this,'初中')">初中</button><button class="tag" onclick="marTag(this,'课外')">课外</button></div>    <div class="mar-search"><input id="marSearch" type="text" placeholder="🔍 搜索篇目" oninput="marSearch()"></div>

  <div id="pickList"></div>

  <div class="tip" id="tip"></div>

  <div style="display:none">

    <button class="btn btn-p" id="startBtn" disabled>开始连打</button>

  </div>

</div>



<!-- 答题界面 -->

<div id="s2" style="display:none">

  <div class="qprog" id="prog"></div>

  <div class="qcard">

    <div class="qhead">

      <span class="qtitle" id="qTitle"></span>

      <span class="qtag" id="qTag"></span>

    </div>

    <div class="qctx" id="qCtx"></div>

    <div class="q" id="qText"></div>

    <div class="opts" id="qOpts"></div>

  </div>

</div>



<!-- 结算界面 -->

<div id="s3" style="display:none">

  <div class="finish">

    <div>🏁 连打完成</div>

    <div class="rate" id="rateNum">0%</div>

    <div class="sub" id="pickedList" style="margin-top:6px;font-size:14px;opacity:.95"></div>

    <div class="sub" id="rateDetail"></div>

    <div class="sub" id="timeUsed" style="margin-top:4px;font-size:13px;opacity:.85"></div>

    <div class="cm" id="rateComment"></div>

  </div>

  <div class="btn-bar">

    <button class="btn btn-p" id="againBtn">再打一次</button>

    <a class="btn btn-s" href="https://guangdianxiaoshu-bit.github.io/wenyanwen-quiz/">返回首页</a>

  </div>

</div>



<div class="footer"><div class="d"></div><p>📚 <strong>光点小塾</strong> · 专注语文学习轻量化、日常化</p></div>

</div>



<button class="float-start" id="floatStart" disabled>🔥 开始连打</button>

<script>

var QDATA = {
  "吕蒙正为相": [

    {

    {

    },
    {
      "tag": "字词释义",
      "q": "“其弟<span class=\"highlight\">遂</span>不复敢言”中“<span class=\"highlight\">遂</span>”的意思是？",

    {

    {

    }
  ],
  "桃花源记": [
    {
      "tag": "字词释义",

  "马说": [{"tag": "字词释义", "q": "“<span class=\"highlight\">然后</span>有千里马”中“<span class=\"highlight\">然后</span>”的意思是？", "o": ["这样以后", "于是", "接着", "然而"], "a": 0, "e": "“然后”意为这样以后。“然后有千里马”即这样以后才有千里马。"}, {"tag": "字词释义", "q": "“千里马常有，<span class=\"highlight\">而</span>伯乐不常有”中“<span class=\"highlight\">而</span>”的意思是？", "o": ["却，表转折", "并且", "然后", "如果"], "a": 0, "e": "“而”表转折，却。“而伯乐不常有”即可是伯乐不常有。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">故</span>虽有名马”中“<span class=\"highlight\">故</span>”的意思是？", "o": ["所以", "原因", "过去", "故意"], "a": 0, "e": "“故”意为所以。“故虽有名马”即因此即使有名马。"}, {"tag": "字词释义", "q": "“故<span class=\"highlight\">虽</span>有名马”中“<span class=\"highlight\">虽</span>”的意思是？", "o": ["即使", "虽然", "竟然", "唯独"], "a": 0, "e": "“虽”意为即使（表让步）。“虽有名马”即即使有名贵的马。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">祗</span>辱于奴隶人之手”中“<span class=\"highlight\">祗</span>”的意思是？", "o": ["只是", "恭敬", "到达", "原本"], "a": 0, "e": "“祗”同“只”，只是。“祗辱于奴隶人之手”即只是受辱于奴仆之手。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">骈死</span>于槽枥之间”中“<span class=\"highlight\">骈死</span>”的意思是？", "o": ["并列而死", "先后而死", "安然死去", "迅速死去"], "a": 0, "e": "“骈死”意为并列而死（和普通马一起死）。“骈死于槽枥之间”即一同死在马槽之间。"}, {"tag": "字词释义", "q": "“不<span class=\"highlight\">以</span>千里称也”中“<span class=\"highlight\">以</span>”的意思是？", "o": ["凭借", "因为", "按照", "认为"], "a": 0, "e": "“以”意为凭借。“不以千里称”即不凭千里（的才能）著称。"}, {"tag": "句式", "q": "“马<span class=\"highlight\">之</span>千里者”中“<span class=\"highlight\">之</span>”的用法是？", "o": ["定语后置的标志", "结构助词，的", "代词，它", "动词，去"], "a": 0, "e": "“之”是定语后置的标志，“马之千里者”即日行千里的马。"}, {"tag": "字词释义", "q": "“一食<span class=\"highlight\">或</span>尽粟一石”中“<span class=\"highlight\">或</span>”的意思是？", "o": ["有时", "或者", "有人", "突然"], "a": 0, "e": "“或”意为有时。“一食或尽粟一石”即一顿有时能吃下一石粮食。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">食</span>马者不知其能千里而食也”中“<span class=\"highlight\">食</span>”的意思是？", "o": ["喂养", "食物", "吃", "粮食"], "a": 0, "e": "“食”读 sì，意为喂养、饲养。“食马者”即喂马的人。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">是</span>马也”中“<span class=\"highlight\">是</span>”的意思是？", "o": ["这", "表判断", "正确", "于是"], "a": 0, "e": "“是”作代词，这。“是马也”即这样的马。"}, {"tag": "字词释义", "q": "“才美不外<span class=\"highlight\">见</span>”中“<span class=\"highlight\">见</span>”的意思是？", "o": ["表现", "看见", "出现", "拜见"], "a": 0, "e": "“见”同“现”，表现。“才美不外见”即才能和美好的素质不能表现出来。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">且</span>欲与常马等不可得”中“<span class=\"highlight\">且</span>”的意思是？", "o": ["尚且", "并且", "反而", "暂且"], "a": 0, "e": "“且”意为尚且。“且欲与常马等不可得”即想要跟普通马一样尚且办不到。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">安</span>求其能千里也”中“<span class=\"highlight\">安</span>”的意思是？", "o": ["怎么", "安全", "安放", "哪里"], "a": 0, "e": "“安”意为怎么（表反问）。“安求其能千里也”即怎么能要求它日行千里呢？"}, {"tag": "词类活用", "q": "“<span class=\"highlight\">策</span>之不以其道”中“<span class=\"highlight\">策</span>”的意思是？", "o": ["驱赶", "马鞭", "策略", "督促"], "a": 0, "e": "“策”是名词作动词，用马鞭驱赶。“策之”即鞭打它。"}, {"tag": "字词释义", "q": "“不<span class=\"highlight\">以</span>其道”中“<span class=\"highlight\">以</span>”的意思是？", "o": ["按照", "用", "因为", "认为"], "a": 0, "e": "“以”意为按照。“不以其道”即不按照（驱使千里马的）正确方法。"}, {"tag": "字词释义", "q": "“食之不能尽其<span class=\"highlight\">材</span>”中“<span class=\"highlight\">材</span>”的意思是？", "o": ["才能", "材料", "木材", "资质"], "a": 0, "e": "“材”同“才”，才能。“尽其材”即竭尽它的才能。"}, {"tag": "字词释义", "q": "“鸣之而不能<span class=\"highlight\">通</span>其意”中“<span class=\"highlight\">通</span>”的意思是？", "o": ["通晓", "通过", "通畅", "沟通"], "a": 0, "e": "“通”意为通晓。“通其意”即通晓它的意思。"}, {"tag": "字词释义", "q": "“执策而<span class=\"highlight\">临</span>之”中“<span class=\"highlight\">临</span>”的意思是？", "o": ["面对", "临近", "降临", "俯视"], "a": 0, "e": "“临”意为面对。“执策而临之”即拿着马鞭面对着它。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">其</span>真无马邪”中“<span class=\"highlight\">其</span>”的意思是？", "o": ["难道", "代词，它", "其中", "大概"], "a": 0, "e": "“其”表反问语气，难道。“其真无马邪”即难道真的没有千里马吗？（“其真不知马也”的“其”表推测，大概。）"}, {"tag": "断句", "q": "下列朗读停顿划分正确的一项是？", "o": ["祗辱于 / 奴隶人之手", "食马者 / 不知其能千里而食也", "才美不外 / 见", "其真无马 / 邪其真不知马也"], "a": 1, "e": "B 正确，“食马者”后停顿。A 应为“祗辱 / 于奴隶人之手”；C 应为“才美 / 不外见”；D 应为“其真无马邪？/ 其真不知马也”。"}, {"tag": "句式", "q": "下面句式判断错误的一项是？", "o": ["“马之千里者”是定语后置，译为日行千里的马", "“祗辱于奴隶人之手”属于状语后置句", "“食马者不知其能千里而食也”是被动句", "“其真不知马也”为表推测语气的陈述句"], "a": 2, "e": "C 判断错误。“食马者不知其能千里而食也”是陈述句，不是被动句。其余三项判断均正确。"}, {"tag": "词类活用", "q": "对词类活用分析正确的一项是？", "o": ["“策之不以其道”中“策”，名词，马鞭", "“策之不以其道”中“策”，名词作动词，用马鞭驱赶", "“食之不能尽其材”中“尽”，形容词，尽头", "“食之不能尽其材”中“尽”，名词作状语，尽力"], "a": 1, "e": "B 分析正确。“策”名词作动词，用马鞭驱赶。A 未看出活用；C、D 对“尽”分析错误，“尽”是形容词作动词，竭尽。"}, {"tag": "翻译", "q": "对“其真无马邪？其真不知马也”翻译正确的一项是？", "o": ["难道真的没有千里马吗？大概是（他们）真的不认识千里马吧！", "难道真的没有马吗？其实是真的不认识马啊！", "它真的没有马吗？是真的不知道马吧！", "难道真的没有千里马吗？确实是他们不认识千里马啊！"], "a": 0, "e": "前一个“其”表反问（难道），后一个“其”表推测（大概）。A 翻译准确。D 把后一句译成肯定语气，与前文推测语气不符。"}, {"tag": "内容理解", "q": "下列对文章内容理解分析有误的一项是？", "o": ["“千里马常有，而伯乐不常有”开篇点明核心，伯乐对千里马命运起决定作用", "“才美不外见”写出千里马的才能被埋没，无法展现", "文中“食马者”指善于发掘人才的贤明君主", "全文托物言志，借千里马的遭遇写有才之士怀才不遇"], "a": 2, "e": "C 有误。“食马者”指喂马的人，比喻愚昧、不识人才的统治者，并非贤明君主。"}, {"tag": "内容理解", "q": "下面对本文艺术手法与主旨理解，说法错误的一项是？", "o": ["以千里马比喻有才之士，伯乐比喻识才的明君", "“其真无马邪？其真不知马也”设问，抒发作者的感慨与批判", "作者认为千里马本身能力不足，所以才会被埋没", "文章层层蓄势，结尾点出问题根源在于统治者不识人才"], "a": 2, "e": "C 错误。作者认为千里马被埋没的根源是“食马者”不识马、不善养，并非千里马本身能力不足。"}],[

  "岳阳楼记": [{"tag": "字词释义", "q": "“滕子京<span class=\"highlight\">谪</span>守巴陵郡”中“<span class=\"highlight\">谪</span>”的意思是？", "o": ["贬官", "流放", "责备", "指责"], "a": 0, "e": "“谪”意为贬官。“滕子京谪守巴陵郡”即滕子京被贬官到巴陵郡做太守。"}, {"tag": "古今异义", "q": "“<span class=\"highlight\">越明年</span>”中“<span class=\"highlight\">明年</span>”在文中的意思是？", "o": ["第二年", "今年的下一年", "来年", "以后"], "a": 0, "e": "“明年”古义为第二年，今义为今年的下一年。“越明年”即到了第二年。"}, {"tag": "字词释义", "q": "“百废<span class=\"highlight\">具</span>兴”中“<span class=\"highlight\">具</span>”的意思是？", "o": ["全，都", "具体", "具备", "准备"], "a": 0, "e": "“具”同“俱”，全、都。“百废具兴”即各种荒废的事业都兴办起来。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">乃</span>重修岳阳楼”中“<span class=\"highlight\">乃</span>”的意思是？", "o": ["于是", "竟然", "才", "却"], "a": 0, "e": "“乃”意为于是。“乃重修岳阳楼”即于是重新修建岳阳楼。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">属</span>予作文以记之”中“<span class=\"highlight\">属</span>”的意思是？", "o": ["嘱托", "属于", "归属", "连接"], "a": 0, "e": "“属”同“嘱”，嘱托。“属予作文以记之”即嘱托我写一篇文章来记述这件事。"}, {"tag": "古今异义", "q": "“属予<span class=\"highlight\">作文</span>以记之”中“<span class=\"highlight\">作文</span>”在文中的意思是？", "o": ["写文章", "习作", "文章", "作品"], "a": 0, "e": "“作文”古义为写文章，今义为学生习作。“属予作文”即嘱托我写文章。"}, {"tag": "字词释义", "q": "“作文<span class=\"highlight\">以</span>记之”中“<span class=\"highlight\">以</span>”的意思是？", "o": ["来，表目的", "用", "因为", "按照"], "a": 0, "e": "“以”表目的，来。“以记之”即用来记述这件事。"}, {"tag": "字词释义", "q": "“予观<span class=\"highlight\">夫</span>巴陵胜状”中“<span class=\"highlight\">夫</span>”的意思是？", "o": ["那", "大丈夫", "语气词", "并且"], "a": 0, "e": "“夫”是指示代词，那。“观夫巴陵胜状”即看那巴陵的美好景色。"}, {"tag": "字词释义", "q": "“巴陵<span class=\"highlight\">胜</span>状”中“<span class=\"highlight\">胜</span>”的意思是？", "o": ["美好", "胜利", "超过", "名胜"], "a": 0, "e": "“胜”意为美好。“胜状”即美好的景色。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">衔</span>远山”中“<span class=\"highlight\">衔</span>”的意思是？", "o": ["连接", "用嘴叼", "包含", "仰望"], "a": 0, "e": "“衔”意为连接（拟人）。 “衔远山”即（洞庭湖）连接着远处的山。"}, {"tag": "字词释义", "q": "“浩浩<span class=\"highlight\">汤汤</span>”中“<span class=\"highlight\">汤汤</span>”的意思是？", "o": ["水势大", "热水", "汤水", "翻腾"], "a": 0, "e": "“汤汤”读 shāng shāng，意为水势浩大。"}, {"tag": "字词释义", "q": "“此则岳阳楼之<span class=\"highlight\">大观</span>也”中“<span class=\"highlight\">大观</span>”的意思是？", "o": ["雄伟景象", "伟大观点", "大规模", "观赏"], "a": 0, "e": "“大观”意为雄伟景象。“岳阳楼之大观”即岳阳楼的雄伟景象。"}, {"tag": "字词释义", "q": "“前人之述<span class=\"highlight\">备</span>矣”中“<span class=\"highlight\">备</span>”的意思是？", "o": ["详尽", "准备", "具备", "防备"], "a": 0, "e": "“备”意为详尽、完备。“前人之述备矣”即前人的记述已经很详尽了。"}, {"tag": "字词释义", "q": "“览物之情，<span class=\"highlight\">得无</span>异乎”中“<span class=\"highlight\">得无</span>”的意思是？", "o": ["恐怕，表推测", "得到", "没有", "难道"], "a": 0, "e": "“得无”表推测，恐怕、莫非。“得无异乎”即恐怕会有所不同吧。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">若夫</span>淫雨霏霏”中“<span class=\"highlight\">若夫</span>”的意思是？", "o": ["像那", "如果", "假若", "丈夫"], "a": 0, "e": "“若夫”是发语词，像那，用来引起下文。“若夫淫雨霏霏”即像那连绵的雨纷纷而下。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">淫</span>雨霏霏”中“<span class=\"highlight\">淫</span>”的意思是？", "o": ["连绵", "淫荡", "暴雨", "狂风"], "a": 0, "e": "“淫”意为连绵不断。“淫雨”即连绵不断的雨。"}, {"tag": "字词释义", "q": "“浊浪<span class=\"highlight\">排</span>空”中“<span class=\"highlight\">排</span>”的意思是？", "o": ["冲击", "排列", "排除", "推开"], "a": 0, "e": "“排”意为冲击。“浊浪排空”即浑浊的波浪冲向天空。"}, {"tag": "古今异义", "q": "“商旅<span class=\"highlight\">不行</span>”中“<span class=\"highlight\">不行</span>”在文中的意思是？", "o": ["不能通行", "不走路", "不可以", "不执行"], "a": 0, "e": "“不行”古义为不能通行，今义为不可以。“商旅不行”即商人和旅客无法通行。"}, {"tag": "字词释义", "q": "“则有<span class=\"highlight\">去国</span>怀乡”中“<span class=\"highlight\">去国</span>”的意思是？", "o": ["离开国都", "离开国家", "去国外", "前往国都"], "a": 0, "e": "“去”意为离开，“国”意为国都（京城）。“去国”即离开国都。"}, {"tag": "字词释义", "q": "“满目<span class=\"highlight\">萧然</span>”中“<span class=\"highlight\">萧然</span>”的意思是？", "o": ["萧条", "肃然", "欢快", "静谧"], "a": 0, "e": "“萧然”意为萧条冷落的样子。“满目萧然”即眼前尽是萧条的景象。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">至若</span>春和景明”中“<span class=\"highlight\">至若</span>”的意思是？", "o": ["至于", "如果", "甚至", "到了"], "a": 0, "e": "“至若”意为至于，用来转换话题。“至若春和景明”即至于春风和煦、阳光明媚时。"}, {"tag": "字词释义", "q": "“春和<span class=\"highlight\">景</span>明”中“<span class=\"highlight\">景</span>”的意思是？", "o": ["日光", "景色", "景物", "风景"], "a": 0, "e": "“景”古义为日光，今义为景色。“春和景明”即春风和煦、阳光明媚。"}, {"tag": "字词释义", "q": "“沙鸥翔<span class=\"highlight\">集</span>”中“<span class=\"highlight\">集</span>”的意思是？", "o": ["停息", "集合", "集中", "集市"], "a": 0, "e": "“集”意为停息。“沙鸥翔集”即沙洲上的鸥鸟时而飞翔时而停歇。"}, {"tag": "古今异义", "q": "“锦鳞<span class=\"highlight\">游泳</span>”中“<span class=\"highlight\">游泳</span>”在文中的意思是？", "o": ["游动", "游泳运动", "浮沉", "嬉戏"], "a": 0, "e": "“游泳”古义为游动，今义为体育运动。“锦鳞游泳”即美丽的鱼儿在水中游来游去。"}, {"tag": "字词释义", "q": "“长烟<span class=\"highlight\">一</span>空”中“<span class=\"highlight\">一</span>”的意思是？", "o": ["全，都", "数目一", "一旦", "统一"], "a": 0, "e": "“一”意为全、都。“长烟一空”即大片烟雾完全消散。"}, {"tag": "字词释义", "q": "“此乐何<span class=\"highlight\">极</span>”中“<span class=\"highlight\">极</span>”的意思是？", "o": ["穷尽", "极点", "极力", "达到"], "a": 0, "e": "“极”意为穷尽。“此乐何极”即这种乐趣哪有穷尽。"}, {"tag": "字词释义", "q": "“予<span class=\"highlight\">尝</span>求古仁人之心”中“<span class=\"highlight\">尝</span>”的意思是？", "o": ["曾经", "品尝", "尝试", "经历"], "a": 0, "e": "“尝”意为曾经。“予尝求”即我曾经探求。"}, {"tag": "字词释义", "q": "“或<span class=\"highlight\">异</span>二者之为”中“<span class=\"highlight\">异</span>”的意思是？", "o": ["不同于", "奇异", "差异", "奇怪"], "a": 0, "e": "“异”意为不同于。“或异二者之为”即或许不同于以上两种心情。"}, {"tag": "字词释义", "q": "“不<span class=\"highlight\">以</span>物喜”中“<span class=\"highlight\">以</span>”的意思是？", "o": ["因为", "用", "凭借", "来"], "a": 0, "e": "“以”意为因为。“不以物喜”即不因外物好坏而或喜或悲。"}, {"tag": "字词释义", "q": "“居<span class=\"highlight\">庙堂</span>之高”中“<span class=\"highlight\">庙堂</span>”的意思是？", "o": ["朝廷", "庙宇", "殿堂", "祠堂"], "a": 0, "e": "“庙堂”古义为朝廷。“居庙堂之高”即在朝廷做官。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">微</span>斯人”中“<span class=\"highlight\">微</span>”的意思是？", "o": ["如果没有", "微小", "轻微", "微妙"], "a": 0, "e": "“微”意为如果没有。“微斯人”即如果没有这种人。"}, {"tag": "字词释义", "q": "“吾谁与<span class=\"highlight\">归</span>”中“<span class=\"highlight\">归</span>”的意思是？", "o": ["归依", "归来", "归还", "归属"], "a": 0, "e": "“归”意为归依。“吾谁与归”即我同谁一道呢。"}, {"tag": "句式", "q": "下面对文言句式判断错误的一项是？", "o": ["“此则岳阳楼之大观也”为判断句", "“居庙堂之高则忧其民”是定语后置句", "“吾谁与归”属于宾语前置句", "“不以物喜，不以己悲”是被动句"], "a": 3, "e": "D 判断错误。“不以物喜，不以己悲”是互文（不因外物好坏和自己得失而或喜或悲），不是被动句。其余三项判断均正确。"}, {"tag": "词类活用", "q": "下面词类活用分析正确的一项是？", "o": ["“百废具兴”中“废”，动词，废弃", "“先天下之忧而忧”中“先”，名词作状语，在……之前", "“后天下之乐而乐”中“后”，名词，后面", "“长烟一空”中“空”，名词，天空"], "a": 1, "e": "B 分析正确。“先”名词作状语，在……之前。A“废”是形容词作名词（荒废的事业）；C“后”名词作状语，在……之后；D“空”形容词作动词（消散）。"}, {"tag": "内容理解", "q": "下列对迁客骚人的览物之情，理解正确的一项是？", "o": ["迁客骚人能够做到不以物喜，不以己悲", "阴雨萧条之景触发迁客骚人喜悦舒畅的心情", "迁客骚人悲喜随景物变化，“以物喜，以己悲”", "迁客骚人胸怀远大，心系天下百姓安危"], "a": 2, "e": "C 理解正确。迁客骚人的心情随阴晴景色变化而或悲或喜（以物喜，以己悲），这正是古仁人与之不同的地方。"}, {"tag": "内容理解", "q": "下列对文章内容与艺术分析有误的一项是？", "o": ["文章以“记”为名，大量议论，借写景抒发政治理想", "“微斯人，吾谁与归”既赞美古仁人，也暗含劝勉滕子京", "“先天下之忧而忧，后天下之乐而乐”体现古仁人超脱个人得失，心怀天下", "古仁人“进亦忧，退亦忧”，是指做官就忧愁，不做官就不再忧愁"], "a": 3, "e": "D 有误。“进亦忧，退亦忧”是指无论做官（进）还是退隐（退）都心怀天下而忧虑，并非“不做官就不再忧愁”。"}, {"tag": "内容理解", "q": "下面对全文理解表述错误的一项是？", "o": ["文中写阴晴两种景色，用来对比迁客骚人两种不同心境", "作者实地游览岳阳楼，目睹洞庭风光写下本篇文章", "“衔远山，吞长江”的“衔”“吞”用拟人，写出洞庭湖气势宏大", "古仁人的境界高于迁客骚人，是作者推崇的理想人格"], "a": 1, "e": "B 错误。范仲淹并未亲临岳阳楼，本文是他应滕子京之请、依据《洞庭晚秋图》等写成的。"}, {"tag": "翻译", "q": "对“微斯人，吾谁与归”翻译正确的一项是？", "o": ["如果没有这样的人，我同谁一道呢？", "如果没有这种人，我和谁一起回来？", "微小的人，我和谁一起回去？", "如果没有这个人，我同谁归还呢？"], "a": 0, "e": "“微”意为如果没有，“吾谁与归”是宾语前置（吾与谁归）。A 翻译准确。B 误译“归”为回来；C 误译“微”为微小；D 误译“归”为归还。"}, {"tag": "翻译", "q": "对“先天下之忧而忧，后天下之乐而乐”翻译正确的一项是？", "o": ["在天下人忧愁之前先忧愁，在天下人快乐之后才快乐", "先为天下人担忧，后为天下人高兴", "天下人忧愁之前就忧愁，天下人快乐之后就快乐", "在天下之前忧愁，在天下之后快乐"], "a": 0, "e": "“先”“后”都是名词作状语（在……之前、在……之后）。A 翻译准确。C 漏掉“先”“后”作状语的含义；B、D 语序不当。"}, {"tag": "句式", "q": "【联动七八年级】下列句子中属于状语后置（介宾短语后置）的一项是？", "o": ["刻唐贤今人诗赋于其上", "其印为余群从所得", "马之千里者", "何陋之有"], "a": 0, "e": "A 是状语后置，“于其上”后置（于其上刻诗赋）。B 是被动句（为……所，选自《活板》）；C 是定语后置（选自《马说》）；D 是宾语前置（何陋之有=有何陋，选自《陋室铭》）。"}, {"tag": "词类活用", "q": "【联动七八年级】下列句中加点字的用法与其他三项不同的一项是？", "o": ["北通巫峡中“北”", "斗折蛇行中“斗”", "其一犬坐于前中“犬”", "策之不以其道中“策”"], "a": 3, "e": "A“北”（选自本文）名词作状语，向北；B“斗”（选自《小石潭记》）名词作状语，像北斗星那样；C“犬”（选自《狼》）名词作状语，像狗一样；D“策”（选自《马说》）名词作动词，用马鞭驱赶。故选 D。"}],[{"tag": "字词释义", "q": "“滕子京<span class=\"highlight\">谪</span>守巴陵郡”中“<span class=\"highlight\">谪</span>”的意思是？", "o": ["贬官", "流放", "责备", "指责"], "a": 0, "e": "“谪”意为贬官。“滕子京谪守巴陵郡”即滕子京被贬官到巴陵郡做太守。"}, {"tag": "古今异义", "q": "“<span class=\"highlight\">越明年</span>”中“<span class=\"highlight\">明年</span>”在文中的意思是？", "o": ["第二年", "今年的下一年", "来年", "以后"], "a": 0, "e": "“明年”古义为第二年，今义为今年的下一年。“越明年”即到了第二年。"}, {"tag": "字词释义", "q": "“百废<span class=\"highlight\">具</span>兴”中“<span class=\"highlight\">具</span>”的意思是？", "o": ["全，都", "具体", "具备", "准备"], "a": 0, "e": "“具”同“俱”，全、都。“百废具兴”即各种荒废的事业都兴办起来。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">乃</span>重修岳阳楼”中“<span class=\"highlight\">乃</span>”的意思是？", "o": ["于是", "竟然", "才", "就"], "a": 0, "e": "“乃”意为于是。“乃重修岳阳楼”即于是重新修建岳阳楼。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">属</span>予作文以记之”中“<span class=\"highlight\">属</span>”的意思是？", "o": ["嘱托", "属于", "归属", "连接"], "a": 0, "e": "“属”同“嘱”，嘱托。“属予作文以记之”即嘱托我写一篇文章来记述这件事。"}, {"tag": "古今异义", "q": "“属予<span class=\"highlight\">作文</span>以记之”中“<span class=\"highlight\">作文</span>”在文中的意思是？", "o": ["写文章", "习作", "文章", "作品"], "a": 0, "e": "“作文”古义为写文章，今义为学生习作。“属予作文”即嘱托我写文章。"}, {"tag": "字词释义", "q": "“作文<span class=\"highlight\">以</span>记之”中“<span class=\"highlight\">以</span>”的意思是？", "o": ["来，表目的", "用", "因为", "按照"], "a": 0, "e": "“以”表目的，来。“以记之”即用来记述这件事。"}, {"tag": "字词释义", "q": "“予观<span class=\"highlight\">夫</span>巴陵胜状”中“<span class=\"highlight\">夫</span>”的意思是？", "o": ["那", "大丈夫", "语气词", "并且"], "a": 0, "e": "“夫”是指示代词，那。“观夫巴陵胜状”即看那巴陵的美好景色。"}, {"tag": "字词释义", "q": "“巴陵<span class=\"highlight\">胜</span>状”中“<span class=\"highlight\">胜</span>”的意思是？", "o": ["美好", "胜利", "超过", "名胜"], "a": 0, "e": "“胜”意为美好。“胜状”即美好的景色。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">衔</span>远山”中“<span class=\"highlight\">衔</span>”的意思是？", "o": ["连接", "用嘴叼", "包含", "仰望"], "a": 0, "e": "“衔”意为连接（拟人）。 “衔远山”即（洞庭湖）连接着远处的山。"}, {"tag": "字词释义", "q": "“浩浩<span class=\"highlight\">汤汤</span>”中“<span class=\"highlight\">汤汤</span>”的意思是？", "o": ["水势大", "热水", "汤水", "翻腾"], "a": 0, "e": "“汤汤”读 shāng shāng，意为水势浩大。"}, {"tag": "字词释义", "q": "“此则岳阳楼之<span class=\"highlight\">大观</span>也”中“<span class=\"highlight\">大观</span>”的意思是？", "o": ["雄伟景象", "伟大观点", "大规模", "观赏"], "a": 0, "e": "“大观”意为雄伟景象。“岳阳楼之大观”即岳阳楼的雄伟景象。"}, {"tag": "字词释义", "q": "“前人之述<span class=\"highlight\">备</span>矣”中“<span class=\"highlight\">备</span>”的意思是？", "o": ["详尽", "准备", "具备", "防备"], "a": 0, "e": "“备”意为详尽、完备。“前人之述备矣”即前人的记述已经很详尽了。"}, {"tag": "字词释义", "q": "“览物之情，<span class=\"highlight\">得无</span>异乎”中“<span class=\"highlight\">得无</span>”的意思是？", "o": ["恐怕，表推测", "得到", "没有", "难道"], "a": 0, "e": "“得无”表推测，恐怕、莫非。“得无异乎”即恐怕会有所不同吧。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">若夫</span>淫雨霏霏”中“<span class=\"highlight\">若夫</span>”的意思是？", "o": ["像那", "如果", "假若", "丈夫"], "a": 0, "e": "“若夫”是发语词，像那，用来引起下文。“若夫淫雨霏霏”即像那连绵的雨纷纷而下。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">淫</span>雨霏霏”中“<span class=\"highlight\">淫</span>”的意思是？", "o": ["连绵", "淫荡", "暴雨", "狂风"], "a": 0, "e": "“淫”意为连绵不断。“淫雨”即连绵不断的雨。"}, {"tag": "字词释义", "q": "“浊浪<span class=\"highlight\">排</span>空”中“<span class=\"highlight\">排</span>”的意思是？", "o": ["冲击", "排列", "排除", "推开"], "a": 0, "e": "“排”意为冲击。“浊浪排空”即浑浊的波浪冲向天空。"}, {"tag": "古今异义", "q": "“商旅<span class=\"highlight\">不行</span>”中“<span class=\"highlight\">不行</span>”在文中的意思是？", "o": ["不能通行", "不走路", "不可以", "不执行"], "a": 0, "e": "“不行”古义为不能通行，今义为不可以。“商旅不行”即商人和旅客无法通行。"}, {"tag": "字词释义", "q": "“则有<span class=\"highlight\">去国</span>怀乡”中“<span class=\"highlight\">去国</span>”的意思是？", "o": ["离开国都", "离开国家", "去国外", "前往国都"], "a": 0, "e": "“去”意为离开，“国”意为国都（京城）。“去国”即离开国都。"}, {"tag": "字词释义", "q": "“满目<span class=\"highlight\">萧然</span>”中“<span class=\"highlight\">萧然</span>”的意思是？", "o": ["萧条", "肃然", "欢快", "静谧"], "a": 0, "e": "“萧然”意为萧条冷落的样子。“满目萧然”即眼前尽是萧条的景象。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">至若</span>春和景明”中“<span class=\"highlight\">至若</span>”的意思是？", "o": ["至于", "如果", "甚至", "到了"], "a": 0, "e": "“至若”意为至于，用来转换话题。“至若春和景明”即至于春风和煦、阳光明媚时。"}, {"tag": "字词释义", "q": "“春和<span class=\"highlight\">景</span>明”中“<span class=\"highlight\">景</span>”的意思是？", "o": ["日光", "景色", "景物", "风景"], "a": 0, "e": "“景”古义为日光，今义为景色。“春和景明”即春风和煦、阳光明媚。"}, {"tag": "字词释义", "q": "“沙鸥翔<span class=\"highlight\">集</span>”中“<span class=\"highlight\">集</span>”的意思是？", "o": ["停息", "集合", "集中", "集市"], "a": 0, "e": "“集”意为停息。“沙鸥翔集”即沙洲上的鸥鸟时而飞翔时而停歇。"}, {"tag": "古今异义", "q": "“锦鳞<span class=\"highlight\">游泳</span>”中“<span class=\"highlight\">游泳</span>”在文中的意思是？", "o": ["游动", "游泳运动", "浮沉", "嬉戏"], "a": 0, "e": "“游泳”古义为游动，今义为体育运动。“锦鳞游泳”即美丽的鱼儿在水中游来游去。"}, {"tag": "字词释义", "q": "“长烟<span class=\"highlight\">一</span>空”中“<span class=\"highlight\">一</span>”的意思是？", "o": ["全，都", "数目一", "一旦", "统一"], "a": 0, "e": "“一”意为全、都。“长烟一空”即大片烟雾完全消散。"}, {"tag": "字词释义", "q": "“此乐何<span class=\"highlight\">极</span>”中“<span class=\"highlight\">极</span>”的意思是？", "o": ["穷尽", "极点", "极力", "达到"], "a": 0, "e": "“极”意为穷尽。“此乐何极”即这种乐趣哪有穷尽。"}, {"tag": "字词释义", "q": "“予<span class=\"highlight\">尝</span>求古仁人之心”中“<span class=\"highlight\">尝</span>”的意思是？", "o": ["曾经", "品尝", "尝试", "经历"], "a": 0, "e": "“尝”意为曾经。“予尝求”即我曾经探求。"}, {"tag": "字词释义", "q": "“或<span class=\"highlight\">异</span>二者之为”中“<span class=\"highlight\">异</span>”的意思是？", "o": ["不同于", "奇异", "差异", "奇怪"], "a": 0, "e": "“异”意为不同于。“或异二者之为”即或许不同于以上两种心情。"}, {"tag": "字词释义", "q": "“不<span class=\"highlight\">以</span>物喜”中“<span class=\"highlight\">以</span>”的意思是？", "o": ["因为", "用", "凭借", "来"], "a": 0, "e": "“以”意为因为。“不以物喜”即不因外物好坏而或喜或悲。"}, {"tag": "字词释义", "q": "“居<span class=\"highlight\">庙堂</span>之高”中“<span class=\"highlight\">庙堂</span>”的意思是？", "o": ["朝廷", "庙宇", "殿堂", "祠堂"], "a": 0, "e": "“庙堂”古义为朝廷。“居庙堂之高”即在朝廷做官。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">微</span>斯人”中“<span class=\"highlight\">微</span>”的意思是？", "o": ["如果没有", "微小", "轻微", "微妙"], "a": 0, "e": "“微”意为如果没有。“微斯人”即如果没有这种人。"}, {"tag": "字词释义", "q": "“吾谁与<span class=\"highlight\">归</span>”中“<span class=\"highlight\">归</span>”的意思是？", "o": ["归依", "归来", "归还", "归属"], "a": 0, "e": "“归”意为归依。“吾谁与归”即我同谁一道呢。"}, {"tag": "句式", "q": "下面对文言句式判断错误的一项是？", "o": ["“此则岳阳楼之大观也”为判断句", "“居庙堂之高则忧其民”是定语后置句", "“吾谁与归”属于宾语前置句", "“不以物喜，不以己悲”是被动句"], "a": 3, "e": "D 判断错误。“不以物喜，不以己悲”是互文（不因外物好坏和自己得失而或喜或悲），不是被动句。其余三项判断均正确。"}, {"tag": "词类活用", "q": "下面词类活用分析正确的一项是？", "o": ["“百废具兴”中“废”，动词，废弃", "“先天下之忧而忧”中“先”，名词作状语，在……之前", "“后天下之乐而乐”中“后”，名词，后面", "“长烟一空”中“空”，名词，天空"], "a": 1, "e": "B 分析正确。“先”名词作状语，在……之前。A“废”是形容词作名词（荒废的事业）；C“后”名词作状语，在……之后；D“空”形容词作动词（消散）。"}, {"tag": "内容理解", "q": "下列对迁客骚人的览物之情，理解正确的一项是？", "o": ["迁客骚人能够做到不以物喜，不以己悲", "阴雨萧条之景触发迁客骚人喜悦舒畅的心情", "迁客骚人悲喜随景物变化，“以物喜，以己悲”", "迁客骚人胸怀远大，心系天下百姓安危"], "a": 2, "e": "C 理解正确。迁客骚人的心情随阴晴景色变化而或悲或喜（以物喜，以己悲），这正是古仁人与之不同的地方。"}, {"tag": "内容理解", "q": "下列对文章内容与艺术分析有误的一项是？", "o": ["文章以“记”为名，大量议论，借写景抒发政治理想", "“微斯人，吾谁与归”既赞美古仁人，也暗含劝勉滕子京", "“先天下之忧而忧，后天下之乐而乐”体现古仁人超脱个人得失，心怀天下", "古仁人“进亦忧，退亦忧”，是指做官就忧愁，不做官就不再忧愁"], "a": 3, "e": "D 有误。“进亦忧，退亦忧”是指无论做官（进）还是退隐（退）都心怀天下而忧虑，并非“不做官就不再忧愁”。"}, {"tag": "内容理解", "q": "下面对全文理解表述错误的一项是？", "o": ["文中写阴晴两种景色，用来对比迁客骚人两种不同心境", "作者实地游览岳阳楼，目睹洞庭风光写下本篇文章", "“衔远山，吞长江”的“衔”“吞”用拟人，写出洞庭湖气势宏大", "古仁人的境界高于迁客骚人，是作者推崇的理想人格"], "a": 1, "e": "B 错误。范仲淹并未亲临岳阳楼，本文是他应滕子京之请、依据《洞庭晚秋图》等写成的。"}, {"tag": "翻译", "q": "对“微斯人，吾谁与归”翻译正确的一项是？", "o": ["如果没有这样的人，我同谁一道呢？", "如果没有这种人，我和谁一起回来？", "微小的人，我和谁一起回去？", "如果没有这个人，我同谁归还呢？"], "a": 0, "e": "“微”意为如果没有，“吾谁与归”是宾语前置（吾与谁归）。A 翻译准确。B 误译“归”为回来；C 误译“微”为微小；D 误译“归”为归还。"}, {"tag": "翻译", "q": "对“先天下之忧而忧，后天下之乐而乐”翻译正确的一项是？", "o": ["在天下人忧愁之前先忧愁，在天下人快乐之后才快乐", "先为天下人担忧，后为天下人高兴", "天下人忧愁之前就忧愁，天下人快乐之后就快乐", "在天下之前忧愁，在天下之后快乐"], "a": 0, "e": "“先”“后”都是名词作状语（在……之前、在……之后）。A 翻译准确。C 漏掉“先”“后”作状语的含义；B、D 语序不当。"}, {"tag": "句式", "q": "【联动七八年级】下列句子中属于状语后置（介宾短语后置）的一项是？", "o": ["刻唐贤今人诗赋于其上", "其印为余群从所得", "马之千里者", "何陋之有"], "a": 0, "e": "A 是状语后置，“于其上”后置（于其上刻诗赋）。B 是被动句（为……所，选自《活板》）；C 是定语后置（选自《马说》）；D 是宾语前置（何陋之有=有何陋，选自《陋室铭》）。"}, {"tag": "词类活用", "q": "【联动七八年级】下列句中加点字的用法与其他三项不同的一项是？", "o": ["北通巫峡中“北”", "斗折蛇行中“斗”", "其一犬坐于前中“犬”", "策之不以其道中“策”"], "a": 3, "e": "A“北”（选自本文）名词作状语，向北；B“斗”（选自《小石潭记》）名词作状语，像北斗星那样；C“犬”（选自《狼》）名词作状语，像狗一样；D“策”（选自《马说》）名词作动词，用马鞭驱赶。故选 D。"}]
};

var SOURCE = {
  "吕蒙正为相": "吕文穆公〔吕文穆公〕即吕蒙正，北宋政治家，官至宰相，谥号文穆以宽厚为宰相，太宗尤所眷遇。有一朝士，家藏古镜，自言能照二百里，欲因公弟〔公弟〕吕蒙正的弟弟献以求知。其弟伺间从容〔从容〕舒缓、不慌不忙言之，公笑曰：“吾面不过碟子大，安用照二百里？”其弟遂不复敢言。闻者叹服，以为贤于李卫公〔李卫公〕指李德裕，唐代宰相，封卫国公，以廉洁寡欲著称远矣。盖寡好而不为物累者，昔贤〔贤〕古代贤能之人之所难也。",
  "桃花源记": "晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田、美池、桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。见渔人，乃大惊，问所从来。具答之。便要还家，设酒杀鸡作食。村中闻有此人，咸来问讯。自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。问今是何世，乃不知有汉，无论魏晋。此人一一为具言所闻，皆叹惋。余人各复延至其家，皆出酒食。停数日，辞去。此中人语云：“不足为外人道也。”既出，得其船，便扶向路，处处志之。及郡下，诣太守，说如此。太守即遣人随其往，寻向所志，遂迷，不复得路。南阳刘子骥，高尚士也，闻之，欣然规往。未果，寻病终。后遂无问津者。",
  "周亚夫军细柳": "文帝之后六年，匈奴大入边。乃以宗正刘礼为将军，军霸上；祝兹侯徐厉为将军，军棘门；以河内守亚夫为将军，军细柳：以备胡。上自劳军。至霸上及棘门军，直驰入，将以下骑送迎。已而之细柳军，军士吏被甲，锐兵刃，彀弓弩，持满。天子先驱至，不得入。先驱曰：“天子且至！”军门都尉曰：“将军令曰‘军中闻将军令，不闻天子之诏’。”居无何，上至，又不得入。于是上乃使使持节诏将军：“吾欲入劳军。”亚夫乃传言开壁门。壁门士吏谓从属车骑曰：“将军约，军中不得驱驰。”于是天子乃按辔徐行。至营，将军亚夫持兵曰：“介胄之士不拜，请以军礼见。”天子为动，改容式车。使人称谢：“皇帝敬劳将军。”成礼而去。既出军门，群臣皆惊。文帝曰：“嗟乎，此真将军矣！曩者霸上、棘门军，若儿戏耳，其将固可袭而虏也。至于亚夫，可得而犯邪！”称善者久之。",
  "愚公移山": "太行、王屋二山，方七百里，高万仞，本在冀州之南，河阳之北。北山愚公者，年且九十，面山而居。惩山北之塞，出入之迂也，聚室而谋曰：“吾与汝毕力平险，指通豫南，达于汉阴，可乎？”杂然相许。其妻献疑曰：“以君之力，曾不能损魁父之丘，如太行、王屋何？且焉置土石？”杂曰：“投诸渤海之尾，隐土之北。”遂率子孙荷担者三夫，叩石垦壤，箕畚运于渤海之尾。邻人京城氏之孀妻有遗男，始龀，跳往助之。寒暑易节，始一反焉。河曲智叟笑而止之曰：“甚矣，汝之不惠！以残年余力，曾不能毁山之一毛，其如土石何？”北山愚公长息曰：“汝心之固，固不可彻，曾不若孀妻弱子。虽我之死，有子存焉。子又生孙，孙又生子；子又有子，子又有孙；子子孙孙无穷匮也，而山不加增，何苦而不平？”河曲智叟亡以应。操蛇之神闻之，惧其不已也，告之于帝。帝感其诚，命夸娥氏二子负二山，一厝朔东，一厝雍南。自此，冀之南，汉之阴，无陇断焉。",
  "生于忧患，死于安乐": "舜发于畎亩之中，傅说举于版筑之间，胶鬲举于鱼盐之中，管夷吾举于士，孙叔敖举于海，百里奚举于市。故天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。人恒过，然后能改；困于心，衡于虑，而后作；征于色，发于声，而后喻。入则无法家拂士，出则无敌国外患者，国恒亡。然后知生于忧患而死于安乐也。",
  "富贵不能淫": "景春曰：“公孙衍、张仪岂不诚大丈夫哉？一怒而诸侯惧，安居而天下熄。”孟子曰：“是焉得为大丈夫乎？子未学礼乎？丈夫之冠也，父命之；女子之嫁也，母命之，往送之门，戒之曰：'往之女家，必敬必戒，无违夫子！'以顺为正者，妾妇之道也。居天下之广居，立天下之正位，行天下之大道。得志，与民由之；不得志，独行其道。富贵不能淫，贫贱不能移，威武不能屈。此之谓大丈夫。”",
  "得道多助，失道寡助": "天时不如地利，地利不如人和。三里之城，七里之郭，环而攻之而不胜。夫环而攻之，必有得天时者矣，然而不胜者，是天时不如地利也。城非不高也，池非不深也，兵革非不坚利也，米粟非不多也，委而去之，是地利不如人和也。故曰：域民不以封疆之界，固国不以山溪之险，威天下不以兵革之利。得道者多助，失道者寡助。寡助之至，亲戚畔之；多助之至，天下顺之。以天下之所顺，攻亲戚之所畔，故君子有不战，战必胜矣。",
  "与朱元思书": "风烟俱净，天山共色。从流飘荡，任意东西。自富阳至桐庐一百许里，奇山异水，天下独绝。水皆缥碧，千丈见底。游鱼细石，直视无碍。急湍甚箭，猛浪若奔。夹岸高山，皆生寒树，负势竞上，互相轩邈，争高直指，千百成峰。泉水激石，泠泠作响；好鸟相鸣，嘤嘤成韵。蝉则千转不穷，猿则百叫无绝。鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反。横柯上蔽，在昼犹昏；疏条交映，有时见日。",
  "记承天寺夜游": "元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭。庭下如积水空明，水中藻、荇交横，盖竹柏影也。何夜无月何处无竹柏但少闲人如吾两人者耳。",
  "答谢中书书": "山川之美，古来共谈。高峰入云，清流见底。两岸石壁，五色交辉。青林翠竹，四时俱备。晓雾将歇，猿鸟乱鸣；夕日欲颓，沉鳞竞跃。实是欲界之仙都。自康乐以来，未复有能与其奇者。",
  "三峡": "自三峡七百里中，两岸连山，略无阙处。重岩叠嶂，隐天蔽日，自非亭午夜分，不见曦月。至于夏水襄陵，沿溯阻绝。或王命急宣，有时朝发白帝，暮到江陵，其间千二百里，虽乘奔御风，不以疾也。春冬之时，则素湍绿潭，回清倒影，绝巘(yǎn)多生怪柏，悬泉瀑布，飞漱其间，清荣峻茂，良多趣味。每至晴初霜旦，林寒涧肃，常有高猿长啸，属引凄异，空谷传响，哀转久绝。故渔者歌曰：“巴东三峡巫峡长，猿鸣三声泪沾裳。”",
  "活板": "板印书籍，唐人尚未盛为之。自冯瀛王始印五经，已后典籍皆为板本。 庆历中，有布衣毕昇，又为活板。 其法：用胶泥刻字，薄如钱唇，每字为一印，火烧令坚。 先设一铁板，其上以松脂、蜡和纸灰之类冒之。 欲印，则以一铁范置铁板上，乃密布字印，满铁范为一板，持就火炀之，药稍熔，则以一平板按其面，则字平如砥。 若止印三二本，未为简易；若印数十百千本，则极为神速。 常作二铁板，一板印刷，一板已自布字，此印者才毕，则第二板已具，更互用之，瞬息可就。 每一字皆有数印，如“之”“也”等字，每字有二十余印，以备一板内有重复者。 不用，则以纸帖之，每韵为一帖，木格贮之。 有奇字素无备者，旋刻之，以草火烧，瞬息可成。 不以木为之者，文理有疏密，沾水则高下不平，兼与药相粘，不可取；不若燔土，用讫再火令药熔，以手拂之，其印自落，殊不沾污。 昇死，其印为余群从所得，至今保藏。",
  "木兰诗": "唧唧复唧唧，木兰当户织。不闻机杼声，唯闻女叹息。问女何所思，问女何所忆。女亦无所思，女亦无所忆。昨夜见军帖，可汗(kè hán)大点兵，军书十二卷，卷卷有爷名。阿爷无大儿，木兰无长兄，愿为市鞍马，从此替爷征。东市买骏马，西市买鞍鞯(jiān)，南市买辔(pèi)头，北市买长鞭。旦辞爷娘去，暮宿黄河边……万里赴戎机，关山度若飞。朔气传金柝(tuò)，寒光照铁衣。将军百战死，壮士十年归。……爷娘闻女来，出郭相扶将……雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？",
  "爱莲说": "水陆草木之花，可爱者甚蕃(fán)。晋陶渊明独爱菊。自李唐来，世人甚爱牡丹。予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。予谓菊花之隐逸者也牡丹花之富贵者也莲花之君子者也。噫！菊之爱，陶后鲜有闻。莲之爱，同予者何人？牡丹之爱，宜乎众矣。",
  "陋室铭": "山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？",
  "卖油翁": "陈康肃公善射当世无双公亦以此自矜(jīn)。尝射于家圃，有卖油翁释担而立，睨(nì)之久而不去。见其发矢十中八九，但微颔(hàn)之。康肃问曰：“汝亦知射乎？吾射不亦精乎？”翁曰：“无他，但手熟尔。”康肃忿然曰：“尔安敢轻吾射！”翁曰：“以我酌(zhuó)油知之。”乃取一葫芦置于地，以钱覆其口，徐以杓(sháo)酌油沥之，自钱孔入，而钱不湿。因曰：“我亦无他，惟手熟尔。”康肃笑而遣之。",
  "孙权劝学": "初，权谓吕蒙曰：“卿(qīng)今当涂掌事，不可不学！”蒙辞以军中多务。权曰：“孤岂欲卿治经为博士邪(yé)！但当涉猎，见往事耳。卿言多务孰若孤孤常读书自以为大有所益。”蒙乃始就学。及鲁肃过寻阳，与蒙论议，大惊曰：“卿今者才略，非复吴下阿蒙！”蒙曰：“士别三日，即更(gēng)刮目相待，大兄何见事之晚乎！”肃遂拜蒙母，结友而别。",
  "司马光": "群儿戏于庭，一儿登瓮，足跌没水中。众皆弃去，光持石击破之，水迸，儿得活。",
  "守株待兔": "宋人有耕者。田中有株。兔走触株，折颈而死。因释其耒而守株，冀复得兔。兔不可复得，而身为宋国笑。",
  "精卫填海": "炎帝之少女，名曰女娃。女娃游于东海，溺而不返，故为精卫，常衔西山之木石，以堙(yīn)于东海。",
  "王戎不取道旁李": "王戎七岁，尝与诸小儿游。看道边李树多子折枝，诸儿竞走取之，唯戎不动。人问之，答曰：“树在道边而多子，此必苦李。”取之，信然。",
  "囊萤夜读": "胤恭勤不倦，博学多通。家贫不常得油，夏月则练囊盛数十萤火以照书，以夜继日焉。",
  "铁杵成针": "磨针溪，在象耳山下。世传李太白读书山中，未成，弃去。过是溪，逢老媪方磨铁杵。问之，曰：“欲作针。”太白感其意，还卒业。",
  "古人谈读书之论语": "①知之为知之，不知为不知，是知也。｜②敏而好学，不耻下问。｜③默而识之，学而不厌，诲人不倦。｜④我非生而知之者，好古，敏以求之者也。｜⑤学如不及，犹恐失之。｜⑥吾尝终日不食，终夜不寝，以思，无益，不如学也。",
  "古人谈读书之读书有三到": "余尝谓读书有三到，谓心到、眼到、口到。心不在此，则眼不看仔细，心既不专一，却只漫浪诵读，决不能记，记亦不能久也。三到之中，心到最急。心既到矣，眼口岂不到乎？",
  "自相矛盾": "楚人有鬻(yù)盾与矛者，誉之曰：“吾盾之坚，物莫能陷也。”又誉其矛曰：“吾矛之利，于物无不陷也。”或曰：“以子之矛陷子之盾，何如？”其人弗能应也。夫不可陷之盾与无不陷之矛，不可同世而立。",
  "杨氏之子": "梁国杨氏子九岁，甚聪惠。孔君平诣其父，父不在，乃呼儿出。为设果，果有杨梅。孔指以示儿曰：“此是君家果。”儿应声答曰：“未闻孔雀是夫子家禽。”",
  "伯牙鼓琴": "伯牙鼓琴，锺子期听之。方鼓琴而志在太山，锺子期曰：“善哉乎鼓琴，巍巍乎若太山。”少选之间而志在流水，锺子期又曰：“善哉乎鼓琴，汤汤乎若流水。”锺子期死，伯牙破琴绝弦，终身不复鼓琴，以为世无足复为鼓琴者。",
  "书戴嵩画牛": "蜀中有杜处士，好书画，所宝以百数。有戴嵩《牛》一轴，尤所爱，锦囊玉轴，常以自随。一日曝书画，有一牧童见之，拊(fǔ)掌大笑，曰：“此画斗牛也。牛斗，力在角，尾搐入两股间，今乃掉尾而斗，谬(miù)矣。”处士笑而然之。古语有云：“耕当问奴，织当问婢。”不可改也。",
  "学弈": "弈秋，通国之善弈者也。使弈秋诲二人弈，其一人专心致志，惟弈秋之为听；一人虽听之，一心以为有鸿鹄将至，思援弓缴(zhuó)而射之。虽与之俱学，弗若矣。为是其智弗若与(yú)？曰：非然也。",
  "两小儿辩日": "孔子东游，见两小儿辩斗，问其故。一儿曰：“我以日始出时去人近，而日中时远也。”一儿曰：“我以日初出远，而日中时近也。”一儿曰：“日初出大如车盖，及日中则如盘盂，此不为远者小而近者大乎？”一儿曰：“日初出沧沧凉凉，及其日中如探汤，此不为近者热而远者凉乎？”孔子不能决也。两小儿笑曰：“孰(shú)为汝多知乎？”",
  "咏雪": "谢太傅寒雪日内集，与儿女讲论文义。俄而雪骤，公欣然曰：“白雪纷纷何所似？”兄子胡儿曰：“撒盐空中差可拟。”兄女曰：“未若柳絮因风起。”公大笑乐。即公大兄无奕女，左将军王凝之妻也。",
  "陈太丘与友期行": "陈太丘与友期行，期日中。过中不至，太丘舍去，去后乃至。元方时年七岁，门外戏。客问元方：“尊君在不？”答曰：“待君久不至，已去。”友人便怒曰：“非人哉！与人期行，相委而去。”元方曰：“君与家君期日中。日中不至，则是无信；对子骂父，则是无礼。”友人惭，下车引之。元方入门不顾。",
  "论语十二章": "①子曰：“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？”｜②曾子曰：“吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？”｜③子曰：“吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。”｜④子曰：“温故而知新，可以为师矣。”｜⑤子曰：“学而不思则罔，思而不学则殆。”｜⑥子曰：“贤哉，回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。贤哉，回也！”｜⑦子曰：“知之者不如好之者，好之者不如乐之者。”｜⑧子曰：“饭疏食，饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云。”｜⑨子曰：“三人行，必有我师焉。择其善者而从之，其不善者而改之。”｜⑩子在川上曰：“逝者如斯夫，不舍昼夜。”｜⑪子曰：“三军可夺帅也，匹夫不可夺志也。”｜⑫子夏曰：“博学而笃志，切问而近思，仁在其中矣。”",
  "诫子书": "夫君子之行，静以修身，俭以养德。非淡泊无以明志，非宁静无以致远。夫学须静也，才须学也，非学无以广才，非志无以成学。淫慢则不能励精，险躁则不能治性。年与时驰，意与日去，遂成枯落，多不接世，悲守穷庐，将复何及！",
  "狼": "一屠晚归，担中肉尽，止有剩骨。途中两狼，缀行甚远。屠惧，投以骨。一狼得骨止，一狼仍从。复投之，后狼止而前狼又至。骨已尽矣，而两狼之并驱如故。屠大窘，恐前后受其敌。顾野有麦场，场主积薪其中，苫(shàn)蔽成丘。屠乃奔倚其下，弛担持刀。狼不敢前，眈眈相向。少时，一狼径去，其一犬坐于前。久之，目似瞑，意暇甚。屠暴起，以刀劈狼首，又数刀毙之。方欲行，转视积薪后，一狼洞其中，意将隧入以攻其后也。身已半入，止露尻(kāo)尾。屠自后断其股，亦毙之。乃悟前狼假寐，盖以诱敌。狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？止增笑耳。",
  "穿井得一人": "宋之丁氏，家无井而出溉汲，常一人居外。及其家穿井，告人曰：“吾穿井得一人。”有闻而传之者：“丁氏穿井得一人。”国人道之，闻之于宋君。宋君令人问之于丁氏，丁氏对曰：“得一人之使，非得一人于井中也。”求闻之若此，不若无闻也。",
  "杞人忧天": "杞国有人忧天地崩坠，身亡所寄，废寝食者。又有忧彼之所忧者，因往晓之，曰：“天，积气耳，亡处亡气。若屈伸呼吸，终日在天中行止，奈何忧崩坠乎？”其人曰：“天果积气，日月星宿，不当坠耶？”晓之者曰：“日月星宿，亦积气中之有光耀者，只使坠，亦不能有所中伤。”其人曰：“奈地坏何？”晓之者曰：“地，积块耳，充塞四虚，亡处亡块。若躇步跐蹈，终日在地上行止，奈何忧其坏？”其人舍然大喜，晓之者亦舍然大喜。",
  "小石潭记": "从小丘西行百二十步，隔篁竹，闻水声，如鸣珮环，心乐之。伐竹取道，下见小潭，水尤清冽。全石以为底，近岸，卷石底以出，为坻，为屿，为嵁，为岩。青树翠蔓，蒙络摇缀，参差披拂。 潭中鱼可百许头，皆若空游无所依，日光下澈，影布石上。佁然不动，俶尔远逝，往来翕忽，似与游者相乐。 潭西南而望，斗折蛇行，明灭可见。其岸势犬牙差互，不可知其源。 坐潭上，四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃。以其境过清，不可久居，乃记之而去。 同游者：吴武陵，龚古，余弟宗玄。隶而从者，崔氏二小生，曰恕己，曰奉壹。",
  "核舟记": "明有奇巧人曰王叔远，能以径寸之木，为宫室、器皿、人物，以至鸟兽、木石，罔不因势象形，各具情态。尝贻余核舟一，盖大苏泛赤壁云。 舟首尾长约八分有奇，高可二黍许。中轩敞者为舱，箬篷覆之。旁开小窗，左右各四，共八扇。启窗而观，雕栏相望焉。闭之，则右刻“山高月小，水落石出”，左刻“清风徐来，水波不兴”，石青糁之。 船头坐三人，中峨冠而多髯者为东坡，佛印居右，鲁直居左。苏、黄共阅一手卷。东坡右手执卷端，左手抚鲁直背。鲁直左手执卷末，右手指卷，如有所语。东坡现右足，鲁直现左足，各微侧，其两膝相比者，各隐卷底衣褶中。佛印绝类弥勒，袒胸露乳，矫首昂视，神情与苏、黄不属。卧右膝，诎右臂支船，而竖其左膝，左臂挂念珠倚之——珠可历历数也。 舟尾横卧一楫。楫左右舟子各一人。居右者椎髻仰面，左手倚一衡木，右手攀右趾，若啸呼状。居左者右手执蒲葵扇，左手抚炉，炉上有壶，其人视端容寂，若听茶声然。 其船背稍夷，则题名其上，文曰“天启壬戌秋日，虞山王毅叔远甫刻”，细若蚊足，钩画了了，其色墨。又用篆章一，文曰“初平山人”，其色丹。 通计一舟，为人五；为窗八；为箬篷，为楫，为炉，为壶，为手卷，为念珠各一；对联、题名并篆文，为字共三十有四。而计其长曾不盈寸。盖简桃核修狭者为之。嘻，技亦灵怪矣哉！",
  "北冥有鱼": "北冥有鱼，其名为鲲。鲲之大，不知其几千里也；化而为鸟，其名为鹏。鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。是鸟也，海运则将徙于南冥。南冥者，天池也。《齐谐》者，志怪者也。 《谐》之言曰：“鹏之徙于南冥也，水击三千里，抟扶摇而上者九万里，去以六月息者也。”野马也，尘埃也，生物之以息相吹也。天之苍苍，其正色邪？其远而无所至极邪？其视下也，亦若是则已矣。",
  "庄子与惠子游于濠梁": "庄子与惠子游于濠梁之上。庄子曰：“鲦鱼出游从容，是鱼之乐也。”惠子曰：“子非鱼，安知鱼之乐？”庄子曰：“子非我，安知我不知鱼之乐？”惠子曰：“我非子，固不知子矣；子固非鱼也，子之不知鱼之乐，全矣！” 庄子曰：“请循其本。子曰‘汝安知鱼乐’云者，既已知吾知之而问我，我知之濠上也。”",
  "虽有嘉肴": "虽有嘉肴，弗食，不知其旨也；虽有至道，弗学，不知其善也。是故学然后知不足，教然后知困。 知不足，然后能自反也；知困，然后能自强也。故曰：教学相长也。《兑命》曰“学学半”，其此之谓乎！",
  "床头捉刀人": "魏武将见匈奴使，自以形陋，不足雄远国，使崔季圭代，帝自捉刀立床头。 既毕，令间谍问曰：“魏王何如？” 匈奴使答曰：“魏王雅望非常，然床头捉刀人乃英雄也。” 魏武闻之，追杀此使。",
  "大道之行也": "大道之行也，天下为公。选贤与能，讲信修睦。 故人不独亲其亲，不独子其子，使老有所终，壮有所用，幼有所长，矜、寡、孤、独、废疾者皆有所养，男有分，女有归。 货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己。是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭。是谓大同。",
  "原不识字": "有延师教其子者，师至，主人曰：“家贫，多失礼于先生，奈何！”师曰：“何言之谦，仆固无不可者。” 主人曰：“蔬食，可乎？”曰：“可。”主人曰：“家无臧获，凡洒扫庭除，启闭门户，劳先生为之，可乎？”曰：“可。” 主人曰：“或家人妇子欲买零星杂物，屈先生一行，可乎？”曰：“可。”主人曰：“如此，幸甚！”师曰：“仆亦有一言，愿主人勿讶焉。” 主人问何言？师曰：“自愧幼时不学耳！”主人曰：“何言之谦。”师曰：“不敢欺，仆实不识一字。”",
  "属牛": "一官遇生辰，吏典闻其属鼠，乃醵黄金铸一鼠为寿。 官甚喜，曰：“汝等可知奶奶生辰亦在目下乎？” 众吏曰：“不知，请问其属？”官曰：“小我一岁，丑年生的。”",
  "书低": "一生赁僧房读书，每日游玩，午后归房。呼童取书来，童持《文选》，视之曰低；持《汉书》，视之曰低；又持《史记》，视之曰低。 僧大诧曰：“此三书熟其一，足称饱学，俱云低何也？” 生曰：“我要睡，取书作枕头耳。”",
  "借牛": "有走柬借牛于富翁者，翁方对客，讳不识字，伪启缄视之。 对来使曰：“知道了，少刻我自来也。”",
  "马说": "世有伯乐，然后有千里马。千里马常有，而伯乐不常有。故虽有名马，祗辱于奴隶人之手，骈死于槽枥之间，不以千里称也。 马之千里者，一食或尽粟一石。食马者不知其能千里而食也。是马也，虽有千里之能，食不饱，力不足，才美不外见，且欲与常马等不可得，安求其能千里也？ 策之不以其道，食之不能尽其材，鸣之而不能通其意，执策而临之，曰：“天下无马！”呜呼！其真无马邪？其真不知马也！"
,
  "岳阳楼记": "庆历四年庆历四年春，滕子京谪守巴陵郡。越明年，政通人和政通人和，百废具兴，乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上，属予作文以记之。\n予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯，朝晖夕阴，气象万千，此则岳阳楼之大观也，前人之述备矣。然则北通巫峡，南极潇湘潇湘，迁客骚人骚人，多会于此，览物之情，得无异乎？\n若夫淫雨霏霏霏霏，连月不开，阴风怒号，浊浪排空，日星隐曜，山岳潜形，商旅不行，樯倾楫摧樯倾楫摧，薄暮冥冥冥冥，虎啸猿啼。登斯楼也，则有去国怀乡，忧谗畏讥忧谗畏讥，满目萧然，感极而悲者矣。\n至若春和景明，波澜不惊，上下天光，一碧万顷，沙鸥翔集，锦鳞游泳，岸芷汀兰岸芷汀兰，郁郁青青。而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。\n嗟夫！予尝求古仁人古仁人之心，或异二者之为，何哉？不以物喜，不以己悲，居庙堂之高则忧其民，处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰“先天下之忧而忧，后天下之乐而乐”乎！噫！微斯人，吾谁与归？时六年九月十五日。"
};

function marTag(btn, t){
  marCurTag = t;
  var tags = document.querySelectorAll('.mar-tags .tag');
  for (var i = 0; i < tags.length; i++) tags[i].classList.remove('on');
  btn.classList.add('on');
  applyMarFilter();
}
function marSearch(){ applyMarFilter(); }
function applyMarFilter(){
  var input = document.getElementById('marSearch');
  var kw = input ? (input.value || '').trim() : '';
  var picks = document.querySelectorAll('#pickList .pick');
  for (var j = 0; j < picks.length; j++) {
    var p = picks[j];
    var g = p.getAttribute('data-tags') || '';
    var okTag = (!marCurTag || g.indexOf(marCurTag) >= 0);
    var okKw = (!kw || (p.textContent || '').indexOf(kw) >= 0);
    p.style.display = (okTag && okKw) ? '' : 'none';
  }
}

function splitSent(s){ return s.match(/[^。！？；]+[。！？；]*/g) || [s]; }
function getCtx(src, q){
  if (!src) return '';
  var m = q.match(/“([^”]*)”/);
  var sent = m ? m[1].replace(/<[^>]+>/g, '') : '';
  var parts = splitSent(src);
  if (parts.length <= 3) { return '<span class="lbl">原文</span>' + src; }
  var idx = -1;
  for (var i = 0; i < parts.length; i++) { if (sent && parts[i].indexOf(sent) !== -1) { idx = i; break; } }
  if (idx === -1) { return '<span class="lbl">原文</span>' + parts.slice(0, 2).join('') + '……'; }
  var from = Math.max(0, idx - 1), to = Math.min(parts.length, idx + 2);
  return '<span class="lbl">原文</span>' + parts.slice(from, to).join('');
}

function renderQ(){

  document.getElementById('qText').innerHTML = q.q;

  var qCtx = document.getElementById('qCtx');

  if (qCtx) { qCtx.innerHTML = getCtx(SOURCE[q.title] || '', q.q); }

  var box = document.getElementById('qOpts');

  var order = shf([0,1,2,3]);

  var letters = ['A','B','C','D'];

  var h = '';

  order.forEach(function(d, idx){

    h += '<label data-v="' + d + '" onclick="pick(' + d + ', this)"><span class="ol">' + letters[idx] + '</span>' + q.o[d] + '</label>';

  });

  box.innerHTML = h;

}



window.pick = function(optIdx, el){

  if (el.classList.contains('lock')) return;

  var q = seq[cur];

  var labels = document.querySelectorAll('#qOpts label');

  for (var i=0;i<labels.length;i++) labels[i].classList.add('lock');

  el.classList.add('picked');

  if (optIdx === q.a) { correct++; } else { perTitle[q.title] = (perTitle[q.title] || 0) + 1; try { var _wl = JSON.parse(localStorage.getItem('gd_wrong') || '[]'); _wl.push({ paper: '《' + q.title + '》', time: new Date().toLocaleString(), tag: q.tag, q: q.q, options: q.o, userAns: optIdx, correct: q.a, explain: '' }); localStorage.setItem('gd_wrong', JSON.stringify(_wl)); } catch (e) {} }

  setTimeout(nextQ, 350);

};



function nextQ(){

  cur++;

  if (cur >= seq.length) { finish(); return; }

  renderQ();

}



function finish(){

  s2.style.display = 'none';

  var total = seq.length;

  var rate = Math.round(correct / total * 100);

  document.getElementById('rateNum').textContent = rate + '%';

  var parts = picked.map(function(t){ var w = perTitle[t] || 0; return w === 0 ? t + '（全对⭐）' : t + '（错了' + w + '题）'; });

  document.getElementById('pickedList').textContent = '本次篇目：' + parts.join('、');

  document.getElementById('rateDetail').textContent = '答对 ' + correct + ' / ' + total + ' 题';

  var used = Math.round((Date.now() - startTime) / 1000);

  var mm = Math.floor(used / 60), ss = used % 60;

  document.getElementById('timeUsed').textContent = '用时 ' + mm + '分' + (ss < 10 ? '0' : '') + ss + '秒';

  var cm;

  if (rate >= 90) cm = '🏆 太厉害了！连打高手！';

  else if (rate >= 75) cm = '👏 掌握得很扎实！';

  else if (rate >= 60) cm = '💪 基础不错，继续加油！';

  else if (rate >= 40) cm = '📖 需要再复习一下重点字词哦。';

  else cm = '🔄 建议先单篇精读，再来连打挑战！';

  document.getElementById('rateComment').textContent = cm;

  s3.style.display = 'block';

  window.scrollTo({top:0, behavior:'smooth'});

}



document.getElementById('againBtn').addEventListener('click', function(){

  // reset selections

  var cbs = document.querySelectorAll('.pick input');

  for (var i=0;i<cbs.length;i++){ cbs[i].checked=false; }

  document.querySelectorAll('.pick').forEach(function(d){ d.classList.remove('sel'); });

  tip.textContent = ''; startBtn.disabled = true; floatStart.disabled = true;

  s3.style.display='none'; s2.style.display='none'; s1.style.display='block'; floatStart.style.display='block';

});

floatStart.addEventListener('click', function(){

  if (startBtn.disabled) { tip.textContent = '请先选择至少一篇'; return; }

  startBtn.click();

});

})();

</script>
