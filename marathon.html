var SOURCE = "孙权劝学": "初，权谓吕蒙曰：“卿(qīng)今当涂掌事，不可不学！”蒙辞以军中多务。权曰：“孤岂欲卿治经为博士邪(yé)！但当涉猎，见往事耳。卿言多务孰若孤孤常读书自以为大有所益。”蒙乃始就学。及鲁肃过寻阳，与蒙论议，大惊曰：“卿今者才略，非复吴下阿蒙！”蒙曰：“士别三日，即更(gēng)刮目相待，大兄何见事之晚乎！”肃遂拜蒙母，结友而别。","司马光": "群儿戏于庭，一儿登瓮，足跌没水中。众皆弃去，光持石击破之，水迸，儿得活。", "守株待兔": "宋人有耕者。田中有株。兔走触株，折颈而死。因释其耒而守株，冀复得兔。兔不可复得，而身为宋国笑。", "精卫填海": "炎帝之少女，名曰女娃。女娃游于东海，溺而不返，故为精卫，常衔西山之木石，以堙(yīn)于东海。", "王戎不取道旁李": "王戎七岁，尝与诸小儿游。看道边李树多子折枝，诸儿竞走取之，唯戎不动。人问之，答曰：“树在道边而多子，此必苦李。”取之，信然。", "囊萤夜读": "胤恭勤不倦，博学多通。家贫不常得油，夏月则练囊盛数十萤火以照书，以夜继日焉。", "铁杵成针": "磨针溪，在象耳山下。世传李太白读书山中，未成，弃去。过是溪，逢老媪方磨铁杵。问之，曰：“欲作针。”太白感其意，还卒业。", "古人谈读书之论语": "①知之为知之，不知为不知，是知也。｜②敏而好学，不耻下问。｜③默而识之，学而不厌，诲人不倦。｜④我非生而知之者，好古，敏以求之者也。｜⑤学如不及，犹恐失之。｜⑥吾尝终日不食，终夜不寝，以思，无益，不如学也。", "古人谈读书之读书有三到": "余尝谓读书有三到，谓心到、眼到、口到。心不在此，则眼不看仔细，心既不专一，却只漫浪诵读，决不能记，记亦不能久也。三到之中，心到最急。心既到矣，眼口岂不到乎？", "自相矛盾": "楚人有鬻(yù)盾与矛者，誉之曰：“吾盾之坚，物莫能陷也。”又誉其矛曰：“吾矛之利，于物无不陷也。”或曰：“以子之矛陷子之盾，何如？”其人弗能应也。夫不可陷之盾与无不陷之矛，不可同世而立。", "杨氏之子": "梁国杨氏子九岁，甚聪惠。孔君平诣其父，父不在，乃呼儿出。为设果，果有杨梅。孔指以示儿曰：“此是君家果。”儿应声答曰：“未闻孔雀是夫子家禽。”", "伯牙鼓琴": "伯牙鼓琴，锺子期听之。方鼓琴而志在太山，锺子期曰：“善哉乎鼓琴，巍巍乎若太山。”少选之间而志在流水，锺子期又曰：“善哉乎鼓琴，汤汤乎若流水。”锺子期死，伯牙破琴绝弦，终身不复鼓琴，以为世无足复为鼓琴者。", "书戴嵩画牛": "蜀中有杜处士，好书画，所宝以百数。有戴嵩《牛》一轴，尤所爱，锦囊玉轴，常以自随。一日曝书画，有一牧童见之，拊(fǔ)掌大笑，曰：“此画斗牛也。牛斗，力在角，尾搐入两股间，今乃掉尾而斗，谬(miù)矣。”处士笑而然之。古语有云：“耕当问奴，织当问婢。”不可改也。", "学弈": "弈秋，通国之善弈者也。使弈秋诲二人弈，其一人专心致志，惟弈秋之为听；一人虽听之，一心以为有鸿鹄将至，思援弓缴(zhuó)而射之。虽与之俱学，弗若矣。为是其智弗若与(yú)？曰：非然也。", "两小儿辩日": "孔子东游，见两小儿辩斗，问其故。一儿曰：“我以日始出时去人近，而日中时远也。”一儿曰：“我以日初出远，而日中时近也。”一儿曰：“日初出大如车盖，及日中则如盘盂，此不为远者小而近者大乎？”一儿曰：“日初出沧沧凉凉，及其日中如探汤，此不为近者热而远者凉乎？”孔子不能决也。两小儿笑曰：“孰(shú)为汝多知乎？”", "咏雪": "谢太傅寒雪日内集，与儿女讲论文义。俄而雪骤，公欣然曰：“白雪纷纷何所似？”兄子胡儿曰：“撒盐空中差可拟。”兄女曰：“未若柳絮因风起。”公大笑乐。即公大兄无奕女，左将军王凝之妻也。", "陈太丘与友期行": "陈太丘与友期行，期日中。过中不至，太丘舍去，去后乃至。元方时年七岁，门外戏。客问元方：“尊君在不？”答曰：“待君久不至，已去。”友人便怒曰：“非人哉！与人期行，相委而去。”元方曰：“君与家君期日中。日中不至，则是无信；对子骂父，则是无礼。”友人惭，下车引之。元方入门不顾。", "论语十二章": "①子曰：“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？”｜②曾子曰：“吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？”｜③子曰：“吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。”｜④子曰：“温故而知新，可以为师矣。”｜⑤子曰：“学而不思则罔，思而不学则殆。”｜⑥子曰：“贤哉，回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。贤哉，回也！”｜⑦子曰：“知之者不如好之者，好之者不如乐之者。”｜⑧子曰：“饭疏食，饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云。”｜⑨子曰：“三人行，必有我师焉。择其善者而从之，其不善者而改之。”｜⑩子在川上曰：“逝者如斯夫，不舍昼夜。”｜⑪子曰：“三军可夺帅也，匹夫不可夺志也。”｜⑫子夏曰：“博学而笃志，切问而近思，仁在其中矣。”", "诫子书": "夫君子之行，静以修身，俭以养德。非淡泊无以明志，非宁静无以致远。夫学须静也，才须学也，非学无以广才，非志无以成学。淫慢则不能励精，险躁则不能治性。年与时驰，意与日去，遂成枯落，多不接世，悲守穷庐，将复何及！", "狼": "一屠晚归，担中肉尽，止有剩骨。途中两狼，缀行甚远。屠惧，投以骨。一狼得骨止，一狼仍从。复投之，后狼止而前狼又至。骨已尽矣，而两狼之并驱如故。屠大窘，恐前后受其敌。顾野有麦场，场主积薪其中，苫(shàn)蔽成丘。屠乃奔倚其下，弛担持刀。狼不敢前，眈眈相向。少时，一狼径去，其一犬坐于前。久之，目似瞑，意暇甚。屠暴起，以刀劈狼首，又数刀毙之。方欲行，转视积薪后，一狼洞其中，意将隧入以攻其后也。身已半入，止露尻(kāo)尾。屠自后断其股，亦毙之。乃悟前狼假寐，盖以诱敌。狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？止增笑耳。", "穿井得一人": "宋之丁氏，家无井而出溉汲，常一人居外。及其家穿井，告人曰：“吾穿井得一人。”有闻而传之者：“丁氏穿井得一人。”国人道之，闻之于宋君。宋君令人问之于丁氏，丁氏对曰：“得一人之使，非得一人于井中也。”求闻之若此，不若无闻也。", "杞人忧天": "杞国有人忧天地崩坠，身亡所寄，废寝食者。又有忧彼之所忧者，因往晓之，曰：“天，积气耳，亡处亡气。若屈伸呼吸，终日在天中行止，奈何忧崩坠乎？”其人曰：“天果积气，日月星宿，不当坠耶？”晓之者曰：“日月星宿，亦积气中之有光耀者，只使坠，亦不能有所中伤。”其人曰：“奈地坏何？”晓之者曰：“地，积块耳，充塞四虚，亡处亡块。若躇步跐蹈，终日在地上行止，奈何忧其坏？”其人舍然大喜，晓之者亦舍然大喜。"};



(function(){

var pickList = document.getElementById('pickList');

var startBtn = document.getElementById('startBtn');

var floatStart = document.getElementById('floatStart');

var tip = document.getElementById('tip');

var s1 = document.getElementById('s1'), s2 = document.getElementById('s2'), s3 = document.getElementById('s3');

var titles = Object.keys(QDATA);

var selected = {};



// Render pick list

titles.forEach(function(t){

  var n = QDATA[t].length;

  var div = document.createElement('label');

  div.className = 'pick';

  div.innerHTML = '<input type="checkbox" value="' + t + '"><span class="nm">' + t + '</span><span class="ct">' + n + ' 题</span>';

  div.querySelector('input').addEventListener('change', function(e){

    var checked = e.target.checked;

    var count = 0;

    titles.forEach(function(x){ if (document.querySelector('input[value="' + x + '"]').checked) count++; });

    if (checked && count > 5) {

      e.target.checked = false;

      tip.textContent = '最多只能选择 5 篇哦';

      return;

    }

    tip.textContent = count ? '已选择 ' + count + ' 篇' : '';

    div.classList.toggle('sel', e.target.checked);

    startBtn.disabled = count < 1; floatStart.disabled = count < 1;

  });

  pickList.appendChild(div);

});



// shuffle

function shf(a){ var b=[].concat(a); for(var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i];b[i]=b[j];b[j]=t; } return b; }



var seq = [];   // flattened question list: {title, tag, q, o, a}

var cur = 0;    // current index

var correct = 0;



var startTime = 0;

var picked = [];

var perTitle = {};

startBtn.addEventListener('click', function(){

  startTime = Date.now();

  picked = [];

  perTitle = {};

  seq = [];

  titles.forEach(function(t){ var cb = document.querySelector('input[value="' + t + '"]'); if (cb && cb.checked) picked.push(t); });

  titles.forEach(function(t){

    var cb = document.querySelector('input[value="' + t + '"]');

    if (cb && cb.checked) {

      QDATA[t].forEach(function(q){ seq.push({title:t, tag:q.tag, q:q.q, o:q.o, a:q.a}); });

    }

  });

  cur = 0; correct = 0;

  s1.style.display = 'none'; s3.style.display = 'none'; s2.style.display = 'block'; floatStart.style.display = 'none';

  renderQ();

});




function splitSent(s){ return s.match(/[^。！？；]+[。！？；]*/g) || [s]; }
function getCtx(src, q){
  if (!src) return '';
  var m = q.match(/“([^”]*)”/);
  var sent = m ? m[1].replace(/<[^>]+>/g, '') : '';
  var parts = splitSent(src);
  if (parts.length <= 3) { return '<span class="lbl">原文</span>' + src; }
  var idx = -1;
  for (var i = 0; i < parts.length; i++) { if (sent && parts[i].indexOf(sent) !== -1) { idx = i; break; } }
  if (idx === -1) { return '<span class="lbl">原文</span>' + parts.slice(0, 2).join('') + '……'; }
  var from = Math.max(0, idx - 1), to = Math.min(parts.length, idx + 2);
  return '<span class="lbl">原文</span>' + parts.slice(from, to).join('');
}

function renderQ(){

  var q = seq[cur];

  document.getElementById('prog').textContent = '第 ' + (cur+1) + ' / ' + seq.length + ' 题';

  document.getElementById('qTitle').textContent = q.title;

  document.getElementById('qTag').textContent = q.tag;

  document.getElementById('qText').innerHTML = q.q;

  var qCtx = document.getElementById('qCtx');

  if (qCtx) { qCtx.innerHTML = getCtx(SOURCE[q.title] || '', q.q); }

  var box = document.getElementById('qOpts');

  var order = shf([0,1,2,3]);

  var letters = ['A','B','C','D'];

  var h = '';

  order.forEach(function(d, idx){

    h += '<label data-v="' + d + '" onclick="pick(' + d + ', this)"><span class="ol">' + letters[idx] + '</span>' + q.o[d] + '</label>';

  });

  box.innerHTML = h;

}



window.pick = function(optIdx, el){

  if (el.classList.contains('lock')) return;

  var q = seq[cur];

  var labels = document.querySelectorAll('#qOpts label');

  for (var i=0;i<labels.length;i++) labels[i].classList.add('lock');

  el.classList.add('picked');

  if (optIdx === q.a) { correct++; } else { perTitle[q.title] = (perTitle[q.title] || 0) + 1; }

  setTimeout(nextQ, 350);

};



function nextQ(){

  cur++;

  if (cur >= seq.length) { finish(); return; }

  renderQ();

}



function finish(){

  s2.style.display = 'none';

  var total = seq.length;

  var rate = Math.round(correct / total * 100);

  document.getElementById('rateNum').textContent = rate + '%';

  var parts = picked.map(function(t){ var w = perTitle[t] || 0; return w === 0 ? t + '（全对⭐）' : t + '（错了' + w + '题）'; });

  document.getElementById('pickedList').textContent = '本次篇目：' + parts.join('、');

  document.getElementById('rateDetail').textContent = '答对 ' + correct + ' / ' + total + ' 题';

  var used = Math.round((Date.now() - startTime) / 1000);

  var mm = Math.floor(used / 60), ss = used % 60;

  document.getElementById('timeUsed').textContent = '用时 ' + mm + '分' + (ss < 10 ? '0' : '') + ss + '秒';

  var cm;

  if (rate >= 90) cm = '🏆 太厉害了！连打高手！';

  else if (rate >= 75) cm = '👏 掌握得很扎实！';

  else if (rate >= 60) cm = '💪 基础不错，继续加油！';

  else if (rate >= 40) cm = '📖 需要再复习一下重点字词哦。';

  else cm = '🔄 建议先单篇精读，再来连打挑战！';

  document.getElementById('rateComment').textContent = cm;

  s3.style.display = 'block';

  window.scrollTo({top:0, behavior:'smooth'});

}



document.getElementById('againBtn').addEventListener('click', function(){

  // reset selections

  var cbs = document.querySelectorAll('.pick input');

  for (var i=0;i<cbs.length;i++){ cbs[i].checked=false; }

  document.querySelectorAll('.pick').forEach(function(d){ d.classList.remove('sel'); });

  tip.textContent = ''; startBtn.disabled = true; floatStart.disabled = true;

  s3.style.display='none'; s2.style.display='none'; s1.style.display='block'; floatStart.style.display='block';

});

floatStart.addEventListener('click', function(){

  if (startBtn.disabled) { tip.textContent = '请先选择至少一篇'; return; }

  startBtn.click();

});

})();

</script>
