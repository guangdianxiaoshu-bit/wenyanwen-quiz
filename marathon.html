<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {

    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Serif SC", serif;

    background: #f8f5f0; color: #2c2c2c; padding: 0 0 48px; line-height: 1.8;

  }

  .wrap { max-width: 560px; margin: 0 auto; padding: 0 14px; }

  .banner {

    background: linear-gradient(135deg, #b5533c, #d47a5e); color: #fff;

    text-align: center; padding: 30px 20px 24px; margin-bottom: 16px;

  }

  .banner h1 { font-size: 22px; font-weight: 700; letter-spacing: 2px; }

  .banner p { font-size: 13px; opacity: .85; margin-top: 4px; }

  .sec { font-size: 15px; font-weight: 600; color: #b5533c; padding-bottom: 6px; border-bottom: 2px solid #e8d5cc; margin: 18px 0 12px; }

  #pickList { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  .pick {

    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 3px;

    background: #fff; padding: 14px 6px; border-radius: 10px; border: 1px solid #ede7dd; cursor: pointer; transition: all .15s; position: relative;

  }

  @media (max-width: 480px) { #pickList { grid-template-columns: repeat(2, 1fr); } }

  .pick:hover { border-color: #d47a5e; }

  .pick.sel { border-color: #b5533c; background: #fdf0ec; }

  .pick input { position: absolute; top: 6px; right: 6px; width: 16px; height: 16px; accent-color: #b5533c; }

  .pick .nm { font-size: 13px; font-weight: 600; color: #3d2b1a; line-height: 1.4; }

  .pick .ct { font-size: 10px; color: #b3926f; }

  .tip { font-size: 12px; color: #999; margin: 4px 0 10px; }

  .btn-bar { text-align: center; margin: 24px 0; }

  .btn {

    display: inline-block; padding: 13px 36px; border-radius: 26px; font-size: 15px; font-weight: 600;

    border: none; cursor: pointer; font-family: inherit; transition: all .2s; margin: 4px 6px;

  }

  .btn-p { background: linear-gradient(135deg, #b5533c, #8f3d2b); color: #fff; box-shadow: 0 2px 8px rgba(181,83,60,0.3); }

  .btn-p:disabled { opacity: .5; cursor: not-allowed; }

  .btn-s { background: #fff; color: #b5533c; border: 2px solid #d47a5e; }

  .qprog { font-size: 13px; color: #999; margin: 10px 0 6px; }

  .qcard { background: #fff; border-radius: 12px; padding: 16px 18px; border: 1px solid #ede7dd; }

  .qhead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }

  .qtitle { font-size: 12px; color: #b5533c; background: #fdf0ec; border-radius: 4px; padding: 1px 8px; }

  .qtag { font-size: 11px; color: #999; }

  .qctx {
    background: #fdf6f2; border: 1px solid #e8d5cc; border-radius: 8px;
    padding: 10px 12px; font-size: 13px; line-height: 1.9; color: #6d4c41;
    margin-bottom: 10px;
  }
  .qctx .lbl { font-size: 11px; color: #b5533c; font-weight: 600; margin-right: 4px; }

  .q { font-size: 15px; font-weight: 500; line-height: 1.7; margin-bottom: 10px; }

  .q .highlight { color: #b5533c; font-weight: 600; }

  .opts label {

    display: block; padding: 10px 14px; margin: 5px 0; border-radius: 8px;

    border: 1.5px solid #e8d5cc; font-size: 14px; cursor: pointer; transition: all .15s;

  }

  .opts label:hover { border-color: #d47a5e; background: #fdf6f2; }

  .opts label.picked { border-color: #b5533c; background: #fdf0ec; }

  .opts label.lock { pointer-events: none; }

  .ol { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; background: #f0ebe3; font-size: 12px; font-weight: 600; margin-right: 8px; color: #666; }

  .opts label.picked .ol { background: #b5533c; color: #fff; }

  .finish {

    background: linear-gradient(135deg, #b5533c, #d47a5e); color: #fff; border-radius: 16px;

    padding: 32px 20px; margin: 24px 0; text-align: center;

  }

  .finish .big { font-size: 46px; font-weight: 800; margin: 8px 0 4px; }

  .finish .sub { font-size: 14px; opacity: .85; }

  .finish .rate { font-size: 60px; font-weight: 800; margin: 12px 0 6px; }

  .finish .cm { font-size: 15px; opacity: .95; margin-top: 8px; }

  .footer { text-align: center; padding: 30px 0 10px; font-size: 12px; color: #bbb; }

  .footer .d { width: 40px; height: 2px; background: #e0d5c5; margin: 0 auto 10px; }

  .float-home {

    position: fixed; right: 16px; bottom: 24px; z-index: 900;

    background: rgba(181,83,60,0.92); color: #fff; padding: 10px 18px; border-radius: 24px;

    font-size: 13px; text-decoration: none; box-shadow: 0 3px 12px rgba(0,0,0,0.25);

    display: flex; align-items: center; gap: 6px; transition: all .2s;

  }

  .float-home:hover { background: #8f3d2b; transform: translateY(-2px); }

  .float-start {

    position: fixed; right: 16px; bottom: 84px; z-index: 900;

    background: rgba(181,83,60,0.95); color: #fff; padding: 10px 18px;

    border: none; border-radius: 24px; font-size: 14px; font-weight: 600;

    cursor: pointer; font-family: inherit; box-shadow: 0 3px 12px rgba(0,0,0,0.25);

    transition: all .2s;

  }

  .float-start:hover { background: #8f3d2b; transform: translateY(-2px); }

  .float-start:disabled { opacity: .5; cursor: not-allowed; transform: none; }

</style>

<div class="wrap">

"桃花源记": [{"tag": "字词释义", "q": "“<span class=\"highlight\">缘</span>溪行”中“<span class=\"highlight\">缘</span>”的意思是？", "o": ["沿着", "缘由", "因为", "缘分"], "a": 0, "e": "“缘”意为“沿着、顺着”。“缘溪行”即顺着溪水划行。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">夹岸</span>数百步”中“<span class=\"highlight\">夹岸</span>”的意思是？", "o": ["两岸", "夹着岸", "岸边", "两岸之间"], "a": 0, "e": "“夹岸”即两岸。"}, {"tag": "字词释义", "q": "“芳草<span class=\"highlight\">鲜美</span>”中“<span class=\"highlight\">鲜美</span>”的意思是？", "o": ["鲜艳", "新鲜美味", "味道鲜美", "鲜嫩美丽"], "a": 3, "e": "“鲜美”意为“鲜嫩美丽”，是古今异义词（今义指味道鲜美）。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">落英</span>缤纷”中“<span class=\"highlight\">落英</span>”的意思是？", "o": ["落花", "花", "花瓣", "落叶"], "a": 0, "e": "“落英”指落花。“英”指花。"}, {"tag": "字词释义", "q": "“落英<span class=\"highlight\">缤纷</span>”中“<span class=\"highlight\">缤纷</span>”的意思是？", "o": ["繁多而错杂的样子", "缤纷（今义）", "纷纷", "繁多"], "a": 0, "e": "“缤纷”形容落花繁多而错杂的样子。"}, {"tag": "字词释义", "q": "“复<span class=\"highlight\">前</span>行”中“<span class=\"highlight\">前</span>”的活用和意思是？", "o": ["名词作状语，向前", "前面", "前进", "先前"], "a": 0, "e": "“前”名词作状语，意为“向前”。“复前行”即又向前划行。"}, {"tag": "字词释义", "q": "“欲<span class=\"highlight\">穷</span>其林”中“<span class=\"highlight\">穷</span>”的意思是？", "o": ["走到尽头", "贫穷", "穷尽", "困窘"], "a": 0, "e": "“穷”意为“走到尽头”。“欲穷其林”即想要走到林子尽头。"}, {"tag": "特殊句式", "q": "“林尽水源”的特殊句式是？", "o": ["判断句", "宾语前置", "状语后置", "被动句"], "a": 2, "e": "“林尽水源”即“林尽（于）水源”，桃花林在溪水发源处就到头了，是状语后置，省略介词“于”。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">仿佛</span>若有光”中“<span class=\"highlight\">仿佛</span>”的意思是？", "o": ["仿佛（今义）", "隐隐约约", "好像", "相似"], "a": 1, "e": "“仿佛”意为“隐隐约约，好像”。"}, {"tag": "字词释义", "q": "“屋舍<span class=\"highlight\">俨然</span>”中“<span class=\"highlight\">俨然</span>”的意思是？", "o": ["整齐的样子", "俨然（今义）", "严肃", "整齐"], "a": 0, "e": "“俨然”意为“整齐的样子”。“屋舍俨然”即房屋整整齐齐。"}, {"tag": "字词释义", "q": "“桑竹之<span class=\"highlight\">属</span>”中“<span class=\"highlight\">属</span>”的意思是？", "o": ["类", "属于", "归属", "嘱咐"], "a": 0, "e": "“属”意为“类”。“桑竹之属”即桑树竹林之类。"}, {"tag": "字词释义", "q": "“阡陌<span class=\"highlight\">交通</span>”中“<span class=\"highlight\">交通</span>”的意思是？", "o": ["相通", "交通运输", "交通（今义）", "交错相通"], "a": 3, "e": "“交通”意为“交错相通”，是古今异义词（今义指交通运输）。"}, {"tag": "字词释义", "q": "“男女衣着，<span class=\"highlight\">悉</span>如外人”中“<span class=\"highlight\">悉</span>”的意思是？", "o": ["全，都", "熟悉", "详细", "知道"], "a": 0, "e": "“悉”意为“全、都”。“悉如外人”即全都和外面的人一样。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">并</span>怡然自乐”中“<span class=\"highlight\">并</span>”的意思是？", "o": ["都，一起", "并且", "并列", "合并"], "a": 0, "e": "“并”意为“都、一起”。“并怡然自乐”即都安闲快乐。"}, {"tag": "字词释义", "q": "“见渔人，<span class=\"highlight\">乃</span>大惊”中“<span class=\"highlight\">乃</span>”的意思是？", "o": ["于是，就", "才", "竟然", "却"], "a": 0, "e": "“乃”意为“于是、就”。看见渔人，于是十分惊奇。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">具</span>答之”中“<span class=\"highlight\">具</span>”的意思是？", "o": ["工具", "详尽", "具备", "具有"], "a": 1, "e": "“具”意为“详尽、详细”。“具答之”即详尽地回答。"}, {"tag": "字词释义", "q": "“便<span class=\"highlight\">要</span>还家”中“<span class=\"highlight\">要</span>”的意思是？", "o": ["同“邀”，邀请", "重要", "要求", "需要"], "a": 0, "e": "“要”同“邀”，邀请。“便要还家”即就邀请（渔人）到自己家。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">咸</span>来问讯”中“<span class=\"highlight\">咸</span>”的意思是？", "o": ["全，都", "咸味", "咸（今义）", "皆"], "a": 0, "e": "“咸”意为“全、都”。“咸来问讯”即都来打听消息。"}, {"tag": "字词释义", "q": "“率<span class=\"highlight\">妻子</span>邑人”中“<span class=\"highlight\">妻子</span>”的意思是？", "o": ["妻子儿女", "妻子和儿子", "妻子（今义）", "家人"], "a": 0, "e": "“妻子”意为“妻子儿女”，是古今异义词（今义只指妻子）。"}, {"tag": "字词释义", "q": "“来此<span class=\"highlight\">绝境</span>”中“<span class=\"highlight\">绝境</span>”的意思是？", "o": ["险境", "绝境（今义）", "与人世隔绝的地方", "走投无路"], "a": 2, "e": "“绝境”意为“与人世隔绝的地方”，是古今异义词（今义指走投无路的境地）。"}, {"tag": "字词释义", "q": "“不复出<span class=\"highlight\">焉</span>”中“<span class=\"highlight\">焉</span>”的意思是？", "o": ["从这里（兼词，于此）", "语气词", "哪里", "怎么"], "a": 0, "e": "“焉”是兼词，意为“于此、从这里”。“不复出焉”即不再从这里出去。"}, {"tag": "字词释义", "q": "“遂与外人<span class=\"highlight\">间隔</span>”中“<span class=\"highlight\">间隔</span>”的意思是？", "o": ["断绝", "间隔（今义）", "隔开", "隔绝"], 会", "表达作者惋惜之情，遗憾刘子骥没能找到世外桃源", "意在批判世人追求隐逸生活，却缺少坚持寻访的毅力"], "a": 1, "e": "借名士寻访失败增添神秘色彩，暗示桃花源是虚构的理想社会，可望而不可即。"}, {"tag": "内容理解", "q": "桃花源中人叮嘱渔人“不足为外人道也”，下列理解不正确的一项是？", "o": ["桃花源人害怕外界战乱侵扰，破坏这里安宁平和的生活", "他们不愿世俗之人闯入，打破与世隔绝、自给自足的美好家园", "桃花源人心存私心，想独自占有这片世外桃源，不愿分享美景", "为下文渔人再寻桃花源却迷路埋下伏笔，推动情节发展"], "a": 2, "e": "桃花源人叮嘱不外传是出于避乱、守护安宁，并非“心存私心、独自占有”。"}],"周亚夫军细柳": [{"tag": "字词释义", "q": "“<span class=\"highlight\">乃</span>以宗正刘礼为将军”中“<span class=\"highlight\">乃</span>”的意思是？", "o": ["于是，就", "才", "竟然", "却"], "a": 0, "e": "“乃”意为“于是、就”。“乃以宗正刘礼为将军”即于是任命宗正刘礼为将军。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">军</span>霸上”中“<span class=\"highlight\">军</span>”的活用和意思是？", "o": ["名词作动词，驻军", "军队", "军营", "军事"], "a": 0, "e": "“军”名词作动词，意为“驻军”。“军霸上”即驻军霸上。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">以</span>备胡”中“<span class=\"highlight\">以</span>”的意思是？", "o": ["来，用来", "凭借", "因为", "认为"], "a": 0, "e": "“以”意为“来、用来”。“以备胡”即用来防备匈奴。"}, {"tag": "字词释义", "q": "“上自<span class=\"highlight\">劳</span>军”中“<span class=\"highlight\">劳</span>”的意思是？", "o": ["慰劳", "劳动", "劳累", "功劳"], "a": 0, "e": "“劳”意为“慰劳”。“上自劳军”即皇上亲自慰劳军队。"}, {"tag": "字词释义", "q": "“将以<span class=\"highlight\">下骑</span>送迎”中“<span class=\"highlight\">下骑</span>”的意思是？", "o": ["下马", "骑马的人", "骑兵", "下车"], "a": 0, "e": "“下骑”意为“下马”。“将以下骑送迎”即将军及其部下都下马迎送。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">已而</span>之细柳军”中“<span class=\"highlight\">已而</span>”的意思是？", "o": ["不久", "已经", "然后", "很久"], "a": 0, "e": "“已而”意为“不久”。"}, {"tag": "字词释义", "q": "“已而<span class=\"highlight\">之</span>细柳军”中“<span class=\"highlight\">之</span>”的意思是？", "o": ["到，往", "的", "代词", "取消句子独立性"], "a": 0, "e": "“之”是动词，意为“到、往”。“之细柳军”即到细柳军营。"}, {"tag": "字词释义", "q": "“军士吏<span class=\"highlight\">被</span>甲”中“<span class=\"highlight\">被</span>”的意思是？", "o": ["同“披”，穿着", "被子", "被动", "背负"], "a": 0, "e": "“被”同“披”，穿着。“军士吏被甲”即官兵都穿着铠甲。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">锐兵刃</span>”中“<span class=\"highlight\">锐</span>”的活用和意思是？", "o": ["形容词使动用法，使……锋利（刀出鞘）", "锐利的兵器", "精锐的部队", "兵器锋利"], "a": 0, "e": "“锐”形容词使动用法，“使……锋利”。“锐兵刃”即使刀刃锋利，即刀出鞘。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">彀(gòu)</span>弓弩”中“<span class=\"highlight\">彀</span>”的意思是？", "o": ["张开", "弓箭", "弓弦", "拉满"], "a": 0, "e": "“彀”意为“张开”。“彀弓弩”即张开弓弩。"}, {"tag": "字词释义", "q": "“天子<span class=\"highlight\">先驱</span>至”中“<span class=\"highlight\">先驱</span>”的意思是？", "o": ["先行引导的人员", "先驱者", "先头部队", "前进"], "a": 0, "e": "“先驱”指先行引导的人员。“天子先驱至”即天子的先行引导人员到了营前。"}, {"tag": "字词释义", "q": "“天子<span class=\"highlight\">且</span>至”中“<span class=\"highlight\">且</span>”的意思是？", "o": ["将要", "并且", "况且", "尚且"], "a": 0, "e": "“且”意为“将要”。“天子且至”即天子即将到来。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">居</span>无何”中“<span class=\"highlight\">居</span>”的意思是？", "o": ["经过，过了", "居住", "停留", "占据"], "a": 0, "e": "“居”意为“经过、过了”。“居无何”即过了不久。"}, {"tag": "字词释义", "q": "“居<span class=\"highlight\">无何</span>”中“<span class=\"highlight\">无何</span>”的意思是？", "o": ["不久", "没有什么", "没有原因", "无论"], "a": 0, "e": "“无何”意为“不久”。“居无何”即过了不久。"}, {"tag": "字词释义", "q": "“于是上乃<span class=\"highlight\">使</span>使持节诏将军”中第一个“<span class=\"highlight\">使</span>”的意思是？", "o": ["派遣", "使者", "使用", "假如"], "a": 0, "e": "第一个“使”是动词，意为“派遣”。"}, {"tag": "字词释义", "q": "“于是上乃使<span class=\"highlight\">使</span>持节诏将军”中第二个“<span class=\"highlight\">使</span>”的意思是？", "o": ["使者", "派遣", "使用", "使命"], "a": 0, "e": "第二个“使”是名词，意为“使者”。"}, {"tag": "字词释义", "q": "“亚夫<span class=\"highlight\">乃</span>传言开壁门”中“<span class=\"highlight\">乃</span>”的意思是？", "o": ["才", "于是", "竟然", "却"], "a": 0, "e": "“乃”意为“才”。“亚夫乃传言开壁门”即周亚夫这才传令打开营垒大门。"}, {"tag": "字词释义", "q": "“壁门士吏<span class=\"highlight\">谓</span>从属车骑曰”中“<span class=\"highlight\">谓</span>”的意思是？", "o": ["告诉，对……说", "认为", "叫做", "称为"], "a": 0, "e": "“谓”意为“告诉、对……说”。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">介</span>胄之士不拜”中“<span class=\"highlight\">介</span>”的活用和意思是？", "o": ["名词作动词，穿铠甲", "介绍", "间隔", "铠甲（名词）"], "a": 0, "e": "“介”名词作动词，意为“穿铠甲”。“介胄之士”即穿铠甲戴头盔的将士。"}, {"tag": "字词释义", "q": "“天子为<span class=\"highlight\">动</span>”中“<span class=\"highlight\">动</span>”的意思是？", "o": ["感动", "行动", "打动", "变动"], "a": 0, "e": "“动”意为“感动”。“天子为动”即天子被他感动（“为”表被动）。"}, {"tag": "字词释义", "q": "“改容<span class=\"highlight\">式车</span>”中“<span class=\"highlight\">式</span>”的意思是？", "o": ["同“轼”，车前横木，这里指扶轼致敬", "乘车", "车式", "仪式"], "a": 0, "e": "“式”同“轼”，车前横木，这里指扶轼致敬。“改容式车”即表情严肃，扶着车前横木表示敬意。"}, {"tag": "字词释义", "q": "“使人<span class=\"highlight\">称谢</span>”中“<span class=\"highlight\">称谢</span>”的意思是？", "o": ["致意，告知", "感谢", "称谢（今义）", "谢罪"], "a": 0, "e": "“称谢”意为“致意、告知”，是古今异义词。“使人称谢”即派人向周亚夫致意。"}, {"tag": "字词释义", "q": "“成礼而<span class=\"highlight\">去</span>”中“<span class=\"highlight\">去</span>”的意思是？", "o": ["离开", "去除", "过去", "前往"], "a": 0, "e": "“去”意为“离开”。“成礼而去”即完成礼仪后离去。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">既</span>出军门”中“<span class=\"highlight\">既</span>”的意思是？", "o": ["已经，……之后", "既然", "即使", "立即"], "a": 0, "e": "“既”意为“已经”。“既出军门”即出了军营大门之后。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">曩</span>者霸上、棘门军”中“<span class=\"highlight\">曩</span>”的意思是？", "o": ["先前，从前", "囊", "曾经", "日后"], "a": 0, "e": "“曩”意为“先前、从前”。“曩者”即先前。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">若</span>儿戏耳”中“<span class=\"highlight\">若</span>”的意思是？", "o": ["像，如同", "如果", "你", "假如"], "a": 0, "e": "“若”意为“像、如同”。“若儿戏耳”即就像儿戏一样。"}, {"tag": "字词释义", "q": "“其将<span class=\"highlight\">固</span>可袭而虏也”中“<span class=\"highlight\">固</span>”的意思是？", "o": ["一定，必", "坚固", "本来", "顽固"], "a": 0, "e": "“固”意为“一定、必”。“其将固可袭而虏也”即那里的将军必定会被袭击而俘获。"}, {"tag": "字词释义", "q": "“称善者久<span class=\"highlight\">之</span>”中“<span class=\"highlight\">之</span>”的意思是？", "o": ["音节助词，补足音节", "的", "代词", "到"], "a": 0, "e": "“之”是音节助词，用来补足音节。“称善者久之”即称赞了很久。"}, {"tag": "字词释义", "q": "下列加点字词类活用类型与“<span class=\"highlight\">军</span>细柳”相同的一项是？", "o": ["锐兵刃", "介胄之士不拜", "天子为动", "按辔徐行"], "a": 1, "e": "“军”名词作动词，驻军；“介胄”名词作动词，穿铠甲戴头盔，活用类型相同。A“锐”使动；C 被动句；D 无活用。"}, {"tag": "内容理解", "q": "下列对“军中闻将军令，不闻天子之诏”的翻译，准确的一项是？", "o": ["军营中听从将军的命令，不听从天子发布的诏令。", "军营里听见将军下令，听不见天子的诏书。", "在军队中只能听闻将军，不能听闻天子。", "将军下令，天子的诏令不起作用。"], "a": 0, "e": "“闻”为听从，“诏”为诏令。A 项翻译准确。"}, {"tag": "内容理解", "q": "下列翻译有误的一项是？", "o": ["居无何，上至，又不得入：过了不久，皇上驾到，也不能够进入军营。", "将军约，军中不得驱驰：将军规定，军营中不可以策马疾驰。", "介胄之士不拜，请以军礼见：穿戴盔甲的将士不行跪拜礼，请允许我用军礼参见。", "天子为动：天子主动动身。"], "a": 3, "e": "“天子为动”是被动句，意为“天子被他感动”，不是“主动动身”。"}, {"tag": "断句", "q": "下列朗读停顿划分正确的一项是？", "o": ["已而之细柳 / 军", "军士吏 / 被甲，锐兵 / 刃", "于是上 / 乃使使持节诏将军", "称善者 / 久之"], "a": 3, "e": "A“细柳军”不可拆；B“锐兵刃”不可拆；C 应在“于是”后停顿；D“称善者/久之”停顿正确。"}, {"tag": "内容理解", "q": "文章写霸上、棘门军营的作用是？", "o": ["体现三处军营防御力量各有特色", "与细柳营形成对比，突出周亚夫治军严明", "说明刘礼、徐厉两位将军毫无军事才能", "交代匈奴入侵时汉朝全部边防部署"], "a": 1, "e": "霸上、棘门营门大开、直驰而入，与细柳营军纪严明形成对比，突出周亚夫治军严明。"}, {"tag": "内容理解", "q": "下列说法不符合文意的一项是？", "o": ["细柳营士兵严守军令，即使天子到来也不随意放行", "周亚夫面对汉文帝，坚持行军人礼仪，不卑不亢", "群臣感到吃惊，是因为大家都认为周亚夫应当迎接皇帝", "汉文帝内心不满周亚夫无礼，只是表面称赞他"], "a": 3, "e": "汉文帝赞赏周亚夫（“此真将军矣”），并非“内心不满、表面称赞”。"}, {"tag": "内容理解", "q": "下列对周亚夫人物形象的概括，不准确的一项是？", "o": ["治军严格，军纪严明", "坚守原则，刚正不阿", "谄媚君主，讨好帝王", "恪尽职守，不卑不亢"], "a": 2, "e": "周亚夫治军严明、刚正不阿、不卑不亢，绝非“谄媚君主”。"}, {"tag": "内容理解", "q": "下列关于本文的理解，说法正确的一项是？", "o": ["周亚夫拒绝天子直接进军营，是以下犯上、目中无人", "“被”“式”都是文中出现的通假字", "霸上棘门军营守卫森严，外敌难以偷袭", "本文主要通过大量心理描写塑造人物"], "a": 1, "e": "“被”通“披”（穿着），“式”通“轼”（车前横木），都是通假字。B 项正确。"}],"愚公移山": [{"tag": "字词释义", "q": "“太行、王屋二山，<span class=\"highlight\">方</span>七百里”中“<span class=\"highlight\">方</span>”的意思是？", "o": ["方圆，纵横", "方向", "方法", "正在"], "a": 0, "e": "“方”意为“方圆、纵横”。“方七百里”指纵横七百里。"}, {"tag": "字词释义", "q": "“高万<span class=\"highlight\">仞</span>”中“<span class=\"highlight\">仞</span>”的意思是？", "o": ["古代长度单位，七尺或八尺为一仞", "千仞", "刀刃", "认"], "a": 0, "e": "“仞”是古代长度单位，七尺或八尺为一仞。“高万仞”极言其高。"}, {"tag": "字词释义", "q": "“年<span class=\"highlight\">且</span>九十”中“<span class=\"highlight\">且</span>”的意思是？", "o": ["将近", "并且", "况且", "尚且"], "a": 0, "e": "“且”意为“将近”。“年且九十”即年纪将近九十岁。"}, {"tag": "字词释义", "q": "“面山<span class=\"highlight\">而</span>居”中“<span class=\"highlight\">而</span>”的意思是？", "o": ["表修饰", "表转折", "表顺承", "表并列"], "a": 0, "e": "“而”表修饰，“面山而居”即面对着山居住。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">惩</span>山北之塞”中“<span class=\"highlight\">惩</span>”的意思是？", "o": ["苦于", "惩罚", "惩戒", "戒备"], "a": 0, "e": "“惩”意为“苦于”。“惩山北之塞”即苦于山北道路阻塞。"}, {"tag": "字词释义", "q": "“出入之<span class=\"highlight\">迂</span>也”中“<span class=\"highlight\">迂</span>”的意思是？", "o": ["曲折，绕远", "迂腐", "迂回", "迟缓"], "a": 0, "e": "“迂”意为“曲折、绕远”。“出入之迂”即进出都要绕远路。"}, {"tag": "字词释义", "q": "“吾与汝<span class=\"highlight\">毕力</span>平险”中“<span class=\"highlight\">毕力</span>”的意思是？", "o": ["用尽力气，竭尽全力", "完毕", "全部力量", "最终"], "a": 0, "e": "“毕力”意为“用尽力气”。“毕”是尽、竭尽。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">指</span>通豫南”中“<span class=\"highlight\">指</span>”的意思是？", "o": ["一直，直", "手指", "指向", "指使"], "a": 0, "e": "“指”意为“一直、直”。“指通豫南”即一直通向豫州南部。"}, {"tag": "字词释义", "q": "“达于汉<span class=\"highlight\">阴</span>”中“<span class=\"highlight\">阴</span>”的意思是？", "o": ["水的南岸", "阴天", "阴冷", "阴影"], "a": 0, "e": "“阴”指水的南岸。古代称山之北、水之南为阴。“汉阴”即汉水南岸。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">杂然</span>相许”中“<span class=\"highlight\">杂然</span>”的意思是？", "o": ["纷纷地", "杂乱", "混杂", "纷杂"], "a": 0, "e": "“杂然”意为“纷纷地”。“杂然相许”即大家纷纷表示赞同。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">曾</span>不能损魁父之丘”中“<span class=\"highlight\">曾</span>”的意思是？", "o": ["连……都（表强调）", "曾经", "不曾", "竟然"], "a": 0, "e": "“曾”意为“连……都”，表强调。“曾不能损魁父之丘”即连魁父这样的小山丘都不能削减。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">如太行、王屋何</span>”中“如……何”的意思是？", "o": ["把……怎么样", "像……什么", "如果……怎么办", "如何"], "a": 0, "e": "“如……何”意为“把……怎么样”。“如太行、王屋何”即能把太行、王屋两座大山怎么样呢？"}, {"tag": "字词释义", "q": "“且<span class=\"highlight\">焉</span>置土石”中“<span class=\"highlight\">焉</span>”的意思是？", "o": ["哪里", "于此", "语气词", "怎么"], "a": 0, "e": "“焉”意为“哪里”。“且焉置土石”即况且把土石放到哪里去呢？"}, {"tag": "字词释义", "q": "“投<span class=\"highlight\">诸</span>渤海之尾”中“<span class=\"highlight\">诸</span>”的意思是？", "o": ["兼词，“之于”", "众多", "诸位", "各种"], "a": 0, "e": "“诸”是兼词，为“之于”的合音。“投诸渤海之尾”即把它扔到渤海边上。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">遂</span>率子孙”中“<span class=\"highlight\">遂</span>”的意思是？", "o": ["于是，就", "成功", "顺利", "完成"], "a": 0, "e": "“遂”意为“于是、就”。"}, {"tag": "字词释义", "q": "“子孙<span class=\"highlight\">荷</span>担者三夫”中“<span class=\"highlight\">荷</span>”的意思是？", "o": ["肩负，挑", "荷花", "负荷", "感谢"], "a": 0, "e": "“荷”意为“肩负、挑”。“荷担者三夫”即能挑担子的三个人。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">叩</span>石垦壤”中“<span class=\"highlight\">叩</span>”的意思是？", "o": ["敲，打", "叩头", "扣留", "询问"], "a": 0, "e": "“叩”意为“敲、打”。“叩石垦壤”即敲石头挖泥土。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">箕畚</span>运于渤海之尾”中“<span class=\"highlight\">箕畚</span>”的活用和意思是？", "o": ["名词作状语，用箕畚", "箕畚（名词）", "扫帚", "搬运"], "a": 0, "e": "“箕畚”名词作状语，意为“用箕畚”。"}, {"tag": "字词释义", "q": "“邻人京城氏之<span class=\"highlight\">孀妻</span>”中“<span class=\"highlight\">孀妻</span>”的意思是？", "o": ["寡妇", "双妻", "独居女子", "已婚女子"], "a": 0, "e": "“孀妻”即寡妇。"}, {"tag": "字词释义", "q": "“始<span class=\"highlight\">龀</span>”中“<span class=\"highlight\">龀</span>”的意思是？", "o": ["换牙（指七八岁）", "龋齿", "牙齿", "稚嫩"], "a": 0, "e": "“龀”指换牙。“始龀”即刚换牙，指七八岁。"}, {"tag": "字词释义", "q": "“寒暑<span class=\"highlight\">易</span>节”中“<span class=\"highlight\">易</span>”的意思是？", "o": ["交换，变换", "容易", "改变", "交易"], "a": 0, "e": "“易”意为“交换、变换”。“寒暑易节”即冬夏换季。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">始</span>一反焉”中“<span class=\"highlight\">始</span>”的意思是？", "o": ["才", "开始", "起初", "始终"], "a": 0, "e": "“始”意为“才”。“始一反焉”即才往返一次。"}, {"tag": "字词释义", "q": "“始一<span class=\"highlight\">反</span>焉”中“<span class=\"highlight\">反</span>”的意思是？", "o": ["同“返”，往返", "反对", "反而", "返回"], "a": 0, "e": "“反”同“返”，往返。“始一反焉”即才往返一次。"}, {"tag": "字词释义", "q": "“汝<span class=\"highlight\">之</span>不惠”中“<span class=\"highlight\">之</span>”的意思是？", "o": ["取消句子独立性", "的", "代词", "到"], "a": 0, "e": "“汝之不惠”的“之”用于主谓之间，取消句子独立性。"}, {"tag": "字词释义", "q": "“汝之不<span class=\"highlight\">惠</span>”中“<span class=\"highlight\">惠</span>”的意思是？", "o": ["同“慧”，聪明", "恩惠", "贤惠", "惠顾"], "a": 0, "e": "“惠”同“慧”，聪明。“汝之不惠”即你太不聪明了。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">其</span>如土石何”中“<span class=\"highlight\">其</span>”的意思是？", "o": ["加强反问语气", "他的", "其中", "大概"], "a": 0, "e": "“其”用在“如……何”前，加强反问语气。“其如土石何”即又能把泥土石头怎么样呢？"}, {"tag": "字词释义", "q": "“汝心之<span class=\"highlight\">固</span>”中“<span class=\"highlight\">固</span>”的意思是？", "o": ["顽固", "坚固", "本来", "巩固"], "a": 0, "e": "“固”意为“顽固”。“汝心之固”即你的思想太顽固了。"}, {"tag": "字词释义", "q": "“固不可<span class=\"highlight\">彻</span>”中“<span class=\"highlight\">彻</span>”的意思是？", "o": ["通，变通", "彻底", "透彻", "贯彻"], "a": 0, "e": "“彻”意为“通、变通”。“固不可彻”即顽固到不可改变的地步。"}, {"tag": "字词释义", "q": "“曾<span class=\"highlight\">不若</span>孀妻弱子”中“<span class=\"highlight\">不若</span>”的意思是？", "o": ["不如，比不上", "不像", "若不是", "不善"], "a": 0, "e": "“不若”意为“不如、比不上”。“曾不若孀妻弱子”即连寡妇和小孩都比不上。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">虽</span>我之死”中“<span class=\"highlight\">虽</span>”的意思是？", "o": ["即使", "虽然", "虽然……但是", "纵然"], "a": 0, "e": "“虽”意为“即使”。“虽我之死，有子存焉”即即使我死了，还有儿子在。"}, {"tag": "字词释义", "q": "“有子存<span class=\"highlight\">焉</span>”中“<span class=\"highlight\">焉</span>”的意思是？", "o": ["语气词，了，啊", "哪里", "于此", "怎么"], "a": 0, "e": "“焉”是句末语气词，表陈述语气。“有子存焉”即还有儿子在啊。"}, {"tag": "字词释义", "q": "“何<span class=\"highlight\">苦</span>而不平”中“<span class=\"highlight\">苦</span>”的意思是？", "o": ["愁，担心", "痛苦", "辛苦", "苦于"], "a": 0, "e": "“苦”意为“愁、担心”。“何苦而不平”即还担心挖不平吗？"}, {"tag": "字词释义", "q": "“河曲智叟<span class=\"highlight\">亡</span>以应”中“<span class=\"highlight\">亡</span>”的意思是？", "o": ["同“无”，没有", "死亡", "灭亡", "逃亡"], "a": 0, "e": "“亡”同“无”，没有。“亡以应”即无话可答。"}, {"tag": "字词释义", "q": "“一<span class=\"highlight\">厝</span>朔东”中“<span class=\"highlight\">厝</span>”的意思是？", "o": ["放置，安放", "处理", "磨刀石", "错过"], "a": 0, "e": "“厝”意为“放置、安放”。“一厝朔东”即一座放在朔方东部。“厝”通“措”。"}, {"tag": "字词释义", "q": "“无<span class=\"highlight\">陇</span>断焉”中“<span class=\"highlight\">陇</span>”的意思是？", "o": ["同“垄”，山冈，高地", "陇西", "田地", "丘陵"], "a": 0, "e": "“陇”同“垄”，山冈、高地。“无陇断焉”即再也没有山冈阻隔了。"}, {"tag": "字词释义", "q": "对“毕力平险”中词语的用法，分析正确的一项是？", "o": ["险：动词，冒险", "险：形容词作名词，险峻的大山", "毕：名词，完毕", "无词类活用现象"], "a": 1, "e": "“险”形容词作名词，指险峻的大山；“毕”是“尽、用尽”。"}, {"tag": "内容理解", "q": "下列对“甚矣，汝之不惠”的翻译，准确的一项是？", "o": ["太过分了，你不懂得恩惠。", "你太不聪明了！", "严重啊，你不肯施舍。", "你十分不贤惠。"], "a": 1, "e": "“甚矣”表程度之深；“惠”同“慧”，聪明。“汝之不惠”即你太不聪明了。"}, {"tag": "内容理解", "q": "下列翻译有误的一项是？", "o": ["惩山北之塞，出入之迂也：苦于山北路途阻塞，出来进去都要绕远。", "指通豫南，达于汉阴：一直通向豫州南部，到达汉水南岸。", "子子孙孙无穷匮也，而山不加增，何苦而不平：子子孙孙无穷无尽，可是山不会增高加大，还担心挖不平吗？", "帝感其诚：天帝感受到他的诚实。"], "a": 3, "e": "“帝感其诚”是被动句，应为“天帝被他的诚心感动”，不是“感受到他的诚实”。"}, {"tag": "断句", "q": "下列朗读停顿划分正确的一项是？", "o": ["邻人京城氏之孀妻 / 有遗男", "遂率子孙荷担 / 者三夫", "河曲智叟笑 / 而止之曰", "命夸娥氏 / 二子负二山"], "a": 0, "e": "B 应为“遂率子孙荷担者/三夫”（荷担者定语后置）；C 应为“河曲智叟/笑而止之曰”；D 应为“命/夸娥氏二子负二山”。A 停顿正确。"}, {"tag": "内容理解", "q": "愚公妻子“献疑”与智叟“笑而止之”的态度，分析正确的一项是？", "o": ["两人都坚决反对移山，想法完全一致", "妻子提出疑问，是出于关心；智叟嘲讽、阻止，目光短浅", "妻子认为没有地方放置土石，坚决阻止愚公", "智叟认可愚公志向，只是担忧他力量不足"], "a": 1, "e": "妻子“献疑”是出于关心，提出实际困难；智叟“笑而止之”是嘲讽阻止、目光短浅。"}, {"tag": "内容理解", "q": "文中设置“操蛇之神”“天帝移山”的神话结尾，作用是？", "o": ["说明依靠人力无法移山，必须依靠神灵", "增添神话色彩，寄托古人征服自然的愿望，突出愚公精神感动天地", "证明古代山神可以随意移动大山", "体现愚公自身能力不足以战胜大山"], "a": 1, "e": "神话结尾寄托古人征服自然的愿望，突出愚公坚持不懈的精神感动天地，并非宣扬迷信。"}, {"tag": "内容理解", "q": "下列对文章内涵的理解，正确的一项是？", "o": ["本文告诉我们遇到困难，可以等待神灵帮助", "只要持之以恒，持续奋斗，终能战胜艰难险阻", "人力永远无法改变自然，只能被动顺从", "做事不需要听取任何人的质疑与建议"], "a": 1, "e": "本文赞颂持之以恒、艰苦奋斗的精神，说明只要坚持不懈就能战胜艰难险阻。"}],"生于忧患，死于安乐": [{"tag": "字词释义", "q": "“舜<span class=\"highlight\">发</span>于畎亩之中”中“<span class=\"highlight\">发</span>”的意思是？", "o": ["兴起，被任用", "出发", "散发", "发现"], "a": 0, "e": "“发”意为“兴起、被任用”。舜从田野之中兴起。"}, {"tag": "字词释义", "q": "“傅说<span class=\"highlight\">举</span>于版筑之间”中“<span class=\"highlight\">举</span>”的意思是？", "o": ["被举用，被选拔", "举起", "推举", "全，都"], "a": 0, "e": "“举”意为“被举用、被选拔”。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">故</span>天将降大任于是人也”中“<span class=\"highlight\">故</span>”的意思是？", "o": ["所以", "缘故", "旧的", "故意"], "a": 0, "e": "“故”意为“所以”。"}, {"tag": "字词释义", "q": "“天将降大任于<span class=\"highlight\">是人</span>也”中“<span class=\"highlight\">是人</span>”的意思是？", "o": ["这样的人", "这个国家", "人民", "人类"], "a": 0, "e": "“是人”意为“这样的人”，指承担大任的人。"}, {"tag": "字词释义", "q": "“必先<span class=\"highlight\">苦</span>其心志”中“<span class=\"highlight\">苦</span>”的活用和意思是？", "o": ["使动用法，使……痛苦", "痛苦", "辛苦", "苦难"], "a": 0, "e": "“苦”使动用法，“使……痛苦”。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">劳</span>其筋骨”中“<span class=\"highlight\">劳</span>”的活用和意思是？", "o": ["使动用法，使……劳累", "劳累", "劳动", "功劳"], "a": 0, "e": "“劳”使动用法，“使……劳累”。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">饿</span>其体肤”中“<span class=\"highlight\">饿</span>”的活用和意思是？", "o": ["使动用法，使……饥饿", "饥饿", "挨饿", "饿死"], "a": 0, "e": "“饿”使动用法，“使……饥饿”。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">空乏</span>其身”中“<span class=\"highlight\">空乏</span>”的意思是？", "o": ["使……穷困（困乏）", "空缺", "贫穷", "空虚"], "a": 0, "e": "“空乏”意为“使……穷困、资财缺乏”。使他的身体穷困。"}, {"tag": "字词释义", "q": "“行<span class=\"highlight\">拂</span>乱其所为”中“<span class=\"highlight\">拂</span>”的意思是？", "o": ["违背，不顺", "擦拭", "拂晓", "拂过"], "a": 0, "e": "“拂”意为“违背、不顺”。“拂乱”即扰乱。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">曾</span>益其所不能”中“<span class=\"highlight\">曾</span>”的意思是？", "o": ["同“增”，增加", "曾经", "竟然", "尚且"], "a": 0, "e": "“曾”同“增”，增加。“曾益”即增加。"}, {"tag": "字词释义", "q": "“人<span class=\"highlight\">恒</span>过”中“<span class=\"highlight\">恒</span>”的意思是？", "o": ["常常", "恒心", "长久", "永久"], "a": 0, "e": "“恒”意为“常常”。“人恒过”即人常常犯错误。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">然后</span>能改”中“<span class=\"highlight\">然后</span>”的意思是？", "o": ["这样以后", "然后（今义）", "然而", "以后"], "a": 0, "e": "“然后”意为“这样以后”。"}, {"tag": "字词释义", "q": "“困于心，<span class=\"highlight\">衡</span>于虑”中“<span class=\"highlight\">衡</span>”的意思是？", "o": ["同“横”，梗塞，不顺", "平衡", "衡量", "秤"], "a": 0, "e": "“衡”同“横”，梗塞、不顺。“衡于虑”即思虑阻塞。"}, {"tag": "字词释义", "q": "“而后<span class=\"highlight\">作</span>”中“<span class=\"highlight\">作</span>”的意思是？", "o": ["奋起，指有所作为", "作业", "制作", "发作"], "a": 0, "e": "“作”意为“奋起”，这里指有所作为。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">征</span>于色”中“<span class=\"highlight\">征</span>”的意思是？", "o": ["征验，表现", "征讨", "征求", "特征"], "a": 0, "e": "“征”意为“征验、表现”。“征于色”即表现在脸色上。"}, {"tag": "字词释义", "q": "“而后<span class=\"highlight\">喻</span>”中“<span class=\"highlight\">喻</span>”的意思是？", "o": ["了解，明白", "比喻", "告知", "晓喻"], "a": 0, "e": "“喻”意为“了解、明白”。“而后喻”即而后才能被人理解。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">入</span>则无法家拂士”中“<span class=\"highlight\">入</span>”的意思是？", "o": ["在国内", "进入", "收入", "进来"], "a": 0, "e": "“入”与“出”相对，指“在国内”。"}, {"tag": "字词释义", "q": "“入则无<span class=\"highlight\">法家</span>拂士”中“<span class=\"highlight\">法家</span>”的意思是？", "o": ["守法度的大臣", "法家学派", "执法的官吏", "法律"], "a": 0, "e": "“法家”指守法度的大臣。"}, {"tag": "字词释义", "q": "“入则无法家<span class=\"highlight\">拂士</span>”中“<span class=\"highlight\">拂士</span>”的意思是？", "o": ["辅佐君主的贤士", "拂拭兵器的士兵", "有志之士", "文人士子"], "a": 0, "e": "“拂士”指辅佐君主的贤士。“拂”同“弼”，辅佐。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">出</span>则无敌国外患者”中“<span class=\"highlight\">出</span>”的意思是？", "o": ["在国外", "出去", "外出", "出来"], "a": 0, "e": "“出”指“在国外”，与“入”（在国内）相对。"}, {"tag": "字词释义", "q": "“出则无<span class=\"highlight\">敌</span>国外患者”中“<span class=\"highlight\">敌</span>”的意思是？", "o": ["匹敌，相当", "敌人", "敌对", "抵抗"], "a": 0, "e": "“敌”意为“匹敌、相当”，指势力相当。“敌国外患”指势力相当的外国侵犯的忧患。"}, {"tag": "字词释义", "q": "对“所以动心忍性”中加点词的用法，解说得当的一项是？", "o": ["动：动词，震动；忍：忍耐，无活用", "动：使动，使……震撼；忍：使动，使……坚忍", "动：名词，活动；忍：形容词，坚韧", "动、忍均为意动用法"], "a": 1, "e": "“动”“忍”都是使动用法：“使……震撼”“使……坚忍”。"}, {"tag": "内容理解", "q": "下列对“故天将降大任于是人也”的翻译，正确的一项是？", "o": ["所以上天将要降临重大使命给这样的人。", "因此上天将要下达重要任务于是这个人。", "所以上天降低重任给这个人。", "因此上天将要托付大任认同这个人。"], "a": 0, "e": "“故”为所以，“大任”为重大使命，“于是人”为“给这样的人”。A 项翻译准确。"}, {"tag": "断句", "q": "下列语句停顿划分正确的一项是？", "o": ["舜发于畎 / 亩之中", "故天将降大任 / 于是人也", "困于心衡 / 于虑而后作", "入则无 / 法家拂士"], "a": 3, "e": "A 拆散“畎亩”；B 应在“故”后稍顿；C 应为“困于心/衡于虑”；D“入则无/法家拂士”停顿正确。"}, {"tag": "论证方法", "q": "文章开篇列举舜、傅说等六人的事例，作用是？", "o": ["证明出身底层的人更容易成功", "作为事实论据，论证磨难能使人担当大任", "说明古代君王都来自民间", "对比安逸环境使人堕落"], "a": 1, "e": "六人都是出身微贱而终担大任，作为事实论据论证“磨难能使人担当大任”。"}, {"tag": "内容理解", "q": "下列对文章内容的理解，不符合文意的一项是？", "o": ["人才想要成才，需要经受肉体、精神多方面磨难", "人犯错之后，只要自我反省，就一定能够成功", "国家长久安定，既需要国内贤臣，也需要外部对手的警醒", "文章从个人成才推及国家治理，由小到大论证观点"], "a": 1, "e": "“人恒过，然后能改”强调犯错后能改正，但“只要反省就一定成功”说法过于绝对，不符合文意。"}, {"tag": "内容理解", "q": "下列关于本文的说法，不正确的一项是？", "o": ["“曾、衡、拂”都是本文出现的通假字", "本文先举例，再说理，最后提炼中心论点", "文章仅从正面论证忧患的价值", "结尾“生于忧患，死于安乐”统领全篇"], "a": 2, "e": "文章既从正面论证忧患使人成才，又从反面论证安乐导致亡国，“仅从正面”说法错误。"}, {"tag": "论证思路", "q": "下列对文章论证思路的分析，正确的一项是？", "o": ["先提出中心论点，再举事例证明", "先列举事例，提炼人才造就的道理，再引申到治国，最后归纳论点", "先谈论国家治理，再谈论个人成长", "先反面论证安乐亡国，再正面论证忧患成才"], "a": 1, "e": "文章先列举六人事例，提炼出“生于忧患”的道理，再引申到国家治理（入无法家拂士、出无敌国外患），最后归纳中心论点。"}],"富贵不能淫": [{"tag": "字词释义", "q": "“岂不<span class=\"highlight\">诚</span>大丈夫哉”中“<span class=\"highlight\">诚</span>”的意思是？", "o": ["真正，确实", "诚心诚意", "果真如此", "忠厚老实"], "a": 0, "e": "“诚”意为“真正、确实”。“岂不诚大丈夫哉”即难道不是真正的大丈夫吗？"}, {"tag": "字词释义", "q": "“岂不诚<span class=\"highlight\">大丈夫</span>哉”中“<span class=\"highlight\">大丈夫</span>”的意思是？", "o": ["有志气有节操的人", "成年男子", "大男人", "丈夫"], "a": 0, "e": "“大丈夫”指有志气、有节操、有作为的人。"}, {"tag": "字词释义", "q": "“一怒<span class=\"highlight\">而</span>诸侯惧”中“<span class=\"highlight\">而</span>”的意思是？", "o": ["表顺承，就，于是", "表转折，却", "表并列，并且", "表修饰"], "a": 0, "e": "“而”表顺承。“一怒而诸侯惧”即一发怒诸侯就害怕。"}, {"tag": "字词释义", "q": "“安居而天下<span class=\"highlight\">熄</span>”中“<span class=\"highlight\">熄</span>”的意思是？", "o": ["指战火停息，天下太平", "熄灭", "消灭", "平息怒火"], "a": 0, "e": "“熄”本义熄灭，这里指战火停息、天下太平。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">是</span>焉得为大丈夫乎”中“<span class=\"highlight\">是</span>”的意思是？", "o": ["这", "是（判断词）", "正确", "于是"], "a": 0, "e": "“是”是指示代词，意为“这”。"}, {"tag": "字词释义", "q": "“是<span class=\"highlight\">焉</span>得为大丈夫乎”中“<span class=\"highlight\">焉</span>”的意思是？", "o": ["怎么，哪里", "于是，就", "语气助词", "在此，于此"], "a": 0, "e": "“焉”是疑问代词，意为“怎么、哪里”。"}, {"tag": "字词释义", "q": "“是焉<span class=\"highlight\">得</span>为大丈夫乎”中“<span class=\"highlight\">得</span>”的意思是？", "o": ["能够", "得到", "得意", "得以"], "a": 0, "e": "“得”意为“能够”。"}, {"tag": "字词释义", "q": "“丈夫之<span class=\"highlight\">冠</span>也”中“<span class=\"highlight\">冠</span>”的读音和意思是？", "o": ["guàn，行冠礼（动词）", "guān，帽子（名词）", "guàn，冠军", "guān，衣冠"], "a": 0, "e": "“冠”读 guàn，动词，行冠礼。古代男子二十岁行冠礼表示成年。"}, {"tag": "字词释义", "q": "“父<span class=\"highlight\">命</span>之”中“<span class=\"highlight\">命</span>”的意思是？", "o": ["训导，教导", "命令，使令", "命运，运气", "命名，取名"], "a": 0, "e": "“命”此处意为“训导、教导”。“父命之”即父亲训导他。"}, {"tag": "字词释义", "q": "“往送<span class=\"highlight\">之</span>门”中“<span class=\"highlight\">之</span>”的意思是？", "o": ["到，往（动词）", "的（助词）", "代词，她", "取消句子独立性"], "a": 0, "e": "“往送之门”的“之”是动词，意为“到、往”。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">戒</span>之曰”中“<span class=\"highlight\">戒</span>”的意思是？", "o": ["告诫，叮嘱", "警戒，防备", "戒除，革除", "戒备，提防"], "a": 0, "e": "“戒”意为“告诫、叮嘱”。“戒之曰”即告诫她说。"}, {"tag": "字词释义", "q": "“往之<span class=\"highlight\">女</span>家”中“<span class=\"highlight\">女</span>”的意思是？", "o": ["同“汝”，你", "女子", "女儿", "妇女"], "a": 0, "e": "“女”同“汝”，你的。“往之女家”即到你的夫家去。"}, {"tag": "字词释义", "q": "“无违<span class=\"highlight\">夫子</span>”中“<span class=\"highlight\">夫子</span>”的意思是？", "o": ["丈夫", "老师", "对人的尊称", "男子"], "a": 0, "e": "“夫子”这里指丈夫。“无违夫子”即不要违背丈夫。"}, {"tag": "字词释义", "q": "“居天下之<span class=\"highlight\">广居</span>”中“<span class=\"highlight\">广居</span>”喻指？", "o": ["“仁”", "宽广的住宅", "广大的居所", "天下"], "a": 0, "e": "“广居”比喻“仁”，指仁的居所。"}, {"tag": "字词释义", "q": "“立天下之<span class=\"highlight\">正位</span>”中“<span class=\"highlight\">正位</span>”喻指？", "o": ["“礼”", "端正的位置", "正当地位", "正确的座位"], "a": 0, "e": "“正位”比喻“礼”。"}, {"tag": "字词释义", "q": "“行天下之<span class=\"highlight\">大道</span>”中“<span class=\"highlight\">大道</span>”喻指？", "o": ["“义”", "宽阔的大路", "大道理", "正道"], "a": 0, "e": "“大道”比喻“义”。"}, {"tag": "字词释义", "q": "“与民<span class=\"highlight\">由</span>之”中“<span class=\"highlight\">由</span>”的意思是？", "o": ["遵从，遵循", "由于，因为", "理由，缘故", "自由自在"], "a": 0, "e": "“由”意为“遵从、遵循”。“与民由之”即与百姓一同遵循大道。"}, {"tag": "字词释义", "q": "“贫贱不能<span class=\"highlight\">移</span>”中“<span class=\"highlight\">移</span>”的活用和意思是？", "o": ["使动，使……动摇", "移动，挪动", "迁移，转移", "移交，转交"], "a": 0, "e": "“移”使动用法，“使……改变、动摇”。贫贱不能使（他）改变操守。"}, {"tag": "字词释义", "q": "“威武不能<span class=\"highlight\">屈</span>”中“<span class=\"highlight\">屈</span>”的活用和意思是？", "o": ["使动，使……屈服", "委屈，冤屈", "弯曲，屈曲", "理亏，理屈"], "a": 0, "e": "“屈”使动用法，“使……屈服”。"}, {"tag": "字词释义", "q": "对“富贵不能淫”中“<span class=\"highlight\">淫</span>”的用法，解说得当的一项是？", "o": ["动词，放纵，古今词义一致，无活用", "使动用法，使……惑乱、迷惑", "名词，淫邪之事", "形容词，荒淫的"], "a": 1, "e": "“淫”是使动用法，“使……惑乱、迷惑”。富贵不能使（他）迷惑。B 项解说正确。"}, {"tag": "内容理解", "q": "下列对“一怒而诸侯惧，安居而天下熄”的翻译，正确的一项是？", "o": ["（他们）一发怒，诸侯就害怕；安定下来，天下的战火便停息。", "一旦发怒，诸侯感到恐惧；安心居住，天下就熄灭了。", "（他们）一发脾气，诸侯畏惧；居家过日子，天下太平消失。", "一次发怒诸侯恐惧，安稳居住天下熄火。"], "a": 0, "e": "“而”表顺承；“安居”指安定下来；“熄”指战火停息。A 项翻译准确。"}, {"tag": "内容理解", "q": "对“居天下之广居，立天下之正位，行天下之大道”的翻译，最准确的一项是？", "o": ["住进天下宽广的居所，站在天下端正的位置，走天下宽阔的大路。", "住进宽敞房屋，坚守正当地位，行走宽阔道路。", "（大丈夫应当）住进仁的居所，站在礼的位置，走义的道路。", "居住在广阔之地，立身端正，行走在大道上。"], "a": 2, "e": "“广居”“正位”“大道”分别喻指“仁”“礼”“义”，C 项译出比喻义，最准确。"}, {"tag": "断句", "q": "下列语句停顿划分正确的一项是？", "o": ["公孙衍、张仪岂不 / 诚大丈夫哉", "是焉得 / 为大丈夫乎", "居天下 / 之广居，立天下 / 之正位", "富贵 / 不能淫，贫贱 / 不能移，威武 / 不能屈"], "a": 3, "e": "“富贵”“贫贱”“威武”后停顿，主谓结构清晰：富贵不能淫，贫贱不能移，威武不能屈。"}, {"tag": "内容理解", "q": "景春认为公孙衍、张仪是大丈夫，理由是？", "o": ["他们坚守仁义，不被富贵迷惑", "他们身居高位，坚守本心", "他们一发怒，诸侯害怕；安静下来，天下太平", "他们能够做到贫贱不能移，威武不能屈"], "a": 2, "e": "景春认为他们能“一怒而诸侯惧，安居而天下熄”，凭威势左右天下，故称大丈夫。"}, {"tag": "内容理解", "q": "下列关于“大丈夫”标准的表述，不符合孟子观点的一项是？", "o": ["内心坚守仁、礼、义", "得志时和百姓一同践行正道；不得志时独自坚守原则", "富贵、贫贱、强权都无法改变内心操守", "能够凭借自身威势左右诸侯，掌控天下局势"], "a": 3, "e": "孟子恰恰否定“凭威势左右诸侯”，认为那只是“妾妇之道”，D 项与孟子观点相反。"}, {"tag": "内容理解", "q": "下列关于本文的说法，不正确的一项是？", "o": ["“广居”喻指“仁”，“正位”喻指“礼”，“大道”喻指“义”", "文章先摆出景春观点，再反驳，提出自己的大丈夫标准", "孟子认为公孙衍、张仪能够做到威武不能屈", "文章运用类比论证，用女子出嫁遵从母命类比张仪等人顺从君主"], "a": 2, "e": "孟子认为公孙衍、张仪只是“妾妇之道”，做不到“威武不能屈”，C 项说法错误。"}],"得道多助，失道寡助": [{"tag": "字词释义", "q": "“地利不如<span class=\"highlight\">人和</span>”中“<span class=\"highlight\">人和</span>”的意思是？", "o": ["人心所向", "人们和睦", "友好相处", "人心和顺"], "a": 0, "e": "“人和”指人心所向、内部团结。"}, {"tag": "字词释义", "q": "“三里之<span class=\"highlight\">城</span>”中“<span class=\"highlight\">城</span>”的意思是？", "o": ["内城", "城市", "城墙", "城外"], "a": 0, "e": "“城”指内城。“三里之城”即方圆三里的内城。"}, {"tag": "字词释义", "q": "“七里之<span class=\"highlight\">郭</span>”中“<span class=\"highlight\">郭</span>”的意思是？", "o": ["外城", "城郭", "村庄", "郊外"], "a": 0, "e": "“郭”指外城。古时内城为“城”，外城为“郭”。"}, {"tag": "字词释义", "q": "“环<span class=\"highlight\">而</span>攻之”中“<span class=\"highlight\">而</span>”的意思是？", "o": ["表修饰，环绕着", "表转折，却", "表顺承，然后", "表并列，并且"], "a": 0, "e": "“而”表修饰，连接状语“环”和谓语“攻”，意为“环绕着进攻”。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">夫</span>环而攻之”中“<span class=\"highlight\">夫</span>”的意思是？", "o": ["发语词，无实义", "丈夫，成年男子", "指示代词，那", "语气词，表感叹"], "a": 0, "e": "“夫”是发语词，用于句首，表示将要发表议论，无实义。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">然而</span>不胜者”中“<span class=\"highlight\">然而</span>”的意思是？", "o": ["这样却", "然而（今义）", "然后", "但是"], "a": 0, "e": "“然而”是“然”和“而”连用，“然”指“这样”，“而”表转折，意为“这样却”。"}, {"tag": "论证方法", "q": "“三里之城，七里之郭，环而攻之而不胜”运用了什么论证方法？", "o": ["举例论证", "道理论证", "对比论证", "比喻论证"], "a": 0, "e": "举攻城不胜的事例来证明“天时不如地利”，是举例论证。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">池</span>非不深也”中“<span class=\"highlight\">池</span>”的意思是？", "o": ["护城河", "池塘", "水池", "城池"], "a": 0, "e": "“池”指护城河。“池非不深”即护城河并非不深。"}, {"tag": "字词释义", "q": "“兵<span class=\"highlight\">革</span>非不坚利也”中“<span class=\"highlight\">革</span>”的意思是？", "o": ["皮革制的甲", "皮革", "改革", "革除"], "a": 0, "e": "“革”指皮革制的甲。“兵革”泛指武器装备。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">委</span>而去之”中“<span class=\"highlight\">委</span>”的意思是？", "o": ["放弃", "委托", "委屈", "推卸"], "a": 0, "e": "“委”意为“放弃”。“委而去之”即弃城而逃。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">域</span>民不以封疆之界”中“<span class=\"highlight\">域</span>”的活用和意思是？", "o": ["限制（名作动）", "划分疆域界限", "划定区域范围", "圈定领域范围"], "a": 0, "e": "“域”名词作动词，意为“限制”。“域民”即限制人民（使人民定居）。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">固</span>国不以山溪之险”中“<span class=\"highlight\">固</span>”的活用和意思是？", "o": ["使……巩固", "坚固，牢固", "本来，原来", "顽固，固执"], "a": 0, "e": "“固”使动用法，“使……巩固”。“固国”即巩固国防。"}, {"tag": "字词释义", "q": "“固国不<span class=\"highlight\">以</span>山溪之险”中“<span class=\"highlight\">以</span>”的意思是？", "o": ["凭借，依靠", "因为，由于", "所以，因此", "以为，认为"], "a": 0, "e": "“以”意为“凭借、依靠”。巩固国防不靠山溪的险阻。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">威</span>天下不以兵革之利”中“<span class=\"highlight\">威</span>”的活用和意思是？", "o": ["威慑（形容词作动词）", "威风凛凛的气势", "强大威猛的力量", "威严庄重的仪态"], "a": 0, "e": "“威”形容词作动词，意为“威慑”。“威天下”即威慑天下。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">得道</span>者多助”中“<span class=\"highlight\">得道</span>”的意思是？", "o": ["施行仁政", "得到方法", "获得道理", "走对路"], "a": 0, "e": "“得道”指施行仁政。“得道者”即施行仁政的君主。"}, {"tag": "字词释义", "q": "“寡助之<span class=\"highlight\">至</span>”中“<span class=\"highlight\">至</span>”的意思是？", "o": ["极点", "到达", "至于", "到来"], "a": 0, "e": "“至”意为“极点”。“寡助之至”即少助到了极点。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">亲戚</span>畔之”中“<span class=\"highlight\">亲戚</span>”的意思是？", "o": ["内外亲属", "亲戚朋友", "有血缘的亲人", "同宗族的族人"], "a": 0, "e": "“亲戚”古义指内外亲属，今义指跟自己家庭有婚姻或血统关系的人，属古今异义。"}, {"tag": "字词释义", "q": "“亲戚<span class=\"highlight\">畔</span>之”中“<span class=\"highlight\">畔</span>”的意思是？", "o": ["同“叛”，背叛", "田畔，田界", "旁边，近旁", "陪伴，伴随"], "a": 0, "e": "“畔”同“叛”，背叛。“亲戚畔之”即内外亲属都背叛他。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">以</span>天下之所顺”中“<span class=\"highlight\">以</span>”的意思是？", "o": ["用（凭借）", "被（表被动）", "把（表处置）", "于（表处所）"], "a": 0, "e": "“以”意为“用、凭借”。“以天下之所顺”即用天下归顺的力量。"}, {"tag": "内容理解", "q": "下列对“寡助之至，亲戚畔之；多助之至，天下顺之”的翻译，正确的一项是？", "o": ["少助到极点，内外亲属都背叛他；多助到极点，天下百姓都归顺他。", "少助的人到了，亲戚朋友背叛他；多助的人到了，天下人顺从他。", "少助到了极点，亲戚都背叛；多助到了极点，天下人顺利。", "缺少帮助的人来了，亲戚背叛他；帮助多的人来了，天下归顺。"], "a": 0, "e": "“至”为极点，“亲戚”指内外亲属，“畔”同“叛”，“顺”为归顺。A 项翻译准确。"}, {"tag": "字词释义", "q": "下列加点词解释有误的一项是？", "o": ["<u>池</u>非不深也——护城河", "<u>委</u>而去之——放弃", "<u>亲戚</u>畔之——亲戚朋友", "寡助之<u>至</u>——极点"], "a": 2, "e": "“亲戚畔之”的“亲戚”应解释为古义“内外亲属”，不是今义“亲戚朋友”。"}, {"tag": "内容理解", "q": "下列关于本文论点的说法，正确的一项是？", "o": ["本文中心论点就是开篇提出的“得道者多助，失道寡助”", "“天时不如地利，地利不如人和”是中心论点，推导出“得道多助”的结论", "开篇即提出“得道者多助，失道寡助”，再用战争事例来证明", "结尾“寡助之至，亲戚畔之；多助之至，天下顺之”两句是全文中心论点"], "a": 1, "e": "本文开篇提出中心论点“天时不如地利，地利不如人和”，经论证后推导出核心结论“得道者多助，失道寡助”。"}, {"tag": "论证方法", "q": "“寡助之至，亲戚畔之；多助之至，天下顺之”运用了哪种论证方法？", "o": ["对比论证", "举例论证", "道理论证", "比喻论证"], "a": 0, "e": "将“寡助”“多助”两种后果相对照，是对比论证，突出“得道”的重要性。"}, {"tag": "内容理解", "q": "下列对文章内容的理解，有误的一项是？", "o": ["“得道”指君主施行仁政", "“失道寡助”从反面论证人心的重要性", "文章认为作战时地利的作用大于人和", "“亲戚畔之”是内外亲属背叛君主，是寡助的极致表现"], "a": 2, "e": "文章通过攻城、守城事例层层论证，最终推出“人和”最重要，认为人和的作用大于天时、地利，C 项说法与文意相反。"}, {"tag": "论证思路", "q": "下列对文章论证层次的梳理，正确的一项是？", "o": ["提出论点→举守城事例→举攻城事例→治国道理→得出结论", "提出论点→举攻城事例→举守城事例→类推治国→得出结论", "先提出“得道多助”→举战争例子→层层论证中心论点", "由治国道理说起，再用战争事例佐证"], "a": 1, "e": "文章先提出中心论点，再用攻城事例论证“天时不如地利”，用守城事例论证“地利不如人和”，进而类推治国之道，最后得出结论。"}, {"tag": "论证思路", "q": "本文的论证结构是？", "o": ["总分总：先总提论点，再分层论证，后归纳结论", "并列式：各层平行论述，地位平等，不分主次", "递进式：层层深入，环环相扣，逐层推进", "总分式：先总说再分说，结尾不做归纳总结"], "a": 0, "e": "开篇提出“天时不如地利，地利不如人和”的中心论点，中间分层论证，结尾归纳出“得道者多助”的结论，是总分总结构。"}],"与朱元思书": [{"tag": "字词释义", "q": "“风烟<span class=\"highlight\">俱</span><span class=\"highlight\">净</span>”中“<span class=\"highlight\">俱</span>”的意思是？", "o": ["全，都", "一起", "工具", "具备"], "a": 0, "e": "“俱”意为“全、都”。“风烟俱净”即烟雾都消散尽净。"}, {"tag": "字词释义", "q": "“风烟俱<span class=\"highlight\">净</span>”中“<span class=\"highlight\">净</span>”的意思是？", "o": ["消散，散尽", "干净", "纯净", "清净"], "a": 0, "e": "“净”此处指烟雾消散尽净。"}, {"tag": "字词释义", "q": "“任意<span class=\"highlight\">东西</span>”中“<span class=\"highlight\">东西</span>”的活用和意思是？", "o": ["名词作动词，向东向西漂行", "东边和西边", "物品", "方向"], "a": 0, "e": "“东西”名词作动词，意为“向东向西漂行”。"}, {"tag": "字词释义", "q": "“一百<span class=\"highlight\">许</span>里”中“<span class=\"highlight\">许</span>”的意思是？", "o": ["左右，约", "允许", "也许", "许多"], "a": 0, "e": "“许”意为“左右、约”。“一百许里”即一百里左右。"}, {"tag": "字词释义", "q": "“天下<span class=\"highlight\">独</span>绝”中“<span class=\"highlight\">独</span>”的意思是？", "o": ["独一无二", "独自", "唯独", "孤独"], "a": 0, "e": "“独”意为“独一无二”。“天下独绝”即天下独一无二。"}, {"tag": "字词释义", "q": "“猛浪<span class=\"highlight\">若</span>奔”中“<span class=\"highlight\">若</span>”的意思是？", "o": ["像，如同", "如果", "比得上", "假如"], "a": 0, "e": "“若”意为“像、如同”。凶猛的巨浪像飞奔的骏马。"}, {"tag": "字词释义", "q": "“猛浪若<span class=\"highlight\">奔</span>”中“<span class=\"highlight\">奔</span>”的活用和意思是？", "o": ["动词作名词，飞奔的马", "奔跑", "奔腾", "飞奔"], "a": 0, "e": "“奔”动词作名词，指飞奔的骏马。"}, {"tag": "修辞手法", "q": "“急湍甚箭，猛浪若奔”运用的修辞手法是？", "o": ["对偶+比喻", "对偶+夸张", "比喻+拟人", "排比+比喻"], "a": 0, "e": "把急流比作飞箭、巨浪比作奔马，是比喻；两句对仗工整，是对偶。生动写出江水流速迅猛、气势磅礴。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">夹岸</span>高山”中“<span class=\"highlight\">夹岸</span>”的意思是？", "o": ["两岸", "岸边", "夹住江岸", "对岸"], "a": 0, "e": "“夹岸”即“两岸”。"}, {"tag": "字词释义", "q": "“皆生<span class=\"highlight\">寒树</span>”中“<span class=\"highlight\">寒树</span>”的意思是？", "o": ["耐寒常绿的树，这里指密而绿的树", "寒冷的树", "冬天的树", "枯树"], "a": 0, "e": "“寒树”指耐寒常绿的树，这里形容树木密而绿。"}, {"tag": "字词释义", "q": "“负势<span class=\"highlight\">竞</span>上”中“<span class=\"highlight\">竞</span>”的意思是？", "o": ["争相", "竟然", "竞争", "比赛"], "a": 0, "e": "“竞”意为“争相”。山峦凭借地势争相向上。"}, {"tag": "字词释义", "q": "“互相<span class=\"highlight\">轩邈</span>”中“<span class=\"highlight\">轩邈</span>”的活用和意思是？", "o": ["形容词作动词，向高处、远处伸展", "高大", "深远", "轩敞"], "a": 0, "e": "“轩”“邈”形容词作动词，意为“向高处、远处伸展”。"}, {"tag": "字词释义", "q": "“争高<span class=\"highlight\">直指</span>”中“<span class=\"highlight\">直指</span>”的意思是？", "o": ["笔直地向上，直插云天", "直接指挥", "径直指着", "伸手指挥"], "a": 0, "e": "“直指”意为笔直地向上，直插云天。"}, {"tag": "修辞手法", "q": "“负势竞上，互相轩邈，争高直指”运用的修辞手法是？", "o": ["拟人", "比喻", "夸张", "对偶"], "a": 0, "e": "赋予山峦“竞上”“轩邈”“争高”的竞争情态，是拟人，生动写出群山高耸、连绵、生机勃勃的特点。"}, {"tag": "字词释义", "q": "“蝉则千<span class=\"highlight\">转</span>不穷”中“<span class=\"highlight\">转</span>”的意思是？", "o": ["同“啭”，婉转鸣叫，这里指蝉鸣", "转动", "转变", "转告"], "a": 0, "e": "“转”同“啭”，婉转鸣叫，这里指蝉鸣。"}, {"tag": "字词释义", "q": "“蝉则千转不<span class=\"highlight\">穷</span>”中“<span class=\"highlight\">穷</span>”的意思是？", "o": ["穷尽", "贫穷", "穷困", "尽头"], "a": 0, "e": "“穷”意为“穷尽”。“千转不穷”即长久不停地鸣叫。"}, {"tag": "字词释义", "q": "“鸢飞<span class=\"highlight\">戾</span>天者”中“<span class=\"highlight\">戾</span>”的意思是？", "o": ["至，到达", "暴戾", "乖戾", "弯曲"], "a": 0, "e": "“戾”意为“至、到达”。“鸢飞戾天”即鸢鸟飞到天上。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">经纶</span>世务者”中“<span class=\"highlight\">经纶</span>”的意思是？", "o": ["筹划、治理", "经营", "丝线", "纺织"], "a": 0, "e": "“经纶”本义整理丝缕，引申为“筹划、治理”。"}, {"tag": "字词释义", "q": "“窥谷忘<span class=\"highlight\">反</span>”中“<span class=\"highlight\">反</span>”的意思是？", "o": ["同“返”，返回", "反对", "反而", "反叛"], "a": 0, "e": "“反”同“返”，返回。“忘反”即流连忘返。"}, {"tag": "字词释义", "q": "“横<span class=\"highlight\">柯</span>上蔽”中“<span class=\"highlight\">柯</span>”的意思是？", "o": ["树枝", "斧柄", "树干", "树根"], "a": 0, "e": "“柯”本义斧柄，这里指树枝。“横柯”即横斜的树枝。"}, {"tag": "字词释义", "q": "“横柯<span class=\"highlight\">上</span>蔽”中“<span class=\"highlight\">上</span>”的活用和意思是？", "o": ["名词作状语，在上方", "向上（动词）", "上面", "上级"], "a": 0, "e": "“上”名词作状语，意为“在上方”。"}, {"tag": "字词释义", "q": "“在昼<span class=\"highlight\">犹</span>昏”中“<span class=\"highlight\">犹</span>”的意思是？", "o": ["仍然，好像", "犹豫", "尤其", "还要"], "a": 0, "e": "“犹”意为“仍然、好像”。“在昼犹昏”即白天也如同黄昏。"}, {"tag": "内容理解", "q": "“鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反”在文中的作用是？", "o": ["结构上承上启下，由写景转入抒情议论；内容上抒发热爱自然、淡泊名利、避世归隐的情怀，暗含对追逐名利之人的规劝", "结构上总结全文，内容上点明时间地点", "结构上照应开头，内容上描写景物细节", "结构上引出下文，内容上交代写作缘由"], "a": 0, "e": "结构上承上启下（由写景转入抒情议论）；内容上触景生情，抒发热爱自然、淡泊名利、避世归隐的情怀，也暗含对世俗官场追逐名利之人的规劝。"}, {"tag": "字词释义", "q": "下列加点词解释有误的一项是？", "o": ["一百<u>许</u>里——左右", "猛浪若<u>奔</u>——奔跑", "互相<u>轩</u>邈——向高处伸展", "窥谷忘<u>反</u>——同“返”，返回"], "a": 1, "e": "“奔”动词作名词，指“飞奔的马”，不是“奔跑”。"}, {"tag": "内容理解", "q": "下列最能概括“鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反”所表达思想感情的一项是？", "o": ["热爱自然、避世退隐、鄙弃功名利禄", "对山水美景的喜爱与留恋", "对隐居生活的向往", "赞美富春江山水之美"], "a": 0, "e": "这两句由写景转入抒情议论，表达作者热爱自然、避世退隐、鄙弃功名利禄的思想感情。"}],"记承天寺夜游": [{"tag": "字词释义", "q": "“月色入<span class=\"highlight\">户</span>”中“<span class=\"highlight\">户</span>”的意思是？", "o": ["门", "窗户", "户口", "住户"], "a": 0, "e": "“户”此处指“门”。“月色入户”即月光从门照进来。"}, {"tag": "字词释义", "q": "“欣<span class=\"highlight\">然</span>起行”中“<span class=\"highlight\">然</span>”的意思是？", "o": ["……的样子", "然后", "然而", "竟然"], "a": 0, "e": "“然”是形容词词尾，意为“……的样子”。“欣然”即高兴的样子。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">念</span>无与为乐者”中“<span class=\"highlight\">念</span>”的意思是？", "o": ["想到", "思念", "念叨", "念头"], "a": 0, "e": "“念”意为“考虑、想到”。想到没有人与我共同赏乐。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">遂</span>至承天寺”中“<span class=\"highlight\">遂</span>”的意思是？", "o": ["于是，就", "成功", "即使", "顺利"], "a": 0, "e": "“遂”意为“于是、就”。于是到承天寺寻找张怀民。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">相与</span>步于中庭”中“<span class=\"highlight\">相与</span>”的意思是？", "o": ["共同，一起", "互相给与", "相随", "交往"], "a": 0, "e": "“相与”意为“共同、一起”。我们一起在庭院中散步。"}, {"tag": "字词释义", "q": "“水中藻、荇<span class=\"highlight\">交横</span>”中“<span class=\"highlight\">交横</span>”的意思是？", "o": ["交错纵横", "交叉横放", "相互横着", "交通横行"], "a": 0, "e": "“交横”意为“交错纵横”。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">盖</span>竹柏影也”中“<span class=\"highlight\">盖</span>”的意思是？", "o": ["大概是", "盖子", "遮盖", "因为"], "a": 0, "e": "“盖”表推测语气，意为“大概是”。大概是竹柏的影子。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">但</span>少闲人如吾两人者耳”中“<span class=\"highlight\">但</span>”的意思是？", "o": ["只是", "但是", "况且", "竟然"], "a": 0, "e": "“但”意为“只是”（古今异义，今义为“但是”）。"}, {"tag": "字词释义", "q": "“如吾两人者<span class=\"highlight\">耳</span>”中“<span class=\"highlight\">耳</span>”的意思是？", "o": ["罢了", "耳朵", "感叹语气词", "听到"], "a": 0, "e": "“耳”是句末语气词，意为“罢了”。"}, {"tag": "断句", "q": "“何夜无月何处无竹柏但少闲人如吾两人者耳”断句正确的一项是？", "o": ["何夜无月？何处无竹柏？但少闲人如吾两人者耳。", "何夜无月何处？无竹柏但少闲人？如吾两人者耳。", "何夜无月？何处无竹柏但？少闲人如吾两人者耳。", "何夜无月何处？无竹柏？但少闲人如吾两人者耳。"], "a": 0, "e": "应为两个反问句加一个感叹句：“何夜无月？何处无竹柏？但少闲人如吾两人者耳。”"}, {"tag": "特殊句式", "q": "“水中藻、荇交横，盖竹柏影也”的特殊句式是？", "o": ["判断句", "省略句", "倒装句", "被动句"], "a": 0, "e": "“盖竹柏影也”用“也”表判断，是判断句。"}, {"tag": "内容理解", "q": "下列关于本文主旨情感的理解，不正确的一项是？", "o": ["描绘承天寺月夜美景，抒发赏月的欣喜、漫步的悠闲", "暗含作者被贬黄州的落寞苦闷", "体现苏轼乐观旷达的人生态度", "表达作者对官场生活的向往与留恋"], "a": 3, "e": "本文主旨：①描绘月夜美景，抒发赏月的欣喜、漫步的悠闲；②暗含被贬黄州的落寞苦闷；③体现乐观旷达的人生态度。D 项“向往官场”于文无据。"}, {"tag": "内容理解", "q": "下列对“闲人”内涵的理解，不正确的一项是？", "o": ["指具有闲情逸致、能够欣赏月色美景的人", "暗含作者被贬黄州、仕途失意不得重用的苦闷", "表现作者在逆境中乐观旷达、随缘自适的心境", "指清闲无事、无所事事的人"], "a": 3, "e": "“闲人”包含三层内涵：①闲情逸致、能欣赏月色美景；②暗含被贬黄州、仕途失意的苦闷；③逆境中乐观旷达、随缘自适。D 项“无所事事”是贬义理解，不符。"}, {"tag": "字词释义", "q": "下列加点词解释有误的一项是？", "o": ["月色入<u>户</u>——门", "<u>念</u>无与为乐者——思念", "怀民亦未<u>寝</u>——睡觉", "<u>但</u>少闲人如吾两人者耳——只是"], "a": 1, "e": "“念”意为“考虑、想到”，不是“思念”。"}, {"tag": "特殊句式", "q": "“相与步于中庭”的特殊句式与下列哪句相同？", "o": ["蒙辞以军中多务", "何陋之有", "莲，花之君子者也", "其印为余群从所得"], "a": 0, "e": "“相与步于中庭”即“（于中庭）步”，状语后置，与“蒙辞以军中多务”（以军中多务辞）相同。"}],"答谢中书书": [{"tag": "字词释义", "q": "“青林翠竹，<span class=\"highlight\">四时</span><span class=\"highlight\">俱</span>备”中“<span class=\"highlight\">四时</span>”的意思是？", "o": ["四季", "四个时辰", "时候", "时辰"], "a": 0, "e": "“四时”意为“四季”。青葱的林木与翠绿的竹林，四季常备。"}, {"tag": "字词释义", "q": "“四时<span class=\"highlight\">俱</span>备”中“<span class=\"highlight\">俱</span>”的意思是？", "o": ["全，都", "一起", "工具", "具备"], "a": 0, "e": "“俱”意为“全、都”。“俱备”即全都具备。"}, {"tag": "字词释义", "q": "“晓雾将<span class=\"highlight\">歇</span>”中“<span class=\"highlight\">歇</span>”的意思是？", "o": ["消散", "休息", "停止", "睡觉"], "a": 0, "e": "“歇”此处意为“消散”。清晨的薄雾将要消散。"}, {"tag": "字词释义", "q": "“夕日<span class=\"highlight\">欲</span>颓”中“<span class=\"highlight\">欲</span>”的意思是？", "o": ["将要", "想要", "欲望", "如果"], "a": 0, "e": "“欲”此处意为“将要”。夕阳将要落山。"}, {"tag": "字词释义", "q": "“夕日欲<span class=\"highlight\">颓</span>”中“<span class=\"highlight\">颓</span>”的意思是？", "o": ["坠落（太阳落山）", "颓废", "倒塌", "衰败"], "a": 0, "e": "“颓”此处意为“坠落”，指太阳落山。"}, {"tag": "字词释义", "q": "“<span class=\"highlight\">沉鳞</span>竞跃”中“<span class=\"highlight\">沉鳞</span>”指的是？", "o": ["潜游在水中的鱼", "沉在水底的鳞片", "落水的鱼", "深水中的生物"], "a": 0, "e": "“沉鳞”以“鳞”代指鱼，是借代，指潜游在水中的鱼。"}, {"tag": "字词释义", "q": "“沉鳞<span class=\"highlight\">竞</span>跃”中“<span class=\"highlight\">竞</span>”的意思是？", "o": ["争相", "竟然", "比赛", "竞争"], "a": 0, "e": "“竞”意为“争相”。鱼儿争相跃出水面。"}, {"tag": "字词释义", "q": "“实是<span class=\"highlight\">欲界</span>之仙都”中“<span class=\"highlight\">欲界</span>”的意思是？", "o": ["人间", "欲望的境界", "天界", "世俗"], "a": 0, "e": "“欲界”本为佛家语，此指人间。“仙都”即仙境。"}, {"tag": "字词释义", "q": "“未复有能<span class=\"highlight\">与</span>其奇者”中“<span class=\"highlight\">与</span>”的读音和意思是？", "o": ["yù，参与，这里有“欣赏、领悟”之意", "yǔ，和", "yú，语气词", "yǔ，给予"], "a": 0, "e": "“与”读 yù，意为“参与”，这里引申为“欣赏、领悟”。"}, {"tag": "字词释义", "q": "“未复有能与其<span class=\"highlight\">奇</span>者”中“<span class=\"highlight\">奇</span>”的活用和意思是？", "o": ["形容词作名词，奇景", "形容词，奇特", "形容词，奇怪", "动词，惊奇"], "a": 0, "e": "“奇”形容词作名词，指奇美的山水景色。"}, {"tag": "内容理解", "q": "下列对“晓雾将歇，猿鸟乱鸣；夕日欲颓，沉鳞竞跃”的翻译，正确的一项是？", "o": ["清晨的薄雾将要消散，猿、鸟此起彼伏地鸣叫；夕阳快要落山，水中的鱼争相跃出水面。", "清晨的薄雾将要休息，猿鸟慌乱地鸣叫；夕阳将要坠落，鱼鳞竞相跳跃。", "清晨的薄雾将要停止，猿鸟乱叫；夕阳想要颓废，沉鱼争相跳跃。", "清晨的薄雾快要散尽，猿鸟大声鸣叫；夕阳快要落下，鱼儿争先恐后地跳出水面。"], "a": 0, "e": "“歇”意为消散，“乱鸣”为此起彼伏地鸣叫，“颓 "桃花源记": "晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田、美池、桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。见渔人，乃大惊，问所从来。具答之。便要还家，设酒杀鸡作食。村中闻有此人，咸来问讯。自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。问今是何世，乃不知有汉，无论魏晋。此人一一为具言所闻，皆叹惋。余人各复延至其家，皆出酒食。停数日，辞去。此中人语云：“不足为外人道也。”既出，得其船，便扶向路，处处志之。及郡下，诣太守，说如此。太守即遣人随其往，寻向所志，遂迷，不复得路。南阳刘子骥，高尚士也，闻之，欣然规往。未果，寻病终。后遂无问津者。","周亚夫军细柳": "文帝之后六年，匈奴大入边。乃以宗正刘礼为将军，军霸上；祝兹侯徐厉为将军，军棘门；以河内守亚夫为将军，军细柳：以备胡。上自劳军。至霸上及棘门军，直驰入，将以下骑送迎。已而之细柳军，军士吏被甲，锐兵刃，彀弓弩，持满。天子先驱至，不得入。先驱曰：“天子且至！”军门都尉曰：“将军令曰‘军中闻将军令，不闻天子之诏’。”居无何，上至，又不得入。于是上乃使使持节诏将军：“吾欲入劳军。”亚夫乃传言开壁门。壁门士吏谓从属车骑曰：“将军约，军中不得驱驰。”于是天子乃按辔徐行。至营，将军亚夫持兵曰：“介胄之士不拜，请以军礼见。”天子为动，改容式车。使人称谢：“皇帝敬劳将军。”成礼而去。既出军门，群臣皆惊。文帝曰：“嗟乎，此真将军矣！曩者霸上、棘门军，若儿戏耳，其将固可袭而虏也。至于亚夫，可得而犯邪！”称善者久之。","愚公移山": "太行、王屋二山，方七百里，高万仞，本在冀州之南，河阳之北。北山愚公者，年且九十，面山而居。惩山北之塞，出入之迂也，聚室而谋曰：“吾与汝毕力平险，指通豫南，达于汉阴，可乎？”杂然相许。其妻献疑曰：“以君之力，曾不能损魁父之丘，如太行、王屋何？且焉置土石？”杂曰：“投诸渤海之尾，隐土之北。”遂率子孙荷担者三夫，叩石垦壤，箕畚运于渤海之尾。邻人京城氏之孀妻有遗男，始龀，跳往助之。寒暑易节，始一反焉。河曲智叟笑而止之曰：“甚矣，汝之不惠！以残年余力，曾不能毁山之一毛，其如土石何？”北山愚公长息曰：“汝心之固，固不可彻，曾不若孀妻弱子。虽我之死，有子存焉。子又生孙，孙又生子；子又有子，子又有孙；子子孙孙无穷匮也，而山不加增，何苦而不平？”河曲智叟亡以应。操蛇之神闻之，惧其不已也，告之于帝。帝感其诚，命夸娥氏二子负二山，一厝朔东，一厝雍南。自此，冀之南，汉之阴，无陇断焉。","生于忧患，死于安乐": "舜发于畎亩之中，傅说举于版筑之间，胶鬲举于鱼盐之中，管夷吾举于士，孙叔敖举于海，百里奚举于市。故天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。人恒过，然后能改；困于心，衡于虑，而后作；征于色，发于声，而后喻。入则无法家拂士，出则无敌国外患者，国恒亡。然后知生于忧患而死于安乐也。","富贵不能淫": "景春曰：“公孙衍、张仪岂不诚大丈夫哉？一怒而诸侯惧，安居而天下熄。”孟子曰：“是焉得为大丈夫乎？子未学礼乎？丈夫之冠也，父命之；女子之嫁也，母命之，往送之门，戒之曰：'往之女家，必敬必戒，无违夫子！'以顺为正者，妾妇之道也。居天下之广居，立天下之正位，行天下之大道。得志，与民由之；不得志，独行其道。富贵不能淫，贫贱不能移，威武不能屈。此之谓大丈夫。”","得道多助，失道寡助": "天时不如地利，地利不如人和。三里之城，七里之郭，环而攻之而不胜。夫环而攻之，必有得天时者矣，然而不胜者，是天时不如地利也。城非不高也，池非不深也，兵革非不坚利也，米粟非不多也，委而去之，是地利不如人和也。故曰：域民不以封疆之界，固国不以山溪之险，威天下不以兵革之利。得道者多助，失道者寡助。寡助之至，亲戚畔之；多助之至，天下顺之。以天下之所顺，攻亲戚之所畔，故君子有不战，战必胜矣。","与朱元思书": "风烟俱净，天山共色。从流飘荡，任意东西。自富阳至桐庐一百许里，奇山异水，天下独绝。水皆缥碧，千丈见底。游鱼细石，直视无碍。急湍甚箭，猛浪若奔。夹岸高山，皆生寒树，负势竞上，互相轩邈，争高直指，千百成峰。泉水激石，泠泠作响；好鸟相鸣，嘤嘤成韵。蝉则千转不穷，猿则百叫无绝。鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反。横柯上蔽，在昼犹昏；疏条交映，有时见日。","记承天寺夜游": "元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭。庭下如积水空明，水中藻、荇交横，盖竹柏影也。何夜无月何处无竹柏但少闲人如吾两人者耳。","答谢中书书": "山川之美，古来共谈。高峰入云，清流见底。两岸石壁，五色交辉。青林翠竹，四时俱备。晓雾将歇，猿鸟乱鸣；夕日欲颓，沉鳞竞跃。实是欲界之仙都。自康乐以来，未复有能与其奇者。","三峡": "自三峡七百里中，两岸连山，略无阙处。重岩叠嶂，隐天蔽日，自非亭午夜分，不见曦月。至于夏水襄陵，沿溯阻绝。或王命急宣，有时朝发白帝，暮到江陵，其间千二百里，虽乘奔御风，不以疾也。春冬之时，则素湍绿潭，回清倒影，绝巘(yǎn)多生怪柏，悬泉瀑布，飞漱其间，清荣峻茂，良多趣味。每至晴初霜旦，林寒涧肃，常有高猿长啸，属引凄异，空谷传响，哀转久绝。故渔者歌曰：“巴东三峡巫峡长，猿鸣三声泪沾裳。”","活板": "板印书籍，唐人尚未盛为之。自冯瀛王始印五经，已后典籍皆为板本。庆历中，有布衣毕昇，又为活板。其法：用胶泥刻字，薄如钱唇，每字为一印，火烧令坚。先设一铁板，其上以松脂、蜡和纸灰之类冒之。欲印，则以一铁范置铁板上，乃密布字印，满铁范为一板，持就火炀(yáng)之，药稍熔，则以一平板按其面，则字平如砥。若止印三二本，未为简易；若印数十百千本，则极为神速。常作二铁板，一板印刷，一板已自布字，此印者才毕，则第二板已具，更互用之，瞬息可就。每一字皆有数印……不用，则以纸帖之，每韵为一帖，木格贮之。有奇字素无备者，旋刻之，以草火烧，瞬息可成。不以木为之者，文理有疏密……不若燔土，用讫再火令药熔，以手拂之，其印自落，殊不沾污。昇死，其印为余群从所得，至今保藏。","木兰诗": "唧唧复唧唧，木兰当户织。不闻机杼声，唯闻女叹息。问女何所思，问女何所忆。女亦无所思，女亦无所忆。昨夜见军帖，可汗(kè hán)大点兵，军书十二卷，卷卷有爷名。阿爷无大儿，木兰无长兄，愿为市鞍马，从此替爷征。东市买骏马，西市买鞍鞯(jiān)，南市买辔(pèi)头，北市买长鞭。旦辞爷娘去，暮宿黄河边……万里赴戎机，关山度若飞。朔气传金柝(tuò)，寒光照铁衣。将军百战死，壮士十年归。……爷娘闻女来，出郭相扶将……雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？","爱莲说": "水陆草木之花，可爱者甚蕃(fán)。晋陶渊明独爱菊。自李唐来，世人甚爱牡丹。予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。予谓菊花之隐逸者也牡丹花之富贵者也莲花之君子者也。噫！菊之爱，陶后鲜有闻。莲之爱，同予者何人？牡丹之爱，宜乎众矣。","陋室铭": "山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？","卖油翁": "陈康肃公善射当世无双公亦以此自矜(jīn)。尝射于家圃，有卖油翁释担而立，睨(nì)之久而不去。见其发矢十中八九，但微颔(hàn)之。康肃问曰：“汝亦知射乎？吾射不亦精乎？”翁曰：“无他，但手熟尔。”康肃忿然曰：“尔安敢轻吾射！”翁曰：“以我酌(zhuó)油知之。”乃取一葫芦置于地，以钱覆其口，徐以杓(sháo)酌油沥之，自钱孔入，而钱不湿。因曰：“我亦无他，惟手熟尔。”康肃笑而遣之。","孙权劝学": "初，权谓吕蒙曰：“卿(qīng)今当涂掌事，不可不学！”蒙辞以军中多务。权曰：“孤岂欲卿治经为博士邪(yé)！但当涉猎，见往事耳。卿言多务孰若孤孤常读书自以为大有所益。”蒙乃始就学。及鲁肃过寻阳，与蒙论议，大惊曰：“卿今者才略，非复吴下阿蒙！”蒙曰：“士别三日，即更(gēng)刮目相待，大兄何见事之晚乎！”肃遂拜蒙母，结友而别。","司马光": "群儿戏于庭，一儿登瓮，足跌没水中。众皆弃去，光持石击破之，水迸，儿得活。", "守株待兔": "宋人有耕者。田中有株。兔走触株，折颈而死。因释其耒而守株，冀复得兔。兔不可复得，而身为宋国笑。", "精卫填海": "炎帝之少女，名曰女娃。女娃游于东海，溺而不返，故为精卫，常衔西山之木石，以堙(yīn)于东海。", "王戎不取道旁李": "王戎七岁，尝与诸小儿游。看道边李树多子折枝，诸儿竞走取之，唯戎不动。人问之，答曰：“树在道边而多子，此必苦李。”取之，信然。", "囊萤夜读": "胤恭勤不倦，博学多通。家贫不常得油，夏月则练囊盛数十萤火以照书，以夜继日焉。", "铁杵成针": "磨针溪，在象耳山下。世传李太白读书山中，未成，弃去。过是溪，逢老媪方磨铁杵。问之，曰：“欲作针。”太白感其意，还卒业。", "古人谈读书之论语": "①知之为知之，不知为不知，是知也。｜②敏而好学，不耻下问。｜③默而识之，学而不厌，诲人不倦。｜④我非生而知之者，好古，敏以求之者也。｜⑤学如不及，犹恐失之。｜⑥吾尝终日不食，终夜不寝，以思，无益，不如学也。", "古人谈读书之读书有三到": "余尝谓读书有三到，谓心到、眼到、口到。心不在此，则眼不看仔细，心既不专一，却只漫浪诵读，决不能记，记亦不能久也。三到之中，心到最急。心既到矣，眼口岂不到乎？", "自相矛盾": "楚人有鬻(yù)盾与矛者，誉之曰：“吾盾之坚，物莫能陷也。”又誉其矛曰：“吾矛之利，于物无不陷也。”或曰：“以子之矛陷子之盾，何如？”其人弗能应也。夫不可陷之盾与无不陷之矛，不可同世而立。", "杨氏之子": "梁国杨氏子九岁，甚聪惠。孔君平诣其父，父不在，乃呼儿出。为设果，果有杨梅。孔指以示儿曰：“此是君家果。”儿应声答曰：“未闻孔雀是夫子家禽。”", "伯牙鼓琴": "伯牙鼓琴，锺子期听之。方鼓琴而志在太山，锺子期曰：“善哉乎鼓琴，巍巍乎若太山。”少选之间而志在流水，锺子期又曰：“善哉乎鼓琴，汤汤乎若流水。”锺子期死，伯牙破琴绝弦，终身不复鼓琴，以为世无足复为鼓琴者。", "书戴嵩画牛": "蜀中有杜处士，好书画，所宝以百数。有戴嵩《牛》一轴，尤所爱，锦囊玉轴，常以自随。一日曝书画，有一牧童见之，拊(fǔ)掌大笑，曰：“此画斗牛也。牛斗，力在角，尾搐入两股间，今乃掉尾而斗，谬(miù)矣。”处士笑而然之。古语有云：“耕当问奴，织当问婢。”不可改也。", "学弈": "弈秋，通国之善弈者也。使弈秋诲二人弈，其一人专心致志，惟弈秋之为听；一人虽听之，一心以为有鸿鹄将至，思援弓缴(zhuó)而射之。虽与之俱学，弗若矣。为是其智弗若与(yú)？曰：非然也。", "两小儿辩日": "孔子东游，见两小儿辩斗，问其故。一儿曰：“我以日始出时去人近，而日中时远也。”一儿曰：“我以日初出远，而日中时近也。”一儿曰：“日初出大如车盖，及日中则如盘盂，此不为远者小而近者大乎？”一儿曰：“日初出沧沧凉凉，及其日中如探汤，此不为近者热而远者凉乎？”孔子不能决也。两小儿笑曰：“孰(shú)为汝多知乎？”", "咏雪": "谢太傅寒雪日内集，与儿女讲论文义。俄而雪骤，公欣然曰：“白雪纷纷何所似？”兄子胡儿曰：“撒盐空中差可拟。”兄女曰：“未若柳絮因风起。”公大笑乐。即公大兄无奕女，左将军王凝之妻也。", "陈太丘与友期行": "陈太丘与友期行，期日中。过中不至，太丘舍去，去后乃至。元方时年七岁，门外戏。客问元方：“尊君在不？”答曰：“待君久不至，已去。”友人便怒曰：“非人哉！与人期行，相委而去。”元方曰：“君与家君期日中。日中不至，则是无信；对子骂父，则是无礼。”友人惭，下车引之。元方入门不顾。", "论语十二章": "①子曰：“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？”｜②曾子曰：“吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？”｜③子曰：“吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。”｜④子曰：“温故而知新，可以为师矣。”｜⑤子曰：“学而不思则罔，思而不学则殆。”｜⑥子曰：“贤哉，回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。贤哉，回也！”｜⑦子曰：“知之者不如好之者，好之者不如乐之者。”｜⑧子曰：“饭疏食，饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云。”｜⑨子曰：“三人行，必有我师焉。择其善者而从之，其不善者而改之。”｜⑩子在川上曰：“逝者如斯夫，不舍昼夜。”｜⑪子曰：“三军可夺帅也，匹夫不可夺志也。”｜⑫子夏曰：“博学而笃志，切问而近思，仁在其中矣。”", "诫子书": "夫君子之行，静以修身，俭以养德。非淡泊无以明志，非宁静无以致远。夫学须静也，才须学也，非学无以广才，非志无以成学。淫慢则不能励精，险躁则不能治性。年与时驰，意与日去，遂成枯落，多不接世，悲守穷庐，将复何及！", "狼": "一屠晚归，担中肉尽，止有剩骨。途中两狼，缀行甚远。屠惧，投以骨。一狼得骨止，一狼仍从。复投之，后狼止而前狼又至。骨已尽矣，而两狼之并驱如故。屠大窘，恐前后受其敌。顾野有麦场，场主积薪其中，苫(shàn)蔽成丘。屠乃奔倚其下，弛担持刀。狼不敢前，眈眈相向。少时，一狼径去，其一犬坐于前。久之，目似瞑，意暇甚。屠暴起，以刀劈狼首，又数刀毙之。方欲行，转视积薪后，一狼洞其中，意将隧入以攻其后也。身已半入，止露尻(kāo)尾。屠自后断其股，亦毙之。乃悟前狼假寐，盖以诱敌。狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？止增笑耳。", "穿井得一人": "宋之丁氏，家无井而出溉汲，常一人居外。及其家穿井，告人曰：“吾穿井得一人。”有闻而传之者：“丁氏穿井得一人。”国人道之，闻之于宋君。宋君令人问之于丁氏，丁氏对曰：“得一人之使，非得一人于井中也。”求闻之若此，不若无闻也。", "杞人忧天": "杞国有人忧天地崩坠，身亡所寄，废寝食者。又有忧彼之所忧者，因往晓之，曰：“天，积气耳，亡处亡气。若屈伸呼吸，终日在天中行止，奈何忧崩坠乎？”其人曰：“天果积气，日月星宿，不当坠耶？”晓之者曰：“日月星宿，亦积气中之有光耀者，只使坠，亦不能有所中伤。”其人曰：“奈地坏何？”晓之者曰：“地，积块耳，充塞四虚，亡处亡块。若躇步跐蹈，终日在地上行止，奈何忧其坏？”其人舍然大喜，晓之者亦舍然大喜。",
  "小石潭记": "从小丘西行百二十步，隔篁竹，闻水声，如鸣珮环，心乐之。伐竹取道，下见小潭，水尤清冽。全石以为底，近岸，卷石底以出，为坻，为屿，为嵁，为岩。青树翠蔓，蒙络摇缀，参差披拂。 潭中鱼可百许头，皆若空游无所依，日光下澈，影布石上。佁然不动，俶尔远逝，往来翕忽，似与游者相乐。 潭西南而望，斗折蛇行，明灭可见。其岸势犬牙差互，不可知其源。 坐潭上，四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃。以其境过清，不可久居，乃记之而去。 同游者：吴武陵，龚古，余弟宗玄。隶而从者，崔氏二小生，曰恕己，曰奉壹。"
};



(function(){

var pickList = document.getElementById('pickList');

var startBtn = document.getElementById('startBtn');

var floatStart = document.getElementById('floatStart');

var tip = document.getElementById('tip');

var s1 = document.getElementById('s1'), s2 = document.getElementById('s2'), s3 = document.getElementById('s3');

var titles = Object.keys(QDATA);

var selected = {};



// Render pick list

titles.forEach(function(t){

  var n = QDATA[t].length;

  var div = document.createElement('label');

  div.className = 'pick';

  div.innerHTML = '<input type="checkbox" value="' + t + '"><span class="nm">' + t + '</span><span class="ct">' + n + ' 题</span>';

  div.querySelector('input').addEventListener('change', function(e){

    var checked = e.target.checked;

    var count = 0;

    titles.forEach(function(x){ if (document.querySelector('input[value="' + x + '"]').checked) count++; });

    if (checked && count > 5) {

      e.target.checked = false;

      tip.textContent = '最多只能选择 5 篇哦';

      return;

    }

    tip.textContent = count ? '已选择 ' + count + ' 篇' : '';

    div.classList.toggle('sel', e.target.checked);

    startBtn.disabled = count < 1; floatStart.disabled = count < 1;

  });

  pickList.appendChild(div);

});



// shuffle

function shf(a){ var b=[].concat(a); for(var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i];b[i]=b[j];b[j]=t; } return b; }



var seq = [];   // flattened question list: {title, tag, q, o, a}

var cur = 0;    // current index

var correct = 0;



var startTime = 0;

var picked = [];

var perTitle = {};

startBtn.addEventListener('click', function(){

  startTime = Date.now();

  picked = [];

  perTitle = {};

  seq = [];

  titles.forEach(function(t){ var cb = document.querySelector('input[value="' + t + '"]'); if (cb && cb.checked) picked.push(t); });

  titles.forEach(function(t){

    var cb = document.querySelector('input[value="' + t + '"]');

    if (cb && cb.checked) {

      QDATA[t].forEach(function(q){ seq.push({title:t, tag:q.tag, q:q.q, o:q.o, a:q.a}); });

    }

  });

  cur = 0; correct = 0;

  s1.style.display = 'none'; s3.style.display = 'none'; s2.style.display = 'block'; floatStart.style.display = 'none';

  renderQ();

});




function splitSent(s){ return s.match(/[^。！？；]+[。！？；]*/g) || [s]; }
function getCtx(src, q){
  if (!src) return '';
  var m = q.match(/“([^”]*)”/);
  var sent = m ? m[1].replace(/<[^>]+>/g, '') : '';
  var parts = splitSent(src);
  if (parts.length <= 3) { return '<span class="lbl">原文</span>' + src; }
  var idx = -1;
  for (var i = 0; i < parts.length; i++) { if (sent && parts[i].indexOf(sent) !== -1) { idx = i; break; } }
  if (idx === -1) { return '<span class="lbl">原文</span>' + parts.slice(0, 2).join('') + '……'; }
  var from = Math.max(0, idx - 1), to = Math.min(parts.length, idx + 2);
  return '<span class="lbl">原文</span>' + parts.slice(from, to).join('');
}

function renderQ(){

  var q = seq[cur];

  document.getElementById('prog').textContent = '第 ' + (cur+1) + ' / ' + seq.length + ' 题';

  document.getElementById('qTitle').textContent = q.title;

  document.getElementById('qTag').textContent = q.tag;

  document.getElementById('qText').innerHTML = q.q;

  var qCtx = document.getElementById('qCtx');

  if (qCtx) { qCtx.innerHTML = getCtx(SOURCE[q.title] || '', q.q); }

  var box = document.getElementById('qOpts');

  var order = shf([0,1,2,3]);

  var letters = ['A','B','C','D'];

  var h = '';

  order.forEach(function(d, idx){

    h += '<label data-v="' + d + '" onclick="pick(' + d + ', this)"><span class="ol">' + letters[idx] + '</span>' + q.o[d] + '</label>';

  });

  box.innerHTML = h;

}



window.pick = function(optIdx, el){

  if (el.classList.contains('lock')) return;

  var q = seq[cur];

  var labels = document.querySelectorAll('#qOpts label');

  for (var i=0;i<labels.length;i++) labels[i].classList.add('lock');

  el.classList.add('picked');

  if (optIdx === q.a) { correct++; } else { perTitle[q.title] = (perTitle[q.title] || 0) + 1; try { var _wl = JSON.parse(localStorage.getItem('gd_wrong') || '[]'); _wl.push({ paper: '《' + q.title + '》', time: new Date().toLocaleString(), tag: q.tag, q: q.q, options: q.o, userAns: optIdx, correct: q.a, explain: '' }); localStorage.setItem('gd_wrong', JSON.stringify(_wl)); } catch (e) {} }

  setTimeout(nextQ, 350);

};



function nextQ(){

  cur++;

  if (cur >= seq.length) { finish(); return; }

  renderQ();

}



function finish(){

  s2.style.display = 'none';

  var total = seq.length;

  var rate = Math.round(correct / total * 100);

  document.getElementById('rateNum').textContent = rate + '%';

  var parts = picked.map(function(t){ var w = perTitle[t] || 0; return w === 0 ? t + '（全对⭐）' : t + '（错了' + w + '题）'; });

  document.getElementById('pickedList').textContent = '本次篇目：' + parts.join('、');

  document.getElementById('rateDetail').textContent = '答对 ' + correct + ' / ' + total + ' 题';

  var used = Math.round((Date.now() - startTime) / 1000);

  var mm = Math.floor(used / 60), ss = used % 60;

  document.getElementById('timeUsed').textContent = '用时 ' + mm + '分' + (ss < 10 ? '0' : '') + ss + '秒';

  var cm;

  if (rate >= 90) cm = '🏆 太厉害了！连打高手！';

  else if (rate >= 75) cm = '👏 掌握得很扎实！';

  else if (rate >= 60) cm = '💪 基础不错，继续加油！';

  else if (rate >= 40) cm = '📖 需要再复习一下重点字词哦。';

  else cm = '🔄 建议先单篇精读，再来连打挑战！';

  document.getElementById('rateComment').textContent = cm;

  s3.style.display = 'block';

  window.scrollTo({top:0, behavior:'smooth'});

}



document.getElementById('againBtn').addEventListener('click', function(){

  // reset selections

  var cbs = document.querySelectorAll('.pick input');

  for (var i=0;i<cbs.length;i++){ cbs[i].checked=false; }

  document.querySelectorAll('.pick').forEach(function(d){ d.classList.remove('sel'); });

  tip.textContent = ''; startBtn.disabled = true; floatStart.disabled = true;

  s3.style.display='none'; s2.style.display='none'; s1.style.display='block'; floatStart.style.display='block';

});

floatStart.addEventListener('click', function(){

  if (startBtn.disabled) { tip.textContent = '请先选择至少一篇'; return; }

  startBtn.click();

});

})();

</script>
