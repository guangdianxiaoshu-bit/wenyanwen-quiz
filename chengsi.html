<script>

const questions = [
  { tag: "字词释义", q: '“月色入<span class="highlight">户</span>”中“<span class="highlight">户</span>”的意思是？', options: ["门", "窗户", "户口", "住户"], answer: 0, explain: '“户”此处指“门”。“月色入户”即月光从门照进来。' },
  { tag: "字词释义", q: '“欣<span class="highlight">然</span>起行”中“<span class="highlight">然</span>”的意思是？', options: ["……的样子", "然后", "然而", "竟然"], answer: 0, explain: '“然”是形容词词尾，意为“……的样子”。“欣然”即高兴的样子。' },
  { tag: "字词释义", q: '“<span class="highlight">念</span>无与为乐者”中“<span class="highlight">念</span>”的意思是？', options: ["想到", "思念", "念叨", "念头"], answer: 0, explain: '“念”意为“考虑、想到”。想到没有人与我共同赏乐。' },
  { tag: "字词释义", q: '“<span class="highlight">遂</span>至承天寺”中“<span class="highlight">遂</span>”的意思是？', options: ["于是，就", "成功", "即使", "顺利"], answer: 0, explain: '“遂”意为“于是、就”。于是到承天寺寻找张怀民。' },
  { tag: "字词释义", q: '“<span class="highlight">相与</span>步于中庭”中“<span class="highlight">相与</span>”的意思是？', options: ["共同，一起", "互相给与", "相随", "交往"], answer: 0, explain: '“相与”意为“共同、一起”。我们一起在庭院中散步。' },
  { tag: "字词释义", q: '“水中藻、荇<span class="highlight">交横</span>”中“<span class="highlight">交横</span>”的意思是？', options: ["交错纵横", "交叉横放", "相互横着", "交通横行"], answer: 0, explain: '“交横”意为“交错纵横”。' },
  { tag: "字词释义", q: '“<span class="highlight">盖</span>竹柏影也”中“<span class="highlight">盖</span>”的意思是？', options: ["大概是", "盖子", "遮盖", "因为"], answer: 0, explain: '“盖”表推测语气，意为“大概是”。大概是竹柏的影子。' },
  { tag: "字词释义", q: '“<span class="highlight">但</span>少闲人如吾两人者耳”中“<span class="highlight">但</span>”的意思是？', options: ["只是", "但是", "况且", "竟然"], answer: 0, explain: '“但”意为“只是”（古今异义，今义为“但是”）。' },
  { tag: "字词释义", q: '“如吾两人者<span class="highlight">耳</span>”中“<span class="highlight">耳</span>”的意思是？', options: ["罢了", "耳朵", "感叹语气词", "听到"], answer: 0, explain: '“耳”是句末语气词，意为“罢了”。' },
  { tag: "断句", q: '“何夜无月何处无竹柏但少闲人如吾两人者耳”断句正确的一项是？', options: ["何夜无月？何处无竹柏？但少闲人如吾两人者耳。", "何夜无月何处？无竹柏但少闲人？如吾两人者耳。", "何夜无月？何处无竹柏但？少闲人如吾两人者耳。", "何夜无月何处？无竹柏？但少闲人如吾两人者耳。"], answer: 0, explain: '应为两个反问句加一个感叹句：“何夜无月？何处无竹柏？但少闲人如吾两人者耳。”' },
  { tag: "特殊句式", q: '“水中藻、荇交横，盖竹柏影也”的特殊句式是？', options: ["判断句", "省略句", "倒装句", "被动句"], answer: 0, explain: '“盖竹柏影也”用“也”表判断，是判断句。' },
  { tag: "内容理解", q: '下列关于本文主旨情感的理解，不正确的一项是？', options: ["描绘承天寺月夜美景，抒发赏月的欣喜、漫步的悠闲", "暗含作者被贬黄州的落寞苦闷", "体现苏轼乐观旷达的人生态度", "表达作者对官场生活的向往与留恋"], answer: 3, explain: '本文主旨：①描绘月夜美景，抒发赏月的欣喜、漫步的悠闲；②暗含被贬黄州的落寞苦闷；③体现乐观旷达的人生态度。D 项“向往官场”于文无据。' },
  { tag: "内容理解", q: '下列对“闲人”内涵的理解，不正确的一项是？', options: ["指具有闲情逸致、能够欣赏月色美景的人", "暗含作者被贬黄州、仕途失意不得重用的苦闷", "表现作者在逆境中乐观旷达、随缘自适的心境", "指清闲无事、无所事事的人"], answer: 3, explain: '“闲人”包含三层内涵：①闲情逸致、能欣赏月色美景；②暗含被贬黄州、仕途失意的苦闷；③逆境中乐观旷达、随缘自适。D 项“无所事事”是贬义理解，不符。' },
  { tag: "字词释义", q: '下列加点词解释有误的一项是？', options: ["月色入<u>户</u>——门", "<u>念</u>无与为乐者——思念", "怀民亦未<u>寝</u>——睡觉", "<u>但</u>少闲人如吾两人者耳——只是"], answer: 1, explain: '“念”意为“考虑、想到”，不是“思念”。' },
  { tag: "特殊句式", q: '“相与步于中庭”的特殊句式与下列哪句相同？', options: ["蒙辞以军中多务", "何陋之有", "莲，花之君子者也", "其印为余群从所得"], answer: 0, explain: '“相与步于中庭”即“（于中庭）步”，状语后置，与“蒙辞以军中多务”（以军中多务辞）相同。' }

const STORAGE_PREFIX = 'chengsi_';



let submitted = false;

let shuffles = {};

function shuffleArray(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function generateShuffles() { questions.forEach((_, i) => { shuffles[i] = shuffleArray([0, 1, 2, 3]); }); localStorage.setItem(STORAGE_PREFIX + 'shuffles', JSON.stringify(shuffles)); }

function loadShuffles() { try { const s = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'shuffles')); if (s && Object.keys(s).length === questions.length) { shuffles = s; return; } } catch {} generateShuffles(); }

    translationContent.appendChild(block);

}

  container.innerHTML = '';

  questions.forEach((q, i) => {

    const card = document.createElement('div'); card.className = 'q-card'; card.id = 'q-' + i;

    const letters = ['A', 'B', 'C', 'D']; const order = shuffles[i] || [0, 1, 2, 3];

    card.innerHTML = '<div class="q-header"><span class="q-num">' + (i + 1) + '</span><span class="q-tag">' + q.tag + '</span></div><div class="q-text">' + q.q + '</div><div class="opts">' + order.map((oi, di) => '<label data-q="' + i + '" data-opt="' + oi + '" onclick="selectOption(' + i + ', ' + oi + ')"><input type="radio" name="q' + i + '" value="' + oi + '"><span class="opt-letter">' + letters[di] + '</span>' + q.options[oi] + '</label>').join('') + '</div><div class="explanation" id="exp-' + i + '"><span class="result-tag" id="tag-' + i + '"></span><strong>解析：</strong>' + q.explain + '</div>';

    container.appendChild(card);

  });

}

function selectOption(qIdx, optIdx) {

  if (submitted) return;

  document.querySelectorAll('label[data-q="' + qIdx + '"]').forEach(l => l.classList.remove('selected'));

  const label = document.querySelector('label[data-q="' + qIdx + '"][data-opt="' + optIdx + '"]');

  if (label) label.classList.add('selected');

  const answers = getStoredAnswers(); answers[qIdx] = optIdx;

  localStorage.setItem(STORAGE_PREFIX + 'answers', JSON.stringify(answers));

  const done = getAnswered();

  if (!done.includes(qIdx)) { done.push(qIdx); localStorage.setItem(STORAGE_PREFIX + 'done', JSON.stringify(done)); }

  updateProgress(); checkSubmitReady();

}

function getStoredAnswers() { try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'answers')) || {}; } catch { return {}; } }

function getAnswered() { try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'done')) || []; } catch { return []; } }

function restoreFromStorage() {

  const answers = getStoredAnswers(); const answered = getAnswered();

  if (!answered.length) return;

  Object.keys(answers).forEach(k => { const idx = parseInt(k), opt = answers[k]; const label = document.querySelector('label[data-q="' + idx + '"][data-opt="' + opt + '"]'); if (label) { label.classList.add('selected'); const r = label.querySelector('input[type="radio"]'); if (r) r.checked = true; } });

  updateProgress(); checkSubmitReady();

}

function updateProgress() { const done = getAnswered().length; const total = questions.length; document.getElementById(\'floatProg\').textContent = '已答 ' + done + ' / ' + total + ' 题'; }

function checkSubmitReady() { const done = getAnswered().length; const total = questions.length; submitBtn.disabled = done < total; submitBtn.textContent = done === total ? '📋 提交批改' : '📋 提交批改（还差 ' + (total - done) + ' 题）'; }

submitBtn.addEventListener('click', function() {

  if (submitted) return; if (submitBtn.disabled) { showToast('请先完成所有题目再提交'); return; }

  submitted = true; const answers = getStoredAnswers(); let correct = 0;

  questions.forEach((q, i) => { const userAns = answers[i]; const isCorrect = userAns === q.answer; if (isCorrect) correct++; else { try { var _wl = JSON.parse(localStorage.getItem('gd_wrong') || '[]'); _wl.push({ paper: '《记承天寺夜游》', time: new Date().toLocaleString(), tag: q.tag, q: q.q, options: q.options, userAns: userAns, correct: q.answer, explain: q.explain }); localStorage.setItem('gd_wrong', JSON.stringify(_wl)); } catch (e) {} }

    const card = document.getElementById('q-' + i); card.classList.add(isCorrect ? 'correct' : 'wrong');

    document.querySelectorAll('label[data-q="' + i + '"]').forEach(l => l.classList.add('disabled'));

    const cl = document.querySelector('label[data-q="' + i + '"][data-opt="' + q.answer + '"]'); if (cl) cl.classList.add('show-correct');

    if (!isCorrect && userAns !== undefined) { const wl = document.querySelector('label[data-q="' + i + '"][data-opt="' + userAns + '"]'); if (wl) wl.classList.add('show-wrong'); }

    const exp = document.getElementById('exp-' + i); exp.classList.add('show');

    const tag = document.getElementById('tag-' + i); tag.className = isCorrect ? 'result-tag correct-tag' : 'result-tag wrong-tag'; tag.textContent = isCorrect ? '✓ 正确' : '✗ 错误';

  });

  resultPanel.classList.add('show'); scoreNum.textContent = correct + '/' + questions.length; correctCountEl.textContent = correct;

  const pct = correct / questions.length; let stars = '', comment = '';

  if (pct >= 0.9) { stars = '⭐⭐⭐⭐⭐'; comment = '🏆 太厉害了！你是古文小达人！'; }

  else if (pct >= 0.75) { stars = '⭐⭐⭐⭐'; comment = '👏 掌握得很不错！继续加油！'; }

  else if (pct >= 0.5) { stars = '⭐⭐⭐'; comment = '💪 基础还可以，再复习一遍课下注释吧。'; }

  else { stars = '⭐⭐'; comment = '📖 建议熟读课文，理解每个字的意思。'; }

  resultStars.textContent = stars; scoreComment.textContent = comment;

  submitBtn.disabled = true; submitBtn.textContent = '✅ 已批改'; submitBtn.classList.add('btn-secondary'); submitBtn.classList.remove('btn-primary');

  renderTranslation(); translationPanel.classList.add('show');

  setTimeout(function() { resultPanel.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 200);

  localStorage.setItem(STORAGE_PREFIX + 'submitted', 'true');

  localStorage.removeItem(STORAGE_PREFIX + 'answers');

  localStorage.removeItem(STORAGE_PREFIX + 'done');

  localStorage.removeItem(STORAGE_PREFIX + 'submitted');

});

resetBtn.addEventListener('click', function() {

  if (submitted && !confirm('重新答题将清除当前成绩，确定吗？')) return;

  submitted = false; ['answers','done','submitted','shuffles'].forEach(function(k) { localStorage.removeItem(STORAGE_PREFIX + k); });

  document.querySelectorAll('.q-card').forEach(function(c) { c.className = 'q-card'; });

  document.querySelectorAll('.opts label').forEach(function(l) { l.className = ''; var r = l.querySelector('input[type="radio"]'); if (r) r.checked = false; });

  document.querySelectorAll('.explanation').forEach(function(e) { e.classList.remove('show'); });

  translationPanel.classList.remove('show'); resultPanel.classList.remove('show');

  submitBtn.disabled = true; submitBtn.textContent = '📋 提交批改'; submitBtn.classList.remove('btn-secondary'); submitBtn.classList.add('btn-primary');

  generateShuffles(); renderQuestions(); updateProgress();

  scrollTo({ top: 0, behavior: 'smooth' });

});

function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); clearTimeout(toast._timer); toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 2000); }

generateShuffles(); renderQuestions();

</script>
