<style>

var TIKU = {"《司马光》": [{"tag": "字词释义", "q": "“群儿戏于庭”中“戏”的意思是？", "options": ["演戏", "玩耍", "看戏", "马戏"], "answer": 1, "explain": "“戏”在此处意为“玩耍”。一群小孩在庭院里玩耍。"}, {"tag": "字词释义", "q": "“群儿戏于庭”中“于”的意思是？", "options": ["对于", "在", "于是", "关于"], "answer": 1, "explain": "“于”是介词，意为“在”。"}, {"tag": "字词释义", "q": "“群儿戏于庭”中“庭”的意思是？", "options": ["家庭", "朝廷", "庭院", "大厅"], "answer": 2, "explain": "“庭”指“庭院”，即房子前的院子。"}, {"tag": "字词释义", "q": "“一儿登瓮”中“登”的意思是？", "options": ["登记", "攀登", "蹬腿", "刊登"], "answer": 1, "explain": "“登”意为“攀登、爬上”。一个小孩爬上了瓮缸。"}, {"tag": "字词释义", "q": "“一儿登瓮”中“瓮”是什么？", "options": ["水缸（口小腹大的陶器）", "水桶", "大锅", "瓶子"], "answer": 0, "explain": "“瓮”是口小腹大的陶制容器，用来盛水或酒。这里指庭院里的大水缸。"}, {"tag": "字词释义", "q": "“足跌没水中”中“没”的读音和意思是？", "options": ["méi，没有", "mò，淹没", "méi，没事儿", "mò，出没"], "answer": 1, "explain": "“没”读mò，意为“淹没”。小孩失足落入水中，被水淹没。"}, {"tag": "字词释义", "q": "“众皆弃去”中“众”的意思是？", "options": ["众多", "观众", "众人", "群众"], "answer": 2, "explain": "“众”指“大家、其他人”，即其他小孩。"}, {"tag": "字词释义", "q": "“众皆弃去”中“皆”的意思是？", "options": ["都", "一起", "普通", "皆是"], "answer": 0, "explain": "“皆”意为“都”。其他小孩都吓跑了。"}, {"tag": "字词释义", "q": "“众皆去”中“去”的意思是？", "options": ["离开", "去…", "去除", "跑了"], "answer": 0, "explain": "“去”在古文中意为“离开”。其他小孩都抛下（落水的小孩）离开了。"}, {"tag": "字词释义", "q": "“光持石击瓮破之”中“持”的意思是？", "options": ["保持", "坚持", "拿", "支持"], "answer": 2, "explain": "“持”意为“拿”。司马光拿起石头砸瓮。"}, {"tag": "字词释义", "q": "“水迸”中“迸”的意思是？", "options": ["迸发", "喷涌而出", "迸裂", "四溅"], "answer": 1, "explain": "“迸”意为“喷涌而出”。瓮被砸破后，水一下子喷涌出来。"}, {"tag": "内容理解", "q": "这个故事主要表现了司马光的什么品质？", "options": ["胆小怕事", "聪明勇敢、临危不乱", "力气很大", "喜欢玩石头"], "answer": 1, "explain": "面对突发危险，其他孩子都吓跑了，司马光却沉着冷静地砸瓮救人，表现了聪明勇敢、临危不乱的品质。"}], "《守株待兔》": [{"tag": "字词释义", "q": "“宋人有耕者”中“耕”的意思是？", "options": ["打猎", "耕种", "砍柴", "钓鱼"], "answer": 1, "explain": "“耕”意为“耕种”。宋国有个耕种的人（农民）。"}, {"tag": "字词释义", "q": "“兔走触株”中“走”的意思是？", "options": ["走路", "跑", "散步", "逃走"], "answer": 1, "explain": "“走”在古文中意为“跑”，是古今异义词。现代汉语的“走”古代说“行”。"}, {"tag": "字词释义", "q": "“兔走触株”中“触”的意思是？", "options": ["接触", "碰撞", "触摸", "触发"], "answer": 1, "explain": "“触”意为“碰撞”。兔子跑得太快，撞到了树桩上。"}, {"tag": "字词释义", "q": "“折颈而死”中“颈”的意思是？", "options": ["头", "脖子", "翅膀", "脚"], "answer": 1, "explain": "“颈”指“脖子”。兔子撞断脖子而死。"}, {"tag": "字词释义", "q": "“因释其耒”中“因”的意思是？", "options": ["因为", "于是", "原因", "因此"], "answer": 1, "explain": "“因”在此处意为“于是”，表示顺承关系。"}, {"tag": "字词释义", "q": "“因释其耒”中“释”的意思是？", "options": ["解释", "释放", "放下", "消失"], "answer": 2, "explain": "“释”意为“放下”。农民放下农具不再干活。"}, {"tag": "字词释义", "q": "“因释其耒”中“耒”是什么？", "options": ["一种农具", "一棵树", "一把伞", "一个笼子"], "answer": 0, "explain": "“耒”是古代用来耕田的农具，类似今天的犁。"}, {"tag": "字词释义", "q": "“冀复得兔”中“冀”的意思是？", "options": ["希望", "继续", "既然", "奇怪"], "answer": 0, "explain": "“冀”意为“希望”。农夫希望再得到一只兔子。"}, {"tag": "字词释义", "q": "“冀复得兔”中“复”的意思是？", "options": ["复习", "恢复", "再", "答复"], "answer": 2, "explain": "“复”意为“再、又”。希望能再得到一只兔子。"}, {"tag": "字词释义", "q": "“兔不可复得”中“得”的意思是？", "options": ["得到", "得意", "得体", "来得及"], "answer": 0, "explain": "“得”意为“得到”。兔子不可能再得到了。"}, {"tag": "字词释义", "q": "“而身为宋国笑”中“为”的意思是？", "options": ["为了", "因为", "被", "成为"], "answer": 2, "explain": "“为”表示被动，意为“被”。农夫被宋国人耻笑。"}, {"tag": "内容理解", "q": "这则寓言告诉我们什么道理？", "options": ["兔子跑得快容易撞树", "不要心存侥幸，要靠劳动获得成果", "种地很辛苦", "树桩可以用来抓兔子"], "answer": 1, "explain": "守株待兔讽刺了那些把偶然当作必然、妄想不劳而获的人。告诉我们不要心存侥幸，要靠诚实的劳动获得成果。"}], "《精卫填海》": [{"tag": "字词释义", "q": "“炎帝之少女”中“之”的意思是？", "options": ["的", "到", "去", "这"], "answer": 0, "explain": "“之”是结构助词，意为“的”。炎帝的小女儿。"}, {"tag": "字词释义", "q": "“炎帝之少女”中“少女”在文中的意思是？", "options": ["年轻女子", "小女儿", "少女", "小女孩"], "answer": 1, "explain": "“少女”在此处是古今异义词，意为“小女儿”，不是现代汉语中的“少女”。"}, {"tag": "字词释义", "q": "“名曰女娃”中“曰”的意思是？", "options": ["说", "叫", "是", "认为"], "answer": 1, "explain": "“曰”意为“叫、称为”。名字叫女娃。"}, {"tag": "字词释义", "q": "“女娃游于东海”中“游”的意思是？", "options": ["游泳", "游玩", "旅游", "游戏"], "answer": 1, "explain": "“游”意为“游玩”。女娃去东海游玩。"}, {"tag": "字词释义", "q": "“女娃游于东海”中“于”的意思是？", "options": ["对于", "到", "在", "于是"], "answer": 2, "explain": "“于”是介词，意为“在”。女娃在东海游玩。"}, {"tag": "字词释义", "q": "“溺而不返”中“溺”的意思是？", "options": ["溺爱", "溺水", "沉溺", "沉迷"], "answer": 1, "explain": "“溺”意为“溺水、淹没”。女娃溺水而死。"}, {"tag": "字词释义", "q": "“溺而不返”中“而”表示什么关系？", "options": ["转折（却）", "顺承（然后）", "并列（并且）", "因果（因而）"], "answer": 1, "explain": "“而”表顺承，意为“然后”。溺水了然后没能返回（死去）。"}, {"tag": "字词释义", "q": "“故为精卫”中“故”的意思是？", "options": ["故事", "旧的", "因此", "故乡"], "answer": 2, "explain": "“故”意为“因此、所以”。因此化成了精卫鸟。"}, {"tag": "字词释义", "q": "“故为精卫”中“为”的意思是？", "options": ["为了", "因为", "成为", "被"], "answer": 2, "explain": "“为”意为“成为”。因此成为精卫鸟。"}, {"tag": "字词释义", "q": "“常衔西山之木石”中“衔”的意思是？", "options": ["包含", "叼", "衔接", "头衔"], "answer": 1, "explain": "“衔”意为“叼”。精卫鸟经常用嘴叼着西山的树枝和石块。"}, {"tag": "字词释义", "q": "“以堙于东海”中“以”的意思是？", "options": ["因为", "用来", "认为", "可以"], "answer": 1, "explain": "“以”意为“用来”，表示目的。用来填塞东海。"}, {"tag": "字词释义", "q": "“以堙(yīn)于东海”中“堙(yīn)”的意思是？", "options": ["淹没", "填塞", "烟囱", "阻拦"], "answer": 1, "explain": "“堙(yīn)”意为“填塞”。精卫鸟叼来木石是为了填平东海。"}], "《王戎不取道旁李》": [{"tag": "字词释义", "q": "“王戎七岁，尝与诸小儿游”中“尝”的意思是？", "options": ["品尝", "曾经", "尝试", "常常"], "answer": 1, "explain": "“尝”意为“曾经”。王戎七岁的时候，曾经和一群小孩一起玩。"}, {"tag": "字词释义", "q": "“尝与诸小儿游”中“与”的意思是？", "options": ["给予", "和", "参与", "与其"], "answer": 1, "explain": "“与”是介词，意为“和、跟”。"}, {"tag": "字词释义", "q": "“尝与诸小儿游”中“诸”的意思是？", "options": ["各个（众位）", "全部", "几位", "各位（尊称）"], "answer": 0, "explain": "“诸”意为“众、各”。“诸小儿”即“各位小孩、一群小孩”。“诸位”是现代敬称，与本义不同。"}, {"tag": "字词释义", "q": "“看道边李树多子折枝”中“子”的意思是？", "options": ["儿子", "果实", "种子", "子女"], "answer": 1, "explain": "“子”在此处指“果实”，即李子。李树上结满了果子。"}, {"tag": "字词释义", "q": "“诸儿竞走取之”中“竞”的意思是？", "options": ["竞争", "争相", "竞赛", "究竟"], "answer": 1, "explain": "“竞”意为“争相”。其他小孩都争相跑过去摘李子。"}, {"tag": "字词释义", "q": "“诸儿竞走取之”中“走”的意思是？", "options": ["走路", "跑", "散步", "逃走"], "answer": 1, "explain": "“走”在古文中意为“跑”，是古今异义词。小孩们跑着去摘李子。"}, {"tag": "字词释义", "q": "“诸儿竞走取之”中“之”指的是什么？", "options": ["王戎", "李子", "树枝", "小孩"], "answer": 1, "explain": "“之”是代词，指代“李子”。小孩们争相跑过去摘李子。"}, {"tag": "字词释义", "q": "“唯戎不动”中“唯”的意思是？", "options": ["唯一", "只有", "但是", "思维"], "answer": 1, "explain": "“唯”意为“只有”。只有王戎站在原地不动。"}, {"tag": "字词释义", "q": "“答曰”中“曰”的意思是？", "options": ["说", "日", "是", "因为"], "answer": 0, "explain": "“曰”意为“说”。王戎回答说。"}, {"tag": "字词释义", "q": "“此必苦李”中“此”的意思是？", "options": ["此时", "这", "因此", "彼此"], "answer": 1, "explain": "“此”意为“这”。这一定是苦李子。"}, {"tag": "字词释义", "q": "“此必苦李”中“必”的意思是？", "options": ["必须", "一定", "必要", "毕竟"], "answer": 1, "explain": "“必”意为“一定”。这一定是苦李子。"}, {"tag": "内容理解", "q": "“取之，信然”中“信然”的意思是？", "options": ["相信别人", "确实这样", "信以为真", "自然相信"], "answer": 1, "explain": "“信然”意为“确实这样”。“信”是“确实”，“然”是“这样”。摘下李子一尝，果然像王戎说的那样是苦的。王戎小小年纪就能通过观察推理得出结论，表现了善于观察思考的品质。"}], "《囊萤夜读》": [{"tag": "字词释义", "q": "“胤恭勤不倦”中“恭勤”的意思是？", "options": ["恭谨", "庭勤", "肃敬勤勉", "恭敬"], "answer": 2, "explain": "“恭勤”意为“肃敬勤勉”。车胤肃敬勤勉而不知疲倦。"}, {"tag": "字词释义", "q": "“恭勤不倦”中“倦”的意思是？", "options": ["疲倦", "反倦", "懈怠", "厌倦"], "answer": 0, "explain": "“倦”意为“疲倦”。肃敬勤勉而不知疲倦。"}, {"tag": "字词释义", "q": "“博学多通”中“通”的意思是？", "options": ["通过", "流通", "通晓", "串通"], "answer": 2, "explain": "“通”意为“通晓，明白”。博学多通即知识广博，学问精通。"}, {"tag": "字词释义", "q": "“家贫不常得油”中“常”的意思是？", "options": ["经常", "平常", "常识", "常见"], "answer": 0, "explain": "“常”意为“经常”。家境贫寒，不能经常得到灯油。"}, {"tag": "字词释义", "q": "“夏月则练囊”中“练囊”是什么？", "options": ["练习用的袋子", "白色薄绢做的口袋", "棉布袋", "练过的袋子"], "answer": 1, "explain": "“练囊”指“白色薄绢做的口袋”。“练”是白色薄绢，“囊”是袋子。"}, {"tag": "字词释义", "q": "“练囊盛数十萤火”中“盛”的意思是？", "options": ["盛大", "装着", "孟", "充满"], "answer": 1, "explain": "“盛”读shèng，意为“装”。用白绢袋子装数十只萤火虫。"}, {"tag": "字词释义", "q": "“盛数十萤火”中“萤火”指的是？", "options": ["火光", "萤火虫", "火把", "荧幕"], "answer": 1, "explain": "“萤火”指的是“萤火虫”。古人称萤火虫为“萤”。"}, {"tag": "字词释义", "q": "“以夜继日”中“以夜继日”的意思是？", "options": ["夜晚接着白天", "白天接着夜晚", "以夜替日", "夜和日一样"], "answer": 0, "explain": "“以夜继日”即“用夜晚接着白天”，形容夜以继日地学习。"}, {"tag": "内容理解", "q": "车胤用什么照亮书籍？", "options": ["灯油", "月光", "萤火虫", "火把"], "answer": 2, "explain": "车胤用白绢袋子装萤火虫照亮书籍，即“囊萤夜读”故事。"}, {"tag": "内容理解", "q": "这则故事表现了车胤什么样的品质？", "options": ["聪明过人", "苦学勤奋、刻苦读书", "喜欢萤火虫", "有钱买油"], "answer": 1, "explain": "囊萤夜读表现了车胤刻苦勤奋、刻苦读书的品质。这也是后世“囊萤夜读”典故的来历。"}], "《铁杵成针》": [{"tag": "字词释义", "q": "“过是溪”中“是”的意思是？", "options": ["这", "正确", "判断", "因为"], "answer": 0, "explain": "“是”意为“这”。路过这条小溪。"}, {"tag": "字词释义", "q": "“逢老媪方磨铁杵”中“方”的意思是？", "options": ["方向", "正在", "方法", "方才"], "answer": 1, "explain": "“方”意为“正在”。遇见一位老妇人正在磨铁棒。"}, {"tag": "字词释义", "q": "“逢老媪方磨铁杵”中“老媪”指的是？", "options": ["老爷爷", "老妇人", "老婆婆的丈夫", "年轻姑娘"], "answer": 1, "explain": "“老媪”指老妇人。“媪”是古代对老年妇女的称呼。"}, {"tag": "字词释义", "q": "“逢老媪方磨铁杵”中“铁杵”是什么？", "options": ["铁针", "用来舂米或捣衣的铁棒", "铁锅", "铁锤"], "answer": 1, "explain": "“铁杵”是用来舂米或捣衣的铁棒。“杵”读chǔ，是捣物的棒槌。"}, {"tag": "字词释义", "q": "“未成，弃去”中“去”的意思是？", "options": ["去掉", "离开", "过去", "前往"], "answer": 1, "explain": "“去”意为“离开”。放弃学习离开了。"}, {"tag": "字词释义", "q": "“太白感其意”中“感其意”的意思是？", "options": ["感到她的意思", "被她的意志感动", "感谢她的心意", "感受她的想法"], "answer": 1, "explain": "“感其意”意为“被她的意志感动”。李白被老妇人的意志所感动。"}, {"tag": "字词释义", "q": "“还卒业”中“卒”的意思是？", "options": ["士兵", "完成", "突然", "终归"], "answer": 1, "explain": "“卒”意为“完成”。“卒业”即完成学业。"}, {"tag": "字词释义", "q": "“还卒业”中“还”的意思是？", "options": ["还是", "回去", "还给", "还有"], "answer": 1, "explain": "“还”读huán，意为“回去”。回去完成了学业。"}, {"tag": "内容理解", "q": "李白听了老妇人的话后怎么做？", "options": ["继续放弃学习", "回去完成了学业", "去别处游玩", "帮老妇人磨针"], "answer": 1, "explain": "李白被老妇人的意志感动，“还卒业”——回去完成了学业。"}, {"tag": "内容理解", "q": "这则故事告诉我们什么道理？", "options": ["做事要半途而废", "只要有恒心毅力，再难的事也能成功", "铁杵可以磨成针", "李白小时候不爱学习"], "answer": 1, "explain": "“铁杵成针”比喻只要有恒心、肯下功夫，再难的事也能做成。这也是成语“只要功夫深，铁杵磨成针”的来历。"}], "《古人谈读书之论语》": [{"tag": "字词释义", "q": "“是知也”中“知”的读音和意思是？", "options": ["zhī，知道", "zhì，同“智”，智慧", "zhī，知识", "zhì，知觉"], "answer": 1, "explain": "“知”是通假字，同“智”，读zhì，意为“智慧”。知道就是知道，不知道就是不知道，这就是智慧。"}, {"tag": "字词释义", "q": "“敏而好学”中“敏”的意思是？", "options": ["聪敏", "敏捷", "敏感", "勤奋"], "answer": 0, "explain": "“敏”此处指聪敏。聪明而又喜好学习。"}, {"tag": "字词释义", "q": "“敏而好学”中“好”的意思是？", "options": ["良好", "爱好", "好处", "友好"], "answer": 1, "explain": "“好”读hào，意为“喜好、爱好”。聪明而又喜好学习。"}, {"tag": "字词释义", "q": "“不耻下问”中“耻”的意思是？", "options": ["羞耻", "耻辱", "以……为耻", "可耻"], "answer": 2, "explain": "“耻”是意动用法，意为“以……为耻”。不以向别人请教为耻。"}, {"tag": "字词释义", "q": "“不耻下问”中“下问”的意思是？", "options": ["向下问", "向地位、学问不如自己的人请教", "低声地问", "谦虚地问"], "answer": 1, "explain": "“下问”指向地位、学问不如自己的人请教。"}, {"tag": "字词释义", "q": "“默而识之”中“识”的读音和意思是？", "options": ["shí，认识", "shí，知识", "zhì，记住", "zhì，识别"], "answer": 2, "explain": "“识”读zhì，意为“记住”。默默地记住所学的知识。"}, {"tag": "字词释义", "q": "“学而不厌”中“厌”的意思是？", "options": ["讨厌", "厌烦", "满足", "厌倦"], "answer": 2, "explain": "“厌”意为“满足”。学习不知道满足。"}, {"tag": "字词释义", "q": "“诲人不倦”中“诲”的意思是？", "options": ["悔恨", "教诲", "学习", "商量"], "answer": 1, "explain": "“诲”意为“教诲”。教导别人不知疲倦。"}, {"tag": "字词释义", "q": "“敏以求之者也”中“敏”的意思是？", "options": ["聪敏", "勤勉", "敏捷", "敏感"], "answer": 1, "explain": "“敏”此处指勤勉。勤奋敏捷地去求得知识。"}, {"tag": "字词释义", "q": "“学如不及”中“及”的意思是？", "options": ["以及", "到达", "赶得上", "及时"], "answer": 2, "explain": "“及”意为“赶得上”。学习就像追赶什么似的，唯恐赶不上。"}, {"tag": "字词释义", "q": "“犹恐失之”中“犹”的意思是？", "options": ["还", "犹如", "犹豫", "尤其"], "answer": 0, "explain": "“犹”意为“还，尚且”。学到了，还唯恐丢失了。"}, {"tag": "字词释义", "q": "“吾尝终日不食”中“尝”的意思是？", "options": ["品尝", "曾经", "尝试", "偿还"], "answer": 1, "explain": "“尝”意为“曾经”。我曾经整天不吃饭。"}, {"tag": "字词释义", "q": "“吾尝终日不食”中“终日”的意思是？", "options": ["整天", "太阳", "终于", "一天"], "answer": 0, "explain": "“终日”意为“整天”。我曾经整天不吃饭。"}, {"tag": "字词释义", "q": "“以思，无益”中“益”的意思是？", "options": ["益处", "增加", "有益", "溢出"], "answer": 0, "explain": "“益”意为“益处、好处”。用来思考没有益处，不如去学习。"}, {"tag": "内容理解", "q": "“知之为知之，不知为不知，是知也”告诉我们什么道理？", "options": ["做人要谦虚", "要诚实，知道就是知道，不知道就是不知道", "要多向别人请教", "做人要聪明"], "answer": 1, "explain": "这则语录告诉我们：对待知识要诚实，不不懂装懂，这才是真正的智慧。"}, {"tag": "内容理解", "q": "“学如不及，犹恐失之”表达了怎样的学习态度？", "options": ["学习要慢慢来", "学习要争分夺秒，唯恐落后", "学习不重要", "学习要劳逸结合"], "answer": 1, "explain": "这句话形容学习时唯恐赶不上、唯恐丢失的紧迫感，表达了勤勉努力、分秒必争的学习态度。"}], "《古人谈读书之读书有三到》": [{"tag": "字词释义", "q": "“余尝谓读书有三到”中“尝”的意思是？", "options": ["曾经", "品尝", "尝试", "偿还"], "answer": 0, "explain": "“尝”意为“曾经”。我曾经说读书有三到。"}, {"tag": "字词释义", "q": "“余尝谓读书有三到”中“谓”的意思是？", "options": ["说", "叫做", "认为", "称谓"], "answer": 0, "explain": "“谓”意为“说”。我曾经说读书有三到。"}, {"tag": "字词释义", "q": "“心不在此，则眼不看仔细”中“则”的意思是？", "options": ["原则", "就", "但是", "那么"], "answer": 1, "explain": "“则”意为“就，便”。心思不在这里，那么眼睛就不看仔细。"}, {"tag": "字词释义", "q": "“心既不专一”中“既”的意思是？", "options": ["既然", "即使", "已经", "既而"], "answer": 2, "explain": "“既”意为“已经”。心思已经不专一了。"}, {"tag": "字词释义", "q": "“却只漫浪诵读”中“漫浪”的意思是？", "options": ["浪漫", "随意", "漫步", "散漫"], "answer": 1, "explain": "“漫浪”意为“随意”。却只是随意地诵读。"}, {"tag": "字词释义", "q": "“决不能记”中“决”的意思是？", "options": ["决定", "坚决", "一定", "决断"], "answer": 2, "explain": "“决”意为“一定，必定”。一定不能记住。"}, {"tag": "字词释义", "q": "“记亦不能久也”中“亦”的意思是？", "options": ["也", "又如", "并且", "既然"], "answer": 0, "explain": "“亦”意为“也”。记住了也不能长久。"}, {"tag": "字词释义", "q": "“心到最急”中“急”的意思是？", "options": ["着急", "紧急", "要紧", "急促"], "answer": 2, "explain": "“急”意为“要紧，重要”。三到之中，心到最要紧。"}, {"tag": "字词释义", "q": "“眼口岂不到乎”中“岂”的意思是？", "options": ["哪里", "难道", "岂止", "可以"], "answer": 1, "explain": "“岂”意为“难道，怎么”，表反问。心思到了，眼睛和嘴巴难道会不到吗？"}, {"tag": "内容理解", "q": "朱熹认为读书三到中，哪一最为重要？", "options": ["眼到", "口到", "心到", "手到"], "answer": 2, "explain": "朱熹说“心到最急”，认为三到之中心到最要紧。"}, {"tag": "内容理解", "q": "这则短文告诉我们读书时应该怎样？", "options": ["三心二意", "专心致志，用心读书", "只读不记", "大声朗读就够了"], "answer": 1, "explain": "短文强调读书要心到，心思专一才能真正记住，告诉我们读书要专心致志。"}], "《自相矛盾》": [{"tag": "字词释义", "q": "“楚人有鬻盾与矛者”中“鬻”的意思是？", "options": ["买", "卖", "煮", "经营"], "answer": 1, "explain": "“鬻”读yù，意为“卖”。有一个楚国人，既卖盾又卖矛。"}, {"tag": "字词释义", "q": "“誉之曰”中“誉”的意思是？", "options": ["荣誉", "夸耀", "信誉", "名声"], "answer": 1, "explain": "“誉”意为“夸耀”。他夸耀自己的盾。"}, {"tag": "字词释义", "q": "“吾盾之坚”中“之”的意思是？", "options": ["到", "助词，的", "去", "它"], "answer": 1, "explain": "“之”是助词，相当于“的”。“吾盾之坚”即“我的盾的坚固”。"}, {"tag": "字词释义", "q": "“物莫能陷也”中“莫”的意思是？", "options": ["没有，表示否定", "不要", "莫非", "或许"], "answer": 0, "explain": "“莫”意为“没有，表示否定”。没有什么东西能够穿透它。"}, {"tag": "字词释义", "q": "“物莫能陷也”中“陷”的意思是？", "options": ["陷阱", "陷入", "刺破", "陷害"], "answer": 2, "explain": "“陷”意为“刺破”。没有什么东西能够刺破它。"}, {"tag": "字词释义", "q": "“或曰”中“或”的意思是？", "options": ["或者", "有的人", "有时", "或许"], "answer": 1, "explain": "“或”意为“有的人”。有的人说。"}, {"tag": "字词释义", "q": "“其人弗能应也”中“弗”的意思是？", "options": ["不", "通假字，通“拂”", "不用", "弗如"], "answer": 0, "explain": "“弗”意为“不”。那人不能回答。"}, {"tag": "字词释义", "q": "“夫不可陷之盾”中“夫”的意思是？", "options": ["丈夫", "句首发语词，表示要发议论", "夫子", "况且"], "answer": 1, "explain": "“夫”放在句首，是发语词，表示将要发议论，不翻译。"}, {"tag": "内容理解", "q": "这个卖矛和盾的人为什么回答不上来？", "options": ["他忘了怎么说", "矛和盾都太贵", "他的话前后矛盾，无法自圆其说", "他不想回答"], "answer": 2, "explain": "他说盾“物莫能陷”、矛“于物无不陷”，两者互相抵触，所以被问“以子之矛陷子之盾”时无法回答。"}, {"tag": "内容理解", "q": "这则寓言告诉我们什么道理？", "options": ["矛和盾不能一起卖", "说话做事要前后一致，不能自相矛盾", "要同时夸耀矛和盾", "买东西时要小心"], "answer": 1, "explain": "“自相矛盾”比喻说话做事前后抵触，告诉我们说话做事要前后一致，实事求是。"}], "《杨氏之子》": [{"tag": "字词释义", "q": "“甚聪惠”中“甚”的意思是？", "options": ["很", "甚至", "擅长", "过分"], "answer": 0, "explain": "“甚”意为“很，非常”。这个孩子非常聪明。"}, {"tag": "字词释义", "q": "“孔君平诣其父”中“诣”的读音和意思是？", "options": ["zhǐ，拜访", "yì，拜访", "zhǐ，造诣", "yì，造诣"], "answer": 1, "explain": "“诣”读yì，意为“拜访”。孔君平来拜访他的父亲。"}, {"tag": "字词释义", "q": "“孔君平诣其父”中“其”的意思是？", "options": ["代词，他的", "其中", "其他", "尤其"], "answer": 0, "explain": "“其”是代词，指代杨氏之子，意为“他的”。来拜访他的父亲。"}, {"tag": "字词释义", "q": "“乃呼儿出”中“乃”的意思是？", "options": ["竟然", "就", "才", "你的"], "answer": 1, "explain": "“乃”意为“就，于是”。父亲不在家，于是就把孩子叫了出来。"}, {"tag": "字词释义", "q": "“为设果”中“设”的意思是？", "options": ["设计", "假设", "摆放", "设立"], "answer": 2, "explain": "“设”意为“摆放，摆设”。孩子给孔君平端来了水果。"}, {"tag": "字词释义", "q": "“孔指以示儿曰”中“指”的意思是？", "options": ["手指", "指出", "指导", "指着"], "answer": 3, "explain": "“指”意为“指着”。孔君平指着杨梅给孩子看。"}, {"tag": "字词释义", "q": "“孔指以示儿曰”中“示”的意思是？", "options": ["给……看", "表示", "示意", "出示"], "answer": 0, "explain": "“示”意为“给……看”。孔君平指着杨梅给孩子看。"}, {"tag": "字词释义", "q": "“儿应声答曰”中“应声”的意思是？", "options": ["随声而动", "立刻回应", "回应声音", "大声说"], "answer": 0, "explain": "“应声”意为“随声而动”，指随着声音（立刻）回答。孩子随声回答“未闻孔雀是夫子家禽”。"}, {"tag": "内容理解", "q": "孔君平说“此是君家果”是什么意思？", "options": ["杨梅确实是杨家的果子", "因为“杨梅”的“杨”和孩子姓杨相同，故意开玩笑", "杨梅很珍贵", "杨梅只能杨家吃"], "answer": 1, "explain": "孔君平利用“杨梅”的“杨”字和孩子姓“杨”相同，开玩笑说杨梅是杨家的果子。"}, {"tag": "内容理解", "q": "孩子回答“未闻孔雀是夫子家禽”妙在哪里？", "options": ["孔雀很好看", "孔君平姓“孔”，孩子用“孔雀”来反击，既礼貌又机智", "孩子不喜欢孔雀", "孔雀是孔家的"], "answer": 1, "explain": "孩子模仿孔君平的方法，用“孔雀”的“孔”字反击：既然杨梅是杨家的，那孔雀就是孔家的。以其人之道还治其人之身，既不失礼又十分机智。"}, {"tag": "内容理解", "q": "这个故事表现了杨氏之子的什么特点？", "options": ["调皮捣蛋", "机智聪慧，反应敏捷", "骄傲自大", "贪吃嘴馋"], "answer": 1, "explain": "九岁的孩子应声作答，用“孔雀是夫子家禽”巧妙反击，表现了机智聪慧、反应敏捷的特点。"}], "《伯牙鼓琴》": [{"tag": "字词释义", "q": "“伯牙鼓琴”中“鼓”的意思是？", "options": ["弹奏", "击鼓", "鼓动", "鼓励"], "answer": 0, "explain": "“鼓”意为“弹奏”。“鼓琴”即弹琴。"}, {"tag": "字词释义", "q": "“方鼓琴而志在太山”中“方”的意思是？", "options": ["正在", "方向", "方法", "方才"], "answer": 0, "explain": "“方”意为“正，正在”。正当伯牙弹琴时，心中想着泰山。"}, {"tag": "字词释义", "q": "“方鼓琴而志在太山”中“志”的意思是？", "options": ["心志", "志向", "标志", "记录"], "answer": 0, "explain": "“志”意为“心志，情志”，指心中所想的。伯牙弹琴时心中想着泰山。"}, {"tag": "字词释义", "q": "“善哉乎鼓琴”中“善”的意思是？", "options": ["善良", "好", "擅长", "善于"], "answer": 1, "explain": "“善哉”意为“好啊”，“善”意为“好”。这是锺子期的赞叹。"}, {"tag": "字词释义", "q": "“巍巍乎若太山”中“若”的意思是？", "options": ["如果", "像", "假若", "若干"], "answer": 1, "explain": "“若”意为“像”。琴音像大山一样高峻。"}, {"tag": "字词释义", "q": "“少选之间而志在流水”中“少选”的意思是？", "options": ["不久", "少数", "选择", "很久"], "answer": 0, "explain": "“少选”意为“一会儿，不久”。过了一会儿，伯牙心意转向流水。"}, {"tag": "字词释义", "q": "“汤汤乎若流水”中“汤汤”的读音和意思是？", "options": ["shāng shāng，水流大而急的样子", "tāng tāng，水很多", "shāng shāng，热水", "tāng tāng，浩浩荡荡"], "answer": 0, "explain": "“汤汤”读shāng shāng，形容水流大而急的样子。琴音像流水一样浩荡。"}, {"tag": "字词释义", "q": "“伯牙破琴绝弦”中“绝”的意思是？", "options": ["断绝", "绝对", "绝妙", "尽头"], "answer": 0, "explain": "“绝”意为“断绝”。伯牙摔破琴身、扯断琴弦。"}, {"tag": "字词释义", "q": "“以为世无足复为鼓琴者”中“以为”的意思是？", "options": ["认为", "因为", "所以", "把…当作"], "answer": 0, "explain": "“以为”意为“认为”。认为世上再没有值得为之弹琴的人。"}, {"tag": "字词释义", "q": "“以为世无足复为鼓琴者”中“足”的意思是？", "options": ["脚", "值得", "足够", "满足"], "answer": 1, "explain": "“足”意为“值得”。认为世上再没有值得为之弹琴的人了。"}, {"tag": "内容理解", "q": "锺子期死后，伯牙“破琴绝弦，终身不复鼓琴”是因为什么？", "options": ["琴坏了", "失去了知音，认为世上再没有值得为之弹琴的人", "不喜欢弹琴了", "琴弦断了"], "answer": 1, "explain": "锺子期是伯牙的知音，能听懂他的琴声。知音已逝，伯牙认为世上再没有值得为之弹琴的人，所以破琴绝弦。"}, {"tag": "内容理解", "q": "“伯牙鼓琴”这个故事表达了什么？", "options": ["要爱护乐器", "知音难觅，朋友间深厚的情谊", "弹琴要专心", "伯牙琴艺高超"], "answer": 1, "explain": "故事表达了知音难觅、朋友间深厚情谊的主题。“高山流水”也因此成为知音的代称。"}], "《书戴嵩画牛》": [{"tag": "字词释义", "q": "“好书画”中“好”的意思是？", "options": ["喜爱", "良好", "好事", "友好"], "answer": 0, "explain": "“好”读hào，意为“喜爱”。喜爱书画。"}, {"tag": "字词释义", "q": "“所宝以百数”中“宝”的意思是？", "options": ["珍宝", "名词作动词，珍藏", "宝贝", "宝贵"], "answer": 1, "explain": "“宝”名词作动词，活用为“珍藏”。所珍藏的（书画）用百来计算。"}, {"tag": "字词释义", "q": "“所宝以百数”中“以”的意思是？", "options": ["用", "因为", "所以", "以为"], "answer": 0, "explain": "“以”意为“用，凭”。所珍藏的书画用百来计算。"}, {"tag": "字词释义", "q": "“所宝以百数”中“数”的意思是？", "options": ["数字", "计算", "数量", "数次"], "answer": 1, "explain": "“数”意为“计算”。所珍藏的书画用百来计算，即成百件。"}, {"tag": "字词释义", "q": "“尤所爱”中“尤”的意思是？", "options": ["尤其", "仍然", "优秀", "犹豫"], "answer": 0, "explain": "“尤”意为“尤其”。其中他尤其珍爱《牛》这幅画。"}, {"tag": "字词释义", "q": "“锦囊玉轴”中“锦囊玉轴”的意思是？", "options": ["用锦缎作画囊，用玉作画轴（名词作动词）", "锦缎做的囊、玉做的轴（名词）", "锦缎和玉做的盒子", "用锦缎包着的玉轴"], "answer": 0, "explain": "“锦囊玉轴”是名词作动词，意为“用锦缎作画囊，用玉作画轴”。"}, {"tag": "字词释义", "q": "“拊掌大笑”中“拊”的意思是？", "options": ["拍", "抚摸", "扶持", "拍打"], "answer": 0, "explain": "“拊”读fǔ，意为“拍”。“拊掌”即拍手。"}, {"tag": "字词释义", "q": "“尾搐入两股间”中“搐”的意思是？", "options": ["抽缩", "抽搐", "抽打", "压缩"], "answer": 0, "explain": "“搐”意为“抽缩”。尾巴收缩夹在两腿之间。"}, {"tag": "字词释义", "q": "“尾搐入两股间”中“股”的意思是？", "options": ["大腿", "屁股", "股份", "一股"], "answer": 0, "explain": "“股”意为“大腿”。“两股”即两条大腿。"}, {"tag": "字词释义", "q": "“今乃掉尾而斗”中“乃”的意思是？", "options": ["却", "于是", "才", "竟然"], "answer": 0, "explain": "“乃”意为“却”，表转折。如今这幅画却画成牛摇着尾巴相斗。"}, {"tag": "字词释义", "q": "“今乃掉尾而斗”中“掉”的意思是？", "options": ["摆动", "掉下", "丢失", "旋转"], "answer": 0, "explain": "“掉”意为“摆动，摇”。“掉尾”即摇着尾巴。"}, {"tag": "字词释义", "q": "“谬矣”中“谬”的意思是？", "options": ["错误", "荒谬", "差错", "巧妙"], "answer": 0, "explain": "“谬”读miù，意为“错误”。这是错误的啊！"}, {"tag": "字词释义", "q": "“处士笑而然之”中“而”的意思是？", "options": ["表修饰，笑着", "表转折，却", "表顺承，然后", "表并列，并且"], "answer": 0, "explain": "“而”表修饰关系，连接“笑”和“然之”，意为“笑着”。处士笑着认为他说得对。"}, {"tag": "字词释义", "q": "“处士笑而然之”中“然”的意思是？", "options": ["认为……对", "然而", "这样", "燃烧"], "answer": 0, "explain": "“然”是意动用法，意为“认为……对”。“然之”即认为他说得对。"}, {"tag": "内容理解", "q": "牧童为什么说这幅《斗牛图》画错了？", "options": ["牛不应该画尾巴", "牛相斗时尾巴夹在两腿间，画里却是摇着尾巴", "牛角画得不对", "牛的颜色不对"], "answer": 1, "explain": "牧童说牛相斗时“力在角，尾搐入两股间”，而画里却是“掉尾而斗”，与实情不符，所以说画错了。"}, {"tag": "内容理解", "q": "“耕当问奴，织当问婢”告诉我们什么道理？", "options": ["要听奴仆的话", "遇到事情要向有实践经验的人请教", "农夫和织女最聪明", "不要相信别人"], "answer": 1, "explain": "“奴”“婢”是常年耕田、织布的人，最有实践经验。这句话告诉我们：遇事要向有实践经验的人请教，不可凭空臆断。"}], "《学弈》": [{"tag": "字词释义", "q": "“通国之善弈者也”中“通国”的意思是？", "options": ["全国", "各国", "通行全国", "全国统一"], "answer": 0, "explain": "“通国”意为“全国”。弈秋是全国最擅长下棋的人。"}, {"tag": "字词释义", "q": "“通国之善弈者也”中“善”的意思是？", "options": ["善良", "擅长", "好事", "喜爱"], "answer": 1, "explain": "“善”意为“善于、擅长”。善于下棋的人。"}, {"tag": "字词释义", "q": "“使弈秋诲二人弈”中“使”的意思是？", "options": ["使者", "让", "使用", "如果"], "answer": 1, "explain": "“使”意为“让、叫”。让弈秋教导两个人下棋。"}, {"tag": "字词释义", "q": "“使弈秋诲二人弈”中“诲”的意思是？", "options": ["后悔", "教导", "劝告", "训斥"], "answer": 1, "explain": "“诲”意为“教导”。教导两个人下棋。"}, {"tag": "字词释义", "q": "“使弈秋诲二人弈”中“弈”的意思是？", "options": ["下棋", "游戏", "比赛", "弹琴"], "answer": 0, "explain": "“弈”意为“下棋”。教导两个人下棋。"}, {"tag": "字词释义", "q": "“惟弈秋之为听”中“惟”的意思是？", "options": ["只", "虽然", "但是", "因为"], "answer": 0, "explain": "“惟”意为“只”。“惟弈秋之为听”即“只听弈秋的教导”。"}, {"tag": "字词释义", "q": "“一心以为有鸿鹄将至”中“以为”的意思是？", "options": ["认为", "作为", "因为", "可以"], "answer": 0, "explain": "“以为”意为“认为”。心里一直认为（想着）有天鹅要飞来。"}, {"tag": "字词释义", "q": "“思援弓缴而射之”中“援”的意思是？", "options": ["拉", "援助", "放弃", "举起"], "answer": 0, "explain": "“援”意为“引、拉”。想拉弓搭箭去射它。"}, {"tag": "字词释义", "q": "“思援弓缴(zhuó)而射之”中“缴(zhuó)”的意思是？", "options": ["系在箭上的丝绳，指带丝绳的箭", "缴纳", "缴获", "弓箭"], "answer": 0, "explain": "“缴(zhuó)”指系在箭上的丝绳，这里指带有丝绳的箭，射出后可以收回。"}, {"tag": "字词释义", "q": "“虽与之俱学”中“俱”的意思是？", "options": ["一起", "害怕", "聚集", "各自"], "answer": 0, "explain": "“俱”意为“一起、一同”。虽然他和前一个人一起学习。"}, {"tag": "字词释义", "q": "“弗若之矣”中“若”的意思是？", "options": ["比得上", "好像", "仿佛", "如果"], "answer": 0, "explain": "“若”意为“比得上”。“弗若”即“比不上”（不如）。"}, {"tag": "字词释义", "q": "“为是其智弗若与”中“为”的意思是？", "options": ["因为", "为了", "成为", "作为"], "answer": 0, "explain": "“为”意为“因为”。这是因为他的智力不如前一个人吗？"}, {"tag": "字词释义", "q": "“是其智弗若与”中“弗”的意思是？", "options": ["不", "非常", "难道", "没有"], "answer": 0, "explain": "“弗”意为“不”。智力不如（前一个人）。"}, {"tag": "字词释义", "q": "“弗若与(yú)”中“与(yú)”的意思是？", "options": ["同“欤”，句末语气词，表疑问", "和", "给", "参与"], "answer": 0, "explain": "“与”同“欤”，读yú，是句末语气词，表示疑问。是智力不如吗？"}, {"tag": "字词释义", "q": "“曰：非然也”中“然”的意思是？", "options": ["这样", "然而", "然后", "燃烧"], "answer": 0, "explain": "“然”意为“这样”。回答说：不是这样的。"}], "《两小儿辩日》": [{"tag": "字词释义", "q": "“孔子东游”中“东”的意思是？", "options": ["向东（名词作状语）", "东方", "东家（主人）", "东边"], "answer": 0, "explain": "“东”名词作状语，意为“向东、往东”。孔子向东游历。"}, {"tag": "字词释义", "q": "“见两小儿辩斗”中“辩斗”的意思是？", "options": ["争论", "打斗", "辩解", "比赛"], "answer": 0, "explain": "“辩斗”意为“辩论、争论”。见到两个小孩在争辩。"}, {"tag": "字词释义", "q": "“问其故”中“故”的意思是？", "options": ["原因", "故事", "所以", "旧"], "answer": 0, "explain": "“故”意为“原因”。问他们争辩的原因。"}, {"tag": "字词释义", "q": "“我以日始出时去人近”中“以”的意思是？", "options": ["认为", "用来", "因为", "可以"], "answer": 0, "explain": "“以”意为“认为”。我认为太阳刚升起时距离人近。"}, {"tag": "字词释义", "q": "“日始出时去人近”中“去”的意思是？", "options": ["距离", "离开", "去除", "过去"], "answer": 0, "explain": "“去”意为“距离”。太阳刚升起时距离人近。"}, {"tag": "字词释义", "q": "“及日中则如盘盂”中“及”的意思是？", "options": ["到", "以及", "及时", "来得及"], "answer": 0, "explain": "“及”意为“到、到了”。等到正午就像盘子一样小。"}, {"tag": "字词释义", "q": "“如探汤”中“汤”的意思是？", "options": ["热水", "菜汤", "茶水", "汤药"], "answer": 0, "explain": "“汤”是古今异义词，意为“热水”。像把手伸进热水里一样热。"}, {"tag": "字词释义", "q": "“孔子不能决也”中“决”的意思是？", "options": ["判断", "决定", "决战", "决心"], "answer": 0, "explain": "“决”意为“判断、决断”。孔子不能判断谁对谁错。"}, {"tag": "字词释义", "q": "“孰(shú)为汝多知乎”中“孰(shú)”的意思是？", "options": ["谁", "什么", "为什么", "怎么"], "answer": 0, "explain": "“孰”读shú，意为“谁”。谁说你智慧多呢？"}, {"tag": "字词释义", "q": "“孰为汝多知乎”中“为”的读音和意思是？", "options": ["wèi，同“谓”，说", "wéi，为了", "wèi，因为", "wéi，成为"], "answer": 0, "explain": "“为”读wèi，同“谓”，意为“说”。谁说你知道得多呢？"}, {"tag": "字词释义", "q": "“孰为汝多知乎”中“汝”的意思是？", "options": ["你", "我", "他", "大家"], "answer": 0, "explain": "“汝”意为“你”。谁说你智慧多呢？"}, {"tag": "字词释义", "q": "“孰为汝多知乎”中“知”的读音和意思是？", "options": ["zhì，同“智”，智慧", "zhī，知道", "zhī，知识", "zhì，知觉"], "answer": 0, "explain": "“知”读zhì，同“智”，意为“智慧”。谁说你智慧多呢？"}], "《咏雪》": [{"tag": "字词释义", "q": "“寒雪日内集”中“内集”的意思是？", "options": ["内部集会", "把家人聚集在一起", "在室内集中", "内部收集"], "answer": 1, "explain": "“内集”意为“把家人聚集在一起”，“内”指家人。"}, {"tag": "字词释义", "q": "“与儿女讲论文义”中“儿女”的意思是？", "options": ["儿子和女儿", "子侄辈（泛指家中晚辈）", "儿子", "女儿"], "answer": 1, "explain": "课下注释：“儿女”指“子侄辈”，即家中晚辈。"}, {"tag": "字词释义", "q": "“俄而雪骤”中“俄而”的意思是？", "options": ["突然", "不久", "渐渐地", "慢慢地"], "answer": 1, "explain": "“俄而”表示时间短暂，意为“不久，一会儿”。"}, {"tag": "字词释义", "q": "“俄而雪骤”中“骤”的意思是？", "options": ["快速", "急", "突然", "奔跑"], "answer": 1, "explain": "“骤”此处意为“急”，指雪下得又大又急。"}, {"tag": "字词释义", "q": "“公欣然曰”中“欣然”的意思是？", "options": ["高兴的样子", "生气地", "平静地", "严肃地"], "answer": 0, "explain": "“欣然”意为“高兴的样子”。“然”是词尾，表示“……的样子”。"}, {"tag": "字词释义", "q": "“白雪纷纷何所似”中“何所似”的意思是？", "options": ["像什么", "为什么相似", "多么相似", "怎样相似"], "answer": 0, "explain": "“何所似”即“像什么”，“何”为疑问代词“什么”。"}, {"tag": "字词释义", "q": "“撒盐空中差可拟”中“差可拟”的意思是？", "options": ["大体上可以比拟", "差别很大", "差一点就能比", "差别可以忽略"], "answer": 0, "explain": "课下注释：“差可拟”意为“大体上可以比拟”。"}, {"tag": "字词释义", "q": "“未若柳絮因风起”中“未若”的意思是？", "options": ["比不上", "不像", "没有像", "未能"], "answer": 0, "explain": "“未若”意为“比不上”（未=不，若=比得上）。谢道韫说：比不上比作柳絮乘风飞起。"}, {"tag": "字词释义", "q": "“未若柳絮因风起”中“因”的意思是？", "options": ["因为", "乘", "原因", "顺着"], "answer": 1, "explain": "“因”在此处意为“乘、趁”，即“柳絮趁着风势飞起”。"}, {"tag": "字词释义", "q": "“即公大兄无奕女”中“即”的意思是？", "options": ["立即", "就是", "既然", "即使"], "answer": 1, "explain": "“即”意为“就是”。"}, {"tag": "内容理解", "q": "谢太傅对两个比喻的反应是——", "options": ["未明确表态", "「大笑乐」，非常高兴", "比较后认为柳絮更好", "两个都否定了"], "answer": 1, "explain": "文中写道“公大笑乐”，含蓄地表现了他对谢道韫的回答更为欣赏。"}, {"tag": "内容理解", "q": "文章最后一句交代谢道韫的身份，作者的用意是？", "options": ["补充说明家庭关系", "暗示对谢道韫才气的赞赏", "介绍王凝之的背景", "交待故事结局"], "answer": 1, "explain": "末句含蓄表达了作者对谢道韫咏絮之才的赞赏。"}, {"tag": "内容理解", "q": "谢太傅对于两个比喻，只是“大笑乐”而未明确评判优劣，这样写的好处是？", "options": ["说明谢太傅也不知道哪个更好", "含蓄地让读者自行品味高下，使文章余味无穷", "说明谢太傅两种比喻都不满意", "为了增加故事的悬念"], "answer": 1, "explain": "谢安“大笑乐”而未直接评判，让读者在对比中自己体会谢道韫的妙处，含蓄隽永。"}, {"tag": "句子理解", "q": "“撒盐空中”作比喻，主要抓住了雪的什么特点？", "options": ["轻盈飘逸", "颜色洁白和颗粒感", "冰冷刺骨", "纷纷扬扬"], "answer": 1, "explain": "“撒盐空中”抓住了雪的颜色洁白和如盐粒般的质感。"}, {"tag": "句子理解", "q": "“柳絮因风起”作比喻，主要抓住了雪的什么特点？", "options": ["颜色洁白", "轻盈飘逸、随风飞扬", "寒冷", "晶莹剔透"], "answer": 1, "explain": "“柳絮因风起”写出了雪花轻盈飘逸的姿态，意境更胜一筹。"}, {"tag": "句子理解", "q": "以下对两个比喻的赏析，不正确的是？", "options": [], "answer": 2, "explain": "“柳絮因风起”以春景喻冬景，正因其巧妙而备受推崇。"}, {"tag": "综合", "q": "后人常用“咏絮之才”来赞美什么？", "options": ["擅长写诗的人", "有文才的女子", "擅长画画的人", "善于辩论的人"], "answer": 1, "explain": "“咏絮之才”典出谢道韫咏雪之事，后世用来赞誉有文学才华的女子。"}], "《陈太丘与友期行》": [{"tag": "字词释义", "q": "“陈太丘与友期行”中“期”的意思是？", "options": ["约定", "期限", "期望", "日期"], "answer": 0, "explain": "“期”意为“约定”。陈太丘和友人约定同行。"}, {"tag": "字词释义", "q": "“太丘舍去”中“舍”的意思是？", "options": ["舍弃", "房舍", "施舍", "舍不得"], "answer": 0, "explain": "“舍”意为“舍弃、丢下”。陈太丘丢下（友人）离开了。"}, {"tag": "字词释义", "q": "“太丘舍去”中“去”的意思是？", "options": ["离开", "距离", "去除", "过去"], "answer": 0, "explain": "“去”意为“离开”。陈太丘丢下（友人）离开了。（注意：《两小儿辩日》中“去”是“距离”义，此处是“离开”义。）"}, {"tag": "字词释义", "q": "“去后乃至”中“乃”的意思是？", "options": ["才", "于是", "竟然", "你的"], "answer": 0, "explain": "“乃”意为“才”。太丘走后友人才到。"}, {"tag": "字词释义", "q": "“门外戏”中“戏”的意思是？", "options": ["玩耍", "戏曲", "戏弄", "演戏"], "answer": 0, "explain": "“戏”意为“玩耍、游戏”。元方在门外玩耍。"}, {"tag": "字词释义", "q": "“尊君在不”中“尊君”的意思是？", "options": ["对别人父亲的尊称", "对人谦称自己的父亲", "尊敬的君主", "年长的君子"], "answer": 0, "explain": "“尊君”是对别人父亲的尊称（您父亲）。“家君”才是对人谦称自己的父亲。"}, {"tag": "字词释义", "q": "“尊君在不”中“不”的读音和意思是？", "options": ["fǒu，同“否”，表示疑问", "bù，不，否定", "fǒu，否定", "bù，没有"], "answer": 0, "explain": "“不”读fǒu，同“否”，用在句末表示疑问。你父亲在吗？"}, {"tag": "字词释义", "q": "“相委而去”中“委”的意思是？", "options": ["丢下", "委托", "委屈", "委员"], "answer": 0, "explain": "“委”意为“丢下、舍弃”。却丢下我离开了。"}, {"tag": "字词释义", "q": "“下车引之”中“引”的意思是？", "options": ["拉", "引导", "引用", "吸引"], "answer": 0, "explain": "“引”意为“拉、牵”。友人下车想拉元方（表示歉意）。"}, {"tag": "字词释义", "q": "“元方入门不顾”中“顾”的意思是？", "options": ["回头看", "照顾", "探望", "理睬"], "answer": 0, "explain": "“顾”意为“回头看”。元方头也不回地走进门去。"}], "《论语》十二章": [{"tag": "字词释义", "q": "“学而时习之”中“时”的意思是？", "options": ["按时", "时间", "时常", "时候"], "answer": 0, "explain": "“时”名词作状语，意为“按时”。学习了（知识）然后按时温习。"}, {"tag": "字词释义", "q": "“学而时习之”中“习”的意思是？", "options": ["温习", "学习", "习惯", "练习"], "answer": 0, "explain": "“习”意为“温习、复习”。按时温习所学的知识。"}, {"tag": "字词释义", "q": "“不亦说乎”中“说”的读音和意思是？", "options": ["yuè，愉快", "shuō，说话", "shuì，劝说", "yuè，说教"], "answer": 0, "explain": "“说”读yuè，同“悦”，意为“愉快”。不也是令人愉快的吗？"}, {"tag": "字词释义", "q": "“人不知而不愠”中“愠”的意思是？", "options": ["恼怒", "温暖", "蕴含", "怨恨"], "answer": 0, "explain": "“愠”意为“恼怒”。别人不理解自己也不恼怒。"}, {"tag": "字词释义", "q": "“吾日三省吾身”中“日”的意思是？", "options": ["每天", "太阳", "日子", "一日"], "answer": 0, "explain": "“日”名词作状语，意为“每天”。我每天多次反省自己。"}, {"tag": "字词释义", "q": "“吾日三省吾身”中“三”的意思是？", "options": ["多次", "三次", "三件", "第三"], "answer": 0, "explain": "“三”在古汉语中常表“多次”，是虚指，不是确数。"}, {"tag": "字词释义", "q": "“吾日三省吾身”中“身”的意思是？", "options": ["自己", "身体", "身份", "一生"], "answer": 0, "explain": "“身”意为“自己”。我每天多次反省自己。"}, {"tag": "字词释义", "q": "“为人谋而不忠乎”中“忠”的意思是？", "options": ["尽心竭力", "忠心", "忠厚", "忠告"], "answer": 0, "explain": "“忠”意为“尽心竭力”。为别人谋划事情是否尽心竭力了？"}, {"tag": "字词释义", "q": "“传不习乎”中“传”的意思是？", "options": ["老师传授的知识", "传授", "传记", "传达"], "answer": 0, "explain": "“传”动词作名词，指“老师传授的知识”。老师传授的知识温习了吗？"}, {"tag": "字词释义", "q": "“吾十有五而志于学”中“有”的读音和意思是？", "options": ["yòu，同“又”", "yǒu，有无", "yòu，右边", "yǒu，拥有"], "answer": 0, "explain": "“有”读yòu，同“又”，用于整数和零数之间。“十有五”即十五岁。"}, {"tag": "字词释义", "q": "“吾十有五而志于学”中“志”的意思是？", "options": ["立志", "志向", "标志", "志愿"], "answer": 0, "explain": "“志”意为“立志”。我十五岁立志于学问。"}, {"tag": "字词释义", "q": "“三十而立”中“立”的意思是？", "options": ["立身", "站立", "建立", "立刻"], "answer": 0, "explain": "“立”意为“立身”，指能有所成就。三十岁能在社会上立足。"}, {"tag": "字词释义", "q": "“不逾矩”中“逾”的意思是？", "options": ["越过", "逾期", "更加", "剩余"], "answer": 0, "explain": "“逾”意为“越过”。却不越过规矩。"}, {"tag": "字词释义", "q": "“温故而知新”中“而”表示什么关系？", "options": ["顺承（然后）", "转折（却）", "并列（并且）", "修饰（地）"], "answer": 0, "explain": "“而”表顺承，意为“然后”。温习旧知识然后获得新理解。"}, {"tag": "字词释义", "q": "“学而不思则罔”中“罔”的意思是？", "options": ["迷惑", "欺骗", "枉费", "冤枉"], "answer": 0, "explain": "“罔”意为“迷惑”，感到迷茫而无所得。只学习却不思考就会迷惑。"}, {"tag": "字词释义", "q": "“思而不学则殆”中“而”表示什么关系？", "options": ["转折（却）", "顺承（然后）", "并列（并且）", "修饰（地）"], "answer": 0, "explain": "“而”表转折，意为“却”。只思考却不学习就会疑惑。"}, {"tag": "字词释义", "q": "“思而不学则殆”中“殆”的意思是？", "options": ["疑惑", "危险", "几乎", "大概"], "answer": 0, "explain": "“殆”意为“疑惑”。只思考却不学习就会疑惑而无所适从。"}, {"tag": "字词释义", "q": "“人不堪其忧”中“堪”的意思是？", "options": ["能忍受", "难以", "可以", "胜任"], "answer": 0, "explain": "“堪”意为“能忍受”。别人都无法忍受这种贫苦的忧愁。"}, {"tag": "字词释义", "q": "“好之者不如乐之者”中“乐”的意思是？", "options": ["以……为乐", "快乐", "音乐", "乐趣"], "answer": 0, "explain": "“乐”意动用法，意为“以……为乐”。喜爱道理的人不如以践行道理为乐的人。"}, {"tag": "字词释义", "q": "“饭疏食”中“饭”的意思是？", "options": ["吃", "米饭", "粮食", "厨师"], "answer": 0, "explain": "“饭”名词作动词，意为“吃”。吃粗劣的食物。"}, {"tag": "字词释义", "q": "“饭疏食”中“疏食”的意思是？", "options": ["粗粮", "菜和饭", "稀疏食物", "剩饭"], "answer": 0, "explain": "“疏食”意为“粗粮、粗劣的食物”。"}, {"tag": "字词释义", "q": "“于我如浮云”中“于”的意思是？", "options": ["对于", "在", "到", "被"], "answer": 0, "explain": "“于”意为“对于”。对我而言就像浮云一样。"}, {"tag": "字词释义", "q": "“三人行”中“三”的意思是？", "options": ["几个", "三个", "三次", "第三"], "answer": 0, "explain": "“三”在古汉语中常表“多”，是约数，不是确数。几个人同行。"}, {"tag": "字词释义", "q": "“必有我师焉”中“焉”的意思是？", "options": ["在其中", "哪里", "怎么", "语气词"], "answer": 0, "explain": "“焉”是兼词，相当于“于此”，意为“在其中”。其中必定有值得我学习的人。"}, {"tag": "字词释义", "q": "“逝者如斯夫”中“夫”的意思是？", "options": ["表感叹", "丈夫", "夫子", "夫人"], "answer": 0, "explain": "“夫”是句末语气词，表示感叹。消逝的事物就像这流水一样啊。"}, {"tag": "字词释义", "q": "“三军可夺帅也”中“夺”的意思是？", "options": ["改变", "夺取", "抢夺", "剥夺"], "answer": 0, "explain": "“夺”意为“改变”。军队可以被夺走主帅（改变主帅），但普通人的志向不可改变。"}, {"tag": "字词释义", "q": "“匹夫不可夺志也”中“匹夫”的意思是？", "options": ["平民", "莽夫", "武夫", "一个人"], "answer": 0, "explain": "“匹夫”意为“平民、普通人”。普通百姓的志向无法被强行改变。"}, {"tag": "字词释义", "q": "“博学而笃志”中“笃志”的意思是？", "options": ["志向坚定", "诚实守信", "专心学习", "志向远大"], "answer": 0, "explain": "“笃”意为“坚定”，“笃志”即志向坚定。广泛学习且志向坚定。"}, {"tag": "字词释义", "q": "“切问而近思”中“切”的意思是？", "options": ["恳切", "急切", "确切", "密切"], "answer": 0, "explain": "“切”意为“恳切”。恳切地发问且贴近现实思考。"}], "《诫子书》": [{"tag": "字词释义", "q": "“夫君子之行”中“夫”的意思是？", "options": ["句首发语词，无实义", "丈夫", "夫子", "夫人"], "answer": 0, "explain": "“夫”是句首发语词，用在句首表示要发议论，无实义。"}, {"tag": "字词释义", "q": "“静以修身”中“以”的意思是？", "options": ["来，用来（表目的）", "因为", "认为", "可以"], "answer": 0, "explain": "“以”是连词，表目的，意为“来、用来”。屏除杂念来修养身心。"}, {"tag": "字词释义", "q": "“非淡泊无以明志”中“明”的意思是？", "options": ["明确", "明亮", "明白", "明智"], "answer": 0, "explain": "“明”形容词作动词，意为“明确、坚定”（使……明确）。不内心恬淡就无法明确志向。"}, {"tag": "字词释义", "q": "“非宁静无以致远”中“致远”的意思是？", "options": ["达到远大目标", "到达远方", "走向远方", "远大志向"], "answer": 0, "explain": "“致”是“达到”，“远”指远大目标（形容词作名词）。“致远”即达到远大目标。"}, {"tag": "字词释义", "q": "“非学无以广才”中“广”的意思是？", "options": ["增长", "广大", "广泛", "宽广"], "answer": 0, "explain": "“广”形容词作动词，意为“增长、扩充”（使……增长）。不学习就无法增长才干。"}, {"tag": "字词释义", "q": "“淫慢则不能励精”中“淫慢”的意思是？", "options": ["放纵懈怠", "过于懈怠", "懒惰懈怠", "放松傲慢"], "answer": 0, "explain": "“淫慢”意为“放纵懈怠”。“淫”是放纵，“慢”是懈怠。"}, {"tag": "字词释义", "q": "“淫慢则不能励精”中“励精”的意思是？", "options": ["振奋精神", "鼓励精神", "勉励精神", "勤奋努力"], "answer": 0, "explain": "“励精”意为“振奋精神”。“励”是振奋，“精”指精神。"}, {"tag": "字词释义", "q": "“险躁则不能治性”中“险躁”的意思是？", "options": ["轻薄浮躁", "危险急躁", "谨慎小心", "缓慢迟钝"], "answer": 0, "explain": "“险躁”意为“轻薄浮躁”。“险”是轻薄，“躁”是浮躁。"}, {"tag": "字词释义", "q": "“险躁则不能治性”中“治”的意思是？", "options": ["修养", "治理", "治疗", "整治"], "answer": 0, "explain": "“治”意为“修养”。“治性”即修养性情。"}, {"tag": "字词释义", "q": "“年与时驰”中“驰”的意思是？", "options": ["疾速逝去", "奔驰", "驰骋", "松弛"], "answer": 0, "explain": "“驰”本义是奔驰，这里意为“疾速逝去”。年纪随同时光疾速逝去。"}, {"tag": "字词释义", "q": "“遂成枯落”中“枯落”的意思是？", "options": ["枯枝落叶，比喻年老志衰", "枯萎凋落", "落叶", "干枯"], "answer": 0, "explain": "“枯落”指枯枝落叶，这里比喻人年老志衰、没有用处。"}, {"tag": "字词释义", "q": "“多不接世”中“接世”的意思是？", "options": ["接触社会，为社会所用", "接受现实", "连接世界", "继承传统"], "answer": 0, "explain": "“接世”意为“接触社会，为社会所用”。大多对社会没有贡献。"}, {"tag": "字词释义", "q": "“将复何及”中“及”的意思是？", "options": ["来得及", "以及", "到达", "及格"], "answer": 0, "explain": "“及”意为“来得及”。到那时悔恨又怎么来得及！"}], "《狼》": [{"tag": "字词释义", "q": "“止有剩骨”中“止”的意思是？", "options": ["只，仅", "停止", "阻止", "制止"], "answer": 0, "explain": "“止”意为“只、仅”。担子里只剩下骨头。"}, {"tag": "字词释义", "q": "“缀行甚远”中“缀行”的意思是？", "options": ["紧跟着走", "结伴行走", "慢慢行走", "绕道行走"], "answer": 0, "explain": "“缀行”意为“紧跟着走”。“缀”是连接、紧跟的意思。"}, {"tag": "字词释义", "q": "“投以骨”是什么特殊句式？", "options": ["状语后置（以骨投之）", "宾语前置", "省略句", "判断句"], "answer": 0, "explain": "“投以骨”是状语后置句，正常语序为“以骨投之”，即把骨头投给（狼）。"}, {"tag": "字词释义", "q": "“而两狼之并驱如故”中“之”的作用是？", "options": ["取消句子独立性", "结构助词，的", "代词，它", "动词，去"], "answer": 0, "explain": "“之”用在主谓之间，取消句子独立性，无实义。"}, {"tag": "字词释义", "q": "“并驱如故”中“如故”的意思是？", "options": ["像原来一样", "如同故人", "按照旧例", "装作没事"], "answer": 0, "explain": "“如故”意为“像原来一样”。两只狼像原来一样一起追赶。"}, {"tag": "字词释义", "q": "“屠大窘”中“窘”的意思是？", "options": ["困迫", "贫穷", "害怕", "着急"], "answer": 0, "explain": "“窘”意为“处境困迫、为难”。屠户十分困迫。"}, {"tag": "字词释义", "q": "“恐前后受其敌”中“敌”的意思是？", "options": ["攻击", "敌人", "敌对", "抵抗"], "answer": 0, "explain": "“敌”名词作动词，意为“攻击”。担心前后受到狼的攻击。"}, {"tag": "字词释义", "q": "“顾野有麦场”中“顾”的意思是？", "options": ["看", "照顾", "回顾", "探望"], "answer": 0, "explain": "“顾”意为“看”。（屠户）看见田野里有麦场。"}, {"tag": "字词释义", "q": "“场主积薪其中”中“薪”的意思是？", "options": ["柴草", "薪水", "植被", "木料"], "answer": 0, "explain": "“薪”意为“柴草”。场主在麦场中堆了柴草。"}, {"tag": "字词释义", "q": "“屠乃奔倚其下”中“乃”的意思是？", "options": ["于是", "才", "竟然", "你的"], "answer": 0, "explain": "“乃”意为“于是、就”。屠户于是跑过去倚在柴堆下。"}, {"tag": "字词释义", "q": "“弛担持刀”中“弛”的意思是？", "options": ["放下", "松弛", "放松", "奔驰"], "answer": 0, "explain": "“弛”意为“解除、卸下”，这里指放下担子。放下担子拿起刀。"}, {"tag": "字词释义", "q": "“狼不敢前”中“前”的意思是？", "options": ["上前", "前方", "先前", "前进"], "answer": 0, "explain": "“前”名词作动词，意为“上前”。狼不敢上前。"}, {"tag": "字词释义", "q": "“少时”中“少”的读音是？", "options": ["shāo", "sháo", "shǎo", "shào"], "answer": 2, "explain": "“少时”的“少”读shǎo，意为“一会儿、时间短暂”。"}, {"tag": "字词释义", "q": "“一狼径去”中“径”的意思是？", "options": ["径直", "直径", "小路", "路径"], "answer": 0, "explain": "“径”意为“径直”。一只狼径直离开。"}, {"tag": "字词释义", "q": "“其一犬坐于前”中“犬”的意思是？", "options": ["像狗一样", "狗", "犬子", "猎犬"], "answer": 0, "explain": "“犬”名词作状语，意为“像狗一样”。另一只像狗一样坐在前面。"}, {"tag": "字词释义", "q": "“目似瞑”中“瞑”的意思是？", "options": ["闭上眼睛", "昏暗", "睡觉", "困倦"], "answer": 0, "explain": "“瞑”意为“闭上眼睛”。眼睛好像闭着。"}, {"tag": "字词释义", "q": "“意暇甚”中“暇”的意思是？", "options": ["从容", "空闲", "假日", "休息"], "answer": 0, "explain": "“暇”意为“悠闲、从容”。神情悠闲极了。"}, {"tag": "字词释义", "q": "“屠暴起”中“暴”的意思是？", "options": ["突然", "暴躁", "暴力", "暴露"], "answer": 0, "explain": "“暴”意为“突然”。屠户突然跳起。"}, {"tag": "字词释义", "q": "“方欲行”中“方”的意思是？", "options": ["正要", "方向", "方法", "方才"], "answer": 0, "explain": "“方”意为“正、正要”。正要走。"}, {"tag": "字词释义", "q": "“一狼洞其中”中“洞”的意思是？", "options": ["打洞", "洞穴", "洞口", "洞察"], "answer": 0, "explain": "“洞”名词作动词，意为“打洞”。一只狼正在其中打洞。"}, {"tag": "字词释义", "q": "“意将隧入”中“隧”的意思是？", "options": ["从隧道进入", "隧道", "地道", "挖洞"], "answer": 0, "explain": "“隧”名词作状语，意为“从隧道（通道）进入”。想钻洞从背后攻击。"}, {"tag": "字词释义", "q": "“屠自后断其股”中“股”的意思是？", "options": ["大腿", "屁股", "股票", "股份"], "answer": 0, "explain": "“股”是古今异义词，这里意为“大腿”。屠户从后面砍断它的大腿。"}, {"tag": "字词释义", "q": "“乃悟前狼假寐”中“乃”的意思是？", "options": ["才", "于是", "竟然", "你的"], "answer": 0, "explain": "“乃”意为“才”。（屠户）才明白前狼假装睡觉。"}, {"tag": "字词释义", "q": "“盖以诱敌”中“盖”的意思是？", "options": ["原来是", "大概是", "应该是", "居然是"], "answer": 0, "explain": "“盖”意为“原来是”，表示推断、说明原因。原来是用来诱惑敌人。"}, {"tag": "字词释义", "q": "“禽兽之变诈几何哉”中“几何”的意思是？", "options": ["多少", "几何学", "多久", "几个"], "answer": 0, "explain": "“几何”意为“多少”。禽兽的诡诈能有多少呢？"}, {"tag": "字词释义", "q": "“止增笑耳”中“耳”的意思是？", "options": ["罢了", "耳朵", "耳目", "听闻"], "answer": 0, "explain": "“耳”是语气词，意为“罢了”。只是增加笑料罢了。"}], "《穿井得一人》": [{"tag": "字词释义", "q": "“家无井而出溉汲”中“而”表示什么关系？", "options": ["顺承（然后）", "转折（却）", "并列（并且）", "修饰（地）"], "answer": 0, "explain": "“而”表顺承，意为“然后”。家里没有井，要到外面打水浇田。"}, {"tag": "字词释义", "q": "“及其家穿井”中“及”的意思是？", "options": ["等到", "以及", "到达", "来得及"], "answer": 0, "explain": "“及”意为“等到”。等到他家里打了井。"}, {"tag": "字词释义", "q": "“有闻而传之者”中“而”表示什么关系？", "options": ["顺承（然后）", "转折（却）", "并列（并且）", "修饰（地）"], "answer": 0, "explain": "“而”表顺承，意为“然后”。有听到（传闻）然后传播（它）的人。"}, {"tag": "字词释义", "q": "“国人道之”中“国人”的意思是？", "options": ["国都的居民", "宋国人", "全国人民", "国家的人"], "answer": 0, "explain": "“国人”意为“国都的居民”。国都的居民都谈论这件事。"}, {"tag": "字词释义", "q": "“闻之于宋君”是什么特殊句式？", "options": ["状语后置", "宾语前置", "判断句", "省略句"], "answer": 0, "explain": "“闻之于宋君”是状语后置句，正常语序为“于宋君闻之”，即把这件事报告给宋国国君。"}, {"tag": "字词释义", "q": "“得一人之使”中“使”的意思是？", "options": ["使唤", "使者", "让", "即使"], "answer": 0, "explain": "“使”意为“使唤、使用（劳动力）”。得到一个人使唤（的劳动力）。"}, {"tag": "字词释义", "q": "“求闻之若此”中“若”的意思是？", "options": ["像", "如果", "假如", "比得上"], "answer": 0, "explain": "“若”意为“像”。寻求传闻像这样（处理）。"}, {"tag": "字词释义", "q": "“不若无闻也”中“若”的意思是？", "options": ["比得上", "像", "如果", "假如"], "answer": 0, "explain": "“若”意为“比得上”。“不若”即不如。不如没有听到（传闻）啊。"}, {"tag": "内容理解", "q": "这则寓言告诉我们的道理是？", "options": ["对待传闻要仔细辨别，不能轻信、以讹传讹", "打井可以节省人力", "宋国人都喜欢传闲话", "丁家人口多才打井"], "answer": 0, "explain": "“穿井得一人”的传闻以讹传讹，告诉我们：对待传闻要仔细辨别，不能轻信、更不能以讹传讹。"}, {"tag": "内容理解", "q": "下列句子中不是倒装句的是？", "options": ["吾穿井得一人", "闻之于宋君", "宋君令人问之于丁氏", "非得一人于井中也"], "answer": 0, "explain": "“闻之于宋君”（于宋君闻之）、“宋君令人问之于丁氏”（于丁氏问之）、“非得一人于井中也”（于井中得一人）都是状语后置；“吾穿井得一人”是正常语序。"}], "《杞人忧天》": [{"tag": "字词释义", "q": "“身亡所寄”中“身”的意思是？", "options": ["自己", "身体", "身份", "一生"], "answer": 0, "explain": "“身”意为“自己”。（觉得）自己无处安身。"}, {"tag": "字词释义", "q": "“又有忧彼之所忧者”中“忧”的意思是？", "options": ["担忧", "忧愁", "忧伤", "忧患"], "answer": 0, "explain": "“忧”意为“担忧”。又有为那（杞人）所担忧的事而担忧的人。"}, {"tag": "字词释义", "q": "“因往晓之”中“因”的意思是？", "options": ["于是", "因为", "原因", "因此"], "answer": 0, "explain": "“因”意为“于是、就”。于是前去开导他。"}, {"tag": "字词释义", "q": "“因往晓之”中“晓”的意思是？", "options": ["开导", "知道", "拂晓", "天亮"], "answer": 0, "explain": "“晓”意为“告知、开导”（使……明白）。于是前去开导他。"}, {"tag": "字词释义", "q": "“亡处亡气”中“亡”的读音和意思是？", "options": ["wú，同“无”，没有", "wáng，死亡", "wáng，逃亡", "wú，忘记"], "answer": 0, "explain": "“亡”读wú，同“无”，意为“没有”。没有一处没有气。"}, {"tag": "字词释义", "q": "“若屈伸呼吸”中“若”的意思是？", "options": ["你", "像", "比得上", "如果"], "answer": 0, "explain": "“若”意为“你”（代词）。你屈伸四肢、呼吸。"}, {"tag": "字词释义", "q": "“奈何忧崩坠乎”中“奈何”的意思是？", "options": ["为什么", "怎么办", "无可奈何", "竟然"], "answer": 0, "explain": "“奈何”意为“为什么、怎么”。为什么担忧天会崩塌坠落呢？"}, {"tag": "字词释义", "q": "“天果积气”中“果”的意思是？", "options": ["果真", "果实", "结果", "如果"], "answer": 0, "explain": "“果”意为“果真、确实”。天果真是聚积的气体。"}, {"tag": "字词释义", "q": "“不当坠耶”中“当”的意思是？", "options": ["应当", "会", "担当", "当时"], "answer": 0, "explain": "“当”意为“应当”。天果真是聚积的气体，不应当掉下来吗？"}, {"tag": "字词释义", "q": "“只使坠”中“只使”的意思是？", "options": ["纵使", "只让", "只要", "假如"], "answer": 0, "explain": "“只使”意为“纵使、即使”。纵使坠落。"}, {"tag": "字词释义", "q": "“亦不能有所中伤”中“中伤”的意思是？", "options": ["伤害", "诬陷", "妨碍", "破坏"], "answer": 0, "explain": "“中伤”是古今异义词，这里意为“伤害”（被击中而受伤），不是现代汉语的“诬陷”。"}, {"tag": "字词释义", "q": "“其人舍然大喜”中“舍然”的意思是？", "options": ["消除疑虑的样子", "舍弃的样子", "忽然明白", "安然无恙"], "answer": 0, "explain": "“舍”同“释”，“舍然”即释然，意为“消除疑虑的样子”。那（杞）人消除疑虑，非常高兴。"}], "《孙权劝学》": [{"tag": "字词释义", "q": "“权谓吕蒙曰”中“谓”的意思是？", "options": ["对……说", "认为", "叫做", "称谓"], "answer": 0, "explain": "“谓”意为“对……说”。孙权对吕蒙说。"}, {"tag": "字词释义", "q": "“卿(qīng)今当涂掌事”中“卿(qīng)”的意思是？", "options": ["君对臣的爱称（你）", "臣对君的敬称", "宰相", "夫妻互称"], "answer": 0, "explain": "“卿”是古代君对臣的爱称，这里相当于“你”。"}, {"tag": "字词释义", "q": "“蒙辞以军中多务”中“辞”的意思是？", "options": ["推辞", "言辞", "告别", "口才"], "answer": 0, "explain": "“辞”意为“推辞、推托”。吕蒙用军中事务多来推辞。"}, {"tag": "字词释义", "q": "“孤岂欲卿治经为博士邪”中“孤”的意思是？", "options": ["古代王侯的自称", "孤独", "孤儿", "孤单"], "answer": 0, "explain": "“孤”是古代王侯的自称，相当于“我”。"}, {"tag": "字词释义", "q": "“岂欲卿治经为博士邪”中“治经”的意思是？", "options": ["研究儒家经典", "管理经书", "整理经典", "诵读经文"], "answer": 0, "explain": "“治经”意为“研究儒家经典”。难道想要你研究儒家经典吗？"}, {"tag": "字词释义", "q": "“为博士邪”中“博士”的意思是？", "options": ["专掌经学传授的学官", "学位称号", "博学的人", "博士研究生"], "answer": 0, "explain": "“博士”是古今异义词，这里指专掌经学传授的学官。"}, {"tag": "字词释义", "q": "“但当涉猎”中“但”的意思是？", "options": ["只", "但是", "竟然", "况且"], "answer": 0, "explain": "“但”意为“只、只是”（古今异义，今义“但是”）。只是应当粗略地阅读。"}, {"tag": "字词释义", "q": "“但当涉猎”中“涉猎”的意思是？", "options": ["粗略地阅读", "深入研读", "涉水打猎", "广泛猎取"], "answer": 0, "explain": "“涉猎”意为“粗略地阅读”。只是应当粗略地阅读。"}, {"tag": "字词释义", "q": "“卿言多务孰若孤”中“孰”的意思是？", "options": ["谁", "什么", "为什么", "怎么"], "answer": 0, "explain": "“孰”意为“谁”。你说事务多，谁比得上我呢？"}, {"tag": "字词释义", "q": "“孰若孤”中“若”的意思是？", "options": ["比得上", "像", "如果", "你"], "answer": 0, "explain": "“若”意为“比得上”。“孰若”即哪里比得上。"}, {"tag": "字词释义", "q": "“自以为大有所益”中“以为”的意思是？", "options": ["认为", "作为", "因为", "可以"], "answer": 0, "explain": "“以为”意为“认为”。自己认为大有好处。"}, {"tag": "字词释义", "q": "“蒙乃始就学”中“乃”的意思是？", "options": ["于是", "才", "竟然", "你的"], "answer": 0, "explain": "“乃”意为“于是、就”。吕蒙于是开始学习。"}, {"tag": "字词释义", "q": "“及鲁肃过寻阳”中“及”的意思是？", "options": ["等到", "以及", "到达", "及时"], "answer": 0, "explain": "“及”意为“到了……的时候”（等到）。等到鲁肃经过寻阳。"}, {"tag": "字词释义", "q": "“卿今者才略”中“才略”的意思是？", "options": ["才干谋略", "聪明才智", "远大志向", "文学才华"], "answer": 0, "explain": "“才略”意为“才干和谋略”。以你现在的才干谋略来看。"}, {"tag": "字词释义", "q": "“即更(gēng)刮目相待”中“更(gēng)”的意思是？", "options": ["另外", "更加", "更换", "反而"], "answer": 0, "explain": "“更”读gēng，意为“另、另外”（重新）。就要另外用新的眼光看待。"}, {"tag": "字词释义", "q": "“肃遂拜蒙母”中“遂”的意思是？", "options": ["于是", "终于", "顺遂", "满足"], "answer": 0, "explain": "“遂”意为“于是、就”。鲁肃于是拜见吕蒙的母亲。"}, {"tag": "字词释义", "q": "“蒙辞以军中多务”是什么特殊句式？", "options": ["状语后置", "宾语前置", "省略句", "判断句"], "answer": 0, "explain": "“蒙辞以军中多务”是状语后置句，正常语序为“蒙以军中多务辞”，即吕蒙用军中事务多来推辞。"}, {"tag": "内容理解", "q": "“卿言多务孰若孤孤常读书自以为大有所益”断句正确的一项是？", "options": ["卿言多务，孰若孤？孤常读书，自以为大有所益。", "卿言多务孰，若孤孤常读书，自以为大有所益。", "卿言多务孰若孤孤，常读书自以为，大有所益。", "卿言多务，孰若孤孤，常读书自，以为大有所益。"], "answer": 0, "explain": "正确断句为“卿言多务，孰若孤？孤常读书，自以为大有所益。”意思是：你说事务多，谁比得上我呢？我经常读书，自己认为大有好处。"}], "《卖油翁》": [{"tag": "字词释义", "q": "“陈康肃公善射”中“善”的意思是？", "options": ["擅长", "善良", "良好", "喜爱"], "answer": 0, "explain": "“善”意为“擅长”。陈康肃公擅长射箭。"}, {"tag": "字词释义", "q": "“公亦以此自矜”中“以”的意思是？", "options": ["凭借", "用来", "因为", "认为"], "answer": 0, "explain": "“以”意为“凭、凭借”。康肃公也凭这种本领自夸。"}, {"tag": "字词释义", "q": "“公亦以此自矜(jīn)”中“自矜”的意思是？", "options": ["自夸", "自尊", "自豪", "自卑"], "answer": 0, "explain": "“矜”读jīn，“自矜”意为“自夸”。康肃公也凭这种本领自夸。"}, {"tag": "字词释义", "q": "“尝射于家圃”中“尝”的意思是？", "options": ["曾经", "尝试", "品尝", "常常"], "answer": 0, "explain": "“尝”意为“曾经”。他曾经在自家的园子里射箭。"}, {"tag": "字词释义", "q": "“有卖油翁释担而立”中“释”的意思是？", "options": ["放下", "解释", "释放", "消除"], "answer": 0, "explain": "“释”意为“放下”。放下担子站在那里。"}, {"tag": "字词释义", "q": "“释担而立”中“而”表示什么关系？", "options": ["顺承（然后）", "转折（却）", "并列（并且）", "修饰（地）"], "answer": 0, "explain": "“而”表顺承，意为“然后”。放下担子然后站着。"}, {"tag": "字词释义", "q": "“睨(nì)之久而不去”中“睨”的意思是？", "options": ["斜着眼看", "正眼看", "闭着眼", "偷偷看"], "answer": 0, "explain": "“睨”读nì，意为“斜着眼看”。斜着眼睛看他射箭。"}, {"tag": "字词释义", "q": "“睨之久而不去”中“而”表示什么关系？", "options": ["顺承（然后）", "转折（却）", "并列（并且）", "修饰（地）"], "answer": 0, "explain": "“而”表顺承。斜着眼睛看了很久，没有离开。"}, {"tag": "字词释义", "q": "“睨之久而不去”中“去”的意思是？", "options": ["离开", "去除", "过去", "距离"], "answer": 0, "explain": "“去”意为“离开”。很久都没有离开。"}, {"tag": "字词释义", "q": "“但微颔之”中“但”的意思是？", "options": ["只", "但是", "竟然", "况且"], "answer": 0, "explain": "“但”意为“只、只是”。只是对此微微点头。"}, {"tag": "字词释义", "q": "“但微颔(hàn)之”中“颔”的意思是？", "options": ["点头", "下巴", "摇头", "低垂"], "answer": 0, "explain": "“颔”读hàn，意为“点头”。只是对此微微点头。"}, {"tag": "字词释义", "q": "“无他”中“无他”的意思是？", "options": ["没有别的奥妙", "没有别人", "没有其他办法", "没有别的意思"], "answer": 0, "explain": "“无他”意为“没有别的（奥妙）”。没有别的奥妙，只是手法熟练罢了。"}, {"tag": "字词释义", "q": "“但手熟尔”中“尔”的意思是？", "options": ["罢了", "你", "这样", "仍然"], "answer": 0, "explain": "“尔”同“耳”，是句末语气词，意为“罢了”。只是手法熟练罢了。"}, {"tag": "字词释义", "q": "“康肃忿然”中“然”的意思是？", "options": ["……的样子", "然而", "然后", "这样"], "answer": 0, "explain": "“然”是形容词词尾，意为“……的样子”。康肃公气愤的样子。"}, {"tag": "字词释义", "q": "“尔安敢轻吾射”中“尔”的意思是？", "options": ["你", "罢了", "这样", "我"], "answer": 0, "explain": "“尔”意为“你”。你怎么敢轻视我射箭的本领！"}, {"tag": "字词释义", "q": "“尔安敢轻吾射”中“安”的意思是？", "options": ["怎么", "安全", "安定", "安心"], "answer": 0, "explain": "“安”意为“怎么”。你怎么敢轻视我射箭的本领！"}, {"tag": "字词释义", "q": "“以我酌油知之”中“以”的意思是？", "options": ["凭借", "用来", "因为", "认为"], "answer": 0, "explain": "“以”意为“凭、凭借”。凭我倒油的经验懂得这个道理。"}, {"tag": "字词释义", "q": "“乃取一葫芦置于地”中“乃”的意思是？", "options": ["于是", "才", "竟然", "你的"], "answer": 0, "explain": "“乃”意为“于是、就”。于是拿出一个葫芦放在地上。"}, {"tag": "字词释义", "q": "“以钱覆其口”中“以”的意思是？", "options": ["用", "凭借", "用来", "认为"], "answer": 0, "explain": "“以”意为“用”。用一枚铜钱盖住葫芦的口。"}, {"tag": "字词释义", "q": "“徐以杓酌油沥之”中“徐”的意思是？", "options": ["慢慢地", "匆匆地", "轻轻地", "重重地"], "answer": 0, "explain": "“徐”意为“慢慢地”。慢慢地用勺子舀油滴入葫芦。"}, {"tag": "字词释义", "q": "“徐以杓(sháo)酌油沥之”中“杓”的意思是？", "options": ["同“勺”，勺子", "木桶", "器皿", "竹竿"], "answer": 0, "explain": "“杓”读sháo，同“勺”，意为“勺子”。慢慢地用勺子舀油。"}, {"tag": "字词释义", "q": "“康肃笑而遣之”中“遣”的意思是？", "options": ["打发", "派遣", "谴责", "惩罚"], "answer": 0, "explain": "“遣”意为“打发、让……走”。康肃公笑着让他走了。"}, {"tag": "字词释义", "q": "“尝射于家圃”是什么特殊句式？", "options": ["状语后置", "宾语前置", "定语后置", "主谓倒装"], "answer": 0, "explain": "“尝射于家圃”是状语后置句，正常语序为“尝于家圃射”，即曾经在自家的园子里射箭。"}, {"tag": "内容理解", "q": "下列句子中没有省略成分的是？", "options": ["汝亦知射乎", "但微颔之", "自钱孔入，而钱不湿", "尝射于家圃"], "answer": 0, "explain": "“但微颔之”省略主语“翁”，“自钱孔入”省略主语“油”，“尝射于家圃”省略主语“公”；“汝亦知射乎”主谓宾完整，没有省略。"}, {"tag": "内容理解", "q": "“陈康肃公善射当世无双公亦以此自矜”断句正确的一项是？", "options": ["陈康肃公善射，当世无双，公亦以此自矜。", "陈康肃公善射当世，无双公亦，以此自矜。", "陈康肃公善，射当世无双，公亦以此自矜。", "陈康肃公善射当世无双公，亦以此自矜。"], "answer": 0, "explain": "正确断句为“陈康肃公善射，当世无双，公亦以此自矜。”即陈康肃公擅长射箭，当世没有第二个人能比，他也凭此自夸。"}, {"tag": "内容理解", "q": "把“我亦无他，惟手熟尔。”翻译为“我也没有别的本事，手法熟练罢了。”是否正确？", "options": ["正确", "错误", "空", "空"], "answer": 1, "explain": "译文错误。“惟”意为“只、只是”，漏译了；“无他”应译“没有别的奥妙”。正确翻译为“我也没有别的奥妙，只是手法熟练罢了”。"}, {"tag": "内容理解", "q": "这则故事告诉我们的道理是？", "options": ["熟能生巧，本领再高也不应自夸", "射箭不如倒油", "卖油翁技艺更高超", "做事要抢先一步"], "answer": 0, "explain": "卖油翁以“酌油”技艺折服陈尧咨，告诉我们熟能生巧，即使本领再高也不应自夸。"}, {"tag": "内容理解", "q": "陈尧咨对卖油翁的态度前后有什么变化？", "options": ["从自矜、忿然到心服（笑而遣之）", "始终谦虚", "始终愤怒", "从佩服到轻视"], "answer": 0, "explain": "陈尧咨起初“自矜”，被质疑后“忿然”，见到酌油绝技后“笑而遣之”，态度从自夸、生气转为心服。"}], "《陋室铭》": [{"tag": "字词释义", "q": "“有仙则名”中“名”的意思是？", "options": ["出名", "名字", "名声", "命名"], "answer": 0, "explain": "“名”名词作动词，意为“出名、有名”。有了神仙就会出名。"}, {"tag": "字词释义", "q": "“斯是陋室”中“斯”的意思是？", "options": ["这", "那", "这样", "于是"], "answer": 0, "explain": "“斯”意为“这”。这是简陋的屋子。"}, {"tag": "字词释义", "q": "“惟吾德馨”中“惟”的意思是？", "options": ["加强肯定语气", "只", "因为", "虽然"], "answer": 0, "explain": "“惟”在最新课本中解释为“加强肯定语气”。“惟吾德馨”即正是因为我品德高尚（才不觉得简陋）。"}, {"tag": "字词释义", "q": "“往来无白丁”中“白丁”的意思是？", "options": ["没有功名的平民", "目不识丁的人", "穿白衣服的人", "有名望的人"], "answer": 0, "explain": "“白丁”指没有功名的平民。交往的没有无功名的平民。"}, {"tag": "字词释义", "q": "“可以调素琴”中“调”的意思是？", "options": ["弹奏", "调节", "调动", "调试"], "answer": 0, "explain": "“调”意为“弹奏”。可以弹奏不加装饰的琴。"}, {"tag": "字词释义", "q": "“调素琴”中“素”的意思是？", "options": ["不加装饰的", "白色的", "原本的", "素雅的"], "answer": 0, "explain": "“素”意为“不加装饰的”。“素琴”即不加装饰的琴。"}, {"tag": "字词释义", "q": "“阅金经”中“金经”的意思是？", "options": ["佛经", "用金粉书写的经书", "最珍贵的经书", "道德经"], "answer": 0, "explain": "“金经”指佛经。阅读佛经。"}, {"tag": "字词释义", "q": "“无丝竹之乱耳”中“丝竹”的意思是？", "options": ["奏乐的声音", "丝绸和竹子", "乐器本身", "悠扬的歌声"], "answer": 0, "explain": "“丝竹”原指弦乐器和管乐器，这里借代指奏乐的声音。"}, {"tag": "字词释义", "q": "“无丝竹之乱耳”中“乱”的意思是？", "options": ["使……扰乱", "混乱", "作乱", "杂乱"], "answer": 0, "explain": "“乱”使动用法，意为“使……扰乱”。没有奏乐的声音使（我的）耳朵被扰乱。"}, {"tag": "字词释义", "q": "“无案牍之劳形”中“劳”的意思是？", "options": ["使……劳累", "劳累", "劳动", "功劳"], "answer": 0, "explain": "“劳”使动用法，意为“使……劳累”。没有官府的公文使（我的）身体劳累。"}, {"tag": "字词释义", "q": "“何陋之有”是什么特殊句式？", "options": ["宾语前置", "状语后置", "判断句", "省略句"], "answer": 0, "explain": "“何陋之有”是宾语前置句，正常语序为“有何陋”，即有什么简陋的呢？"}, {"tag": "内容理解", "q": "本文表达了作者怎样的思想感情？", "options": ["安贫乐道、高洁傲岸的情操", "对诸葛亮的仰慕", "对自然景色的喜爱", "对官场生活的向往"], "answer": 0, "explain": "作者身居陋室却不以为陋，因为“惟吾德馨”，表达了安贫乐道、高洁傲岸的情操。"}, {"tag": "内容理解", "q": "文中提到“南阳诸葛庐，西蜀子云亭”的作用是？", "options": ["类比自比，表明自己品德高尚、安贫乐道", "说明这些房子都很简陋", "表达对古代贤人的怀念", "表明自己想去南阳西蜀居住"], "answer": 0, "explain": "以诸葛亮的草庐、扬子云的亭子自比（类比），表明自己同古代贤人一样，虽居陋室但品德高尚、不慕荣利。"}], "《爱莲说》": [{"tag": "字词释义", "q": "“可爱者甚蕃”中“可爱”的意思是？", "options": ["值得喜爱", "讨人喜欢", "可爱的人", "喜爱"], "answer": 0, "explain": "“可爱”是古今异义词，意为“值得喜爱”。值得喜爱的非常多。"}, {"tag": "字词释义", "q": "“可爱者甚蕃(fán)”中“蕃”的意思是？", "options": ["多", "茂盛", "繁殖", "稀少"], "answer": 0, "explain": "“蕃”读fán，意为“多”。值得喜爱的非常多。"}, {"tag": "字词释义", "q": "“晋陶渊明独爱菊”中“独”的意思是？", "options": ["只", "独自", "孤独", "独特"], "answer": 0, "explain": "“独”意为“只、唯独”。晋代的陶渊明只喜爱菊花。"}, {"tag": "字词释义", "q": "“予独爱莲”中“予”的读音和意思是？", "options": ["yú，我", "yǔ，给予", "yú，语气词", "yǔ，参与"], "answer": 0, "explain": "“予”读yú，意为“我”。我唯独喜爱莲花。"}, {"tag": "字词释义", "q": "“莲之出淤泥而不染”中“之”的作用是？", "options": ["取消句子独立性，不译", "结构助词，的", "代词，它", "动词，去"], "answer": 0, "explain": "“之”用在主谓之间，取消句子独立性，不译。莲花从淤泥中长出却不被污染。"}, {"tag": "字词释义", "q": "“出淤泥而不染”中“而”表示什么关系？", "options": ["转折（却）", "顺承（然后）", "并列（并且）", "修饰（地）"], "answer": 0, "explain": "“而”表转折，意为“却”。从淤泥中长出却不被污染。"}, {"tag": "字词释义", "q": "“濯清涟而不妖”中“濯”的意思是？", "options": ["洗", "沐浴", "浇灌", "沾染"], "answer": 0, "explain": "“濯”意为“洗”。经过清水的洗涤却不显得妖艳。"}, {"tag": "字词释义", "q": "“濯清涟而不妖”中“妖”的意思是？", "options": ["妖艳", "妖怪", "妖气", "端庄"], "answer": 0, "explain": "“妖”意为“妖艳、艳丽”（美丽而不端庄）。经过清水洗涤却不显得妖艳。"}, {"tag": "字词释义", "q": "“不蔓不枝”中“蔓”的意思是？", "options": ["生枝蔓", "藤蔓", "蔓延", "缠绕"], "answer": 0, "explain": "“蔓”名词作动词，意为“生枝蔓”。不生枝蔓，不长枝节。"}, {"tag": "字词释义", "q": "“不蔓不枝”中“枝”的意思是？", "options": ["长枝节", "树枝", "蔓延", "缠绕"], "answer": 0, "explain": "“枝”名词作动词，意为“长枝节”。不生枝蔓，不长枝节。"}, {"tag": "字词释义", "q": "“香远益清”中“益”的意思是？", "options": ["更加", "益处", "增加", "有益"], "answer": 0, "explain": "“益”意为“更加”。香气远播更加清香。"}, {"tag": "字词释义", "q": "“可远观而不可亵玩焉”中“亵”的意思是？", "options": ["亲近而不庄重", "轻浮", "亵渎", "玩耍"], "answer": 0, "explain": "“亵”意为“亲近而不庄重”。只能远远地观赏而不能靠近赏玩它。"}, {"tag": "字词释义", "q": "“予谓菊”中“谓”的意思是？", "options": ["认为", "对……说", "叫做", "称谓"], "answer": 0, "explain": "“谓”意为“认为”。我认为菊花是花中的隐士。"}, {"tag": "字词释义", "q": "“陶后鲜有闻”中“鲜”的意思是？", "options": ["少", "新鲜", "鲜艳", "鲜美"], "answer": 0, "explain": "“鲜”读xiǎn，意为“少”。在陶渊明以后很少听到了。"}, {"tag": "字词释义", "q": "“宜乎众矣”中“宜”的意思是？", "options": ["应当", "适宜", "便宜", "适合"], "answer": 0, "explain": "“宜”意为“应当”。应当（喜爱牡丹的人）很多了。"}, {"tag": "内容理解", "q": "“予谓菊花之隐逸者也牡丹花之富贵者也莲花之君子者也”断句正确的一项是？", "options": ["予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。", "予谓菊花，之隐逸者也；牡丹花，之富贵者也；莲花，之君子者也。", "予谓菊，花之隐逸者，也牡丹花之富贵者，也莲花之君子者也。", "予谓菊花之，隐逸者也；牡丹花之，富贵者也；莲花之，君子者也。"], "answer": 0, "explain": "正确断句为“予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。”即我认为菊花是花中的隐士，牡丹是花中的富贵者，莲花是花中品德高尚的君子。"}, {"tag": "内容理解", "q": "下列对莲花特点与君子品行的搭配中，错误的是？", "options": ["出淤泥而不染——不与世俗同流合污", "濯清涟而不妖——孤高自傲、哗众取宠", "中通外直——内心通达，行为正直", "不蔓不枝——不结党营私"], "answer": 1, "explain": "B项搭配不当。“濯清涟而不妖”比喻君子不孤高自傲、不哗众取宠，B项“孤高自傲、哗众取宠”恰好说反了。"}, {"tag": "内容理解", "q": "文中写菊、牡丹有什么作用？", "options": ["衬托莲，突出莲的高洁（菊正衬、牡丹反衬）", "说明菊和牡丹也很美", "介绍三种花的习性", "表达对菊和牡丹的喜爱"], "answer": 0, "explain": "写菊、牡丹是为了衬托莲：用菊（隐逸）正衬莲，用牡丹（富贵）反衬莲，突出莲高洁、不慕名利的特点。"}, {"tag": "内容理解", "q": "“莲之爱，同予者何人？”表达了作者怎样的情感？", "options": ["感叹知音稀少，表达洁身自好、不慕名利的情操", "抱怨没人陪自己赏莲", "疑问是否有人爱莲", "表达对牡丹的厌恶"], "answer": 0, "explain": "“同予者何人”感叹世上像自己一样爱莲（洁身自好）的人很少，知音难觅，表达作者不慕名利、洁身自好的高洁情操。"}, {"tag": "内容理解", "q": "如何理解“出淤泥而不染”？", "options": ["比喻君子身处污浊环境却能洁身自好、不同流合污", "说明莲花长在淤泥里", "表达对淤泥的厌恶", "指莲花出淤泥但很干净"], "answer": 0, "explain": "“出淤泥而不染”比喻君子虽身处污浊的环境，却能洁身自好、不与世俗同流合污。"}], "《木兰诗》": [{"tag": "字词释义", "q": "“唧唧复唧唧”中“唧唧”的意思是？", "options": ["叹息声", "织布声", "哭泣声", "鸟叫声"], "answer": 0, "explain": "“唧唧”是叹息声。木兰对着门织布，听不到织布声，只听到她的叹息声。"}, {"tag": "字词释义", "q": "“木兰当户织”中“当户”的意思是？", "options": ["对着门", "在户外", "抵挡门户", "在屋内"], "answer": 0, "explain": "“当”意为“对着”，“户”是“门”。“当户织”即对着门织布。"}, {"tag": "字词释义", "q": "“不闻机杼声”中“机杼”的意思是？", "options": ["织布机", "纺锤", "机敏", "机关"], "answer": 0, "explain": "“机杼”指织布机。“杼”是织布机的梭子。"}, {"tag": "内容理解", "q": "“问女何所思”是什么特殊句式？", "options": ["宾语前置", "状语后置", "判断句", "省略句"], "answer": 0, "explain": "“何所思”即“所思何”（想的是什么），疑问代词“何”作宾语前置。"}, {"tag": "字词释义", "q": "“唯闻女叹息”中“唯”的意思是？", "options": ["只", "唯一", "因为", "虽然"], "answer": 0, "explain": "“唯（同’惟‘）”意为“只”。只听到木兰在叹息。"}, {"tag": "字词释义", "q": "“愿为市鞍马”中“市”的意思是？", "options": ["买", "市场", "出售", "集市"], "answer": 0, "explain": "“市”名词作动词，意为“买”。木兰愿意去买鞍马，替父出征。"}, {"tag": "字词释义", "q": "“军书十二卷”中“十二”的意思是？", "options": ["虚指，表多数", "确指十二", "十加二", "十二次"], "answer": 0, "explain": "“十二”是虚指，表示多数（与下文“壮士十年归”“同行十二年”中的“十、十二”均为虚数）。"}, {"tag": "字词释义", "q": "“旦辞爷娘去”中“旦”的意思是？", "options": ["早晨", "白天", "天亮", "明日"], "answer": 0, "explain": "“旦”意为“早晨”。早晨告别爹娘出发。"}, {"tag": "内容理解", "q": "“东市买骏马……北市买长鞭”四句使用了什么修辞？", "options": ["排比和互文", "比喻", "拟人", "夸张"], "answer": 0, "explain": "“互文”指上下文各举一端，合起来表达完整意思——去各处市场置办出征装备。“排比”指结构相似的四句并列。"}, {"tag": "字词释义", "q": "“但闻黄河流水鸣溅溅”中“但”的意思是？", "options": ["只", "但是", "然而", "不过"], "answer": 0, "explain": "“但”意为“只、只是”，与“不闻”形成对比——听不到爹娘唤女声，只听到黄河水声。"}, {"tag": "字词释义", "q": "“鸣溅溅”中“溅溅”的读音是？", "options": ["jiān jiān", "jiàn jiàn", "jiǎn jiǎn", "jiān jiàn"], "answer": 0, "explain": "“溅溅”读 jiān jiān，形容水流声。（纯读音题，四声调辨析）"}, {"tag": "字词释义", "q": "“燕山胡骑鸣啾啾”中“燕”的读音是？", "options": ["yān", "yàn", "yǎn", "yán"], "answer": 0, "explain": "“燕山”的“燕”读 yān（地名专用读法）。"}, {"tag": "字词释义", "q": "“万里赴戎机”中“戎机”的意思是？", "options": ["战事", "军机", "军事", "战争"], "answer": 0, "explain": "课本注释：“戎机”即“战事”。不远万里奔赴战场参加战事。"}, {"tag": "字词释义", "q": "“关山度若飞”中“度”的意思是？", "options": ["越过", "度过", "衡量", "速度"], "answer": 0, "explain": "“度”意为“越过”。像飞一样越过关隘和山岭。"}, {"tag": "字词释义", "q": "“朔气传金柝”中“朔气”的意思是？", "options": ["北方的寒气", "寒气", "天气", "初春的气息"], "answer": 0, "explain": "“朔”常指北方，“朔气”即北方的寒气。北方的寒气传来打更的声音。"}, {"tag": "字词释义", "q": "“寒光照铁衣”中“铁衣”的意思是？", "options": ["铠甲", "铁匠的衣服", "战袍", "金属衣服"], "answer": 0, "explain": "“铁衣”指铠甲（将士的护身服装）。冷冷的月光照在将士的铠甲上。"}, {"tag": "字词释义", "q": "“策勋十二转”中“策勋”的意思是？", "options": ["记功", "策略", "鞭策", "功劳"], "answer": 0, "explain": "“策”意为“记”（写在简策上），“勋”意为“功勋”。“策勋”即在功劳簿上记功。"}, {"tag": "字词释义", "q": "“赏赐百千强”中“强”的含义是？", "options": ["有余", "强大", "勉强", "强盛"], "answer": 0, "explain": "“强”意为“有余、不止”。赏赐的财物成百上千还有余。"}, {"tag": "字词释义", "q": "“木兰不用尚书郎”中“不用”的意思是？", "options": ["不愿做", "不使用", "用不着", "不可以"], "answer": 0, "explain": "“不用”是古今异义词，意为“不愿做、不做”。木兰不愿做尚书郎的官职。"}, {"tag": "字词释义", "q": "“愿驰千里足”中“千里足”的意思是？", "options": ["千里马", "远行", "走一千里路", "日行千里的脚"], "answer": 0, "explain": "“千里足”指千里马（日行千里的良马）。希望骑上千里马回家乡。"}, {"tag": "内容理解", "q": "“将军百战死，壮士十年归”使用了什么修辞？", "options": ["互文", "比喻", "夸张", "排比"], "answer": 0, "explain": "“互文”——将军和壮士有的战死沙场，有的经历十年征战凯旋。不可拆开理解为“将军都战死、壮士都归来”。"}, {"tag": "内容理解", "q": "诗歌为什么略写十年征战、详写战前准备与还乡场景？", "options": ["突出木兰女儿本色、重亲情不热衷功名", "缺少战争素材", "战争场面不好描写", "为了节省诗歌篇幅"], "answer": 0, "explain": "详略安排服务于主题——诗歌重在塑造木兰勤劳孝顺、不慕荣利的形象。详写战前（替父从军体现孝）和战后（辞官还乡体现淡泊），略写战争（一笔带过），突出木兰的女儿本色。"}, {"tag": "字词释义", "q": "“出郭相扶将”中“郭”的意思是？", "options": ["外城", "城门", "城墙", "城郭姓"], "answer": 0, "explain": "“郭”指外城（古代城有内外两重，内城为“城”，外城为“郭”）。"}, {"tag": "字词释义", "q": "“当户理红妆”中“红妆”的意思是？", "options": ["古代女子的艳丽装束", "红色的衣裳", "红花", "红粉"], "answer": 0, "explain": "“红妆”指古代女子艳丽的装束和打扮。对着门整理打扮。"}, {"tag": "字词释义", "q": "“磨刀霍霍向猪羊”中“霍霍”的意思是？", "options": ["磨刀的声音", "快速的样子", "光亮闪闪", "众多"], "answer": 0, "explain": "“霍霍”是拟声词，形容磨刀的声音。"}, {"tag": "字词释义", "q": "“著我旧时裳”中“著”的读音和意思是？", "options": ["zhuó，穿", "zhù，著作", "zhù，穿着", "zhe，助词"], "answer": 0, "explain": "“著”读 zhuó，意为“穿”。穿上我旧时的衣裳。"}, {"tag": "字词释义", "q": "“对镜帖花黄”中“帖”的意思是？", "options": ["通“贴”，粘贴", "帖子", "涂贴", "帖附"], "answer": 0, "explain": "“帖”通“贴”，意为“粘贴”。对着镜子贴上花黄（面部装饰）。"}, {"tag": "字词释义", "q": "“出门看火伴”中“火伴”的意思是？", "options": ["同伍的士兵", "火把", "伙伴的火", "伙夫"], "answer": 0, "explain": "“火”是古代兵制单位，十人为一“火”。“火伴”即同伍的士兵，后写作“伙伴”。"}, {"tag": "字词释义", "q": "“雄兔脚扑朔”中“扑朔”的意思是？", "options": ["动弹", "扑腾", "迷失", "迅速"], "answer": 0, "explain": "“扑朔”指兔子前脚不停动弹的样子。雄兔前脚总在动弹。"}, {"tag": "内容理解", "q": "木兰形象的核心特点是？", "options": ["勤劳孝顺、勇敢坚毅、不慕荣利", "武艺高强、争强好胜", "温柔贤淑、不爱武装", "机智狡黠、善于伪装"], "answer": 0, "explain": "全文刻画了木兰勤劳（当户织）、孝顺（替父征）、勇敢（万里赴戎机）、不慕荣利（不用尚书郎）、机智（安能辨我是雄雌）的多元形象。"}], "《活板》": [{"tag": "字词释义", "q": "“板印书籍”中“板”的意思是？", "options": ["用雕版（同“版”，名作状）", "木板", "印刷", "版面"], "answer": 0, "explain": "“板”同“版”，名词作状语，意为“用雕版”。用雕版印刷书籍。"}, {"tag": "字词释义", "q": "“尚未盛为之”中“盛”的意思是？", "options": ["大规模地", "茂盛", "丰富", "隆重"], "answer": 0, "explain": "“盛”意为“大规模地”。唐朝人还没有大规模地这样做。"}, {"tag": "字词释义", "q": "“已后典籍”中“已”的读音和意思是？", "options": ["yǐ，同“以”", "yǐ，已经", "jǐ，自己", "yì，已经"], "answer": 0, "explain": "“已”读yǐ，同“以”，“已后”即“以后”。"}, {"tag": "字词释义", "q": "“有布衣毕昇”中“布衣”的意思是？", "options": ["平民", "布做的衣服", "布衣人家", "粗布衣裳"], "answer": 0, "explain": "“布衣”借代指平民（穿布衣的人）。有个平民叫毕昇。"}, {"tag": "字词释义", "q": "“又为活板”中“为”的意思是？", "options": ["制作", "为了", "被", "作为"], "answer": 0, "explain": "“为”意为“制作”。又发明（制作）了活字印刷。"}, {"tag": "字词释义", "q": "“薄如钱唇”中“唇”的意思是？", "options": ["边缘", "嘴唇", "钱孔", "中心"], "answer": 0, "explain": "“唇”意为“边缘”。字模薄得像铜钱的边缘。"}, {"tag": "字词释义", "q": "“每字为一印”中“印”的意思是？", "options": ["字印", "印刷", "印刻", "印象"], "answer": 0, "explain": "“印”指字印（印章）。每个字做一个字印。"}, {"tag": "字词释义", "q": "“火烧令坚”中“火”的意思是？", "options": ["用火（名词作状语）", "火焰", "火烧", "火烤"], "answer": 0, "explain": "“火”名词作状语，意为“用火”。用火烧使它坚硬。"}, {"tag": "字词释义", "q": "“以松脂、蜡和纸灰之类冒之”中“冒”的意思是？", "options": ["覆盖", "冒犯", "冒出", "冒充"], "answer": 0, "explain": "“冒”意为“覆盖”。用松脂、蜡混合纸灰这类东西覆盖（铁板）。"}, {"tag": "字词释义", "q": "“持就火炀之”中“就”的意思是？", "options": ["靠近", "完成", "立即", "于是"], "answer": 0, "explain": "“就”意为“靠近”。拿着（铁板）靠近火烘烤。"}, {"tag": "字词释义", "q": "“持就火炀(yáng)之”中“炀(yáng)”的意思是？", "options": ["烤", "加热", "烧灼", "点火"], "answer": 0, "explain": "“炀”读yáng，意为“烤”。拿着（铁板）靠近火烘烤。"}, {"tag": "字词释义", "q": "“则字平如砥”中“砥”的意思是？", "options": ["磨刀石", "地面", "平地", "基础"], "answer": 0, "explain": "“砥”意为“磨刀石”。字模平整得像磨刀石一样。"}, {"tag": "字词释义", "q": "“若止印三二本”中“止”的意思是？", "options": ["只", "停止", "阻止", "还是"], "answer": 0, "explain": "“止”意为“只、仅”。如果只印两三本。"}, {"tag": "字词释义", "q": "“一板已自布字”中“布字”的意思是？", "options": ["排字", "布置", "分布", "写字"], "answer": 0, "explain": "“布字”意为“排字”。另一块板已经在自行排字。"}, {"tag": "字词释义", "q": "“则第二板已具”中“具”的意思是？", "options": ["准备好", "工具", "具备", "具体"], "answer": 0, "explain": "“具”意为“准备好”。第二块板已经准备好了。"}, {"tag": "字词释义", "q": "“更互用之”中“更互”的意思是？", "options": ["交替", "更加", "更换", "互相"], "answer": 0, "explain": "“更互”意为“交替、轮流”。交替使用两块板。"}, {"tag": "字词释义", "q": "“瞬息可就”中“就”的意思是？", "options": ["完成", "靠近", "立即", "靠近"], "answer": 0, "explain": "“就”意为“完成”。转眼之间就能完成。（与“持就火炀之”的“就=靠近”对比）"}, {"tag": "字词释义", "q": "“则以纸帖之”中“帖”的意思是？", "options": ["标注（动词）", "粘贴", "帖子", "字帖"], "answer": 0, "explain": "“帖”作动词，意为“标注”。就用纸标签标注它们。"}, {"tag": "字词释义", "q": "“旋刻之”中“旋”的意思是？", "options": ["随即", "旋转", "盘旋", "周转"], "answer": 0, "explain": "“旋”意为“随即、立刻”。随即刻制它。"}, {"tag": "字词释义", "q": "“文理有疏密”中“文”的意思是？", "options": ["同“纹”，纹理", "文章", "文字", "文化"], "answer": 0, "explain": "“文”同“纹”，意为“纹理”。木头的纹理有疏有密。"}, {"tag": "字词释义", "q": "“殊不沾污”中“殊”的意思是？", "options": ["根本", "特殊", "不同", "非常"], "answer": 0, "explain": "“殊”意为“根本、绝对”。根本不会被弄脏。"}, {"tag": "内容理解", "q": "“常作二铁板一板印刷一板已自布字此印者才毕则第二板已具更互用之瞬息可就”断句正确的一项是？", "options": ["常作二铁板，一板印刷，一板已自布字，此印者才毕，则第二板已具，更互用之，瞬息可就。", "常作二铁板一板，印刷一板，已自布字此印者，才毕则第二板，已具更互用之，瞬息可就。", "常作二铁板，一板印刷一板已，自布字此印者才毕，则第二板已具更互，用之瞬息可就。", "常作二铁板一板印刷，一板已自布字此印者，才毕则第二板已具，更互用之瞬息可就。"], "answer": 0, "explain": "正确断句为“常作二铁板，一板印刷，一板已自布字，此印者才毕，则第二板已具，更互用之，瞬息可就。”意为常常做两块铁板，一块印刷，一块排字，交替使用，转眼完成。"}, {"tag": "内容理解", "q": "下列句子中是被动句的是？", "options": ["昇死，其印为余群从所得", "板印书籍，唐人尚未盛为之", "火烧令坚", "不以木为之者"], "answer": 0, "explain": "“其印为余群从所得”中“为……所”表被动，是被动句，意为“字印被我的堂兄弟和子侄辈得到”。"}], "《三峡》": [{"tag": "字词释义", "q": "“略无阙处”中“阙”的读音和意思是？", "options": ["quē，同“缺”，空隙缺口", "què，宫阙", "quē，缺少", "jué，掘"], "answer": 0, "explain": "“阙”读quē，同“缺”，意为“空隙、缺口”。完全没有中断的地方。"}, {"tag": "字词释义", "q": "“自非亭午夜分”中“自非”的意思是？", "options": ["如果不是", "自然不是", "自从不是", "只要不是"], "answer": 0, "explain": "“自非”意为“如果不是”。如果不是正午和半夜。"}, {"tag": "字词释义", "q": "“亭午夜分”中“亭午”的意思是？", "options": ["正午", "亭子旁", "中午", "半夜"], "answer": 0, "explain": "“亭午”意为“正午”。不是正午和半夜就看不见太阳和月亮。"}, {"tag": "字词释义", "q": "“夏水襄陵”中“襄”的意思是？", "options": ["冲上，漫上", "襄阳", "帮助", "高起"], "answer": 0, "explain": "“襄”意为“冲上、漫上”。夏天江水漫上山陵。"}, {"tag": "字词释义", "q": "“沿溯阻绝”中“溯”的意思是？", "options": ["逆流而上", "顺流而下", "追溯", "溯流"], "answer": 0, "explain": "“溯”意为“逆流而上”。上行和下行的航道都被阻断。"}, {"tag": "字词释义", "q": "“或王命急宣”中“或”的意思是？", "options": ["有时", "或者", "或许", "某人"], "answer": 0, "explain": "“或”意为“有时”。有时遇到皇帝的命令要急速传达。"}, {"tag": "字词释义", "q": "“虽乘奔御风”中“虽”的意思是？", "options": ["即使", "虽然", "虽然……但是", "纵然"], "answer": 0, "explain": "“虽”意为“即使”（古今异义，今义“虽然”）。即使骑着飞奔的马。"}, {"tag": "字词释义", "q": "“虽乘奔御风”中“奔”的意思是？", "options": ["飞奔的马（动词作名词）", "奔跑", "奔驰", "奔跑的人"], "answer": 0, "explain": "“奔”动词作名词，意为“飞奔的马”。骑着飞奔的马。"}, {"tag": "字词释义", "q": "“不以疾也”中“以”的意思是？", "options": ["认为", "用来", "因为", "可以"], "answer": 0, "explain": "“以”意为“认为”。也不认为（比这）快。"}, {"tag": "内容理解", "q": "“虽乘奔御风，不以疾也。”翻译正确的一项是？", "options": ["即使骑着飞奔的马，驾着疾风，也没有这么快。", "虽然骑着飞奔的马，驾着疾风，也没有这么快。", "即使骑着飞奔的马，驾着疾风，也不认为（比这）慢。", "虽然骑着奔驰的快马，乘着疾风，也不觉得这么快。"], "answer": 0, "explain": "A正确。“虽”应译“即使”，B、D误译“虽然”；“疾”是“快”，C误译“慢”。"}, {"tag": "内容理解", "q": "“朝发白帝”与下列哪句的特殊句式相同？", "options": ["蒙辞以军中多务（状语后置）", "何陋之有（宾语前置）", "莲，花之君子者也（判断句）", "其印为余群从所得（被动句）"], "answer": 0, "explain": "“朝发白帝”即“朝于白帝发”，状语后置句，与《孙权劝学》“蒙辞以军中多务”（以军中多务辞）句式相同，都是状语后置。"}, {"tag": "字词释义", "q": "“则素湍绿潭”中“湍”的意思是？", "options": ["急流", "湍急", "水流", "瀑布"], "answer": 0, "explain": "“湍”意为“急流”。白色的急流、碧绿的深潭。"}, {"tag": "字词释义", "q": "“绝巘(yǎn)多生怪柏”中“绝巘”的意思是？", "options": ["极高的山峰", "山崖", "山顶", "山谷"], "answer": 0, "explain": "“绝巘”读绝巘(yǎn)，意为“极高的山峰”。极高的山峰上多生长着怪柏。"}, {"tag": "字词释义", "q": "“飞漱其间”中“飞漱”的意思是？", "options": ["急流冲荡", "飞速冲刷", "飞流", "洗涤"], "answer": 0, "explain": "“飞漱”意为“急流冲荡”。悬泉瀑布在山峰之间飞速冲荡。"}, {"tag": "字词释义", "q": "“良多趣味”中“良”的意思是？", "options": ["确实，很", "良好", "善良", "优良"], "answer": 0, "explain": "“良”意为“确实、很”。确实有很多趣味。"}, {"tag": "字词释义", "q": "“属引凄异”中“属”的意思是？", "options": ["连接", "属于", "嘱咐", "跟随"], "answer": 0, "explain": "“属”意为“连接”。声音连续不断。"}, {"tag": "字词释义", "q": "“属引凄异”中“引”的意思是？", "options": ["延长", "引导", "牵引", "引用"], "answer": 0, "explain": "“引”意为“延长”。声音连续不断、延长。（属=连接，引=延长）"}, {"tag": "字词释义", "q": "“哀转久绝”中“绝”的意思是？", "options": ["消失", "断绝", "绝对", "极高"], "answer": 0, "explain": "“绝”意为“消失”。悲哀婉转，很久才消失。（与“沿溯阻绝”的“绝=断绝”对比）"}, {"tag": "内容理解", "q": "“林寒涧肃”使用了什么修辞？", "options": ["互文（树林和山涧都清寒寂静）", "比喻", "拟人", "夸张"], "answer": 0, "explain": "“林寒涧肃”是互文，意为“树林和山涧都清寒寂静”，不能拆开理解为“树林寒、山涧肃”。"}, {"tag": "内容理解", "q": "“每至晴初霜旦林寒涧肃常有高猿长啸属引凄异空谷传响哀转久绝”断句正确的一项是？", "options": ["每至晴初霜旦，林寒涧肃，常有高猿长啸，属引凄异，空谷传响，哀转久绝。", "每至晴初，霜旦林寒，涧肃常有，高猿长啸属引，凄异空谷，传响哀转，久绝。", "每至晴初霜旦林寒，涧肃常有高猿，长啸属引凄异，空谷传响哀转，久绝。", "每至晴初霜旦，林寒涧肃常有，高猿长啸属，引凄异空谷，传响哀转久绝。"], "answer": 0, "explain": "正确断句为“每至晴初霜旦，林寒涧肃，常有高猿长啸，属引凄异，空谷传响，哀转久绝。”"}, {"tag": "内容理解", "q": "文末引用渔歌“巴东三峡巫峡长，猿鸣三声泪沾裳”的作用是？", "options": ["烘托秋季三峡萧瑟凄清的氛围，侧面写出山高峡长，渲染猿鸣哀婉", "说明当地百姓生活艰苦", "表现渔者的劳动号子", "赞美三峡秋天景色优美"], "answer": 0, "explain": "引用渔歌有三层作用：①烘托秋季三峡萧瑟凄清的氛围；②侧面写出三峡山高、峡长；③渲染猿鸣哀婉，增强文学色彩。"}], "《答谢中书书》": [{"tag": "字词释义", "q": "“青林翠竹，四时俱备”中“四时”的意思是？", "options": ["四季", "四个时辰", "时候", "时辰"], "answer": 0, "explain": "“四时”意为“四季”。青葱的林木与翠绿的竹林，四季常备。"}, {"tag": "字词释义", "q": "“四时俱备”中“俱”的意思是？", "options": ["全，都", "一起", "工具", "具备"], "answer": 0, "explain": "“俱”意为“全、都”。“俱备”即全都具备。"}, {"tag": "字词释义", "q": "“晓雾将歇”中“歇”的意思是？", "options": ["消散", "休息", "停止", "睡觉"], "answer": 0, "explain": "“歇”此处意为“消散”。清晨的薄雾将要消散。"}, {"tag": "字词释义", "q": "“夕日欲颓”中“欲”的意思是？", "options": ["将要", "想要", "欲望", "如果"], "answer": 0, "explain": "“欲”此处意为“将要”。夕阳将要落山。"}, {"tag": "字词释义", "q": "“夕日欲颓”中“颓”的意思是？", "options": ["坠落（太阳落山）", "颓废", "倒塌", "衰败"], "answer": 0, "explain": "“颓”此处意为“坠落”，指太阳落山。"}, {"tag": "字词释义", "q": "“沉鳞竞跃”中“沉鳞”指的是？", "options": ["潜游在水中的鱼", "沉在水底的鳞片", "落水的鱼", "深水中的生物"], "answer": 0, "explain": "“沉鳞”以“鳞”代指鱼，是借代，指潜游在水中的鱼。"}, {"tag": "字词释义", "q": "“沉鳞竞跃”中“竞”的意思是？", "options": ["争相", "竟然", "比赛", "竞争"], "answer": 0, "explain": "“竞”意为“争相”。鱼儿争相跃出水面。"}, {"tag": "字词释义", "q": "“实是欲界之仙都”中“欲界”的意思是？", "options": ["人间", "欲望的境界", "天界", "世俗"], "answer": 0, "explain": "“欲界”本为佛家语，此指人间。“仙都”即仙境。"}, {"tag": "字词释义", "q": "“未复有能与其奇者”中“与”的读音和意思是？", "options": ["yù，参与，这里有“欣赏、领悟”之意", "yǔ，和", "yú，语气词", "yǔ，给予"], "answer": 0, "explain": "“与”读 yù，意为“参与”，这里引申为“欣赏、领悟”。"}, {"tag": "字词释义", "q": "“未复有能与其奇者”中“奇”的活用和意思是？", "options": ["形容词作名词，奇景", "形容词，奇特", "形容词，奇怪", "动词，惊奇"], "answer": 0, "explain": "“奇”形容词作名词，指奇美的山水景色。"}, {"tag": "内容理解", "q": "下列对“晓雾将歇，猿鸟乱鸣；夕日欲颓，沉鳞竞跃”的翻译，正确的一项是？", "options": ["清晨的薄雾将要消散，猿、鸟此起彼伏地鸣叫；夕阳快要落山，水中的鱼争相跃出水面。", "清晨的薄雾将要休息，猿鸟慌乱地鸣叫；夕阳将要坠落，鱼鳞竞相跳跃。", "清晨的薄雾将要停止，猿鸟乱叫；夕阳想要颓废，沉鱼争相跳跃。", "清晨的薄雾快要散尽，猿鸟大声鸣叫；夕阳快要落下，鱼儿争先恐后地跳出水面。"], "answer": 0, "explain": "“歇”意为消散，“乱鸣”为此起彼伏地鸣叫，“颓”意为坠落，“沉鳞”以鳞代鱼。A 项翻译准确。"}, {"tag": "修辞手法", "q": "“沉鳞竞跃”运用的修辞手法是？", "options": ["借代+拟人", "拟人+夸张", "夸张+比喻", "比喻+借代"], "answer": 0, "explain": "“鳞”代指鱼，是借代；“竞跃”赋予鱼争先恐后的情态，是拟人。"}, {"tag": "内容理解", "q": "文中总领全文、概括山川之美的句子是？", "options": ["山川之美，古来共谈", "高峰入云，清流见底", "实是欲界之仙都", "自康乐以来，未复有能与其奇者"], "answer": 0, "explain": "首句“山川之美，古来共谈”总领全文，点明山川之美自古以来被人共同赞叹。"}, {"tag": "内容理解", "q": "下列关于结尾“自康乐以来，未复有能与其奇者”的深层含义，理解不正确的一项是？", "options": ["赞美谢灵运善于发现山水之美", "惋惜世人大多不懂欣赏山水奇景", "表达作者自己能领略山水美景的自得、庆幸之情", "批评谢灵运之后的文人都无所作为"], "answer": 3, "explain": "深层含义有三点：①赞美谢灵运善于发现山水之美；②惋惜世人大多不懂欣赏山水奇景；③表达自己能领略山水美景的自得、庆幸之情。D 项“批评文人无所作为”于文无据。"}, {"tag": "字词释义", "q": "下列加点词解释有误的一项是？", "options": ["四时俱备——全，都", "晓雾将歇——消散", "夕日欲颓——颓废", "未复有能与其奇者——欣赏、领悟"], "answer": 2, "explain": "“夕日欲颓”的“颓”意为“坠落”（太阳落山），不是“颓废”。"}], "《记承天寺夜游》": [{"tag": "字词释义", "q": "“月色入户”中“户”的意思是？", "options": ["门", "窗户", "户口", "住户"], "answer": 0, "explain": "“户”此处指“门”。“月色入户”即月光从门照进来。"}, {"tag": "字词释义", "q": "“欣然起行”中“然”的意思是？", "options": ["……的样子", "然后", "然而", "竟然"], "answer": 0, "explain": "“然”是形容词词尾，意为“……的样子”。“欣然”即高兴的样子。"}, {"tag": "字词释义", "q": "“念无与为乐者”中“念”的意思是？", "options": ["想到", "思念", "念叨", "念头"], "answer": 0, "explain": "“念”意为“考虑、想到”。想到没有人与我共同赏乐。"}, {"tag": "字词释义", "q": "“遂至承天寺”中“遂”的意思是？", "options": ["于是，就", "成功", "即使", "顺利"], "answer": 0, "explain": "“遂”意为“于是、就”。于是到承天寺寻找张怀民。"}, {"tag": "字词释义", "q": "“相与步于中庭”中“相与”的意思是？", "options": ["共同，一起", "互相给与", "相随", "交往"], "answer": 0, "explain": "“相与”意为“共同、一起”。我们一起在庭院中散步。"}, {"tag": "字词释义", "q": "“水中藻、荇交横”中“交横”的意思是？", "options": ["交错纵横", "交叉横放", "相互横着", "交通横行"], "answer": 0, "explain": "“交横”意为“交错纵横”。"}, {"tag": "字词释义", "q": "“盖竹柏影也”中“盖”的意思是？", "options": ["大概是", "盖子", "遮盖", "因为"], "answer": 0, "explain": "“盖”表推测语气，意为“大概是”。大概是竹柏的影子。"}, {"tag": "字词释义", "q": "“但少闲人如吾两人者耳”中“但”的意思是？", "options": ["只是", "但是", "况且", "竟然"], "answer": 0, "explain": "“但”意为“只是”（古今异义，今义为“但是”）。"}, {"tag": "字词释义", "q": "“如吾两人者耳”中“耳”的意思是？", "options": ["罢了", "耳朵", "感叹语气词", "听到"], "answer": 0, "explain": "“耳”是句末语气词，意为“罢了”。"}, {"tag": "断句", "q": "“何夜无月何处无竹柏但少闲人如吾两人者耳”断句正确的一项是？", "options": ["何夜无月？何处无竹柏？但少闲人如吾两人者耳。", "何夜无月何处？无竹柏但少闲人？如吾两人者耳。", "何夜无月？何处无竹柏但？少闲人如吾两人者耳。", "何夜无月何处？无竹柏？但少闲人如吾两人者耳。"], "answer": 0, "explain": "应为两个反问句加一个感叹句：“何夜无月？何处无竹柏？但少闲人如吾两人者耳。”"}, {"tag": "特殊句式", "q": "“水中藻、荇交横，盖竹柏影也”的特殊句式是？", "options": ["判断句", "省略句", "倒装句", "被动句"], "answer": 0, "explain": "“盖竹柏影也”用“也”表判断，是判断句。"}, {"tag": "内容理解", "q": "下列关于本文主旨情感的理解，不正确的一项是？", "options": ["描绘承天寺月夜美景，抒发赏月的欣喜、漫步的悠闲", "暗含作者被贬黄州的落寞苦闷", "体现苏轼乐观旷达的人生态度", "表达作者对官场生活的向往与留恋"], "answer": 3, "explain": "本文主旨：①描绘月夜美景，抒发赏月的欣喜、漫步的悠闲；②暗含被贬黄州的落寞苦闷；③体现乐观旷达的人生态度。D 项“向往官场”于文无据。"}, {"tag": "内容理解", "q": "下列对“闲人”内涵的理解，不正确的一项是？", "options": ["指具有闲情逸致、能够欣赏月色美景的人", "暗含作者被贬黄州、仕途失意不得重用的苦闷", "表现作者在逆境中乐观旷达、随缘自适的心境", "指清闲无事、无所事事的人"], "answer": 3, "explain": "“闲人”包含三层内涵：①闲情逸致、能欣赏月色美景；②暗含被贬黄州、仕途失意的苦闷；③逆境中乐观旷达、随缘自适。D 项“无所事事”是贬义理解，不符。"}, {"tag": "字词释义", "q": "下列加点词解释有误的一项是？", "options": ["月色入户——门", "念无与为乐者——思念", "怀民亦未寝——睡觉", "但少闲人如吾两人者耳——只是"], "answer": 1, "explain": "“念”意为“考虑、想到”，不是“思念”。"}, {"tag": "特殊句式", "q": "“相与步于中庭”的特殊句式与下列哪句相同？", "options": ["蒙辞以军中多务", "何陋之有", "莲，花之君子者也", "其印为余群从所得"], "answer": 0, "explain": "“相与步于中庭”即“（于中庭）步”，状语后置，与“蒙辞以军中多务”（以军中多务辞）相同。"}], "《与朱元思书》": [{"tag": "字词释义", "q": "“风烟俱净”中“俱”的意思是？", "options": ["全，都", "一起", "工具", "具备"], "answer": 0, "explain": "“俱”意为“全、都”。“风烟俱净”即烟雾都消散尽净。"}, {"tag": "字词释义", "q": "“风烟俱净”中“净”的意思是？", "options": ["消散，散尽", "干净", "纯净", "清净"], "answer": 0, "explain": "“净”此处指烟雾消散尽净。"}, {"tag": "字词释义", "q": "“任意东西”中“东西”的活用和意思是？", "options": ["名词作动词，向东向西漂行", "东边和西边", "物品", "方向"], "answer": 0, "explain": "“东西”名词作动词，意为“向东向西漂行”。"}, {"tag": "字词释义", "q": "“一百许里”中“许”的意思是？", "options": ["左右，约", "允许", "也许", "许多"], "answer": 0, "explain": "“许”意为“左右、约”。“一百许里”即一百里左右。"}, {"tag": "字词释义", "q": "“天下独绝”中“独”的意思是？", "options": ["独一无二", "独自", "唯独", "孤独"], "answer": 0, "explain": "“独”意为“独一无二”。“天下独绝”即天下独一无二。"}, {"tag": "字词释义", "q": "“猛浪若奔”中“若”的意思是？", "options": ["像，如同", "如果", "比得上", "假如"], "answer": 0, "explain": "“若”意为“像、如同”。凶猛的巨浪像飞奔的骏马。"}, {"tag": "字词释义", "q": "“猛浪若奔”中“奔”的活用和意思是？", "options": ["动词作名词，飞奔的马", "奔跑", "奔腾", "飞奔"], "answer": 0, "explain": "“奔”动词作名词，指飞奔的骏马。"}, {"tag": "修辞手法", "q": "“急湍甚箭，猛浪若奔”运用的修辞手法是？", "options": ["对偶+比喻", "对偶+夸张", "比喻+拟人", "排比+比喻"], "answer": 0, "explain": "把急流比作飞箭、巨浪比作奔马，是比喻；两句对仗工整，是对偶。生动写出江水流速迅猛、气势磅礴。"}, {"tag": "字词释义", "q": "“夹岸高山”中“夹岸”的意思是？", "options": ["两岸", "岸边", "夹住江岸", "对岸"], "answer": 0, "explain": "“夹岸”即“两岸”。"}, {"tag": "字词释义", "q": "“皆生寒树”中“寒树”的意思是？", "options": ["耐寒常绿的树，这里指密而绿的树", "寒冷的树", "冬天的树", "枯树"], "answer": 0, "explain": "“寒树”指耐寒常绿的树，这里形容树木密而绿。"}, {"tag": "字词释义", "q": "“负势竞上”中“竞”的意思是？", "options": ["争相", "竟然", "竞争", "比赛"], "answer": 0, "explain": "“竞”意为“争相”。山峦凭借地势争相向上。"}, {"tag": "字词释义", "q": "“互相轩邈”中“轩邈”的活用和意思是？", "options": ["形容词作动词，向高处、远处伸展", "高大", "深远", "轩敞"], "answer": 0, "explain": "“轩”“邈”形容词作动词，意为“向高处、远处伸展”。"}, {"tag": "字词释义", "q": "“争高直指”中“直指”的意思是？", "options": ["笔直地向上，直插云天", "直接指挥", "径直指着", "伸手指挥"], "answer": 0, "explain": "“直指”意为笔直地向上， function getWrong() {
  try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; }
}
function saveWrong(list) { localStorage.setItem(KEY, JSON.stringify(list)); }
function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); }, 1500); }
function shf(a){ var b=[].concat(a); for(var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i];b[i]=b[j];b[j]=t; } return b; }
// 去 HTML 标签，用于题干归一化比较（错题记录含 <span>，题库纯文本）
function norm(s){ return String(s || '').replace(/<[^>]+>/g, ''); }

// 合并重复错题（按 篇目+题干 去重，统计次数；保留最近一次的答案和时间）
function mergeWrong(list) {
  var merged = [], seen = {};
  list.forEach(function(w){
    var key = w.paper + '||' + norm(w.q);
    if (seen[key] !== undefined) {
      merged[seen[key]].count++;
      merged[seen[key]].userAns = w.userAns;
      merged[seen[key]].time = w.time;
    } else {
      seen[key] = merged.length;
      merged.push({ paper: w.paper, tag: w.tag, q: w.q, options: w.options, userAns: w.userAns, correct: w.correct, explain: w.explain, time: w.time, count: 1 });
    }
  });
  return merged;
}

function render() {
  var list = getWrong();
  var merged = mergeWrong(list);
  var totalEl = document.getElementById('totalCount');
  var paperEl = document.getElementById('paperCount');
  var listEl = document.getElementById('list');
  totalEl.textContent = merged.length;
  var papers = {};
  merged.forEach(function(w){ papers[w.paper] = (papers[w.paper] || 0) + 1; });
  paperEl.textContent = Object.keys(papers).length;
  if (!merged.length) {
    listEl.innerHTML = '<div class="empty"><div class="big">🎉</div>暂无错题<br>做完自测题后，做错的题会自动收集到这里</div>';
    return;
  }
  var html = '';
  var grouped = {};
  merged.forEach(function(w){ (grouped[w.paper] = grouped[w.paper] || []).push(w); });
  Object.keys(grouped).forEach(function(paper){
    var hasTiku = TIKU && TIKU[paper];
    html += '<div class="paper-group" onclick="this.classList.toggle(\'open\')"><div class="paper-title"><span class="lt"><span class="arr">▶</span> 📄 ' + paper + '</span><span><span class="cnt">' + grouped[paper].length + ' 题</span>' + (hasTiku ? '<button class="redo-btn" onclick="event.stopPropagation();startRedo(\'' + paper + '\')">✏️ 错题重做</button>' : '') + '</span></div>';
    grouped[paper].forEach(function(w){
      html += '<div class="wq">';
      html += '<span class="tag">' + (w.tag || '字词释义') + '</span>';
      html += '<div class="q">' + (w.q || '') + '<span class="times">错 ' + w.count + ' 次</span></div>';
      var ua = (typeof w.userAns === 'number' && w.options) ? w.options[w.userAns] : '未作答';
      var ca = (typeof w.correct === 'number' && w.options) ? w.options[w.correct] : '';
      html += '<div class="a">你的答案：<span class="wrong">' + ua + '</span>　正确答案：<span class="right">' + ca + '</span></div>';
      if (w.explain) html += '<div class="exp"><strong>解析：</strong>' + w.explain + '</div>';
      html += '<div class="meta"><span>' + (w.time || '') + '</span><button class="del" onclick="event.stopPropagation();removeOne(\'' + paper.replace(/'/g, "\\'") + '||' + (w.q || '').replace(/'/g, "\\'") + '\')">删除</button></div>';
      html += '</div>';
    });
    html += '</div>';
  });
  listEl.innerHTML = html;
}

// 按 key 删除该题全部记录（paper||q，q 归一化比较）
function removeOne(key) {
  var list = getWrong();
  var kp = key.split('||')[0], kq = key.split('||')[1];
  var newList = list.filter(function(x){ return x.paper === kp && norm(x.q) === norm(kq); });
  if (newList.length === list.length) return;
  saveWrong(newList); render(); toast('已删除该错题');
}
function clearAll() {
  if (!getWrong().length) return;
  if (!confirm('确定清空所有错题吗？')) return;
  saveWrong([]); render(); toast('错题本已清空');
}
function exportWrong() {
  var merged = mergeWrong(getWrong());
  if (!merged.length) { toast('暂无可导出的错题'); return; }
  var txt = '光点小塾 · 我的错题本\n' + new Date().toLocaleString() + '\n共 ' + merged.length + ' 题（已去重）\n\n';
  var grouped = {};
  merged.forEach(function(w){ (grouped[w.paper] = grouped[w.paper] || []).push(w); });
  Object.keys(grouped).forEach(function(p){
    txt += '【' + p + '】\n';
    grouped[p].forEach(function(w){
      txt += (w.q || '') + '\n';
      txt += '  答错 ' + w.count + ' 次\n';
      txt += '  你的答案：' + ((typeof w.userAns === 'number' && w.options) ? w.options[w.userAns] : '未作答') + '\n';
      txt += '  正确答案：' + ((typeof w.correct === 'number' && w.options) ? w.options[w.correct] : '') + '\n';
      if (w.explain) txt += '  解析：' + w.explain + '\n';
      txt += '\n';
    });
  });
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(function(){ toast('已复制到剪贴板'); });
  } else {
    var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast('已复制到剪贴板');
  }
}

var redoState = null;
var letters = ['A','B','C','D'];

function startRedo(paper){
  var list = getWrong();
  var merged = mergeWrong(list).filter(function(w){ return w.paper === paper; });
  if (!merged.length) { toast('该篇目暂无错题'); return; }
  var all = (TIKU && TIKU[paper]) || [];
  var wrongKeys = {};
  merged.forEach(function(w){ wrongKeys[w.paper + '||' + norm(w.q)] = true; });
  var extras = all.filter(function(q){ return !wrongKeys[paper + '||' + norm(q.q)]; });
  extras = shf(extras).slice(0, 5);
  var items = [];
  merged.forEach(function(w){
    items.push({ paper: paper, tag: w.tag, q: w.q, options: w.options, answer: w.correct, explain: w.explain, wrong: true });
  });
  extras.forEach(function(q){
    items.push({ paper: paper, tag: q.tag, q: q.q, options: q.options, answer: q.answer, explain: q.explain, wrong: false });
  });
  items = shf(items);
  redoState = { paper: paper, items: items };
  document.getElementById('mainView').style.display = 'none';
  document.getElementById('redoView').style.display = 'block';
  document.getElementById('redoTitle').textContent = '📝 错题重做 · ' + paper;
  document.getElementById('redoInfo').textContent = '共 ' + items.length + ' 题，顺序已打乱';
  var h = '';
  items.forEach(function(it, idx){
    h += '<div class="rq" id="rq' + idx + '">';
    h += '<div class="rt"><span class="num">' + (idx + 1) + '</span><span class="rtag">' + (it.tag || '字词释义') + '</span></div>';
    h += '<div class="q">' + it.q + '</div>';
    h += '<div class="opts">';
    it.options.forEach(function(o, oi){
      h += '<label data-i="' + idx + '" data-o="' + oi + '" onclick="pickR(' + idx + ',' + oi + ',this)"><span class="ol">' + letters[oi] + '</span>' + o + '</label>';
    });
    h += '</div>';
    if (it.explain) h += '<div class="exp"><strong>解析：</strong>' + it.explain + '</div>';
    h += '</div>';
  });
  document.getElementById('redoQ').innerHTML = h;
  document.getElementById('redoSubmit').style.display = 'block';
  document.getElementById('redoResult').style.display = 'none';
  window.scrollTo({ top: 0 });
}

window.pickR = function(idx, oi, el){
  var box = el.parentNode;
  var labels = box.querySelectorAll('label');
  for (var i = 0; i < labels.length; i++) labels[i].classList.remove('sel');
  el.classList.add('sel');
  redoState.items[idx].pick = oi;
};

function collectWrong(paper, tag, q, options, userAns, correct, explain){
  try {
    var _wl = JSON.parse(localStorage.getItem(KEY) || '[]');
    _wl.push({ paper: paper, time: new Date().toLocaleString(), tag: tag, q: q, options: options, userAns: userAns, correct: correct, explain: explain });
    localStorage.setItem(KEY, JSON.stringify(_wl));
  } catch (e) {}
}

function submitRedo(){
  if (!redoState) return;
  var items = redoState.items;
  var missing = [];
  items.forEach(function(it, idx){ if (it.pick === undefined) missing.push(idx + 1); });
  if (missing.length) { toast('请完成第 ' + missing.join('、') + ' 题'); return; }
  var wrongPart = items.filter(function(it){ return it.wrong; });
  var wrongPartOK = wrongPart.every(function(it){ return it.pick === it.answer; });
  var newWrong = items.filter(function(it){ return it.pick !== it.answer; }); // 本次答错的题（含补充题）
  // 标注对错
  items.forEach(function(it, idx){
    var card = document.getElementById('rq' + idx);
    card.classList.add('done');
    var labels = card.querySelectorAll('.opts label');
    for (var i = 0; i < labels.length; i++) {
      if (i === it.answer) labels[i].classList.add('ok');
      else if (i === it.pick && it.pick !== it.answer) labels[i].classList.add('no');
    }
  });
  // 原错题全对 → 先从错题本删除该篇全部错题记录
  if (wrongPartOK) {
    var list = getWrong();
    var newList = list.filter(function(x){ return x.paper !== redoState.paper; });
    saveWrong(newList);
  }
  // 再收集本次答错的题（含补充题；原错题再错 → 合并计数+1）——必须在删除之后，否则刚收集的补充题错题会被一并删除
  newWrong.forEach(function(it){ collectWrong(it.paper, it.tag, it.q, it.options, it.pick, it.answer, it.explain); });
  var result = document.getElementById('redoResult');
  var h = '';
  if (wrongPartOK) {
    h += '<div class="big">🎉 错题全部答对！已移出错题本</div>';
    if (newWrong.length) h += '另有 ' + newWrong.length + ' 道补充题答错，已加入错题本。';
    result.className = 'redo-result good';
  } else {
    var still = wrongPart.filter(function(it){ return it.pick !== it.answer; });
    h += '<div class="big">📖 仍有 ' + still.length + ' 道错题未掌握</div>';
    h += '错题记录保留，答错的题错误次数 +1。<br>本次答对 ' + (wrongPart.length - still.length) + ' / ' + wrongPart.length + ' 道错题。';
    if (newWrong.length) h += '另有 ' + newWrong.length + ' 道题答错已记录。';
    result.className = 'redo-result bad';
  }
  result.innerHTML = h;
  result.style.display = 'block';
  document.getElementById('redoSubmit').style.display = 'none';
  render();
}

function backToMain(){
  document.getElementById('redoView').style.display = 'none';
  document.getElementById('mainView').style.display = 'block';
  render();
  window.scrollTo({ top: 0 });
}

render();
</script>
</body>
</html>
